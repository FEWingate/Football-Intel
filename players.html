<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Players — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
.browse-layout{display:grid;grid-template-columns:280px 24px 1fr;gap:12px;align-items:start;position:relative}
.browse-layout.collapsed{grid-template-columns:0px 24px 1fr}
.browse-layout.collapsed #browseCol{overflow:hidden;width:0;padding:0}
.browse-collapse-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text-dim);cursor:pointer;font-family:var(--font-mono);font-size:13px;
  width:24px;height:32px;align-self:start;margin-top:36px;
}
.browse-collapse-btn:hover{color:var(--text);border-color:var(--border2)}
#browseCol{padding-right:0}
.browse-search{
  width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:12px;padding:8px 12px;margin-bottom:10px;
}
.browse-list{max-height:calc(100vh - 260px);overflow:auto}
.browse-row{
  display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:12px;
}
.browse-row:hover{background:var(--surface2)}
.browse-row.active{background:var(--surface2);border:1px solid var(--primary)}
.browse-row .br-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.browse-row .br-val{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);flex:none}
.browse-headshot{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--surface2);flex:none}
.rank-num{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-right:6px;display:inline-block;width:16px}

.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.profile-headshot{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--surface2);
  border:2px solid var(--border)}
.profile-name{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.profile-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:3px}

.tier-badge{
  font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;font-weight:700;
  border-radius:3px;padding:2px 6px;text-transform:uppercase;
}
.tier-badge.top{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.tier-badge.mid{color:var(--text-mid);background:var(--surface2);border:1px solid var(--border)}
.tier-badge.bot{color:var(--accent-green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)}

.window-chart{display:flex;align-items:flex-end;gap:8px;height:220px;margin:16px 0 8px;padding:24px 4px 0}
.window-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.window-bar-value{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--text);white-space:nowrap}
.window-bar{width:100%;border-radius:3px 3px 0 0;min-height:3px}
.window-bar.top{background:var(--accent-red)}
.window-bar.mid{background:var(--text-dim)}
.window-bar.bot{background:var(--accent-green)}
.window-wk{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:2px}

.split-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0 4px}
.split-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.split-card .sc-label{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.split-card .sc-games{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:1px}
.split-card .sc-value{font-family:var(--font-display);font-weight:800;font-size:20px;margin-top:6px;letter-spacing:-.02em}
.split-card.top{border-color:rgba(244,63,94,.3)} .split-card.bot{border-color:rgba(74,222,128,.3)}
.split-card.top5{border-color:rgba(244,63,94,.55)} .split-card.bottom5{border-color:rgba(74,222,128,.55)}

.lead-wrap{overflow:auto;max-height:420px;border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:10px}
.lead-table{width:100%;border-collapse:separate;border-spacing:0}
.compare-table{width:auto;table-layout:fixed}
.compare-table th, .compare-table td{width:170px}
.compare-table th.name-col, .compare-table td.name-col{width:220px}
.compare-player-head{text-align:center !important;padding:14px 10px !important;vertical-align:top}
.compare-headshot-lg{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--surface2);
  border:2px solid var(--border);display:block;margin:0 auto 8px}
.cph-name{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--text);
  text-transform:none;letter-spacing:0;line-height:1.25;white-space:normal;overflow-wrap:break-word}
.cph-team{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  text-transform:none;letter-spacing:0;margin-top:2px}
.lead-table thead th{
  padding:9px 12px;text-align:right;font-family:var(--font-mono);font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;
  position:sticky;top:0;background:var(--surface2);z-index:2;border-bottom:1px solid var(--border);
}
.lead-table thead th.name-col{text-align:left;left:0;z-index:3}
.lead-table td{padding:8px 12px;font-size:12px;text-align:right;border-bottom:1px solid var(--hairline);white-space:nowrap}
.lead-table tbody tr:last-child td{border-bottom:0}
.lead-table tbody tr:hover td{background:var(--surface2)}
.lead-table td.name-col{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;
  display:flex;align-items:center;gap:8px}
.cell-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-mid);font-size:12px}

.committee-team-sel{margin-bottom:20px}
.wk-select{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-family:var(--font-mono);font-size:11px;padding:6px 10px;cursor:pointer;
}
.subsect{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--text-dim);padding:14px 0 3px}

.splits-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px}
.splits-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;cursor:pointer}
.splits-card:hover{border-color:var(--border2)}
.splits-head{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border);
  background:var(--surface2)}
.splits-name{font-family:var(--font-display);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
.splits-venue{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-dim);margin-top:2px}
.splits-diff{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;font-weight:700;
  padding:3px 8px;border-radius:var(--radius-sm);white-space:nowrap}
.splits-diff.up{color:var(--accent-green);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3)}
.splits-diff.down{color:var(--accent-red);background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.3)}
.splits-table{width:100%;border-collapse:collapse}
.splits-table th{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-dim);text-align:right;padding:7px 10px;border-bottom:1px solid var(--border2)}
.splits-table th:first-child,.splits-table td.name-col{text-align:left}
.splits-table td{padding:7px 10px;font-family:var(--font-mono);font-size:12px;text-align:right;
  font-variant-numeric:tabular-nums;border-bottom:1px solid var(--hairline)}
.splits-table tr:last-child td{border-bottom:0}
.splits-table td.name-col{font-family:var(--font-body,inherit);font-weight:600;color:var(--text-mid)}
@media(max-width:900px){
  .browse-layout, .browse-layout.collapsed{grid-template-columns:1fr}
  .browse-layout.collapsed #browseCol{width:auto;overflow:visible;padding:0}
  #browseCol{border-bottom:1px solid var(--border);padding-bottom:16px}
  .browse-collapse-btn{display:none}
}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script>
const main = fiShell({ page:'players', pageLabel:'Players', status:'loading' });

let PLAYERSTATS = null;
let ADV_CACHE = { ngs_passing: {}, ngs_rushing: {}, ff_opportunity: {}, espn_qbr: {}, rosters: null };
let browsePos = 'RB';
let browseCollapsed = false;
let browseSearch = '';
let activePlayer = null;
let activeSec = 'season'; // 'season' | 'career' | 'window' | 'log'
let windowSize = 5; // 5 | 10
let chartStat = 'dk'; // which stat drives the L5/L10 bar chart
let profileTierSelected = 'top'; // which defense tier the Defense Tier tab is filtered to
let committeeTeam = null;

main.innerHTML = `
  <div class="bar">
    <span class="lbl">Players</span>
    <div class="legend"><span>Season totals so far · click a player to see the full profile</span></div>
  </div>
  <div class="tabs" id="viewTabs" role="tablist">
    <button role="tab" data-view="profile" aria-selected="true">Player Profile</button>
    <button role="tab" data-view="committee" aria-selected="false">Committee View</button>
    <button role="tab" data-view="compare" aria-selected="false">Compare</button>
    <button role="tab" data-view="tierlb" aria-selected="false">Tier Leaderboard</button>
    <button role="tab" data-view="splits" aria-selected="false">Splits</button>
  </div>
  <div id="profileView"></div>
  <div id="committeeView" style="display:none"></div>
  <div id="compareView" style="display:none"></div>
  <div id="tierView" style="display:none"></div>
  <div id="splitsView" style="display:none"></div>`;

const $ = id => document.getElementById(id);

async function load(){
  fiStatus("Loading","loading");
  try{
    const res = await fetch(`players/latest.json`);
    if(res.ok) PLAYERSTATS = await res.json();
  }catch(e){}

  if(!PLAYERSTATS){
    fiStatus("No data","error"); fiUpdated("");
    $("profileView").innerHTML = `<div class="empty">
      No player data found.<br>
      Run <b>python3 build_matchup_stats.py all</b> in your lab folder, then reload.</div>`;
    return;
  }

  fiStatus("Ready");
  fiUpdated(`season · ${PLAYERSTATS.data_horizon}`);

  $("viewTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("viewTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    const view = b.dataset.view;
    $("profileView").style.display = view==='profile' ? '' : 'none';
    $("committeeView").style.display = view==='committee' ? '' : 'none';
    $("compareView").style.display = view==='compare' ? '' : 'none';
    $("tierView").style.display = view==='tierlb' ? '' : 'none';
    $("splitsView").style.display = view==='splits' ? '' : 'none';
    if(view==='committee') renderCommittee();
    if(view==='compare') renderCompareView();
    if(view==='tierlb') renderTierLeaderboard();
    if(view==='splits') renderSplits();
  });

  renderProfileView();
}

/* ── PLAYER PROFILE VIEW ─────────────────────────────────────────── */
function renderProfileView(){
  $("profileView").innerHTML = `
    <div class="browse-layout${browseCollapsed?' collapsed':''}" id="browseLayout">
      <div id="browseCol">
        <div class="tabs" id="browsePosTabs" role="tablist"></div>
        <input class="browse-search" id="browseSearchBox" placeholder="Search players…">
        <div class="browse-list" id="browseList"></div>
      </div>
      <button class="browse-collapse-btn" id="browseCollapseBtn" title="${browseCollapsed?'Show list':'Hide list'}">${browseCollapsed?'›':'‹'}</button>
      <div id="profilePanel"><div class="empty">Select a player from the list to see their profile.</div></div>
    </div>`;

  $("browseCollapseBtn").onclick = () => {
    browseCollapsed = !browseCollapsed;
    renderProfileView();
    if(activePlayer) renderProfilePanel();
  };

  const positions = ['QB','RB','WR','TE'];
  $("browsePosTabs").innerHTML = positions.map(p =>
    `<button role="tab" aria-selected="${p===browsePos}" data-pos="${p}">${p}</button>`).join('');
  $("browsePosTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("browsePosTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    browsePos = b.dataset.pos;
    renderBrowseList();
  });
  $("browseSearchBox").oninput = e => { browseSearch = e.target.value.toLowerCase(); renderBrowseList(); };
  renderBrowseList();
}

function primaryStatKey(pos){
  const cats = PLAYERSTATS.labels[pos];
  const vol = cats['Volume'] || Object.values(cats)[0];
  return Object.keys(vol)[0];
}

// Which matchup category (i.e. which stat's own defensive rank) governs a
// given stat's tier. RB is the only position where this isn't just the
// position's single primary stat — a defense can be genuinely different
// against the run vs against RB receiving, so those need separate tiers.
const RB_REC_STATS = new Set(['rec_yds','rec_ypg','rec','rec_pg','targets','tgt_pg','rec_td']);
function matchupKeyFor(pos, statKey){
  if(pos === 'RB') return RB_REC_STATS.has(statKey) ? 'rec_yds' : 'rush_yds';
  return primaryStatKey(pos);
}

function renderBrowseList(){
  const term = browseSearch.trim();
  const key = primaryStatKey(browsePos);
  let list = PLAYERSTATS.players[browsePos].slice();
  if(term) list = list.filter(p => p.name.toLowerCase().includes(term));
  else list.sort((a,b) => (b.season.m[key]||0) - (a.season.m[key]||0));
  list = list.slice(0, 60);

  $("browseList").innerHTML = list.map(p => `
    <div class="browse-row${activePlayer && activePlayer.name===p.name && activePlayer.pos===browsePos ? ' active':''}"
         data-name="${esc(p.name)}">
      <img class="browse-headshot" src="${esc(p.headshot||'')}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <span class="br-name">${esc(p.name)}</span>
      <span class="br-val">${fmtVal(p.season.m[key])}</span>
    </div>`).join('') || `<div class="empty" style="padding:20px 4px">No matches.</div>`;

  $("browseList").querySelectorAll(".browse-row").forEach(el => {
    el.onclick = () => {
      const p = PLAYERSTATS.players[browsePos].find(x => x.name === el.dataset.name);
      openProfile(p, browsePos);
    };
  });
}

function fmtVal(v){
  if(v === null || v === undefined) return '—';
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

const TIER_LABEL = { top: 'Top 10', mid: 'Middle 12', bot: 'Bottom 10' };
const TIER_STAT_KEYS = {
  QB: ['pass_yds'],
  RB: ['rush_yds', 'rec_yds', 'rec'],
  WR: ['rec_yds', 'rec'],
  TE: ['rec_yds', 'rec'],
};

function openProfile(p, pos){
  activePlayer = p; activePlayer.pos = pos; activeSec = 'season';
  renderBrowseList(); // refresh active highlight
  renderProfilePanel();
  // On mobile the two-column layout collapses to a single stacked column
  // (browse list, then profile panel), so the panel renders below the
  // entire list — scroll to it so tapping a player doesn't leave you
  // stuck scrolling past everyone else to see who you picked.
  if(window.innerWidth <= 900){
    $("profilePanel").scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderProfilePanel(){
  const p = activePlayer, pos = p.pos;
  const hasHomeRoad = pos === 'QB' && PLAYERSTATS.qb_dome_splits &&
    PLAYERSTATS.qb_dome_splits[p.team] && PLAYERSTATS.qb_dome_splits[p.team].gsis_id === p.gsis_id;
  $("profilePanel").innerHTML = `
    <div class="profile-head">
      <img class="profile-headshot" src="${esc(p.headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <div>
        <div class="profile-name">${esc(p.name)}</div>
        <div class="profile-sub">${pos} · ${fiTeamLogoInline(p.team)} ${esc(p.team)} · ${p.games} games this season</div>
      </div>
    </div>
    <div class="tabs" id="profileSecTabs" role="tablist">
      <button role="tab" data-sec="season" aria-selected="true">Season</button>
      <button role="tab" data-sec="career" aria-selected="false">Career</button>
      <button role="tab" data-sec="tiers" aria-selected="false">Defense Tier</button>
      <button role="tab" data-sec="window" aria-selected="false">L5 / L10</button>
      <button role="tab" data-sec="log" aria-selected="false">Game Log</button>
      <button role="tab" data-sec="advanced" aria-selected="false">Advanced</button>
      ${hasHomeRoad ? `<button role="tab" data-sec="homeroad" aria-selected="false">Home/Road</button>` : ''}
    </div>
    <div id="profileBody"></div>`;

  $("profileSecTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("profileSecTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    activeSec = b.dataset.sec;
    renderProfileBody();
  });
  renderProfileBody();
}

function fiTeamLogoInline(team){ return fiLogoHTML(team, 16); }

function renderProfileBody(){
  const box = $("profileBody");
  const p = activePlayer;
  if(activeSec === 'season') box.innerHTML = statBlockHTML(p.season.m, `${p.season.games} games`, p.pos);
  else if(activeSec === 'career') box.innerHTML = statBlockHTML(p.career.m,
    `${p.career.games} games · through ${p.career.through}`, p.pos);
  else if(activeSec === 'tiers') renderTierTab(box, p);
  else if(activeSec === 'window') renderWindow(box, p);
  else if(activeSec === 'advanced'){
    box.innerHTML = `<div class="empty">Loading…</div>`;
    renderAdvanced(box, p); // async — updates box once real data arrives
  }
  else if(activeSec === 'homeroad') renderHomeRoadTab(box, p);
  else renderGameLogFull(box, p);
}

// Home/Road (dome/retractable-roof QB1s only) — same data and column set
// as the Splits leaderboard tab, just scoped to this one player, so the
// two views can never drift into showing different numbers.
function renderHomeRoadTab(box, p){
  const q = PLAYERSTATS.qb_dome_splits[p.team];
  const diff = (q.home && q.road) ? +(q.home.dk_pts_pg - q.road.dk_pts_pg).toFixed(1) : null;
  const row = (label, s) => {
    if(!s) return `<tr><td class="name-col">${label}</td>
      <td colspan="${SPLITS_COLS.length}" style="color:var(--text-dim);text-align:center">No games</td></tr>`;
    return `<tr><td class="name-col">${label}</td>` +
      SPLITS_COLS.map(([k,,dec]) => {
        const v = s[k];
        return `<td>${v==null ? '—' : (dec ? v.toFixed(dec) : v)}</td>`;
      }).join('') + `</tr>`;
  };
  box.innerHTML = `
    <div class="empty" style="padding:8px 0 4px;text-align:left;font-size:10px">
      ${esc(SPLITS_VENUE_LABEL[q.venue])} · Home/Road is by team venue for the full season,
      not each game's actual roof state${diff!==null ? ` · ${diff>=0?'+':''}${diff} DK/G at home` : ''}
      · Road (Outdoor) excludes road trips to other dome/retractable-roof teams
    </div>
    <div class="table-wrap"><table class="splits-table">
      <thead><tr><th></th>${SPLITS_COLS.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>
      <tbody>${row('Home', q.home)}${row('Road', q.road)}${row('Road (Outdoor)', q.road_outdoor)}</tbody>
    </table></div>`;
}

// Season-only (splits aren't tracked across career/team changes — same
// scoping decision as Usage). Reuses the same per-stat card the L5/L10
// view already shows, just made visible directly on Season too, since the
// underlying data is season-long regardless of which tab it's viewed from.
function tierProfileSectionHTML(p){
  const cats = PLAYERSTATS.labels[p.pos];
  const statKeys = (TIER_STAT_KEYS[p.pos] || [primaryStatKey(p.pos)])
    .filter(k => cats.Volume && cats.Volume[k]);
  let h = `<div class="subsect" style="padding-top:22px">Vs Defense Tier — Season</div>`;
  statKeys.forEach(statKey => {
    const label = cats.Volume[statKey].l;
    h += `<div style="font-size:11px;color:var(--text-mid);margin:10px 0 2px">${esc(label)}</div>`;
    h += splitCardsHTML(p, { key: statKey, label, pct: false });
  });
  return h;
}

function statBlockHTML(m, horizonNote, pos){
  const cats = PLAYERSTATS.labels[pos];
  const PCT_KEYS = new Set(['rush_share','target_share','snap_pct','rz_carry_share','rz_target_share','rz_touch_share']);
  let h = `<div class="empty" style="padding:8px 0 4px;text-align:left;font-size:10px">${horizonNote}</div>`;
  for(const [cat, labels] of Object.entries(cats)){
    h += `<div class="subsect">${esc(cat)}</div><table class="stat-table"><tbody>`;
    for(const [k, meta] of Object.entries(labels)){
      const v = m[k];
      const text = (v!=null && PCT_KEYS.has(k)) ? `${fmtVal(v)}%` : fmtVal(v);
      h += `<tr><td>${esc(meta.l)}</td><td class="num">${text}</td></tr>`;
    }
    h += `</tbody></table>`;
  }
  return h;
}

/* L5/L10: rolling window aggregated from the per-game log. The bar chart
   is switchable between any raw per-game stat (not the cumulative _pg/_ypg
   rate keys — those trend toward a season average and would flatten the
   chart, not show game-to-game swings), DK fantasy points, and per-game
   usage share where the position supports it. Every window explicitly
   shows the defense tier faced each game, never just a bare number. */
function chartableStats(p){
  const volKeys = Object.keys(PLAYERSTATS.labels[p.pos].Volume)
    .filter(k => !k.endsWith('_pg') && !k.endsWith('_ypg'));
  const opts = volKeys.map(k => ({ key:k, label: PLAYERSTATS.labels[p.pos].Volume[k].l, pct:false }));
  opts.push({ key:'dk', label:'DK Fantasy Points', pct:false });
  const hasRushShare = p.pos === 'RB' && p.log.some(g => g.rush_share != null);
  const hasTargetShare = ['RB','WR','TE'].includes(p.pos) && p.log.some(g => g.target_share != null);
  if(hasRushShare) opts.push({ key:'rush_share', label:'Rush Share', pct:true });
  if(hasTargetShare) opts.push({ key:'target_share', label:'Target Share', pct:true });
  return opts;
}

function chartValue(g, key){
  if(key === 'dk' || key === 'rush_share' || key === 'target_share') return g[key];
  return g.m[key];
}

const TIER_DEFS = [['top5','Top 5'], ['top','Top 10'], ['mid','Middle 12'], ['bot','Bottom 10'], ['bottom5','Bottom 5']];

function renderTierTab(box, p){
  const primaryKey = primaryStatKey(p.pos);
  const mk = matchupKeyFor(p.pos, primaryKey);
  const split = p.splits[profileTierSelected];
  const games = split && split.games ? (split.games[mk] || 0) : 0;

  let h = `<div class="tabs" id="tierSelectTabs" role="tablist">
    ${TIER_DEFS.map(([key,label]) =>
      `<button role="tab" data-tier="${key}" aria-selected="${key===profileTierSelected}">${label}</button>`
    ).join('')}
  </div>`;

  h += (split && split.m)
    ? statBlockHTML(split.m, `${games} games vs this tier`, p.pos)
    : `<div class="empty">No games recorded against this tier yet this season.</div>`;

  box.innerHTML = h;

  $("tierSelectTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    profileTierSelected = b.dataset.tier;
    renderTierTab(box, p);
  });
}

function splitCardsHTML(p, active){
  const tiers = [['top5','vs Top 5'], ['top','vs Top 10'], ['mid','vs Middle 12'], ['bot','vs Bottom 10'], ['bottom5','vs Bottom 5']];
  const mk = matchupKeyFor(p.pos, active.key);
  return `<div class="split-cards">${tiers.map(([key,label]) => {
    const split = p.splits[key];
    const v = split && split.m ? split.m[active.key] : null;
    const vText = v == null ? '—' : (active.pct ? `${v}%` : v);
    const games = split && split.games ? (split.games[mk] || 0) : 0;
    return `<div class="split-card ${key}">
      <div class="sc-label">${label}</div>
      <div class="sc-games">${games} games</div>
      <div class="sc-value">${vText}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderWindow(box, p){
  const log = p.log.slice().sort((a,b)=>a.week-b.week);
  const recent = log.slice(-windowSize);
  const volKeys = Object.keys(PLAYERSTATS.labels[p.pos].Volume);
  const stats = chartableStats(p);
  if(!stats.find(s => s.key === chartStat)) chartStat = 'dk'; // reset if switching to a player without this stat

  const sums = {};
  volKeys.forEach(k => { sums[k] = recent.reduce((s,g)=>s+(g.m[k]||0),0); });
  const dkSum = recent.reduce((s,g)=>s+(g.dk||0),0);
  const n = recent.length || 1;

  let h = `<div class="tabs" id="winSizeTabs" role="tablist">
    <button role="tab" data-n="5" aria-selected="${windowSize===5}">Last 5</button>
    <button role="tab" data-n="10" aria-selected="${windowSize===10}">Last 10</button>
  </div>`;

  h += `<div class="tabs" id="chartStatTabs" role="tablist">
    ${stats.map(s => `<button role="tab" data-key="${s.key}" aria-selected="${chartStat===s.key}">${esc(s.label)}</button>`).join('')}
  </div>`;

  const active = stats.find(s => s.key === chartStat);
  h += splitCardsHTML(p, active);

  h += `<div class="window-chart">`;
  const vals = recent.map(g => chartValue(g, chartStat) || 0);
  const maxVal = Math.max(1, ...vals);
  recent.forEach(g => {
    const v = chartValue(g, chartStat) || 0;
    const pct = Math.max(4, Math.round(70*v/maxVal)); // capped so labels never crowd the top
    const tier = g.tier || 'mid';
    const vText = active.pct ? `${v}%` : v;
    h += `<div class="window-bar-wrap">
      <div class="window-bar-value">${vText}</div>
      <div class="window-bar ${tier}" style="height:${pct}%" title="Wk ${g.week} vs ${esc(g.opp||'?')}: ${vText} ${esc(active.label)} (${TIER_LABEL[tier]||'—'}${g.rank?' #'+g.rank:''})"></div>
      <div class="window-wk">${g.week}</div>
    </div>`;
  });
  h += `</div>
  <div class="empty" style="padding:2px 0 10px;text-align:left;font-size:10px">
    Bar height = ${esc(active.label)} that game · color = defense tier faced (
    <span class="tier-badge top" style="margin:0 2px">Top 10</span>
    <span class="tier-badge mid" style="margin:0 2px">Mid 12</span>
    <span class="tier-badge bot" style="margin:0 2px">Bottom 10</span>)
  </div>`;

  h += `<div class="subsect">Last ${recent.length} games — totals &amp; per-game</div><table class="stat-table"><tbody>`;
  volKeys.forEach(k => {
    const lbl = PLAYERSTATS.labels[p.pos].Volume[k].l;
    h += `<tr><td>${esc(lbl)}</td><td class="num">${fmtVal(sums[k])} tot · ${fmtVal(sums[k]/n)}/gm</td></tr>`;
  });
  h += `<tr><td>DK Fantasy Points</td><td class="num">${fmtVal(dkSum)} tot · ${fmtVal(dkSum/n)}/gm</td></tr>`;
  h += `</tbody></table>`;

  box.innerHTML = h;
  box.querySelectorAll('#winSizeTabs button').forEach(b => b.onclick = () => {
    windowSize = Number(b.dataset.n); renderWindow(box, p);
  });
  box.querySelectorAll('#chartStatTabs button').forEach(b => b.onclick = () => {
    chartStat = b.dataset.key; renderWindow(box, p);
  });
}

function renderGameLogFull(box, p){
  const volKeys = Object.keys(PLAYERSTATS.labels[p.pos].Volume);
  const volLabels = PLAYERSTATS.labels[p.pos].Volume;

  let h = `<div class="lead-wrap"><table class="lead-table"><thead><tr>

/* ── ADVANCED TAB (NGS, Expected Fantasy Points, ESPN QBR) ─────────
   Real per-week files, kept separate from players/latest.json rather
   than merged into it — same low-risk pattern as the Teams page Roster
   tab: new data, new read path, existing working code untouched. */
const ADV_SOURCES = {
  QB: ['ngs_passing', 'espn_qbr', 'ff_opportunity'],
  RB: ['ngs_rushing', 'ff_opportunity'],
  WR: ['ff_opportunity'], TE: ['ff_opportunity'],
};

async function fetchWeekly(sourceDir, cacheObj, week){
  const wk = String(week).padStart(2, '0');
  if(wk in cacheObj) return cacheObj[wk];
  try{
    const res = await fetch(`${sourceDir}/wk${wk}.json`);
    cacheObj[wk] = res.ok ? await res.json() : null;
  }catch(e){ cacheObj[wk] = null; }
  return cacheObj[wk];
}

// espn_qbr's player_id is ESPN's own numbering, not gsis_id — confirmed
// by direct comparison (a real gsis_id looks like "00-0033280"; ESPN's
// own ID for a different real player was plain "4480", no shared format
// at all). rosters/latest.json carries the real crosswalk between them.
async function getEspnId(p){
  if(ADV_CACHE.rosters === null){
    try{
      const res = await fetch('rosters/latest.json');
      if(res.ok) ADV_CACHE.rosters = await res.json();
    }catch(e){ /* stays null, QBR just won't match this session */ }
  }
  const teamRoster = ADV_CACHE.rosters?.teams?.[p.team] || [];
  const match = teamRoster.find(r => r.gsis_id === p.gsis_id);
  if(!match || match.espn_id == null) return null;
  return String(match.espn_id).replace(/\.0$/, ''); // real values come through as "3139477.0"
}

async function renderAdvanced(box, p){
  const sources = ADV_SOURCES[p.pos] || ['ff_opportunity'];
  const weeks = p.log.map(g => g.week).sort((a, b) => a - b);

  const espnId = sources.includes('espn_qbr') ? await getEspnId(p) : null;

  const rows = await Promise.all(weeks.map(async week => {
    const row = { week };
    const fetches = [];

    if(sources.includes('ngs_passing')) fetches.push(
      fetchWeekly('ngs_passing', ADV_CACHE.ngs_passing, week).then(data => {
        const m = data?.players?.find(x => x.gsis_id === p.gsis_id);
        row.cpoe = m?.completion_percentage_above_expectation ?? null;
        row.ttt = m?.avg_time_to_throw ?? null;
        row.aggressiveness = m?.aggressiveness ?? null;
      }));
    if(sources.includes('ngs_rushing')) fetches.push(
      fetchWeekly('ngs_rushing', ADV_CACHE.ngs_rushing, week).then(data => {
        const m = data?.players?.find(x => x.gsis_id === p.gsis_id);
        row.efficiency = m?.efficiency ?? null;
        row.ryoe = m?.rush_yards_over_expected ?? null;
      }));
    if(sources.includes('espn_qbr') && espnId) fetches.push(
      fetchWeekly('espn_qbr', ADV_CACHE.espn_qbr, week).then(data => {
        const m = data?.players?.find(x => String(x.player_id) === espnId);
        row.qbr = m?.qbr_total ?? null;
      }));
    if(sources.includes('ff_opportunity')) fetches.push(
      fetchWeekly('ff_opportunity', ADV_CACHE.ff_opportunity, week).then(data => {
        const m = data?.players?.find(x => x.player_id === p.gsis_id);
        row.fp_actual = m?.total_fantasy_points ?? null;
        row.fp_exp = m?.total_fantasy_points_exp ?? null;
        row.fp_diff = m?.total_fantasy_points_diff ?? null;
      }));

    await Promise.all(fetches);
    return row;
  }));

  const cols = [];
  if(sources.includes('ngs_passing')) cols.push(
    {key:'cpoe', label:'CPOE'}, {key:'ttt', label:'Time to Throw'}, {key:'aggressiveness', label:'Aggressive %'});
  if(sources.includes('ngs_rushing')) cols.push(
    {key:'efficiency', label:'Efficiency'}, {key:'ryoe', label:'Rush Yds Over Exp'});
  if(sources.includes('espn_qbr')) cols.push({key:'qbr', label:'QBR'});
  if(sources.includes('ff_opportunity')) cols.push(
    {key:'fp_actual', label:'Actual FP'}, {key:'fp_exp', label:'Expected FP'}, {key:'fp_diff', label:'FP Diff'});

  const hasAnyData = rows.some(r => cols.some(c => r[c.key] != null));
  if(!hasAnyData){
    box.innerHTML = `<div class="empty">No advanced data available yet for this player's games
      this season — these sources may not have real 2026 data published yet.</div>`;
    return;
  }

  let h = `<div class="lead-wrap"><table class="lead-table"><thead><tr>
    <th class="name-col">Week</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}
  </tr></thead><tbody>`;
  rows.slice().reverse().forEach(r => {
    h += `<tr><td class="name-col">${r.week}</td>
      ${cols.map(c => `<td><span class="cell-val">${fmtVal(r[c.key])}</span></td>`).join('')}
    </tr>`;
  });
  h += `</tbody></table></div>`;
  box.innerHTML = h;
}

/* ── COMPARE VIEW ────────────────────────────────────────────────── */
const COMPARE_MAX = 4;
let comparePos = 'RB';
let comparePlayers = [];
let compareSearch = '';
let compareHorizon = 'season'; // 'season' | 'career'

function renderCompareView(){
  $("compareView").innerHTML = `
    <div class="tabs" id="comparePosTabs" role="tablist"></div>
    <div class="lineup-note" style="margin:6px 0 14px">
      Compare up to ${COMPARE_MAX} players at the same position, side by side. Search below to add.
    </div>
    <input class="browse-search" id="compareSearchBox" placeholder="Search players to compare…" style="max-width:400px">
    <div id="compareSearchResults"></div>
    <div id="compareChips" class="excluded-chips" style="margin:14px 0"></div>
    <div id="compareTableWrap"></div>`;

  const positions = ['QB','RB','WR','TE'];
  $("comparePosTabs").innerHTML = positions.map(p =>
    `<button role="tab" aria-selected="${p===comparePos}" data-pos="${p}">${p}</button>`).join('');
  $("comparePosTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    if(b.dataset.pos !== comparePos) comparePlayers = []; // switching position clears the comparison
    comparePos = b.dataset.pos;
    $("comparePosTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    compareSearch = ''; $("compareSearchBox").value = '';
    renderCompareBody();
  });
  $("compareSearchBox").oninput = e => { compareSearch = e.target.value; renderCompareSearchResults(); };

  renderCompareBody();
}

function renderCompareBody(){
  renderCompareSearchResults();
  renderCompareChips();
  renderCompareTable();
}

function renderCompareSearchResults(){
  const term = compareSearch.trim().toLowerCase();
  const box = $("compareSearchResults");
  if(term.length < 2){ box.innerHTML = ''; return; }
  const selectedNames = new Set(comparePlayers.map(p=>p.name));
  const atMax = comparePlayers.length >= COMPARE_MAX;
  const results = PLAYERSTATS.players[comparePos]
    .filter(p => !selectedNames.has(p.name))
    .filter(p => p.name.toLowerCase().includes(term))
    .slice(0, 12);

  box.innerHTML = results.map(p => `
    <div class="search-result${atMax?' disabled':''}" data-name="${esc(p.name)}">
      <img class="browse-headshot" src="${esc(p.headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <span class="sr-name">${esc(p.name)} · ${esc(p.team)}</span>
    </div>`).join('') || `<div class="empty" style="padding:10px 4px">No matches.</div>`;

  box.querySelectorAll('.search-result:not(.disabled)').forEach(el => {
    el.onclick = () => {
      const p = PLAYERSTATS.players[comparePos].find(x => x.name === el.dataset.name);
      if(p && comparePlayers.length < COMPARE_MAX){
        comparePlayers.push(p);
        compareSearch = ''; $("compareSearchBox").value = '';
        renderCompareBody();
      }
    };
  });
}

function renderCompareChips(){
  $("compareChips").innerHTML = comparePlayers.map(p =>
    `<span class="excluded-chip" data-name="${esc(p.name)}" style="color:var(--primary);background:rgba(163,230,53,.08);border-color:rgba(163,230,53,.3)">
      ${esc(p.name)} ✕
    </span>`).join('');
  $("compareChips").querySelectorAll('.excluded-chip').forEach(el => {
    el.onclick = () => {
      comparePlayers = comparePlayers.filter(p => p.name !== el.dataset.name);
      renderCompareBody();
    };
  });
}

function renderCompareTable(){
  const wrap = $("compareTableWrap");
  if(comparePlayers.length < 2){
    wrap.innerHTML = `<div class="empty">Add at least 2 players to compare.</div>`;
    return;
  }
  const cats = PLAYERSTATS.labels[comparePos];
  const PCT_KEYS = new Set(['rush_share','target_share','snap_pct','rz_carry_share','rz_target_share','rz_touch_share']);

  let h = `<div class="tabs" id="compareHorizonTabs" role="tablist">
    <button role="tab" data-h="season" aria-selected="${compareHorizon==='season'}">Season</button>
    <button role="tab" data-h="career" aria-selected="${compareHorizon==='career'}">Career</button>
  </div>
  <div class="lead-wrap" style="max-height:calc(100vh - 260px);margin-top:10px"><table class="lead-table compare-table"><thead><tr>
    <th class="name-col">Stat</th>
    ${comparePlayers.map(p => `<th class="compare-player-head">
      <img class="compare-headshot-lg" src="${esc(p.headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <div class="cph-name">${esc(p.name)}</div>
      <div class="cph-team">${esc(p.team)}</div>
    </th>`).join('')}
  </tr></thead><tbody>
    <tr><td class="name-col">Games</td>
      ${comparePlayers.map(p => `<td><span class="cell-val">${p[compareHorizon].games}</span></td>`).join('')}
    </tr>`;

  for(const [cat, labels] of Object.entries(cats)){
    h += `<tr><td class="name-col" colspan="${comparePlayers.length+1}" style="background:var(--surface2);font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim)">${esc(cat)}</td></tr>`;
    for(const [k, meta] of Object.entries(labels)){
      h += `<tr><td class="name-col">${esc(meta.l)}</td>`;
      const rowVals = comparePlayers.map(p => p[compareHorizon].m[k]);
      const validVals = rowVals.filter(v => v != null);
      const best = validVals.length ? (meta.inv ? Math.min(...validVals) : Math.max(...validVals)) : null;
      comparePlayers.forEach((p,i) => {
        const v = rowVals[i];
        const text = v == null ? '—' : (PCT_KEYS.has(k) ? `${fmtVal(v)}%` : fmtVal(v));
        const isBest = v != null && v === best && validVals.length > 1;
        h += `<td><span class="cell-val"${isBest?' style="color:var(--primary);font-weight:700"':''}>${text}</span></td>`;
      });
      h += `</tr>`;
    }
  }

  const tierKeys = (TIER_STAT_KEYS[comparePos] || [primaryStatKey(comparePos)])
    .filter(k => cats.Volume && cats.Volume[k]); // guard against a key not existing for this position

  h += `<tr><td class="name-col" colspan="${comparePlayers.length+1}" style="background:var(--surface2);font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim)">Vs defense tier — per game</td></tr>`;
  tierKeys.forEach(statKey => {
    const statLabel = cats.Volume[statKey].l;
    h += `<tr><td class="name-col" style="font-style:italic;color:var(--text-dim)" colspan="${comparePlayers.length+1}">${esc(statLabel)}</td></tr>`;
    [['top','Vs Top 10'], ['mid','Vs Middle 12'], ['bot','Vs Bottom 10']].forEach(([tierKey, tierLabel]) => {
      h += `<tr><td class="name-col">${esc(tierLabel)}</td>`;
      const rowVals = comparePlayers.map(p => p.splits?.[tierKey]?.m?.[statKey]);
      const validVals = rowVals.filter(v => v != null);
      const best = validVals.length ? Math.max(...validVals) : null;
      comparePlayers.forEach((p,i) => {
        const v = rowVals[i];
        const games = p.splits?.[tierKey]?.games?.[matchupKeyFor(comparePos, statKey)] || 0;
        const text = v == null ? '—' : `${fmtVal(v)} <span style="color:var(--text-dim);font-size:10px">(${games}g)</span>`;
        const isBest = v != null && v === best && validVals.length > 1;
        h += `<td><span class="cell-val"${isBest?' style="color:var(--primary);font-weight:700"':''}>${text}</span></td>`;
      });
      h += `</tr>`;
    });
  });

  h += `</tbody></table></div>`;
  wrap.innerHTML = h;

  wrap.querySelectorAll('#compareHorizonTabs button').forEach(b => b.onclick = () => {
    compareHorizon = b.dataset.h; renderCompareTable();
  });
}

/* ── TIER LEADERBOARD ────────────────────────────────────────────── */
const TIER_LB_STATS = {
  QB: [{key:'pass_yds', pgKey:'pass_ypg', label:'Passing Yards'}],
  RB: [{key:'rush_yds', pgKey:'rush_ypg', label:'Rushing Yards'},
       {key:'rec_yds', pgKey:'rec_ypg', label:'Receiving Yards'},
       {key:'rec', pgKey:'rec_pg', label:'Receptions'}],
  WR: [{key:'rec_yds', pgKey:'rec_ypg', label:'Receiving Yards'},
       {key:'rec', pgKey:'rec_pg', label:'Receptions'}],
  TE: [{key:'rec_yds', pgKey:'rec_ypg', label:'Receiving Yards'},
       {key:'rec', pgKey:'rec_pg', label:'Receptions'}],
};
let tierPos = 'QB';
let tierStat = 'pass_yds';
let tierSelected = 'top'; // 'top' | 'mid' | 'bot'
let tierSortKey = 'season'; // 'season' | 'pergame' | 'tier'
let tierSortDir = 'desc';

const TIER_OPTIONS = [['top','Vs Top 10'], ['mid','Vs Middle 12'], ['bot','Vs Bottom 10']];

function renderTierLeaderboard(){
  $("tierView").innerHTML = `
    <div class="tabs" id="tierPosTabs" role="tablist"></div>
    <div class="tabs" id="tierStatTabs" role="tablist"></div>
    <div class="lineup-note" style="margin:10px 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>Top 25 by season total · click any column to sort · defense tier:</span>
      <select class="wk-select" id="tierSelectDropdown"></select>
    </div>
    <div id="tierTableWrap"></div>`;

  const positions = ['QB','RB','WR','TE'];
  $("tierPosTabs").innerHTML = positions.map(p =>
    `<button role="tab" aria-selected="${p===tierPos}" data-pos="${p}">${p}</button>`).join('');
  $("tierPosTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    tierPos = b.dataset.pos;
    tierStat = TIER_LB_STATS[tierPos][0].key; // reset to first stat option for the new position
    tierSortKey = 'season'; tierSortDir = 'desc';
    $("tierPosTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderTierStatTabs();
    renderTierTable();
  });

  $("tierSelectDropdown").innerHTML = TIER_OPTIONS.map(([key,label]) =>
    `<option value="${key}"${key===tierSelected?' selected':''}>${label}</option>`).join('');
  $("tierSelectDropdown").onchange = e => {
    tierSelected = e.target.value;
    if(tierSortKey === 'tier') tierSortDir = 'desc'; // fresh tier, start from the top again
    renderTierTable();
  };

  renderTierStatTabs();
  renderTierTable();
}

function renderTierStatTabs(){
  const opts = TIER_LB_STATS[tierPos];
  $("tierStatTabs").innerHTML = opts.map(s =>
    `<button role="tab" aria-selected="${s.key===tierStat}" data-key="${s.key}">${esc(s.label)}</button>`).join('');
  $("tierStatTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    tierStat = b.dataset.key;
    tierSortKey = 'season'; tierSortDir = 'desc';
    $("tierStatTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderTierTable();
  });
}

function renderTierTable(){
  const cats = PLAYERSTATS.labels[tierPos];
  const statConfig = TIER_LB_STATS[tierPos].find(s => s.key === tierStat);
  const statLabel = statConfig.label;
  const pgKey = statConfig.pgKey;
  const hasPg = cats.Volume && cats.Volume[pgKey];
  const tierLabel = TIER_OPTIONS.find(([k]) => k === tierSelected)[1];

  let rows = PLAYERSTATS.players[tierPos].filter(p => (p.season.m[tierStat] || 0) > 0);

  const sortVal = p => {
    if(tierSortKey === 'season') return p.season.m[tierStat] || 0;
    if(tierSortKey === 'pergame') return hasPg ? (p.season.m[pgKey] || 0) : 0;
    return p.splits?.[tierSelected]?.m?.[tierStat] ?? -Infinity; // players with no games in this tier sort last
  };
  rows.sort((a,b) => tierSortDir==='desc' ? sortVal(b)-sortVal(a) : sortVal(a)-sortVal(b));
  rows = rows.slice(0, 25);

  const sortArrow = key => key===tierSortKey ? (tierSortDir==='desc'?' ▾':' ▴') : '';
  let h = `<div class="lead-wrap" style="max-height:calc(100vh - 320px)"><table class="lead-table"><thead><tr>
    <th class="name-col">Player</th><th>GP</th>
    <th data-sort="season" class="${tierSortKey==='season'?'sorted':''}" style="cursor:pointer">${esc(statLabel)}${sortArrow('season')}</th>
    ${hasPg ? `<th data-sort="pergame" class="${tierSortKey==='pergame'?'sorted':''}" style="cursor:pointer">Per Game${sortArrow('pergame')}</th>` : ''}
    <th data-sort="tier" class="${tierSortKey==='tier'?'sorted':''}" style="cursor:pointer">${esc(tierLabel)}${sortArrow('tier')}</th>
  </tr></thead><tbody>`;

  rows.forEach((p, i) => {
    const total = p.season.m[tierStat];
    const perGame = hasPg ? p.season.m[pgKey] : null;
    const tv = p.splits?.[tierSelected]?.m?.[tierStat];
    const tGames = p.splits?.[tierSelected]?.games?.[matchupKeyFor(tierPos, tierStat)] || 0;
    const tText = tv == null ? '—' : `${fmtVal(tv)} <span style="color:var(--text-dim);font-size:10px">(${tGames}g)</span>`;
    h += `<tr data-name="${esc(p.name)}" style="cursor:pointer">
      <td class="name-col"><span class="rank-num">${i+1}</span>
        <img class="browse-headshot" src="${esc(p.headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        ${esc(p.name)} <span style="color:var(--text-dim);font-size:10px">${esc(p.team)}</span></td>
      <td><span class="cell-val">${p.season.games}</span></td>
      <td><span class="cell-val">${fmtVal(total)}</span></td>
      ${hasPg ? `<td><span class="cell-val">${fmtVal(perGame)}</span></td>` : ''}
      <td><span class="cell-val">${tText}</span></td>
    </tr>`;
  });
  h += `</tbody></table></div>`;

  $("tierTableWrap").innerHTML = h;
  $("tierTableWrap").querySelectorAll('th[data-sort]').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.sort;
      if(key === tierSortKey) tierSortDir = tierSortDir==='desc' ? 'asc' : 'desc';
      else { tierSortKey = key; tierSortDir = 'desc'; }
      renderTierTable();
    };
  });
  $("tierTableWrap").querySelectorAll('tr[data-name]').forEach(el => {
    el.onclick = () => {
      const p = PLAYERSTATS.players[tierPos].find(x => x.name === el.dataset.name);
      $("viewTabs").querySelectorAll("button").forEach(x=>
        x.setAttribute("aria-selected", String(x.dataset.view==='profile')));
      $("profileView").style.display = '';
      $("tierView").style.display = 'none';
      browsePos = tierPos;
      renderProfileView();
      openProfile(p, tierPos);
    };
  });
}

/* ── SPLITS VIEW (QB1s, dome/retractable-roof teams, home vs road) ─── */
const SPLITS_VENUE_LABEL = { fixed: 'Fixed dome', retractable: 'Retractable roof' };
const SPLITS_COLS = [
  ['games','G',0], ['comp','Cmp',0], ['att','Att',0], ['comp_pct','Cmp%',1],
  ['pass_yds','Yds',0], ['pass_ypg','Yds/G',1], ['ypa','Y/A',1], ['pass_td','TD',0], ['int','INT',0],
  ['rating','Rate',1], ['sacks','Sk',0], ['dk_pts_pg','DK/G',1],
];

function renderSplits(){
  const dome = PLAYERSTATS.qb_dome_splits || {};
  const teams = Object.keys(dome).sort();
  if(!teams.length){
    $("splitsView").innerHTML = `<div class="empty">No dome/road splits available yet.<br>
      Run <b>python3 build_matchup_stats.py all</b> in your lab folder, then reload.</div>`;
    return;
  }

  const splitsRow = (label, s) => {
    if(!s) return `<tr><td class="name-col">${label}</td>
      <td colspan="${SPLITS_COLS.length}" style="color:var(--text-dim);text-align:center">No games</td></tr>`;
    return `<tr><td class="name-col">${label}</td>` +
      SPLITS_COLS.map(([k,,dec]) => {
        const v = s[k];
        return `<td>${v==null ? '—' : (dec ? v.toFixed(dec) : v)}</td>`;
      }).join('') + `</tr>`;
  };

  const cards = teams.map(t => {
    const q = dome[t];
    const diff = (q.home && q.road) ? +(q.home.dk_pts_pg - q.road.dk_pts_pg).toFixed(1) : null;
    return `<div class="splits-card" data-gsis="${esc(q.gsis_id)}">
      <div class="splits-head">
        <img class="browse-headshot" style="width:34px;height:34px" src="${esc(q.headshot||'')}"
             referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <div>
          <div class="splits-name">${esc(q.name)} ${fiLogoHTML(t,16)}
            <span style="color:var(--text-dim);font-weight:400;font-size:11px">${t}</span></div>
          <div class="splits-venue">${SPLITS_VENUE_LABEL[q.venue]}</div>
        </div>
        ${diff!==null ? `<span class="splits-diff ${diff>=0?'up':'down'}">
          ${diff>=0?'+':''}${diff} DK/G at home</span>` : ''}
      </div>
      <div class="table-wrap"><table class="splits-table">
        <thead><tr><th></th>${SPLITS_COLS.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>
        <tbody>${splitsRow('Home', q.home)}${splitsRow('Road', q.road)}${splitsRow('Road (Outdoor)', q.road_outdoor)}</tbody>
      </table></div>
    </div>`;
  }).join('');

  $("splitsView").innerHTML = `
    <div class="lineup-note" style="margin-bottom:12px">
      QB1 for every fixed-dome or retractable-roof team · ${teams.length} qualifying starters ·
      Home/Road is by team venue for the full season, not each game's actual roof state
      (retractable-roof teams occasionally play a home game with the roof open).
      Road (Outdoor) further narrows Road to games at a stadium that isn't itself
      a dome/retractable-roof venue — a road trip to another dome team is excluded.
    </div>
    <div class="splits-grid">${cards}</div>`;

  $("splitsView").querySelectorAll(".splits-card").forEach(el => {
    el.onclick = () => {
      const p = PLAYERSTATS.players.QB.find(x => x.gsis_id === el.dataset.gsis);
      if(!p) return;
      $("viewTabs").querySelectorAll("button").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.view==='profile')));
      $("profileView").style.display = '';
      $("splitsView").style.display = 'none';
      browsePos = 'QB';
      renderProfileView();
      openProfile(p, 'QB');
    };
  });
}

load();
</script>
