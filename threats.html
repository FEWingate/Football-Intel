<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Threat System — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
.summary{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.warn{display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;padding:11px 13px;
  border:1px solid rgba(251,146,60,.4);background:rgba(251,146,60,.07);
  border-radius:var(--radius);font-size:12.5px;color:var(--text-mid);line-height:1.55}
.warn b{color:var(--accent-orange);font-family:var(--font-mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding-top:2px}
.sum-pill{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;
  padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--text-mid)}
.sum-pill b{color:var(--text);font-weight:600}

.tier-nuclear{--tc:var(--accent-red)}
.tier-elite{--tc:var(--accent-gold)}
.tier-standard{--tc:var(--accent-blue)}
.tbadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);
  font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  padding:3px 8px;border-radius:var(--radius-sm);color:var(--tc);
  border:1px solid color-mix(in srgb, var(--tc) 45%, transparent);
  background:color-mix(in srgb, var(--tc) 9%, transparent)}
.tbadge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--tc)}

.gm-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@media(max-width:900px){.gm-grid{grid-template-columns:1fr}}
.gm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.gm.live{border-color:color-mix(in srgb,var(--accent-red) 40%,var(--border))}
.gm-head{padding:13px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;background:var(--surface2)}
.gm-title{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.gm-title em{font-style:normal;color:var(--text-dim);font-weight:600;font-size:12px;margin:0 6px}
.gm-recs{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.gm-count{margin-left:auto;font-family:var(--font-mono);font-size:10px;
  color:var(--text-dim);letter-spacing:.06em}
.sides{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:560px){.sides{grid-template-columns:1fr}}
.side{padding:13px 15px 15px}
.side + .side{border-left:1px solid var(--border)}
@media(max-width:560px){.side + .side{border-left:0;border-top:1px solid var(--border)}}
.side-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-mid);margin-bottom:11px;
  display:flex;align-items:center;gap:7px}
.side-h .vs{color:var(--text-dim);letter-spacing:.04em;text-transform:none}

.thr{padding:10px 0;border-bottom:1px solid var(--hairline)}
.thr:last-child{border-bottom:0}
.thr-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.thr-name{font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.thr-pos{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);
  border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.thr-snap{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-left:auto}
.thr-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.conv{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.conv-row{font-family:var(--font-mono);font-size:10.5px;color:var(--text-mid);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.conv-row .cat{color:var(--text)}
.conv-row .rk{font-size:9.5px}
.conv-row .arrow{color:var(--text-dim)}
.conv-row .mark{width:7px;display:inline-block;color:var(--primary);font-size:7px;line-height:1}
.conv-row.support{opacity:.5}
.support-note{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;
  color:var(--text-dim);padding-left:14px;margin-top:2px;font-style:italic}
.na{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
  letter-spacing:.1em;padding:8px 0}
.rules{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  line-height:1.9;margin-top:26px;padding-top:16px;border-top:1px solid var(--border)}
.rules b{color:var(--text-mid);font-weight:500}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script>
const SUPPORT_DISPLAY_MAX = 10;   // how far down to show supporting rows

let DATA = null;
const main = fiShell({ page: 'threats', pageLabel: 'Threat System', status: 'loading' });
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

main.innerHTML = `
  <div class="bar">
    <label class="lbl" for="wk">Week</label><select id="wk"></select>
    <div class="legend">
      <span class="tier-standard"><span class="tbadge">Standard</span></span>
      <span>top 10 vs bottom 10</span>
      <span class="tier-elite"><span class="tbadge">Elite</span></span>
      <span>top 5 vs bottom 5</span>
      <span class="tier-nuclear"><span class="tbadge">Nuclear</span></span>
      <span>top 3 vs bottom 3</span>
    </div>
  </div>
  <div id="warn"></div>
  <div class="summary" id="summary"></div>
  <div class="gm-grid" id="grid" aria-live="polite"></div>
  <div class="rules" id="rules"></div>`;

const wkSel = $('wk');
for (let w = 3; w <= 18; w++){
  const o = document.createElement('option'); o.value = w; o.textContent = 'Week ' + w;
  wkSel.appendChild(o);
}
wkSel.value = 10;
wkSel.addEventListener('change', () => load(Number(wkSel.value)));

const classify = fiClassify;

/* ── data ── */
async function load(week){
  $('grid').innerHTML = `<div class="empty">Loading week ${week}…</div>`;
  $('summary').innerHTML = ''; $('rules').innerHTML = '';
  fiStatus('Loading', 'loading');
  try {
    const res = await fetch(`threats/wk${pad(week)}.json`);
    if (!res.ok) throw new Error('missing');
    DATA = await res.json();
  } catch (e){
    DATA = null; fiStatus('No data', 'error'); fiUpdated('');
    $('grid').innerHTML = `<div class="empty">
      Week ${week} isn't built yet.<br>
      Run <b>python3 build_matchup_stats.py ${week}</b>, then reload.</div>`;
    return;
  }
  fiStatus('Ready');
  fiUpdated(`${DATA.season} · through ${DATA.data_horizon}`);
  render();
}

function label(pos, cat){ return DATA.labels[pos][cat] || cat; }

function threatHTML(s){
  const results = classify(s.cats || {});
  if (!results.length) return '';
  const badges = results.map(r =>
    `<span class="tier-${r.tier}"><span class="tbadge">${r.tierLabel} ${r.type}</span></span>`).join('');
  const convCats = results.flatMap(r => r.conv);
  const row = (c, converged) => {
    const x = s.cats[c];
    return `<div class="conv-row${converged ? '' : ' support'}">
      ${converged ? '<span class="mark">\u25CF</span>' : '<span class="mark"></span>'}
      <span class="cat">${esc(label(s.pos, c))}</span>
      <span class="rk ${rkClass(x.r)}">#${x.r}</span>
      <span>${x.v}</span>
      <span class="arrow">vs</span>
      <span class="rk ${rkClass(x.dr)}">D #${x.dr}</span>
      <span>${x.dv} allowed</span>
    </div>`;
  };
  const support = Object.keys(s.cats).filter(c =>
    !convCats.includes(c) && s.cats[c].r <= SUPPORT_DISPLAY_MAX);
  const rows = convCats.map(c => row(c, true)).join('')
    + support.map(c => row(c, false)).join('')
    + (support.length ? '<div class="support-note">'
        + (support.length === 1 ? 'top-10 strength, defence not vulnerable there'
                                : 'top-10 strengths, defence not vulnerable there')
        + '</div>' : '');
  return `<div class="thr">
    <div class="thr-top">
      <span class="thr-name">${esc(s.name)}</span>
      <span class="thr-pos">${esc(s.pos)}</span>
      <span class="thr-snap">${s.snap_pct}% snaps</span>
    </div>
    <div class="thr-badges">${badges}</div>
    <div class="conv">${rows}</div>
  </div>`;
}

function sideHTML(team, opp){
  const t = DATA.teams[team];
  if (!t) return `<div class="side"><div class="side-h">${esc(team)}</div><div class="na">N/A</div></div>`;
  const body = (t.starters || []).map(threatHTML).filter(Boolean).join('');
  return `<div class="side">
    <div class="side-h">${esc(team)} <span class="vs">vs ${esc(opp)} defense</span></div>
    ${body || '<div class="na">N/A — no threats</div>'}
  </div>`;
}

function render(){
  const counts = {}; let total = 0, gamesWith = 0;
  const cards = DATA.games.map(g => {
    let n = 0;
    for (const t of [g.away, g.home]){
      for (const s of (DATA.teams[t]?.starters || [])){
        for (const r of classify(s.cats || {})){
          n++; total++;
          counts[`${r.tierLabel} ${r.type}`] = (counts[`${r.tierLabel} ${r.type}`] || 0) + 1;
        }
      }
    }
    if (n) gamesWith++;
    const hot = Object.keys(DATA.teams).length && n >= 3;
    return `<section class="gm${hot ? ' live' : ''}">
      <div class="gm-head">
        <span class="gm-title">${g.away}<em>@</em>${g.home}</span>
        <span class="gm-recs">${esc(g.away_record)} · ${esc(g.home_record)}</span>
        <span class="gm-count">${n || 'no'} threat${n === 1 ? '' : 's'}</span>
      </div>
      <div class="sides">${sideHTML(g.away, g.home)}${sideHTML(g.home, g.away)}</div>
    </section>`;
  }).join('');

  $('grid').innerHTML = cards;
  $('warn').innerHTML = DATA.thin_sample
    ? `<div class="warn"><b>Thin sample</b><span>Ranks here come from only
       ${DATA.week - 1} week${DATA.week - 1 === 1 ? '' : 's'} of play, with a
       ${DATA.min_games}-game minimum. Early-season ranks swing hard, so expect more
       flags than a settled week would produce — treat these as provisional.</span></div>`
    : '';
  $('summary').innerHTML =
    `<span class="sum-pill"><b>${total}</b> threats</span>
     <span class="sum-pill"><b>${gamesWith}</b> of ${DATA.games.length} games</span>` +
    Object.entries(counts).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<span class="sum-pill">${esc(k)} <b>${v}</b></span>`).join('');
  $('rules').innerHTML =
    `<b>Starters</b> — one QB, one RB, two WR, one TE per team, by mean offensive snap share
     over the previous ${DATA.snap_lookback} weeks.<br>
     <b>Ranks</b> — per-game production, ranked within position among players with
     ${DATA.min_games}+ games. Defense ranks are yards and scores allowed to that position, per game.<br>
     <b>Tiers are exclusive</b> — a convergence counts once, at the tightest tier it clears.
     A player can hold more than one designation.`;
}

load(10);
</script>
</body>
</html>
