<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Games — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
.daygroup{margin-bottom:24px}
.dayhead{display:flex;align-items:baseline;gap:11px;margin:0 0 11px}
.dayhead h2{margin:0;font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:700;color:var(--text)}
.dayhead .date{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:.06em}
.dayhead .rule{flex:1;height:1px;background:var(--border)}

.card-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 22px 20px;display:block;text-decoration:none;color:inherit;
  transition:border-color .18s,transform .15s}
.gcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.gcard.hot{border-color:rgba(163,230,53,.45)}
.gcard-top{display:flex;align-items:flex-start;gap:14px}
.teams-col{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:11px;padding:6px 0}
.tabbr{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.02em;
  min-width:60px}
.trow.win .tabbr{color:var(--primary)}
.trec{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim)}
.tform{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em}
.tform .W{color:var(--accent-green)} .tform .L{color:var(--accent-red)} .tform .T{color:var(--text-dim)}
.tscore{margin-left:auto;font-family:var(--font-mono);font-size:23px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--text-mid)}
.trow.win .tscore{color:var(--text);font-weight:700}
.kick{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text-mid);
  white-space:nowrap;line-height:1.7}
.kick .final{color:var(--accent-green);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.odds{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--hairline)}
.odd{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;padding:5px 10px;
  border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text-mid)}
.odd b{color:var(--text);font-weight:600}
.odd.thr{border-color:rgba(163,230,53,.4);color:var(--primary);background:rgba(163,230,53,.06)}
.odd.thr b{color:var(--primary)}
.meta{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;font-family:var(--font-mono);
  font-size:10.5px;color:var(--text-dim);letter-spacing:.04em}
.links{display:flex;gap:8px;margin-top:14px}
.links a{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);text-decoration:none;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 9px}
.links span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-dim);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 9px}
.gcard:hover .links span{color:var(--primary);border-color:rgba(163,230,53,.4)}
.modal-header{text-align:center}
.modal-header .modal-title{justify-content:center}
.modal-header .modal-subtitle{text-align:center}
.boxtable td{font-size:13.5px}
.boxtable .boxlbl{text-align:center;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.boxtable .num{font-family:var(--font-mono);font-size:15px;color:var(--text-mid);width:34%}
.boxtable td.num:first-child{text-align:right}
.boxtable td.num:last-child{text-align:left}
.boxtable .num.lead{color:var(--primary);font-weight:600}
.leaders{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
@media(max-width:600px){.leaders{grid-template-columns:1fr}}
.lead-col{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 13px}
.lead-team{display:flex;align-items:center;gap:8px;font-family:var(--font-display);
  font-weight:800;font-size:15px;margin-bottom:9px}
.lead-row{display:grid;grid-template-columns:44px 1fr;gap:7px;padding:6px 0;
  border-bottom:1px solid var(--hairline)}
.lead-row:last-child{border-bottom:0}
.lp{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.12em;color:var(--text-dim);
  padding-top:3px}
.ln{font-size:13.5px;font-weight:500}
.lv{grid-column:2;font-family:var(--font-mono);font-size:10.5px;color:var(--text-mid)}
.mkt{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.na{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
@media(max-width:520px){
  .kick{font-size:11px}.tabbr{font-size:20px;min-width:52px}
  .gcard{padding:16px 16px 17px}
  .card-grid{grid-template-columns:1fr}
}

/* The card itself is now a div, not a button (buttons can't legally nest
   inside buttons — needed real per-action buttons inside it). Restyled to
   look and behave the same as before, plus keyboard-focusable. */
.gcard{cursor:pointer}
.gcard:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Real per-action buttons in the link row, replacing the old decorative
   spans. stopPropagation keeps them independent of the card's own
   default click (Box Score). */
.links button{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);background:none;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 9px;cursor:pointer;transition:all .15s;
}
.links button:hover{color:var(--primary);border-color:rgba(163,230,53,.4)}
.links button:disabled{opacity:.4;cursor:not-allowed}
.links button:disabled:hover{color:var(--text-dim);border-color:var(--border)}

/* Matchup modal: team_off vs team_def side-by-side comparison rows */
.mu-side{margin-bottom:18px}
.mu-side:last-child{margin-bottom:0}
.mu-head{display:flex;align-items:center;gap:8px;font-family:var(--font-display);
  font-weight:800;font-size:14px;margin-bottom:10px}
.mu-head .vs{color:var(--text-dim);font-weight:500;font-size:12px}
.mu-row{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--hairline)}
.mu-row:last-child{border-bottom:0}
.mu-val{font-family:var(--font-mono);font-size:13px;color:var(--text-mid)}
.mu-val.off{text-align:right}
.mu-val b{color:var(--text);font-weight:600}
.mu-rank{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-left:5px}
.mu-lbl{text-align:center;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-dim)}

/* Threats modal */
.thr-side{margin-bottom:16px}
.thr-side:last-child{margin-bottom:0}
.thr-player{padding:10px 0;border-bottom:1px solid var(--hairline)}
.thr-player:last-child{border-bottom:0}
.thr-pname{font-size:13px;font-weight:600;color:var(--text)}
.thr-ppos{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-left:6px}
.thr-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.thr-badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;border:1px solid rgba(163,230,53,.35);
  color:var(--primary);background:rgba(163,230,53,.07)}
.thr-badge.nuclear{border-color:rgba(248,113,113,.4);color:#f87171;background:rgba(248,113,113,.08)}
.thr-badge.elite{border-color:rgba(250,204,21,.4);color:var(--accent-gold);background:rgba(250,204,21,.08)}

/* Game Breakdown modal — markdown container, matches DFS Center's
   Coeus report styling */
.gb-report h1{font-family:var(--font-display);font-weight:800;font-size:20px;margin:0 0 6px;color:var(--text)}
.gb-report h2{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--primary);
  margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--hairline)}
.gb-report h2:first-of-type{border-top:none;padding-top:0;margin-top:14px}
.gb-report h3{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--text);margin:14px 0 6px}
.gb-report p{font-size:12.5px;line-height:1.65;color:var(--text-mid);margin:0 0 11px}
.gb-report strong{color:var(--text);font-weight:600}
.gb-report ul,.gb-report ol{margin:0 0 11px;padding-left:19px}
.gb-report li{font-size:12.5px;line-height:1.6;color:var(--text-mid);margin-bottom:4px}
.gb-report hr{border:none;border-top:1px solid var(--hairline);margin:18px 0}

</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
<script>
let GAMES = null, THREATS = null, MATCHUP = null, GB_MANIFEST = null;
const main = fiShell({ page: 'games', pageLabel: 'Games', status: 'loading' });
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

main.innerHTML = `
  <div class="bar">
    <label class="lbl" for="wk">Week</label><select id="wk"></select>
    <div class="legend" id="wksum"></div>
  </div>
  <div id="slate" aria-live="polite"></div>
  <div class="modal-overlay" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-subtitle" id="mSub"></div>
      <button class="modal-close" id="mClose" aria-label="Close game">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>`;

const wkSel = $('wk');
for (let w = 1; w <= 18; w++){
  const o = document.createElement('option'); o.value = w; o.textContent = 'Week ' + w;
  wkSel.appendChild(o);
}
wkSel.value = 10;
wkSel.addEventListener('change', () => load(Number(wkSel.value)));

async function load(week){
  $('slate').innerHTML = `<div class="empty">Loading week ${week}…</div>`;
  $('wksum').innerHTML = '';
  fiStatus('Loading', 'loading');
  try {
    const r = await fetch(`games/wk${pad(week)}.json`);
    if (!r.ok) throw new Error('missing');
    GAMES = await r.json();
  } catch (e){
    GAMES = null; fiStatus('No data', 'error'); fiUpdated('');
    $('slate').innerHTML = `<div class="empty">
      Week ${week} isn't built yet.<br>
      Run <b>python3 build_matchup_stats.py ${week}</b>, then reload.</div>`;
    return;
  }
  THREATS = null;
  try {
    const r2 = await fetch(`threats/wk${pad(week)}.json`);
    if (r2.ok) THREATS = await r2.json();
  } catch (e){ /* threat board not built for this week — cards still render */ }
  MATCHUP = null;
  try {
    const r3 = await fetch(`matchup/wk${pad(week)}.json`);
    if (r3.ok) MATCHUP = await r3.json();
  } catch (e){ /* matchup stats not built for this week — Matchup button just disables */ }
  GB_MANIFEST = null;
  try {
    const r4 = await fetch(`game_breakdowns/wk${pad(week)}/manifest.json`);
    if (r4.ok) GB_MANIFEST = await r4.json();
  } catch (e){ /* no Game Breakdowns generated for this week yet — button disables per-game */ }
  fiStatus('Ready');
  fiUpdated(`${GAMES.season} · week ${GAMES.week}`);
  render();
}

function threatCount(team){
  if (!THREATS || !THREATS.teams[team]) return null;
  return (THREATS.teams[team].starters || [])
    .reduce((n, s) => n + fiClassify(s.cats).length, 0);
}

function formHTML(f){
  return (f || '').split('').map(c => `<span class="${c}">${c}</span>`).join('');
}

function timeLabel(g){
  if (g.played) return `<div class="final">Final</div>`;
  if (!g.gametime) return '';
  const [h, m] = g.gametime.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `<div>${hh}:${pad(m)} ${ampm} ET</div>`;
}

function render(){
  const days = {};
  GAMES.games.forEach(g => { (days[g.gameday] ||= []).push(g); });

  let html = '', withLines = 0, played = 0;
  Object.entries(days).forEach(([date, list]) => {
    const wd = list[0].weekday || '';
    const nice = new Date(date + 'T12:00:00').toLocaleDateString(undefined,
      { month: 'short', day: 'numeric' });
    html += `<div class="daygroup">
      <div class="dayhead"><h2>${esc(wd)}</h2><span class="date">${nice}</span>
        <span class="rule"></span></div>
      <div class="card-grid">`;
    list.forEach(g => {
      if (g.spread_line !== null) withLines++;
      if (g.played) played++;
      const aw = g.played && g.away_score > g.home_score;
      const hw = g.played && g.home_score > g.away_score;
      const at = threatCount(g.away), ht = threatCount(g.home);
      const totalThreats = (at || 0) + (ht || 0);

      const fav = g.spread_line === null ? null
        : (g.spread_line > 0 ? g.home : g.away);
      const spreadTxt = g.spread_line === null ? ''
        : `<span class="odd"><b>${esc(fav)}</b> −${Math.abs(g.spread_line)}</span>`;
      const totalTxt = g.total_line === null ? ''
        : `<span class="odd">O/U <b>${g.total_line}</b></span>`;
      const thrTxt = totalThreats
        ? `<span class="odd thr"><b>${totalThreats}</b> threat${totalThreats === 1 ? '' : 's'}</span>` : '';

      const hasGB = GB_MANIFEST && GB_MANIFEST.games &&
        (GB_MANIFEST.games[`${g.away}_${g.home}`] || GB_MANIFEST.games[`${g.home}_${g.away}`]);
      const hasMatchup = MATCHUP && MATCHUP.teams && MATCHUP.teams[g.away] && MATCHUP.teams[g.home];
      const hasThreats = THREATS && THREATS.teams && (THREATS.teams[g.away] || THREATS.teams[g.home]);

      html += `<div class="gcard${totalThreats >= 4 ? ' hot' : ''}" data-gid="${g.game_id}"
        tabindex="0" role="button" aria-label="View box score, ${g.away} at ${g.home}">
        <div class="gcard-top">
          <div class="teams-col">
            <div class="trow${aw ? ' win' : ''}">
              ${fiLogoHTML(g.away, 32)}
              <span class="tabbr">${g.away}</span>
              <span class="trec">${esc(g.away_record)}</span>
              <span class="tform">${formHTML(g.away_form)}</span>
              ${g.played ? `<span class="tscore">${g.away_score}</span>` : ''}
            </div>
            <div class="trow${hw ? ' win' : ''}">
              ${fiLogoHTML(g.home, 32)}
              <span class="tabbr">${g.home}</span>
              <span class="trec">${esc(g.home_record)}</span>
              <span class="tform">${formHTML(g.home_form)}</span>
              ${g.played ? `<span class="tscore">${g.home_score}</span>` : ''}
            </div>
          </div>
          <div class="kick">${timeLabel(g)}</div>
        </div>
        <div class="odds">${spreadTxt}${totalTxt}${thrTxt}</div>
        <div class="meta">
          <span>${esc(g.stadium)}</span>
          ${g.roof ? `<span>${esc(g.roof)}</span>` : ''}
          ${g.surface ? `<span>${esc(g.surface)}</span>` : ''}
          ${g.div_game ? '<span>division</span>' : ''}
          ${g.away_rest !== null ? `<span>rest ${g.away_rest}/${g.home_rest}</span>` : ''}
        </div>
        <div class="links">
          <button type="button" data-action="matchup" ${hasMatchup ? '' : 'disabled'}
            title="${hasMatchup ? '' : 'Matchup stats not built for this week'}">Matchup</button>
          <button type="button" data-action="threats" ${hasThreats ? '' : 'disabled'}
            title="${hasThreats ? '' : 'No threat board for this week'}">Threats</button>
          <button type="button" data-action="box">Box score</button>
          <button type="button" data-action="breakdown" ${hasGB ? '' : 'disabled'}
            title="${hasGB ? '' : 'Game Breakdown not available for this game yet'}">Game Breakdown</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  $('slate').innerHTML = html;
  $('slate').querySelectorAll('.gcard').forEach(card => {
    card.addEventListener('click', () => openGame(card.dataset.gid, card));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openGame(card.dataset.gid, card); }
    });
    card.querySelectorAll('.links button').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (btn.disabled) return;
        const gid = card.dataset.gid;
        const action = btn.dataset.action;
        if (action === 'matchup') openMatchup(gid, btn);
        else if (action === 'threats') openThreats(gid, btn);
        else if (action === 'box') openGame(gid, btn);
        else if (action === 'breakdown') openGameBreakdown(gid, btn);
      });
    });
  });
  $('wksum').innerHTML =
    `<span>${GAMES.games.length} games</span>` +
    (played ? `<span>${played} final</span>` : '') +
    (withLines ? `<span>${withLines} with lines</span>` : '<span>lines not posted</span>');
}

/* ── game modal: box score + offensive leaders ── */
let lastFocus = null;
const BOX_ROWS = [
  ['pts', 'Points'], ['total_yds', 'Total yards'], ['pass_yds', 'Passing yards'],
  ['rush_yds', 'Rushing yards'], ['first_downs', 'First downs'],
  ['comp', 'Completions'], ['att', 'Attempts'],
  ['sacks_taken', 'Sacks allowed'], ['turnovers', 'Interceptions'],
];

function leaderBlock(side, team, L){
  if (!L) return `<div class="lead-col"><div class="lead-team">${fiLogoHTML(team, 22)}
    <span>${esc(team)}</span></div><div class="na">No data</div></div>`;
  const qb = L.qb ? `<div class="lead-row"><span class="lp">QB</span>
      <span class="ln">${esc(L.qb.name)}</span>
      <span class="lv">${L.qb.comp}/${L.qb.att}, ${L.qb.yds} yds,
        ${L.qb.td} TD${L.qb.int ? `, ${L.qb.int} INT` : ''}${L.qb.rush_yds ? ` · ${L.qb.rush_yds} rush` : ''}</span>
    </div>` : '';
  const rush = (L.rush || []).map(r => `<div class="lead-row"><span class="lp">RUSH</span>
      <span class="ln">${esc(r.name)}</span>
      <span class="lv">${r.car} car, ${r.yds} yds${r.td ? `, ${r.td} TD` : ''}</span></div>`).join('');
  const rec = (L.rec || []).map(r => `<div class="lead-row"><span class="lp">REC</span>
      <span class="ln">${esc(r.name)}</span>
      <span class="lv">${r.rec}/${r.tgt}, ${r.yds} yds${r.td ? `, ${r.td} TD` : ''}</span></div>`).join('');
  return `<div class="lead-col">
    <div class="lead-team">${fiLogoHTML(team, 22)}<span>${esc(team)}</span></div>
    ${qb}${rush}${rec}</div>`;
}

function openGame(gid, source){
  const g = GAMES.games.find(x => x.game_id === gid);
  if (!g) return;
  lastFocus = source;
  $('mTitle').innerHTML =
    `${fiLogoHTML(g.away, 34)} ${g.away} <em>at</em> ${g.home} ${fiLogoHTML(g.home, 34)}`;
  const when = g.played
    ? `Final — ${g.away} ${g.away_score}, ${g.home} ${g.home_score}`
    : `${esc(g.weekday)} ${esc(g.gameday)}`;
  $('mSub').textContent = `${when} · ${g.stadium}`;

  let h = '';
  const box = g.box || {};
  if (box.away && box.home){
    h += `<div class="sect"><h3>${g.played ? 'Box score' : 'Season totals'}</h3><span class="rule"></span></div>
      <table class="stat-table boxtable"><thead><tr>
        <th class="right">${g.away}</th><th style="text-align:center">&nbsp;</th><th>${g.home}</th>
      </tr></thead><tbody>` +
      BOX_ROWS.filter(([k]) => box.away[k] !== null && box.away[k] !== undefined)
        .map(([k, lbl]) => {
          const a = box.away[k], b = box.home[k];
          const aw = a > b ? ' lead' : '', bw = b > a ? ' lead' : '';
          return `<tr><td class="num${aw}">${a}</td>
            <td class="boxlbl">${lbl}</td><td class="num${bw}">${b}</td></tr>`;
        }).join('') + `</tbody></table>`;
  }

  const L = g.leaders || {};
  if (L.away || L.home){
    h += `<div class="sect"><h3>${g.leader_scope === 'game' ? 'Game leaders' : 'Season leaders'}</h3>
      <span class="rule"></span></div>
      <div class="leaders">${leaderBlock('away', g.away, L.away)}${leaderBlock('home', g.home, L.home)}</div>`;
  }

  if (!h) h = `<div class="empty">No player data for this game yet.<br>
    Box scores appear once the game is played.</div>`;

  const odds = [];
  if (g.spread_line !== null) odds.push(`Spread ${g.spread_line > 0 ? g.home : g.away} −${Math.abs(g.spread_line)}`);
  if (g.total_line !== null) odds.push(`Total ${g.total_line}`);
  if (g.away_ml !== null) odds.push(`ML ${g.away}&nbsp;${g.away_ml > 0 ? '+' : ''}${g.away_ml} / ${g.home}&nbsp;${g.home_ml > 0 ? '+' : ''}${g.home_ml}`);
  if (odds.length) h += `<div class="sect"><h3>Market</h3><span class="rule"></span></div>
    <div class="mkt">${odds.map(o => `<span class="odd">${o}</span>`).join('')}</div>`;

  $('mBody').innerHTML = h;
  $('scrim').classList.add('open'); $('modal').classList.add('open');
  $('mClose').focus();
}
function closeModal(){
  $('scrim').classList.remove('open'); $('modal').classList.remove('open');
  if (lastFocus) lastFocus.focus();
}

/* ── matchup modal: team_off vs opponent's team_def, both directions ── */
const MU_ROWS = [
  ['ppg', 'PPG'], ['total_ypg', 'Total Yds'], ['pass_ypg', 'Pass Yds'],
  ['rush_ypg', 'Rush Yds'], ['fd_pg', '1st Downs'],
];
function muRow(offVal, defVal, label){
  const o = offVal ? `<b>${offVal.v}</b><span class="mu-rank">#${offVal.r}</span>` : '—';
  const d = defVal ? `<b>${defVal.v}</b><span class="mu-rank">#${defVal.r}</span>` : '—';
  return `<div class="mu-row"><span class="mu-val off">${o}</span>
    <span class="mu-lbl">${label}</span><span class="mu-val">${d}</span></div>`;
}
function muSide(offTeam, defTeam){
  const off = MATCHUP.teams[offTeam]?.team_off, def = MATCHUP.teams[defTeam]?.team_def;
  return `<div class="mu-side">
    <div class="mu-head">${fiLogoHTML(offTeam, 22)}<span>${esc(offTeam)} offense</span>
      <span class="vs">vs</span>${fiLogoHTML(defTeam, 22)}<span>${esc(defTeam)} defense</span></div>
    ${MU_ROWS.map(([k, lbl]) => muRow(off?.[k], def?.[k], lbl)).join('')}</div>`;
}
function openMatchup(gid, source){
  const g = GAMES.games.find(x => x.game_id === gid);
  if (!g || !MATCHUP) return;
  lastFocus = source;
  $('mTitle').innerHTML = `${fiLogoHTML(g.away, 34)} ${g.away} <em>at</em> ${g.home} ${fiLogoHTML(g.home, 34)}`;
  $('mSub').textContent = 'Matchup stats — season-to-date';
  $('mBody').innerHTML = muSide(g.away, g.home) + muSide(g.home, g.away);
  $('scrim').classList.add('open'); $('modal').classList.add('open');
  $('mClose').focus();
}

/* ── threats modal: every starter's fiClassify() output, both teams ── */
function threatBadges(cats){
  return fiClassify(cats).map(t =>
    `<span class="thr-badge ${t.tier}">${t.type} ${t.tierLabel}</span>`).join('');
}
function threatSide(team){
  const t = THREATS?.teams?.[team];
  if (!t) return `<div class="thr-side"><div class="mu-head">${fiLogoHTML(team, 22)}
    <span>${esc(team)}</span></div><div class="na">No threat data</div></div>`;
  const qualifying = (t.starters || []).filter(s => fiClassify(s.cats).length);
  const body = qualifying.length
    ? qualifying.map(s => `<div class="thr-player">
        <span class="thr-pname">${esc(s.name)}</span><span class="thr-ppos">${esc(s.pos)}</span>
        <div class="thr-badges">${threatBadges(s.cats)}</div></div>`).join('')
    : `<div class="na">No qualifying Threats this week</div>`;
  return `<div class="thr-side"><div class="mu-head">${fiLogoHTML(team, 22)}
    <span>${esc(team)}</span></div>${body}</div>`;
}
function openThreats(gid, source){
  const g = GAMES.games.find(x => x.game_id === gid);
  if (!g || !THREATS) return;
  lastFocus = source;
  $('mTitle').innerHTML = `${fiLogoHTML(g.away, 34)} ${g.away} <em>at</em> ${g.home} ${fiLogoHTML(g.home, 34)}`;
  $('mSub').textContent = 'Threats for this game';
  $('mBody').innerHTML = threatSide(g.away) + threatSide(g.home);
  $('scrim').classList.add('open'); $('modal').classList.add('open');
  $('mClose').focus();
}

/* ── game breakdown modal: fetches & renders the actual Coeus report ── */
let gbCache = {};
async function openGameBreakdown(gid, source){
  const g = GAMES.games.find(x => x.game_id === gid);
  if (!g || !GB_MANIFEST) return;
  lastFocus = source;
  $('mTitle').innerHTML = `${fiLogoHTML(g.away, 34)} ${g.away} <em>at</em> ${g.home} ${fiLogoHTML(g.home, 34)}`;
  $('mSub').textContent = 'Game Breakdown';
  $('mBody').innerHTML = `<div class="empty">Loading report…</div>`;
  $('scrim').classList.add('open'); $('modal').classList.add('open');
  $('mClose').focus();

  const fwdKey = `${g.away}_${g.home}`, revKey = `${g.home}_${g.away}`;
  const entry = GB_MANIFEST.games[fwdKey] || GB_MANIFEST.games[revKey];
  const key = GB_MANIFEST.games[fwdKey] ? fwdKey : revKey;
  if (!entry){
    $('mBody').innerHTML = `<div class="empty">Game Breakdown not available for this game yet.</div>`;
    return;
  }
  try {
    let md = gbCache[key];
    if (!md){
      const r = await fetch(`game_breakdowns/wk${pad(GAMES.week)}/${key}.md`);
      if (!r.ok) throw new Error('not found');
      md = await r.text();
      gbCache[key] = md;
    }
    $('mBody').innerHTML = `<div class="gb-report">${marked.parse(md)}</div>`;
  } catch (e){
    $('mBody').innerHTML = `<div class="empty">Game Breakdown not available for this game yet.</div>`;
  }
}

$('mClose').addEventListener('click', closeModal);
$('scrim').addEventListener('click', closeModal);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('modal').classList.contains('open')) closeModal();
});

load(10);
</script>
