<style>
.daygroup{margin-bottom:24px}
.dayhead{display:flex;align-items:baseline;gap:11px;margin:0 0 11px}
.dayhead h2{margin:0;font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;

.dayhead .date{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:.06em}
.dayhead .rule{flex:1;height:1px;background:var(--border)}

.card-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 22px 20px;display:block;text-decoration:none;color:inherit;
  transition:border-color .18s,transform .15s}
.gcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.gcard.hot{border-color:rgba(163,230,53,.45)}
.gcard-top{display:flex;align-items:flex-start;gap:14px}
.teams-col{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:11px;padding:6px 0}
.tabbr{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.02em;
  min-width:60px}
.trow.win .tabbr{color:var(--primary)}
.trec{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim)}
.tform{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em}
.tform .W{color:var(--accent-green)} .tform .L{color:var(--accent-red)} .tform .T{color:var(--text-dim)}
.tscore{margin-left:auto;font-family:var(--font-mono);font-size:23px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--text-mid)}
.trow.win .tscore{color:var(--text);font-weight:700}
.kick{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text-mid);

.kick .final{color:var(--accent-red);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.kick .live{color:var(--accent-green);font-size:10px;letter-spacing:.14em;text-transform:uppercase;

.kick .live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent-green);

@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
.kick .bcast{color:var(--text-dim);font-size:10px;text-align:right;margin-top:2px}

/* ── 3 scrolling leader tickers: Passing/Receiving/Rushing. Live across
   the whole week's real games (Thursday included) from Sunday kickoff
   through end of Monday; season-cumulative leaders the rest of the week.
   Classic marquee technique: content rendered twice back-to-back, track
   animated by exactly -50% of its own width, so the loop is seamless.
   Flexbox with an explicit row height, not inline-block + vertical-align
   — real bug found (2026-09-11): the inline-block version left each
   row's actual box height at the mercy of default line-height
   calculations, which came out shorter than the text needed and let
   adjacent ticker rows visually bleed into each other. Flex + a fixed
   height sidesteps that whole class of bug rather than tuning padding
   numbers and hoping. ── */
#tickers{border-bottom:1px solid var(--border)}
.ticker-wrap{display:flex;align-items:center;height:30px;background:var(--surface);
  border-bottom:1px solid var(--hairline);overflow:hidden}
.ticker-wrap:last-child{border-bottom:1px solid var(--border)}
.ticker-label{flex:0 0 auto;font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent-gold);
  padding:0 14px 0 20px;white-space:nowrap}
.ticker-scroll{flex:1 1 auto;overflow:hidden;white-space:nowrap;height:100%;position:relative}
.ticker-track{display:inline-flex;align-items:center;height:100%;white-space:nowrap;
  animation:tickerscroll linear infinite}
.ticker-wrap:hover .ticker-track{animation-play-state:paused}
@keyframes tickerscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;padding:0 22px;font-size:12px;white-space:nowrap}
.ticker-item .tk-rank{color:var(--text-dim);margin-right:6px}
.ticker-item .tk-name{font-weight:600;margin-right:6px}
.ticker-item .tk-team{color:var(--text-dim);margin-right:6px}
.ticker-item .tk-pos{color:var(--accent-gold);margin-right:6px;font-size:10px}
.ticker-item .tk-val{color:var(--accent-green);font-weight:700}
.ticker-empty{padding:0 20px;font-size:11px;color:var(--text-dim);white-space:nowrap}
.odds{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--hairline)}
.odd{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;padding:5px 10px;
  border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text-mid)}
.odd b{color:var(--text);font-weight:600}
.odd.thr{border-color:rgba(163,230,53,.4);color:var(--primary);background:rgba(163,230,53,.06)}
.odd.thr b{color:var(--primary)}
.meta{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;font-family:var(--font-mono);
  font-size:10.5px;color:var(--text-dim);letter-spacing:.04em}
.links{display:flex;gap:8px;margin-top:14px}
.links a{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);text-decoration:none;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 9px}
.links span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-dim);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 9px}
.gcard:hover .links span{color:var(--primary);border-color:rgba(163,230,53,.4)}
.modal-header{text-align:center}
.modal-header .modal-title{justify-content:center}
.modal-header .modal-subtitle{text-align:center}
.boxtable td{font-size:13.5px}
.boxtable .boxlbl{text-align:center;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.boxtable .num{font-family:var(--font-mono);font-size:15px;color:var(--text-mid);width:34%}
.boxtable td.num:first-child{text-align:right}
.boxtable td.num:last-child{text-align:left}

.leaders{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
@media(max-width:600px){.leaders{grid-template-columns:1fr}}

.lp{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.12em;color:var(--text-dim);

.ln{font-size:13.5px;font-weight:500}

@media(max-width:520px){
  .kick{font-size:11px}.tabbr{font-size:20px;min-width:52px}
  .gcard{padding:16px 16px 17px}
  .card-grid{grid-template-columns:1fr}

.gcard:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* Game Breakdown modal — markdown container, matches DFS Center's

.gb-report h1{font-family:var(--font-display);font-weight:800;font-size:24px;margin:0 0 8px;color:var(--text)}
.gb-report h2{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--primary);

<body>
<script src="js/fi-shell.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
<script>
let GAMES = null, THREATS = null, MATCHUP = null, GB_MANIFEST = null, PLAYERS = null;
const main = fiShell({ page: 'games', pageLabel: 'Games', status: 'loading' });
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

main.innerHTML = `
  <div id="tickers"></div>
  <div class="bar">
    <label class="lbl" for="wk">Week</label><select id="wk"></select>
    <div class="legend" id="wksum"></div>
  </div>
  <div id="slate" aria-live="polite"></div>
  <div class="modal-overlay" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-subtitle" id="mSub"></div>
      <button class="modal-close" id="mClose" aria-label="Close game">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>`;

const wkSel = $('wk');
for (let w = 1; w <= 18; w++){
  const o = document.createElement('option'); o.value = w; o.textContent = 'Week ' + w;
  wkSel.appendChild(o);
}
wkSel.value = 1;
wkSel.addEventListener('change', () => load(Number(wkSel.value)));

async function load(week){
  $('slate').innerHTML = `<div class="empty">Loading week ${week}…</div>`;
  $('wksum').innerHTML = '';
  fiStatus('Loading', 'loading');
  // {cache:'no-store'} on every fetch below is deliberate, not default
  // fetch() behavior: confirmed real bug (2026-09-10, traced in
  // intel_reports.html first, same root cause here) — a newly generated
  // Game Breakdown was correctly on disk and correctly listed in the
  // real manifest.json, but the "Game Breakdown" button stayed disabled
  // even after a reload. The local dev server (python -m http.server)
  // sends no cache-control headers, so the browser was free to
  // heuristically keep serving an OLDER cached response for these same
  // URLs. All of these files change whenever the build pipeline runs,
  // with no URL change to signal that — no-store means every page load
  // genuinely re-fetches them instead of ever trusting a stale copy.
  try {
    const r = await fetch(`games/wk${pad(week)}.json`, { cache: 'no-store' });
    if (!r.ok) throw new Error('missing');
    GAMES = await r.json();
  } catch (e){
    GAMES = null; fiStatus('No data', 'error'); fiUpdated('');
    $('slate').innerHTML = `<div class="empty">
      Week ${week} isn't built yet.<br>
      Run <b>python3 build_matchup_stats.py ${week}</b>, then reload.</div>`;
    return;
  }
  THREATS = null;
  try {
    const r2 = await fetch(`threats/wk${pad(week)}.json`, { cache: 'no-store' });
    if (r2.ok) THREATS = await r2.json();
  } catch (e){ /* threat board not built for this week — cards still render */ }
  MATCHUP = null;
  try {
    const r3 = await fetch(`matchup/wk${pad(week)}.json`, { cache: 'no-store' });
    if (r3.ok) MATCHUP = await r3.json();
  } catch (e){ /* matchup stats not built for this week — Matchup button just disables */ }
  GB_MANIFEST = null;
  try {
    const r4 = await fetch(`game_breakdowns/wk${pad(week)}/manifest.json`, { cache: 'no-store' });
    if (r4.ok) GB_MANIFEST = await r4.json();
  } catch (e){ /* no Game Breakdowns generated for this week yet — button disables per-game */ }
  // Real season-cumulative leaders (players/latest.json) — for the
  // Tue-Sat ticker state. Fetched every load regardless of current day,
  // since the day can roll over while the tab stays open.
  PLAYERS = null;
  try {
    const r5 = await fetch(`players/latest.json`, { cache: 'no-store' });
    if (r5.ok) PLAYERS = await r5.json();
  } catch (e){ /* season-leader ticker just won't have data — live-week ticker doesn't need this file at all */ }
  fiStatus('Ready');
  fiUpdated(`${GAMES.season} · week ${GAMES.week}`);
  render();
  renderTickers();
  startEspnPolling(); // re-armed on every week load/switch — resumes automatically if the newly loaded week has a live game
}

function threatCount(team){
  if (!THREATS || !THREATS.teams[team]) return null;
  return (THREATS.teams[team].starters || [])
    .reduce((n, s) => n + fiClassify(s.cats).length, 0);
}

function formHTML(f){
  return (f || '').split('').map(c => `<span class="${c}">${c}</span>`).join('');
}

function etOffsetMinutes(dateStr){
  // Real, DST-aware America/New_York UTC offset for a given calendar date
  // (240 min = EDT, 300 min = EST) — computed via Intl, not hardcoded,
  // since the NFL season genuinely spans both sides of the changeover.
  const d = new Date(`${dateStr}T12:00:00Z`);
  const utcStr = d.toLocaleString('en-US', { timeZone: 'UTC', hour12: false });
  const etStr = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
  return (new Date(utcStr) - new Date(etStr)) / 60000;
}
function kickoffHasPassed(g){
  if(!g.gameday || !g.gametime) return false;
  const [h, m] = g.gametime.split(':').map(Number);
  const kickoffUTC = new Date(`${g.gameday}T00:00:00Z`);
  kickoffUTC.setUTCMinutes(kickoffUTC.getUTCMinutes() + h * 60 + m + etOffsetMinutes(g.gameday));
  return new Date() >= kickoffUTC;
}

// ── ESPN live overlay ──────────────────────────────────────────────────
// nflverse (games/wkNN.json) is the reliable base — real, accurate, but
// only as fresh as the last manual rebuild. ESPN's public scoreboard
// (confirmed real, live, and callable directly from this site's origin —
// CORS verified 2026-09-11) is the automatic layer on top: polled
// periodically and merged into the SAME GAMES.games objects nflverse
// already built, so the existing cards update in place — no separate
// "live" UI to maintain, per Frank's explicit call (2026-09-11): overlay
// onto the working cards, not a parallel live view, because nflverse
// isn't automatic and this needs to be.
const ESPN_SCOREBOARD_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
const ESPN_POLL_MS = 30000;
let espnPollTimer = null;

// A handful of team codes are known to occasionally differ between
// nflverse and ESPN's own abbreviation conventions league-wide. Empty
// today — every code seen in real testing has matched exactly — but kept
// as an explicit, checkable seam rather than assumed permanent: if a
// future mismatch shows up, it's fixed once here, not wherever a code
// comparison happens to live in this file.
const ESPN_TEAM_CODE_FIXUPS = {};
function espnCode(abbr){ return ESPN_TEAM_CODE_FIXUPS[abbr] || abbr; }

async function pollEspnScoreboard(){
  let data;
  try {
    const r = await fetch(ESPN_SCOREBOARD_URL, { cache: 'no-store' });
    if (!r.ok) { console.warn('ESPN scoreboard poll: HTTP', r.status); return false; }
    data = await r.json();
  } catch (e) {
    // ESPN being briefly unreachable is never fatal — nflverse's own data
    // still renders fine — but failing with zero visible trace anywhere
    // makes this exact class of "why isn't X showing" impossible to
    // diagnose from a screenshot alone. A real console warning costs
    // nothing and turns a silent gap into something checkable.
    console.warn('ESPN scoreboard poll failed:', e);
    return false;
  }

  if (!GAMES) return false;
  const events = data.events || [];
  let anyStillLive = false;
  events.forEach(ev => {
    const comp = (ev.competitions || [])[0];
    if (!comp || !comp.competitors) return;
    const away = comp.competitors.find(c => c.homeAway === 'away');
    const home = comp.competitors.find(c => c.homeAway === 'home');
    if (!away || !home) return;
    const awayCode = espnCode(away.team.abbreviation);
    const homeCode = espnCode(home.team.abbreviation);

    const g = GAMES.games.find(x => x.away === awayCode && x.home === homeCode);
    if (!g) return; // this ESPN event isn't on the currently-viewed week — ignore it, not an error

    const state = comp.status.type.state; // 'pre' | 'in' | 'post'
    if (state === 'in') anyStillLive = true;

    g.live = state === 'in';
    g.away_score = Number(away.score);
    g.home_score = Number(home.score);
    g.played = g.played || state === 'post';
    g.liveClock = state === 'in' ? `Q${comp.status.period} ${comp.status.displayClock}` : null;
    // REAL BUG FIX (2026-09-12): was reading ev.broadcast — the top-level
    // event object — but confirmed directly against a live fetch that
    // ESPN nests this inside the competition object instead, on comp
    // (comp.broadcast as a plain string, comp.broadcasts as a parallel
    // array — both genuinely populated for every game checked). This is
    // the real reason it always came back null during the original
    // investigation: not missing data, a wrong nesting level the whole
    // time. comp.broadcasts[0].names[0] kept as a fallback in case the
    // singular field is ever absent while the array form still exists.
    g.broadcast = comp.broadcast || (comp.broadcasts && comp.broadcasts[0] &&
      comp.broadcasts[0].names && comp.broadcasts[0].names[0]) || null;

    // ESPN's per-game leaders are real-time, so they're the only source
    // of "who's doing what" while a game is still live — nflverse can't
    // have this yet, since its own stats aren't real-time. Once the real
    // nflverse box score/leaders exist (g.box / g.leaders, filled in on
    // the next rebuild), those take over in openGame() below — this is a
    // live stand-in, not a replacement for the real pipeline. ESPN's own
    // leaders are ONE leader per stat category for the WHOLE GAME (not
    // split by side the way nflverse's are), keyed by ESPN's numeric
    // team id — the id map lets the live-leaders render below say which
    // real team each one belongs to.
    //
    // Captured for 'post' (Final) as well as 'in' (live), not just live —
    // confirmed directly from a real fetch that ESPN keeps real leaders
    // data on a finished game too. Needed for the live-week ticker, which
    // must include Thursday's (already-final by Sunday) and any early
    // Sunday games alongside whatever's actually in progress right now.
    if ((state === 'in' || state === 'post') && Array.isArray(comp.leaders)) {
      g.espnLeaders = comp.leaders;
      g.espnTeamIdMap = { [away.team.id]: awayCode, [home.team.id]: homeCode };
    }
  });

  render();
  renderTickers();
  if (currentModalGameId) {
    const stillThere = GAMES.games.find(x => x.game_id === currentModalGameId);
    if (stillThere) openGame(currentModalGameId, lastFocus); // refresh the open modal in place rather than leaving it stale
  }
  return anyStillLive;
}

function startEspnPolling(){
  if (espnPollTimer) { clearInterval(espnPollTimer); espnPollTimer = null; }
  pollEspnScoreboard().then(stillLive => {
    // Only keep polling if something on THIS loaded week is actually
    // live right now — no reason to hit ESPN's API every 30s on a
    // Tuesday, or for a past/future week with nothing in progress.
    if (!stillLive) return;
    espnPollTimer = setInterval(async () => {
      const live = await pollEspnScoreboard();
      if (!live) { clearInterval(espnPollTimer); espnPollTimer = null; }
    }, ESPN_POLL_MS);
  });
}

// ── Ticker mode: "live" across the whole real week (Thu included) from
// Sunday's earliest real kickoff through the end of Monday's calendar
// date in ET; "season" the rest of the time. Reuses etOffsetMinutes()/
// kickoffHasPassed() above for the same real, DST-aware time handling —
// no separate date-math system to keep in sync with that one.
function tickerMode(){
  if (!GAMES || !GAMES.games.length) return 'season';
  const sunGames = GAMES.games.filter(g => g.weekday === 'Sunday' && g.gameday && g.gametime);
  const monGames = GAMES.games.filter(g => g.weekday === 'Monday' && g.gameday);
  if (!sunGames.length) return 'season'; // a bye/rescheduled week with no real Sunday slate

  const sunDate = sunGames[0].gameday;
  const monDate = monGames.length ? monGames[monGames.length - 1].gameday : sunDate;

  const now = new Date();
  const offsetMin = etOffsetMinutes(now.toISOString().slice(0, 10));
  const etDateStr = new Date(now.getTime() - offsetMin * 60000).toISOString().slice(0, 10);

  if (etDateStr < sunDate || etDateStr > monDate) return 'season';
  if (etDateStr === sunDate) {
    const earliestSun = sunGames.reduce((min, g) => (!min || g.gametime < min.gametime) ? g : min, null);
    if (!kickoffHasPassed(earliestSun)) return 'season';
  }
  return 'live';
}

// Live-week leaders: ESPN gives exactly ONE leader per stat category per
// game (not split by side), for both live AND final games (the merge
// above captures 'post' as well as 'in' specifically so Thursday's
// already-finished game counts here too, not just what's in progress
// right now). Aggregated across every real game on the currently loaded
// week and sorted — this is the union of each game's own top performer,
// not a true league-wide per-player search, which is the real limit of
// what ESPN's scoreboard endpoint can give without a call per game.
function buildLiveTickerData(){
  const cats = { passingYards: [], rushingYards: [], receivingYards: [] };
  (GAMES.games || []).forEach(g => {
    if (!g.espnLeaders) return;
    g.espnLeaders.forEach(cat => {
      if (!cats[cat.name] || !cat.leaders || !cat.leaders[0]) return;
      const lead = cat.leaders[0];
      const teamCode = (g.espnTeamIdMap || {})[lead.team.id] || '';
      cats[cat.name].push({
        name: lead.athlete.fullName, team: teamCode,
        pos: lead.athlete.position ? lead.athlete.position.abbreviation : '',
        value: lead.value,
      });
    });
  });
  Object.values(cats).forEach(list => list.sort((a, b) => b.value - a.value));
  return {
    passing: cats.passingYards.slice(0, 10),
    rushing: cats.rushingYards.slice(0, 10),
    receiving: cats.receivingYards.slice(0, 10),
  };
}

// Season leaders: real nflverse season-cumulative totals from
// players/latest.json. season.m holds BOTH raw cumulative stats
// (pass_yds) AND running per-game averages (pass_ypg) on the same
// object — pulling the raw total here is deliberate, same real
// distinction this project has been careful about all session (a
// leaderboard is about total production, not a per-game rate).
function buildSeasonTickerData(){
  if (!PLAYERS || !PLAYERS.players) return { passing: [], rushing: [], receiving: [] };
  const all = [];
  ['QB', 'RB', 'WR', 'TE'].forEach(pos => {
    (PLAYERS.players[pos] || []).forEach(p => all.push({ ...p, pos }));
  });
  const topBy = (key, n = 10) => all
    .filter(p => p.season && p.season.m && p.season.m[key] != null)
    .sort((a, b) => b.season.m[key] - a.season.m[key])
    .slice(0, n)
    .map(p => ({ name: p.name, team: p.team, pos: p.pos, value: p.season.m[key] }));
  return {
    passing: topBy('pass_yds'),
    rushing: topBy('rush_yds'),
    receiving: topBy('rec_yds'),
  };
}

function renderTickerRow(label, items){
  if (!items.length){
    return `<div class="ticker-wrap"><span class="ticker-label">${esc(label)}</span>
      <span class="ticker-empty">No real data yet.</span></div>`;
  }
  const one = items.map((it, i) => `<span class="ticker-item">
    <span class="tk-rank">${i + 1}</span>
    <span class="tk-name">${esc(it.name)}</span>
    <span class="tk-team">${esc(it.team)}</span>
    ${it.pos ? `<span class="tk-pos">${esc(it.pos)}</span>` : ''}
    <span class="tk-val">${Math.round(it.value)} yds</span>
  </span>`).join('');
  // Real duration scaled to content — a longer list scrolls
  // proportionally longer so the per-item pace stays roughly constant.
  const seconds = Math.max(18, items.length * 3.5);
  return `<div class="ticker-wrap"><span class="ticker-label">${esc(label)}</span>
    <div class="ticker-scroll"><div class="ticker-track" style="animation-duration:${seconds}s">${one}${one}</div></div>
  </div>`;
}

function renderTickers(){
  const el = $('tickers');
  if (!el) return;
  if (!GAMES) { el.innerHTML = ''; return; }
  const mode = tickerMode();
  const data = mode === 'live' ? buildLiveTickerData() : buildSeasonTickerData();
  const suffix = mode === 'live' ? 'this week' : 'season';
  el.innerHTML =
    renderTickerRow(`Passing Leaders — ${suffix}`, data.passing) +
    renderTickerRow(`Receiving Leaders — ${suffix}`, data.receiving) +
    renderTickerRow(`Rushing Leaders — ${suffix}`, data.rushing);
}

function timeLabel(g){
  if (g.live) return `<div class="live">${esc(g.liveClock || 'Live')}</div>`;
  if (g.played) return `<div class="final">Final</div>`;
  if (!g.gametime) return '';
  const [h, m] = g.gametime.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `<div>${hh}:${pad(m)} ${ampm} ET</div>`;
}

function render(){
  const days = {};
  GAMES.games.forEach(g => { (days[g.gameday] ||= []).push(g); });

  let html = '', withLines = 0, played = 0;
  Object.entries(days).forEach(([date, list]) => {
    const wd = list[0].weekday || '';
    const nice = new Date(date + 'T12:00:00').toLocaleDateString(undefined,
      { month: 'short', day: 'numeric' });
    html += `<div class="daygroup">
      <div class="dayhead"><h2>${esc(wd)}</h2><span class="date">${nice}</span>
        <span class="rule"></span></div>
      <div class="card-grid">`;
    list.forEach(g => {
      if (g.spread_line !== null) withLines++;
      if (g.played) played++;
      // "leading" highlight applies for a real Final AND for a live,
      // in-progress game (per-quarter lead, not just the final result) —
      // both are real, current scores at this point, just one is settled
      // and one isn't yet.
      const scoreKnown = g.played || g.live;
      const aw = scoreKnown && g.away_score > g.home_score;
      const hw = scoreKnown && g.home_score > g.away_score;
      const at = threatCount(g.away), ht = threatCount(g.home);
      const totalThreats = (at || 0) + (ht || 0);

      const fav = g.spread_line === null ? null
        : (g.spread_line > 0 ? g.home : g.away);
      const spreadTxt = g.spread_line === null ? ''
        : `<span class="odd"><b>${esc(fav)}</b> −${Math.abs(g.spread_line)}</span>`;
      const totalTxt = g.total_line === null ? ''
        : `<span class="odd">O/U <b>${g.total_line}</b></span>`;
      const thrTxt = totalThreats
        ? `<span class="odd thr"><b>${totalThreats}</b> threat${totalThreats === 1 ? '' : 's'}</span>` : '';

      const gbManifestHas = GB_MANIFEST && GB_MANIFEST.games &&
        (GB_MANIFEST.games[`${g.away}_${g.home}`] || GB_MANIFEST.games[`${g.home}_${g.away}`]);
      // Game Breakdown is real pre-game analysis — once the real game has
      // started (or, the only state this data currently distinguishes,
      // is fully Final), reading a "preview" of it stops making sense.
      // kickoffHasPassed() covers the in-progress window using just the
      // real schedule's own gameday/gametime — true live in-play state
      // isn't tracked yet (that's the separate live-scores work), but a
      // real kickoff-time check needs no live data at all to be correct.
      const gameStarted = g.played || kickoffHasPassed(g);
      const hasGB = gbManifestHas && !gameStarted;
      const hasMatchup = MATCHUP && MATCHUP.teams && MATCHUP.teams[g.away] && MATCHUP.teams[g.home];
      const hasThreats = THREATS && THREATS.teams && (THREATS.teams[g.away] || THREATS.teams[g.home]);

      html += `<div class="gcard${totalThreats >= 4 ? ' hot' : ''}" data-gid="${g.game_id}"
        tabindex="0" role="button" aria-label="View box score, ${g.away} at ${g.home}">
        <div class="gcard-top">
          <div class="teams-col">
            <div class="trow${aw ? ' win' : ''}">
              ${fiLogoHTML(g.away, 32)}
              <span class="tabbr">${g.away}</span>
              <span class="trec">${esc(g.away_record)}</span>
              <span class="tform">${formHTML(g.away_form)}</span>
              ${scoreKnown ? `<span class="tscore">${g.away_score}</span>` : ''}
            </div>
            <div class="trow${hw ? ' win' : ''}">
              ${fiLogoHTML(g.home, 32)}
              <span class="tabbr">${g.home}</span>
              <span class="trec">${esc(g.home_record)}</span>
              <span class="tform">${formHTML(g.home_form)}</span>
              ${scoreKnown ? `<span class="tscore">${g.home_score}</span>` : ''}
            </div>
          </div>
          <div class="kick">${timeLabel(g)}${g.broadcast ? `<div class="bcast">${esc(g.broadcast)}</div>` : ''}</div>
        </div>
        <div class="odds">${spreadTxt}${totalTxt}${thrTxt}</div>
        <div class="meta">
          <span>${esc(g.stadium)}</span>
          ${g.roof ? `<span>${esc(g.roof)}</span>` : ''}
          ${g.surface ? `<span>${esc(g.surface)}</span>` : ''}
          ${g.div_game ? '<span>division</span>' : ''}
          ${g.away_rest !== null ? `<span>rest ${g.away_rest}/${g.home_rest}</span>` : ''}
        </div>
        <div class="links">
          <button type="button" data-action="matchup" ${hasMatchup ? '' : 'disabled'}
            title="${hasMatchup ? '' : 'Matchup stats not built for this week'}">Matchup</button>
          <button type="button" data-action="threats" ${hasThreats ? '' : 'disabled'}
            title="${hasThreats ? '' : 'No threat board for this week'}">Threats</button>
          <button type="button" data-action="box">Box score</button>
          <button type="button" data-action="breakdown" ${hasGB ? '' : 'disabled'}
            title="${hasGB ? '' : (gameStarted
              ? 'Game Breakdown is pre-game analysis — no longer shown once the game has started'
              : 'Game Breakdown not available for this game yet')}">Game Breakdown</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  $('slate').innerHTML = html;
  $('slate').querySelectorAll('.gcard').forEach(card => {
    card.addEventListener('click', () => openGame(card.dataset.gid, card));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openGame(card.dataset.gid, card); }
    });
    card.querySelectorAll('.links button').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (btn.disabled) return;
        const gid = card.dataset.gid;
        const action = btn.dataset.action;
        if (action === 'matchup') openMatchup(gid, btn);
        else if (action === 'threats') openThreats(gid, btn);
        else if (action === 'box') openGame(gid, btn);
        else if (action === 'breakdown') openGameBreakdown(gid, btn);
      });
    });
  });
  $('wksum').innerHTML =
    `<span>${GAMES.games.length} games</span>` +
    (played ? `<span>${played} final</span>` : '') +
    (withLines ? `<span>${withLines} with lines</span>` : '<span>lines not posted</span>');
}

/* ── game modal: box score + offensive leaders ── */
let lastFocus = null;
let currentModalGameId = null; // tracks which game's modal is open, so a live poll can refresh it in place
const BOX_ROWS = [
  ['pts', 'Points'], ['total_yds', 'Total yards'], ['pass_yds', 'Passing yards'],
  ['rush_yds', 'Rushing yards'], ['first_downs', 'First downs'],
  ['comp', 'Completions'], ['att', 'Attempts'],
  ['sacks_taken', 'Sacks allowed'], ['turnovers', 'Interceptions'],
];

function leaderBlock(side, team, L){
  if (!L) return `<div class="lead-col"><div class="lead-team">${fiLogoHTML(team, 22)}
    <span>${esc(team)}</span></div><div class="na">No data</div></div>`;
  const qb = L.qb ? `<div class="lead-row"><span class="lp">QB</span>
      <span class="ln">${esc(L.qb.name)}</span>
      <span class="lv">${L.qb.comp}/${L.qb.att}, ${L.qb.yds} yds,
        ${L.qb.td} TD${L.qb.int ? `, ${L.qb.int} INT` : ''}${L.qb.rush_yds ? ` · ${L.qb.rush_yds} rush` : ''}</span>
    </div>` : '';
  const rush = (L.rush || []).map(r => `<div class="lead-row"><span class="lp">RUSH</span>
      <span class="ln">${esc(r.name)}</span>
      <span class="lv">${r.car} car, ${r.yds} yds${r.td ? `, ${r.td} TD` : ''}</span></div>`).join('');
  const rec = (L.rec || []).map(r => `<div class="lead-row"><span class="lp">REC</span>
      <span class="ln">${esc(r.name)}</span>
      <span class="lv">${r.rec}/${r.tgt}, ${r.yds} yds${r.td ? `, ${r.td} TD` : ''}</span></div>`).join('');
  return `<div class="lead-col">
    <div class="lead-team">${fiLogoHTML(team, 22)}<span>${esc(team)}</span></div>
    ${qb}${rush}${rec}</div>`;
}

// ESPN's own per-game leaders — one leader per stat category for the
// WHOLE game (not split by side the way nflverse's box/leaders are),
// shown as a real-time stand-in while a game is live and nflverse's own
// (not real-time) leaders don't exist yet for it.
const ESPN_LEADER_LABELS = { passingYards: 'PASS', rushingYards: 'RUSH', receivingYards: 'REC' };
function renderEspnLiveLeaders(g){
  const rows = (g.espnLeaders || [])
    .filter(cat => ESPN_LEADER_LABELS[cat.name] && cat.leaders && cat.leaders[0])
    .map(cat => {
      const lead = cat.leaders[0];
      const teamCode = (g.espnTeamIdMap || {})[lead.team.id] || '';
      return `<div class="lead-row"><span class="lp">${ESPN_LEADER_LABELS[cat.name]}</span>
        <span class="ln">${esc(lead.athlete.fullName)} <span style="color:var(--text-dim)">(${esc(teamCode)})</span></span>
        <span class="lv">${esc(lead.displayValue)}</span></div>`;
    }).join('');
  if (!rows) return '';
  return `<div class="sect"><h3>Live leaders</h3><span class="rule"></span></div>
    <div class="empty" style="padding:4px 0 8px;text-align:left;font-size:10px">
      Real-time from ESPN, updated automatically — the full box score above
      fills in from Football Intel's own data once the game is final.</div>
    <div class="lead-col">${rows}</div>`;
}

function openGame(gid, source){
  const g = GAMES.games.find(x => x.game_id === gid);
  if (!g) return;
  lastFocus = source;
  currentModalGameId = gid;
  $('mTitle').innerHTML =
    `${fiLogoHTML(g.away, 34)} ${g.away} <em>at</em> ${g.home} ${fiLogoHTML(g.home, 34)}`;
  const when = g.live
    ? `${g.liveClock || 'Live'} — ${g.away} ${g.away_score}, ${g.home} ${g.home_score}`
    : g.played
      ? `Final — ${g.away} ${g.away_score}, ${g.home} ${g.home_score}`
      : `${esc(g.weekday)} ${esc(g.gameday)}`;
  $('mSub').textContent = `${when} · ${g.stadium}`;

  let h = '';
  // While a game is live and nflverse's own real box score/leaders don't
  // exist for it yet (they're not real-time — see the fetch comment
  // above), show ESPN's real-time leaders as a clearly-labeled stand-in
  // rather than the empty "no player data yet" state.
  if (g.live && !(g.leaders && (g.leaders.away || g.leaders.home))) {
    h += renderEspnLiveLeaders(g);
  }
  const box = g.box || {};
  if (box.away && box.home){
    h += `<div class="sect"><h3>${g.played ? 'Box score' : 'Season totals'}</h3><span class="rule"></span></div>
      <table class="stat-table boxtable"><thead><tr>
        <th class="right">${g.away}</th><th style="text-align:center">&nbsp;</th><th>${g.home}</th>
      </tr></thead><tbody>` +
      BOX_ROWS.filter(([k]) => box.away[k] !== null && box.away[k] !== undefined)
        .map(([k, lbl]) => {
          const a = box.away[k], b = box.home[k];
          const aw = a > b ? ' lead' : '', bw = b > a ? ' lead' : '';
          return `<tr><td class="num${aw}">${a}</td>
            <td class="boxlbl">${lbl}</td><td class="num${bw}">${b}</td></tr>`;
        }).join('') + `</tbody></table>`;
  }

  const L = g.leaders || {};
  if (L.away || L.home){
    h += `<div class="sect"><h3>${g.leader_scope === 'game' ? 'Game leaders' : 'Season leaders'}</h3>
      <span class="rule"></span></div>
      <div class="leaders">${leaderBlock('away', g.away, L.away)}${leaderBlock('home', g.home, L.home)}</div>`;
  }

  if (!h) h = `<div class="empty">No player data for this game yet.<br>
    Box scores appear once the game is played.</div>`;

  const odds = [];
  if (g.spread_line !== null) odds.push(`Spread ${g.spread_line > 0 ? g.home : g.away} −${Math.abs(g.spread_line)}`);
  if (g.total_line !== null) odds.push(`Total ${g.total_line}`);
  if (g.away_ml !== null) odds.push(`ML ${g.away}&nbsp;${g.away_ml > 0 ? '+' : ''}${g.away_ml} / ${g.home}&nbsp;${g.home_ml > 0 ? '+' : ''}${g.home_ml}`);
  if (odds.length) h += `<div class="sect"><h3>Market</h3><span class="rule"></span></div>
    <div class="mkt">${odds.map(o => `<span class="odd">${o}</span>`).join('')}</div>`;

  $('mBody').innerHTML = h;
  $('scrim').classList.add('open'); $('modal').classList.add('open');
  $('mClose').focus();
}
function closeModal(){
  $('scrim').classList.remove('open'); $('modal').classList.remove('open');
  currentModalGameId = null;
  if (lastFocus) lastFocus.focus();
}

/* ── matchup modal: team_off vs opponent's team_def, both directions ── */

/* ── game breakdown modal: fetches & renders the actual Coeus report ── */
let gbCache = {};
async function openGameBreakdown(gid, source){
  const g = GAMES.games.find(x => x.game_id === gid);
  if (!g || !GB_MANIFEST) return;
  lastFocus = source;
  $('mTitle').innerHTML = `${fiLogoHTML(g.away, 34)} ${g.away} <em>at</em> ${g.home} ${fiLogoHTML(g.home, 34)}`;
  $('mSub').textContent = 'Game Breakdown';
  $('mBody').innerHTML = `<div class="empty">Loading report…</div>`;
  $('scrim').classList.add('open'); $('modal').classList.add('open');
  $('mClose').focus();

  const fwdKey = `${g.away}_${g.home}`, revKey = `${g.home}_${g.away}`;
  const entry = GB_MANIFEST.games[fwdKey] || GB_MANIFEST.games[revKey];
  const key = GB_MANIFEST.games[fwdKey] ? fwdKey : revKey;
  if (!entry){
    $('mBody').innerHTML = `<div class="empty">Game Breakdown not available for this game yet.</div>`;
    return;
  }
  try {
    let md = gbCache[key];
    if (!md){
      const r = await fetch(`game_breakdowns/wk${pad(GAMES.week)}/${key}.md`, { cache: 'no-store' });
      if (!r.ok) throw new Error('not found');
      md = await r.text();
      gbCache[key] = md;
    }
    $('mBody').innerHTML = `<div class="coeus-attribution">Engineered by Coeus</div>
      <div class="gb-report">${marked.parse(md)}</div>`;
  } catch (e){
    $('mBody').innerHTML = `<div class="empty">Game Breakdown not available for this game yet.</div>`;
  }
}

$('mClose').addEventListener('click', closeModal);
$('scrim').addEventListener('click', closeModal);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('modal').classList.contains('open')) closeModal();
});

load(1);
</script>
</body>
</html>
