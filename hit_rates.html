<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hit Rates — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
.summary{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.sum-pill{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;padding:7px 11px;
  border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-mid)}
.sum-pill b{color:var(--text);font-weight:600}
.sum-pill.graded b{color:#4ade80}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-mid)}
.ctl label{display:inline-flex;align-items:center;gap:6px}
.ctl select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);
  font-family:var(--font-mono);font-size:11px;padding:5px 8px}
.gm-grid{display:grid;gap:14px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
@media(max-width:900px){.gm-grid{grid-template-columns:1fr}}
.gm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.gm-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface2)}
.gm-title{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.gm-title em{font-style:normal;color:var(--text-dim);font-weight:600;font-size:12px;margin:0 6px}
.gm-count{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:.06em}
.side{padding:11px 15px 13px}
.side + .side{border-top:1px solid var(--border)}
.side-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-mid);
  margin-bottom:8px;display:flex;align-items:center;gap:6px}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--hairline)}
.hrow:last-child{border-bottom:0}
.hrow.out{opacity:.4;filter:grayscale(.85)}
.hrow.out .hn{text-decoration:line-through}
.hn{font-family:var(--font-display);font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.hp{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.hs{font-family:var(--font-mono);font-size:10px;color:var(--text-mid)}
.hrow .hr-chip,.hrow .tg{margin-left:auto}
.hrow .tg+.hr-chip{margin-left:0}
.inj{font-family:var(--font-mono);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:var(--radius-sm)}
.inj.out{background:#ff2d4a;color:#fff}.inj.doubtful{background:#ff8a1f;color:#1a0f00}.inj.questionable{background:#f5c518;color:#1a1400}
.tg{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tg.win{background:rgba(74,222,128,.16);color:#4ade80}
.tg.loss{background:rgba(248,113,113,.16);color:#f87171}
.tg.void{background:rgba(127,127,127,.16);color:var(--text-mid)}
.na{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);padding:6px 0}
.flat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px 16px}
.flat .hrow{padding:9px 0}
.flat .gtag{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.empty{padding:40px 10px;text-align:center;color:var(--text-mid);font-family:var(--font-mono);font-size:12px;line-height:1.8}
.rules{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);line-height:1.9;margin-top:26px;padding-top:16px;border-top:1px solid var(--border)}
.rules b{color:var(--text-mid);font-weight:500}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script src="js/hit-rates.js"></script>
<script>
const main = fiShell({ page: 'hitrate', pageLabel: 'Hit Rates', status: 'loading' });
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

let TH = null, HRIDX = null, INJ = {};

main.innerHTML = `
  <div class="ctl">
    <label>Week <select id="wk"></select></label>
    <label>Min hit rate <select id="minPct">
      <option value="0.6">60%</option><option value="0.7">70%</option><option value="0.75" selected>75%</option>
      <option value="0.8">80%</option><option value="0.9">90%</option><option value="1">100%</option></select></label>
    <label>Min games <select id="minG"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
    <label>Position <select id="pos"><option value="">All</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select></label>
    <label>Stat <select id="stat"><option value="">All</option>
      ${Object.entries(HR_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    <label>View <select id="view"><option value="game">By game</option><option value="top">Top list</option></select></label>
    <label><input type="checkbox" id="hideOut"> Hide OUT players</label>
  </div>
  <div id="warn"></div>
  <div class="summary" id="summary"></div>
  <div id="body"></div>
  <div class="rules" id="rules"></div>`;

const wkSel = $('wk');
for (let w = 1; w <= 18; w++){ const o = document.createElement('option'); o.value = w; o.textContent = 'Week ' + w; wkSel.appendChild(o); }
wkSel.addEventListener('change', () => load(Number(wkSel.value)));
['minPct', 'minG', 'pos', 'stat', 'view', 'hideOut'].forEach(id => $(id).addEventListener('change', () => { if (TH) render(); }));

/* ── default week: advance past a week once its Monday game has kicked off (same logic as Threats) ── */
function etOffsetMinutes(dateStr){
  const d = new Date(`${dateStr}T12:00:00Z`);
  const utcStr = d.toLocaleString('en-US', { timeZone: 'UTC', hour12: false });
  const etStr = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
  return (new Date(utcStr) - new Date(etStr)) / 60000;
}
function kickoffHasPassed(g){
  if (!g.gameday || !g.gametime) return false;
  const [h, m] = g.gametime.split(':').map(Number);
  const k = new Date(`${g.gameday}T00:00:00Z`);
  k.setUTCMinutes(k.getUTCMinutes() + h * 60 + m + etOffsetMinutes(g.gameday));
  return new Date() >= k;
}
async function determineDefaultWeek(){
  const q = Number(new URLSearchParams(location.search).get('week'));
  if (q >= 1 && q <= 18) return q;
  let week = 1;
  while (week < 18){
    let wk;
    try { const r = await fetch(`games/wk${pad(week)}.json`, { cache: 'no-store' }); if (!r.ok) break; wk = await r.json(); } catch (e) { break; }
    const mon = (wk.games || []).filter(g => g.weekday === 'Monday' && g.gameday);
    if (!mon.length) break;
    const last = mon.reduce((m, g) => (!m || g.gametime > m.gametime) ? g : m, null);
    if (!kickoffHasPassed(last)) break;
    week += 1;
  }
  return week;
}

const injKey = (team, name) => team + '|' + hrNorm(name);
const isOut = (team, name) => { const i = INJ[injKey(team, name)]; return !!i && /^(out|ir|injured reserve)$/i.test((i.report_status || '').trim()); };
async function loadInjuries(week){
  INJ = {};
  try { const r = await fetch(`injuries/wk${pad(week)}.json`, { cache: 'no-store' }); if (!r.ok) return;
        for (const p of ((await r.json()).players || [])) INJ[injKey(p.team, p.name)] = p; } catch (e) {}
}
function injBadge(team, name){
  const i = INJ[injKey(team, name)]; if (!i) return '';
  const st = (i.report_status || '').trim(), l = st.toLowerCase();
  if (isOut(team, name)) return `<span class="inj out">OUT</span>`;
  if (l === 'doubtful') return `<span class="inj doubtful">DOUBTFUL</span>`;
  if (l === 'questionable') return `<span class="inj questionable">QUESTIONABLE</span>`;
  return '';
}

async function load(week){
  $('body').innerHTML = `<div class="empty">Loading week ${week}…</div>`; $('summary').innerHTML = '';
  fiStatus('Loading', 'loading');
  try {
    const [t, p] = await Promise.all([
      fetch(`threats/wk${pad(week)}.json`).then(r => { if (!r.ok) throw 0; return r.json(); }),
      HRIDX ? Promise.resolve(null) : fetch('players/latest.json').then(r => { if (!r.ok) throw 0; return r.json(); }),
    ]);
    TH = t; if (p) HRIDX = hrIndex(p);
  } catch (e){
    TH = null; fiStatus('No data', 'error'); fiUpdated('');
    $('body').innerHTML = `<div class="empty">Week ${week} isn't built yet.<br>Run <b>python3 build_matchup_stats.py ${week}</b>, then reload.</div>`;
    return;
  }
  await loadInjuries(week);
  fiStatus('Ready'); fiUpdated(`${TH.season} · games through Week ${week - 1}`);
  render();
}

/* One row per starter per stat that clears the chosen bar. */
function collect(){
  const minPct = Number($('minPct').value), minG = Number($('minG').value);
  const posF = $('pos').value, statF = $('stat').value, hideOut = $('hideOut').checked;
  const rows = [];
  for (const g of TH.games) for (const team of [g.away, g.home]){
    const info = TH.teams[team]; if (!info) continue;
    for (const s of (info.starters || [])){
      if (posF && s.pos !== posF) continue;
      const out = isOut(team, s.name); if (out && hideOut) continue;
      const p = hrLookup(HRIDX, s.name, s.pos); if (!p) continue;
      const res = hrCompute(p, TH.week - 1);
      for (const stat of Object.keys(res)){
        if (statF && stat !== statF) continue;
        const best = hrBest(res[stat], minPct, minG); if (!best) continue;
        // graded? did he reach this mark in the week's real game (only once it has been played)
        const gm = (p.log || []).find(x => x.week === TH.week);
        const actual = gm && gm.m ? gm.m[stat] : undefined;
        rows.push({ game: g, team, opp: info.opp, s, p, stat, best, games: res[stat].games, out,
                    actual, result: actual == null ? null : (actual >= best.t ? 'HIT' : 'MISS') });
      }
    }
  }
  return rows;
}
const cmp = (a, b) => b.best.pct - a.best.pct || b.games - a.games || b.best.t - a.best.t || a.s.name.localeCompare(b.s.name);

function rowHTML(r, showGame){
  const tag = r.result === 'HIT' ? `<span class="tg win" title="Reached ${r.best.t}: actual ${r.actual}">✓ Hit · ${r.actual}</span>`
            : r.result === 'MISS' ? `<span class="tg loss" title="Needed ${r.best.t}: actual ${r.actual}">✗ Miss · ${r.actual}</span>` : '';
  return `<div class="hrow${r.out ? ' out' : ''}">
    <span class="hn">${esc(r.s.name)}</span><span class="hp">${r.s.pos}</span>
    ${showGame ? `<span class="gtag">${fiLogoHTML(r.team, 14)}${esc(r.team)} vs ${esc(r.opp)}</span>` : ''}
    <span class="hs">${HR_LABEL[r.stat]}</span>${injBadge(r.team, r.s.name)}
    ${tag}<span class="hr-chip ${hrPctClass(r.best.pct)}">${hrText(r.stat, r.best, r.games)} <b>${Math.round(100 * r.best.pct)}%</b></span>
  </div>`;
}

function render(){
  const rows = collect();
  let gH = 0, gM = 0;
  rows.forEach(r => { if (r.result === 'HIT') gH++; else if (r.result === 'MISS') gM++; });
  const players = new Set(rows.map(r => r.team + '|' + r.s.name)).size;
  $('summary').innerHTML = `<span class="sum-pill"><b>${rows.length}</b> benchmarks</span>
    <span class="sum-pill"><b>${players}</b> players</span>` +
    ((gH + gM) ? `<span class="sum-pill graded">Graded <b>${gH}-${gM}</b> (${Math.round(100 * gH / (gH + gM))}%)</span>` : '');
  if (!rows.length){
    $('body').innerHTML = `<div class="empty">No starters clear ${Math.round(100 * Number($('minPct').value))}% over ${$('minG').value}+ games with these filters.<br>Try a lower hit rate or fewer minimum games.</div>`;
  } else if ($('view').value === 'top'){
    $('body').innerHTML = `<div class="flat">${rows.slice().sort(cmp).map(r => rowHTML(r, true)).join('')}</div>`;
  } else {
    $('body').innerHTML = `<div class="gm-grid">${TH.games.map(g => {
      const mine = rows.filter(r => r.game === g);
      const side = team => {
        const rs = mine.filter(r => r.team === team).sort(cmp);
        return `<div class="side"><div class="side-h">${fiLogoHTML(team, 18)}${esc(team)}</div>${rs.length ? rs.map(r => rowHTML(r, false)).join('') : '<div class="na">No starters clear the bar</div>'}</div>`;
      };
      return `<section class="gm"><div class="gm-head"><span class="gm-title">${fiLogoHTML(g.away, 24)}${g.away}<em>@</em>${fiLogoHTML(g.home, 24)}${g.home}</span>
        <span class="gm-count">${mine.length} benchmark${mine.length === 1 ? '' : 's'}</span></div>${side(g.away)}${side(g.home)}</section>`;
    }).join('')}</div>`;
  }
  $('warn').innerHTML = '';
  $('rules').innerHTML = `<b>What this is</b> — for each starter (1 QB, 1 RB, 2 WR, 1 TE per team) it finds the highest benchmark he has reached in at least
    ${Math.round(100 * Number($('minPct').value))}% of his games this season, using only games before Week ${TH.week}. "70+ yds in 7/8" means he reached 70 yards in 7 of his 8 games.<br>
    <b>Ladders</b> — QB passing 200–300 yds and 1–3 TDs; RB rushing 30–100, receiving 15–50, 2–5 receptions; WR/TE receiving 30–100 and 3–7 receptions.<br>
    <b>Graded</b> — once a week has been played, ✓ Hit means he reached that benchmark in that week's game. These are his own benchmarks, not sportsbook lines or prices.`;
}

determineDefaultWeek().then(week => { wkSel.value = week; load(week); });
</script>
</body>
</html>
