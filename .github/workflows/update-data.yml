name: Update Football Intel data

# Runs after each NFL week completes and commits the refreshed JSON.
#   Tuesday 17:00 UTC = 1pm ET  — after Monday Night Football is processed
#   Wednesday 09:00 UTC = 5am ET — catch-up in case nflverse published late
on:
  schedule:
    - cron: '0 17 * * 2'
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks to build: "all", "auto", or a number like 12'
        required: false
        default: 'all'
      season:
        description: 'Season override (blank = current season)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas requests

      - name: Build snapshots from nflverse
        env:
          NFL_SEASON: ${{ github.event.inputs.season }}
        run: |
          if [ -z "$NFL_SEASON" ]; then unset NFL_SEASON; fi
          python3 build_matchup_stats.py "${{ github.event.inputs.weeks || 'all' }}"

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchup context threats
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Data refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Pushed updated data."
          fi
