<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stats Hub — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
/* page-specific: leaderboard table w/ sticky team column + sortable headers */
.hub-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.view-switch{margin-bottom:14px}
.wk-select{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-family:var(--font-mono);font-size:11px;padding:6px 10px;cursor:pointer;
}
.lead-wrap{
  overflow:auto;max-height:calc(100vh - 180px);
  border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:12px;
}
.lead-table{width:100%;border-collapse:separate;border-spacing:0}
.lead-table thead th{
  padding:9px 12px;text-align:right;font-family:var(--font-mono);font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;
  cursor:pointer;user-select:none;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface2);z-index:3;
}
.lead-table thead th:hover{color:var(--text)}
.lead-table thead th.sorted{color:var(--primary)}
.lead-table thead th.team-col{text-align:left;left:0;z-index:4}
.lead-table td{padding:8px 12px;font-size:12px;text-align:right;border-bottom:1px solid var(--hairline);white-space:nowrap}
.lead-table tbody tr:last-child td{border-bottom:0}
.lead-table tbody tr:hover td{background:var(--surface2)}
.lead-table td.team-col{
  text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;
  display:flex;align-items:center;gap:8px;font-size:12.5px;
}
.lead-table tbody tr:hover td.team-col{background:var(--surface2)}
.rank-num{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);width:20px;display:inline-block}
.cell-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-mid);font-size:12px}
.cell-val.carryover-val{color:var(--accent-gold)}
@media(max-width:640px){
  .lead-table td, .lead-table thead th{padding:7px 9px}
}
/* ── PLAYER MODAL ── */
.subsect{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--text-dim);padding:14px 0 3px}
.tier-badge{
  font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;font-weight:700;
  border-radius:3px;padding:2px 6px;text-transform:uppercase;
}
.tier-badge.top{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.tier-badge.mid{color:var(--text-mid);background:var(--surface2);border:1px solid var(--border)}
.tier-badge.bot{color:var(--accent-green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)}
.split-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:10px 0 4px}
.split-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.split-card .sc-label{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.split-card .sc-games{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:1px}
.split-card .sc-value{font-family:var(--font-display);font-weight:800;font-size:20px;margin-top:6px;letter-spacing:-.02em}
.split-card.top{border-color:rgba(244,63,94,.3)}
.split-card.bot{border-color:rgba(74,222,128,.3)}
.gap-up{color:var(--accent-green);font-weight:700}
.gap-down{color:var(--accent-red);font-weight:700}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script>
const main = fiShell({ page:'stats', pageLabel:'Stats Hub', status:'loading' });

const POSITIONS = ['QB','RB','WR','TE'];
let WEEKS = {};       // week number -> full matchup json
let weekList = [];    // sorted available week numbers
let currentWeek = null, currentPos = 'QB', sortKey = null, sortDir = 'desc';

let TEAMSTATS = null;
let offSubgroup = null, offSortKey = null, offSortDir = 'desc';

let PLAYERSTATS = null;
let playerPos = 'QB', playerCat = null, playerSortKey = null, playerSortDir = 'desc';
let currentPlayerRows = [], activePlayer = null, activeSec = 'season', logStatKey = null, lastFocus = null;

let currentView = 'team_off'; // 'team_off' | 'players' | 'dvp' | 'cbdb' | 'rank_shifts'

let rankShiftsSide = 'offense', rankShiftsCat = null, rankShiftsPos = 'RB', rankShiftsSortKey = 'absRankDiff', rankShiftsSortDir = 'desc';
// REAL ADDITION (2026-09-22), per Frank's own direct request (Saturday's
// conversation): a real, side-by-side comparison of each real team's
// season-long carryover rank (the "r" field already on every real
// team_off/team_def category — computed from 2025's complete real
// season) against their genuinely NEW, computed-here 2026 rank, built
// from the same category's real "v26" value — which already exists per
// team, per category, but was never itself ranked against the other 31
// real teams anywhere in this project until now. Real reason this has to
// be computed here rather than read from a stored field: no backend file
// anywhere stores a real, standalone 2026-only rank — only the real 2026
// VALUE (v26) exists pre-computed; the rank is genuinely new.

let CBDB = null;
let cbdbSortKey = null, cbdbSortDir = 'asc';
let cbdbSearchTerm = '';

let season = 2025;
  // Same real reason as Matchup Stats/Contextual: 2026's matchup, team,
  // and player stats need real played games, which don't exist yet.

main.innerHTML = `
  <div class="tabs view-switch" id="viewSwitch" role="tablist">
    <button role="tab" data-view="team_off" aria-selected="true">Team Offense</button>
    <button role="tab" data-view="players" aria-selected="false">Players</button>
    <button role="tab" data-view="dvp" aria-selected="false">Defense vs Position</button>
    <button role="tab" data-view="cbdb" aria-selected="false">CB/DB Coverage</button>
    <button role="tab" data-view="rank_shifts" aria-selected="false">Rank Shifts</button>
  </div>
  <div class="bar">
    <span class="lbl" id="sectionLbl">Team Offense</span>
    <label class="lbl" for="szn">Season</label>
    <select id="szn"><option value="2025">2025</option><option value="2026">2026</option></select>
    <div class="legend" id="sectionLegend"><span>Season totals so far, per team · click any column to sort</span></div>
  </div>
  <div class="hub-controls">
    <div class="tabs" id="innerTabs" role="tablist"></div>
    <select class="wk-select" id="weekSel" style="display:none"></select>
  </div>
  <div class="tabs" id="catTabs" role="tablist" style="display:none"></div>
  <div class="lead-wrap"><table class="lead-table" id="leadTable"></table></div>
  <div class="modal-overlay" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-subtitle" id="mSub"></div>
      <button class="modal-close" id="mClose" aria-label="Close player">✕</button>
      <div class="seg" id="mToggle">
        <button data-sec="season">Season</button>
        <button data-sec="career">Career</button>
        <button data-sec="log">Game Log</button>
      </div>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>`;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

// Same real split as every other toggle page: 2026 is the canonical,
// unprefixed path; 2025 is preserved under archive/, since these builders
// need real played games and won't touch (or archive) 2025 for weeks yet.
const seasonPath = (season, relPath) => season === 2026
  ? relPath
  : `archive/${season}/${relPath}`;

// REAL ADDITION (2026-09-18), per Frank's direct catch: matchup/wkNN.json
// gets built a few weeks ahead of the real, current week on purpose — it's
// the foundation Game Breakdowns bootstrap off of for upcoming games — so
// its mere existence on disk does NOT mean that week has any real games
// played yet (confirmed directly: matchup/wk03.json existed with zero
// real Week 3 games played, just the same carryover data as weeks 1-2).
// Offering an unplayed week as a selectable "Week N" option here is
// genuinely misleading, since this page's own label promises "cumulative
// through the selected week." Same real, proven kickoff-time check
// already used on games.html/threats.html/matchup_stats.html — checked
// here against games/wkNN.json (which has real kickoff times), not
// matchup/, and used as a FILTER on which weeks even appear as options,
// not just which one defaults.
function etOffsetMinutes(dateStr){
  const d = new Date(`${dateStr}T12:00:00Z`);
  const utcStr = d.toLocaleString('en-US', { timeZone: 'UTC', hour12: false });
  const etStr = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
  return (new Date(utcStr) - new Date(etStr)) / 60000;
}
function kickoffHasPassed(g){
  if(!g.gameday || !g.gametime) return false;
  const [h, m] = g.gametime.split(':').map(Number);
  const kickoffUTC = new Date(`${g.gameday}T00:00:00Z`);
  kickoffUTC.setUTCMinutes(kickoffUTC.getUTCMinutes() + h * 60 + m + etOffsetMinutes(g.gameday));
  return new Date() >= kickoffUTC;
}
async function weekHasRealGameStarted(season, week){
  try{
    const r = await fetch(seasonPath(season, `games/wk${pad(week)}.json`), { cache: 'no-store' });
    if(!r.ok) return false;
    const data = await r.json();
    return (data.games || []).some(kickoffHasPassed);
  }catch(e){ return false; }
}

$("viewSwitch").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  $("viewSwitch").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
  currentView = b.dataset.view;
  switchView();
}));
$("szn").value = String(season);
$("szn").addEventListener("change", () => { season = Number($("szn").value); load(); });

async function load(){
  fiStatus("Loading","loading");
  WEEKS = {}; weekList = []; TEAMSTATS = null; PLAYERSTATS = null; CBDB = null;
    // Real reset needed since load() is now re-callable on season toggle —
    // without this, switching seasons would silently accumulate the
    // previous season's weeks alongside the new one instead of replacing them.
  // REAL BUG FIX (2026-09-18), per Frank's direct catch (switching to
  // 2026 left the displayed numbers unchanged): currentWeek was missing
  // from this reset block — every other per-season state here gets
  // cleared, but currentWeek stayed whatever it was from the PREVIOUS
  // season (e.g. 18, from 2025's "Season" view). setupDvpControls()
  // below only assigns a fresh currentWeek when the existing one is
  // falsy, so a real value surviving the season switch skipped that
  // reassignment entirely — and renderDvpTable() then read
  // WEEKS[currentWeek] against the NEWLY loaded, much shorter 2026
  // WEEKS object, where week 18 doesn't exist yet. That throws
  // mid-render, part-way through building the new table — which halts
  // execution before the DOM update happens, leaving the OLD season's
  // numbers sitting on screen exactly as if nothing had changed at all.
  currentWeek = null;
  for(let w=1; w<=22; w++){
    try{
      const res = await fetch(seasonPath(season, `matchup/wk${pad(w)}.json`));
      if(!res.ok) continue;
      WEEKS[w] = await res.json();
      weekList.push(w);
    }catch(e){ /* week not built yet */ }
  }
  weekList.sort((a,b)=>a-b);

  // REAL BUG FIX (2026-09-18), per Frank's direct catch (this filter
  // wiped out ALL of 2025, not just the unplayed 2026 week it was meant
  // to catch): confirmed directly that archive/2025/games/ doesn't
  // exist at all — this project never archived a games/ folder for any
  // past season, so every 2025 week failed this check and got filtered
  // out entirely. Only 2026 (the current, in-progress season) can ever
  // have this "built ahead of a week that hasn't started" problem in
  // the first place — the carryover system that does this only ever
  // runs for the live season. A past, ARCHIVED season is already fully
  // complete by definition; every week that has a real archived
  // matchup/ file genuinely was played, no kickoff check needed or
  // even possible without a games/ archive to check against.
  if (season === 2026) {
    const startedChecks = await Promise.all(weekList.map(w => weekHasRealGameStarted(season, w)));
    weekList = weekList.filter((w, i) => startedChecks[i]);
  }

  try{
    const res = await fetch(seasonPath(season, `teamstats/latest.json`));
    if(res.ok) TEAMSTATS = await res.json();
  }catch(e){ /* team stats not built yet */ }

  try{
    const res = await fetch(seasonPath(season, `players/latest.json`));
    if(res.ok) PLAYERSTATS = await res.json();
  }catch(e){ /* player stats not built yet */ }

  try{
    const res = await fetch(seasonPath(season, `intel/cb_rankings.json`));
    if(res.ok) CBDB = await res.json();
  }catch(e){ /* cb/db rankings not built yet */ }

  if(!weekList.length && !TEAMSTATS && !PLAYERSTATS){
    fiStatus("No data","error"); fiUpdated("");
    $("leadTable").outerHTML = season === 2026
      ? `<div class="empty">2026 isn't built yet — this needs real played games with
         real stats, which won't exist until the season is underway.</div>`
      : `<div class="empty">2025 isn't archived yet.<br>
         Run <b>python3 build_matchup_stats.py --archive-current</b> in your lab folder
         (with NFL_SEASON=2025), then reload.</div>`;
    return;
  }

  fiStatus("Ready");
  switchView();
}

function switchView(){
  if(currentView === 'rank_shifts'){
    $("sectionLbl").textContent = 'Rank Shifts';
    $("sectionLegend").innerHTML = '<span>2025 carryover rank vs. real, computed 2026 rank · ' +
      'all 32 teams, sorted by gap size · click any column to sort</span>';
    $("weekSel").style.display = 'none';
    $("catTabs").style.display = '';
    setupRankShiftsControls();
  } else if(currentView === 'dvp'){
    $("sectionLbl").textContent = 'Defense vs Position';
    $("sectionLegend").innerHTML = '<span>Cumulative through the selected week · click any column to sort</span>';
    $("weekSel").style.display = '';
    $("catTabs").style.display = 'none';
    setupDvpControls();
  } else if(currentView === 'team_off'){
    $("sectionLbl").textContent = 'Team Offense';
    $("sectionLegend").innerHTML = '<span>Season totals so far, per team · click any column to sort</span>';
    $("weekSel").style.display = 'none';
    $("catTabs").style.display = 'none';
    setupTeamOffenseControls();
  } else if(currentView === 'cbdb'){
    $("sectionLbl").textContent = 'CB/DB Coverage';
    $("sectionLegend").innerHTML = '<span>Individual defensive backs, season totals · click any column to sort</span>';
    $("weekSel").style.display = 'none';
    $("catTabs").style.display = 'none';
    setupCbDbControls();
  } else {
    $("sectionLbl").textContent = 'Players';
    $("sectionLegend").innerHTML = '<span>Season totals so far, individual players · click any column to sort</span>';
    $("weekSel").style.display = 'none';
    $("catTabs").style.display = '';
    setupPlayersControls();
  }
}

/* ── DEFENSE VS POSITION ─────────────────────────────────────────── */
// BUG FIX (2026-09-24), per Frank's direct catch: "Passing Yards / Game"
// equaled raw "Passing Yards" for every team — the per-game math itself
// was fine, but matchup/wkNN.json is built with "entering week N"
// semantics (real games from weeks BEFORE N only, weeks < N) — the same
// pre-game-context convention used everywhere else in this pipeline
// (Intel Reports' "upcoming opponent" context, etc.), so it never
// includes week N's own results. This DvP tab's own label promises
// "Cumulative through the selected week" (inclusive), which is a
// genuinely different, retrospective use of the same files — so
// selecting "Week 2" showed real games from week 1 only (data_horizon
// "weeks 1-1"), 1 real game per team, making per-game average trivially
// equal the total. Confirmed directly: selecting "Season" (latestWeek)
// has the identical gap — the most recently STARTED week's own results
// are always missing from that week's own matchup file.
// Fix: since matchup files are built a few weeks ahead on purpose (see
// the weekHasRealGameStarted comment above), matchup/wk{N+1}.json
// already exists and correctly covers real weeks 1..N. Reading N+1's
// file for "Week N" / "Season" gives the genuinely inclusive cumulative
// view the label promises, with no Python change or rebuild needed.
function dvpDataFor(w){
  return WEEKS[w + 1] || WEEKS[w];
}
function setupDvpControls(){
  if(!weekList.length){
    $("innerTabs").innerHTML = '';
    $("leadTable").outerHTML = `<div class="empty" id="leadTable">
      No matchup data found.<br>
      Run <b>python3 build_matchup_stats.py all</b> in your lab folder, then reload.</div>`;
    return;
  }
  const latestWeek = weekList[weekList.length-1];
  if(!currentWeek) currentWeek = latestWeek;

  const opts = [`<option value="${latestWeek}"${currentWeek===latestWeek?' selected':''}>Season</option>`]
    .concat(weekList.slice().reverse().map(w =>
      `<option value="${w}"${w===currentWeek?' selected':''}>Week ${w}</option>`));
  $("weekSel").innerHTML = opts.join('');
  $("weekSel").onchange = e => {
    currentWeek = Number(e.target.value);
    const label = currentWeek === latestWeek ? 'season' : `week ${currentWeek}`;
    fiUpdated(`${label} · ${dvpDataFor(currentWeek).data_horizon}`);
    renderDvpTable();
  };

  $("innerTabs").innerHTML = POSITIONS.map((p,i) =>
    `<button role="tab" aria-selected="${p===currentPos}" data-pos="${p}">${p}</button>`).join('');
  $("innerTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("innerTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    currentPos = b.dataset.pos;
    sortKey = null; sortDir = 'desc';
    renderDvpTable();
  });

  const label = currentWeek === latestWeek ? 'season' : `week ${currentWeek}`;
  fiUpdated(`${label} · ${dvpDataFor(currentWeek).data_horizon}`);
  renderDvpTable();
}

function fmtVal(v){
  if(v === null || v === undefined) return '—';
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

/* ── RANK SHIFTS (2025 carryover rank vs. real, computed 2026 rank) ── */
const RANK_SHIFTS_HIGHER_IS_BETTER = { offense: true, defense: false, dvp: false };

let RANK_SHIFTS_WK = null; // real, current-season matchup data — always
// live/unprefixed, deliberately independent of the page's own season
// toggle (see the real reasoning above setupRankShiftsControls()).

// REAL BUG FIX (2026-09-22), per Frank's direct, real catch (2026 data
// still showing "—" everywhere, even after confirming directly that
// the real v26 field now exists in the real, rebuilt matchup file):
// this tab was reusing the page's own WEEKS/weekList globals, which are
// populated via seasonPath(season, ...) — and this page's own "Season"
// dropdown defaults to 2025. If a person opens Rank Shifts without
// first switching that dropdown to 2026, WEEKS would hold the
// ARCHIVED 2025 matchup files, which never carry a real v26 field at
// all — v26 only ever gets computed in the real, live current-season
// build. Rank Shifts genuinely needs both numbers (the real 2025
// carryover rank AND the real 2026 value) from the SAME real file
// simultaneously — they already live together in the current, live
// matchup/wkNN.json regardless of whatever season the rest of the page
// happens to be showing, so this now fetches that directly, completely
// independent of the season toggle, rather than reusing WEEKS/weekList.
async function loadRankShiftsData(){
  if(RANK_SHIFTS_WK) return RANK_SHIFTS_WK;
  let latest = null;
  for(let w = 1; w <= 22; w++){
    try{
      const r = await fetch(`matchup/wk${pad(w)}.json`, { cache: 'no-store' });
      if(r.ok) latest = await r.json();
    }catch(e){}
  }
  RANK_SHIFTS_WK = latest;
  return latest;
}

async function setupRankShiftsControls(){
  const wk = await loadRankShiftsData();
  if(!wk){
    $("innerTabs").innerHTML = '';
    $("catTabs").innerHTML = '';
    $("leadTable").outerHTML = `<div class="empty" id="leadTable">
      No real matchup data found for computing rank shifts.<br>
      Run <b>python3 build_matchup_stats.py all</b> in your lab folder, then reload.</div>`;
    return;
  }
  // REAL ADDITION (2026-09-23), per Frank's direct request: a third
  // real option alongside Offense/Defense — "vs Position" reuses the
  // exact same real {v, r, v26} shape confirmed on team_off/team_def,
  // just nested one level deeper under a real position
  // (wk.teams[team].def[pos][stat]) — the real rank computation below
  // needed zero changes, since it already works on any (side, cat) ->
  // v26 lookup regardless of where that lookup actually points.
  $("innerTabs").innerHTML = ['offense', 'defense', 'dvp'].map(s =>
    `<button role="tab" aria-selected="${s===rankShiftsSide}" data-side="${s}">
      ${s==='offense'?'Offense':s==='defense'?'Defense':'vs Position'}</button>`).join('');
  $("innerTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("innerTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    rankShiftsSide = b.dataset.side;
    // Real reset — offense and defense share the same real category
    // keys (ppg, total_ypg, etc.), but a stale selected category
    // shouldn't silently carry over into the other side without the
    // person noticing which category they're actually now looking at.
    // Same real reasoning extends to switching into/out of "vs
    // Position" — its real category set (per-position labels) is
    // genuinely different from team_off/team_def's own five.
    rankShiftsCat = null;
    rankShiftsSortKey = 'absRankDiff'; rankShiftsSortDir = 'desc';
    renderRankShiftsTable();
  });

  renderRankShiftsTable();
}

function renderRankShiftsTable(){
  const wk = RANK_SHIFTS_WK;
  // REAL BUG FIX (2026-09-23), per Frank's direct catch: the weekSel
  // (position dropdown) visibility toggle used to live in
  // setupRankShiftsControls() above — which only runs ONCE, when the
  // Rank Shifts tab first opens. Clicking between Offense/Defense/vs
  // Position only ever calls renderRankShiftsTable() afterward, which
  // never touched weekSel's visibility at all — so it stayed hidden
  // forever once a person switched away from whatever side was active
  // on first load. Moved here, which runs on every real switch, so
  // weekSel's shown/hidden state always stays correctly synced with
  // the real, current rankShiftsSide.
  if(rankShiftsSide === 'dvp'){
    $("weekSel").style.display = '';
    $("weekSel").innerHTML = POSITIONS.map(p =>
      `<option value="${p}"${p===rankShiftsPos?' selected':''}>${p}</option>`).join('');
    $("weekSel").onchange = e => {
      rankShiftsPos = e.target.value;
      rankShiftsCat = null;
      rankShiftsSortKey = 'absRankDiff'; rankShiftsSortDir = 'desc';
      renderRankShiftsTable();
    };
  } else {
    $("weekSel").style.display = 'none';
  }
  // REAL ADDITION (2026-09-23): "vs Position" reads the same real
  // per-team, per-category {v, r, v26} cells DvP already reads
  // (wk.teams[team].def[pos][stat], wk.labels.pos[pos]) — genuinely
  // the SAME real data DvP itself shows, just compared across both
  // real seasons here instead of shown for one at a time.
  const isDvp = rankShiftsSide === 'dvp';
  const sideKey = rankShiftsSide === 'offense' ? 'team_off' : 'team_def';
  const labels = isDvp ? wk.labels.pos[rankShiftsPos] : wk.labels[sideKey];
  const cats = Object.keys(labels);
  if(!rankShiftsCat || !cats.includes(rankShiftsCat)) rankShiftsCat = cats[0];

  $("catTabs").innerHTML = cats.map(c =>
    `<button role="tab" aria-selected="${c===rankShiftsCat}" data-cat="${esc(c)}">${esc(typeof labels[c] === 'object' ? labels[c].l : labels[c])}</button>`).join('');
  $("catTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    rankShiftsCat = b.dataset.cat;
    rankShiftsSortKey = 'absRankDiff'; rankShiftsSortDir = 'desc';
    renderRankShiftsTable();
  });

  const higherIsBetter = RANK_SHIFTS_HIGHER_IS_BETTER[rankShiftsSide];
  const rows = Object.entries(wk.teams)
    .map(([abbr, t]) => {
      const cell = isDvp
        ? ((t.def || {})[rankShiftsPos] || {})[rankShiftsCat]
        : (t[sideKey] || {})[rankShiftsCat];
      if(!cell) return null;
      return { abbr, rank2025: cell.r, val2025: cell.v, val2026: cell.v26 ?? null };
    })
    .filter(r => r);

  // REAL, GENUINELY NEW COMPUTATION — this exact rank has never existed
  // anywhere in this project before. Every real category already has a
  // real, standalone 2026 VALUE (v26, confirmed directly against real
  // matchup/wkNN.json data) — but nothing anywhere ranks that value
  // against the other 31 real teams' own real v26 values. Only teams
  // with a real v26 already computed get ranked here; a team still
  // missing one (not enough real 2026 sample yet) gets a real, honest
  // "—" rather than a fabricated rank.
  const withReal2026 = rows.filter(r => r.val2026 != null);
  const sorted2026 = [...withReal2026].sort((a, b) =>
    higherIsBetter ? b.val2026 - a.val2026 : a.val2026 - b.val2026);
  const rank2026ByAbbr = {};
  sorted2026.forEach((r, i) => { rank2026ByAbbr[r.abbr] = i + 1; });

  rows.forEach(r => {
    r.rank2026 = rank2026ByAbbr[r.abbr] ?? null;
    // Positive rankDiff = rank NUMBER went down = real improvement (e.g. 28 -> 5).
    // Negative rankDiff = rank NUMBER went up = real decline (e.g. 5 -> 28).
    r.rankDiff = r.rank2026 != null ? r.rank2025 - r.rank2026 : null;
    r.absRankDiff = r.rankDiff != null ? Math.abs(r.rankDiff) : null;
    // REAL CHANGE (2026-09-22), per Frank's direct, real concern: this
    // was direction-normalized (positive always = "improved") the same
    // way rankDiff still is — but Coeus doesn't see the color coding a
    // human reader uses to tell "+74 = improved" from "+74 = worse," and
    // has no real way to know this column's good/bad convention flips
    // for defense. A "+74" next to two pass-yards-ALLOWED numbers that
    // actually went DOWN is a real, serious misread risk — reading the
    // sign as "more yards" is the natural, literal interpretation, and
    // here it would be exactly backwards. Now a real, literal
    // (2026 - 2025) for BOTH sides — "+" always genuinely means "more of
    // this stat," "-" always means "less," true regardless of which side
    // is being viewed. rankDiff is left as direction-normalized on
    // purpose — a rank NUMBER is already inherently "lower is better" on
    // both sides, so there's no equivalent literal-vs-good/bad conflict
    // there the way there is for a raw yards/points value.
    r.valueDiff = r.val2026 != null ? +((r.val2026 - r.val2025).toFixed(1)) : null;
    // Color still reflects real good/bad direction for a human reader —
    // just no longer tied to the sign itself, which now stays literal.
    r.valueDiffGood = r.valueDiff != null
      ? (higherIsBetter ? r.valueDiff > 0 : r.valueDiff < 0)
      : null;
  });

  if(!rankShiftsSortKey) rankShiftsSortKey = 'absRankDiff';
  const valueFor = (r, key) => key === 'absRankDiff' ? r.absRankDiff : r[key];
  rows.sort((a, b) => {
    const av = valueFor(a, rankShiftsSortKey), bv = valueFor(b, rankShiftsSortKey);
    const avn = av == null ? -Infinity : av, bvn = bv == null ? -Infinity : bv;
    return rankShiftsSortDir === 'desc' ? bvn - avn : avn - bvn;
  });

  const cols = [
    { key: 'rank2025', label: '2025 Rank' },
    { key: 'val2025', label: '2025 Value' },
    { key: 'rank2026', label: '2026 Rank' },
    { key: 'val2026', label: '2026 Value' },
    { key: 'valueDiff', label: 'Value Diff' },
    { key: 'absRankDiff', label: 'Rank Diff' },
  ];

  let head = `<thead><tr>
    <th class="team-col">Team</th>
    ${cols.map(c => `<th data-key="${c.key}" class="${c.key===rankShiftsSortKey?'sorted':''}">
      ${esc(c.label)}${c.key===rankShiftsSortKey ? (rankShiftsSortDir==='desc'?' ▾':' ▴') : ''}
    </th>`).join('')}
  </tr></thead>`;

  let body = '<tbody>' + rows.map(r => {
    // REAL CHANGE (2026-09-22), per Frank's direct request: the "improved"/
    // "declined" words are gone — the +/- sign already says the same real
    // thing on its own, without spelling it out redundantly in words.
    const rankDiffText = r.rankDiff == null ? '—' :
      r.rankDiff === 0 ? '±0' : (r.rankDiff > 0 ? `+${r.rankDiff}` : `${r.rankDiff}`);
    const rankDiffClass = r.rankDiff == null ? '' : r.rankDiff > 0 ? 'gap-up' : r.rankDiff < 0 ? 'gap-down' : '';
    const valueDiffText = r.valueDiff == null ? '—' :
      r.valueDiff === 0 ? '±0' : (r.valueDiff > 0 ? `+${r.valueDiff}` : `${r.valueDiff}`);
    const valueDiffClass = r.valueDiffGood == null ? '' : r.valueDiffGood ? 'gap-up' : 'gap-down';
    return `<tr>
      <td class="team-col">${fiLogoHTML(r.abbr,22)}${esc(FI_TEAM_NAME[r.abbr]||r.abbr)}</td>
      <td><span class="cell-val">#${r.rank2025}</span></td>
      <td><span class="cell-val">${fmtVal(r.val2025)}</span></td>
      <td><span class="cell-val">${r.rank2026 != null ? '#'+r.rank2026 : '—'}</span></td>
      <td><span class="cell-val">${r.val2026 != null ? fmtVal(r.val2026) : '—'}</span></td>
      <td><span class="cell-val ${valueDiffClass}">${valueDiffText}</span></td>
      <td><span class="cell-val ${rankDiffClass}">${rankDiffText}</span></td>
    </tr>`;
  }).join('') + '</tbody>';

  $("leadTable").innerHTML = head + body;

  $("leadTable").querySelectorAll("thead th[data-key]").forEach(th => {
    th.onclick = () => {
      const k = th.dataset.key;
      if(k === rankShiftsSortKey) rankShiftsSortDir = rankShiftsSortDir === 'desc' ? 'asc' : 'desc';
      else { rankShiftsSortKey = k; rankShiftsSortDir = 'desc'; }
      renderRankShiftsTable();
    };
  });
}

function renderDvpTable(){
  const wk = dvpDataFor(currentWeek);
  const labels = wk.labels.pos[currentPos];
  const keys = Object.keys(labels);
  if(!sortKey) sortKey = keys[0];

  // REAL BUG FIX (2026-09-18), per Frank's direct catch (2025 started
  // showing what looked like real 2026 numbers): confirmed directly
  // that archive/2025/matchup/wk18.json's cells ALSO carry a v26 field
  // — traced to yesterday's fix_2025_archive.py, which replaced each
  // archived file's whole "teams" object with the correct one from
  // matchup/wk02.json to fix a real staleness bug, but that object
  // also happens to carry v26 (the real, live 2026 sample) as part of
  // the same structure — a field that never conceptually belongs in a
  // historical archive record regardless of what value it holds. The
  // real, safe fix belongs here rather than touching the data files
  // again: v26 must only ever be trusted while genuinely viewing the
  // live 2026 season, never for an archived one, no matter what a
  // given file happens to contain.
  const getVal = cell => (season === 2026 && cell.v26 !== undefined) ? cell.v26 : cell.v;

  const rows = Object.entries(wk.teams)
    .filter(([,t]) => t.def && t.def[currentPos])
    .map(([abbr,t]) => ({ abbr, def: t.def[currentPos] }));

  rows.sort((a,b) => {
    const av = a.def[sortKey] ? getVal(a.def[sortKey]) : -Infinity;
    const bv = b.def[sortKey] ? getVal(b.def[sortKey]) : -Infinity;
    return sortDir === 'desc' ? bv - av : av - bv;
  });

  let head = `<thead><tr>
    <th class="team-col">Team</th>
    ${keys.map(k => `<th data-key="${k}" class="${k===sortKey?'sorted':''}">
      ${esc(labels[k].l)}${k===sortKey ? (sortDir==='desc'?' ▾':' ▴') : ''}
    </th>`).join('')}
  </tr></thead>`;

  let body = '<tbody>' + rows.map((row,i) => {
    const cells = keys.map(k => {
      const cell = row.def[k];
      if(!cell) return `<td>—</td>`;
      if(season === 2026 && cell.v26 !== undefined){
        return `<td><span class="cell-val">${fmtVal(cell.v26)}</span></td>`;
      }
      return `<td><span class="cell-val carryover-val">${fmtVal(cell.v)}</span><span class="rk ${rkClass(cell.r)}">#${cell.r}</span></td>`;
    }).join('');
    return `<tr>
      <td class="team-col"><span class="rank-num">${i+1}</span>${fiLogoHTML(row.abbr,22)}${esc(FI_TEAM_NAME[row.abbr]||row.abbr)}</td>
      ${cells}
    </tr>`;
  }).join('') + '</tbody>';

  $("leadTable").innerHTML = head + body;

  $("leadTable").querySelectorAll("thead th[data-key]").forEach(th => {
    th.onclick = () => {
      const k = th.dataset.key;
      if(k === sortKey) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      else { sortKey = k; sortDir = 'desc'; }
      renderDvpTable();
    };
  });
}

function offenseColumns(){
  const labels = TEAMSTATS.labels.offense[offSubgroup];

      cols.push({ key, field:'tot', sortKey:`${key}:tot`, label });

  $("scrim").classList.add("open"); $("modal").classList.add("open");

function renderPlayerModalBody(){
  $("mToggle").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.sec === activeSec)));

  const box = $("mBody");
  if(activeSec === 'season') box.innerHTML = statBlockHTML(activePlayer.season.m, `${activePlayer.season.games} games`);
  else if(activeSec === 'career') box.innerHTML = statBlockHTML(activePlayer.career.m,
    `${activePlayer.career.games} games · through ${activePlayer.career.through}` +
    (activePlayer.career.through < 1999 ? '' : ' (nflverse data starts 1999 — pre-1999 seasons aren\'t included)'));
  else renderGameLog(box, activePlayer);

function statBlockHTML(m, horizonNote){
  const cats = PLAYERSTATS.labels[playerPos];
  const PCT_KEYS = new Set(['rush_share','target_share']);
  let h = `<div class="empty" style="padding:8px 0 4px;text-align:left;font-size:10px">${horizonNote}</div>`;
  for(const [cat, labels] of Object.entries(cats)){
    h += `<div class="subsect">${esc(cat)}</div><table class="stat-table"><tbody>`;
    for(const [k, meta] of Object.entries(labels)){
      const v = m[k];
      const text = (v!=null && PCT_KEYS.has(k)) ? `${fmtVal(v)}%` : fmtVal(v);
      h += `<tr><td>${esc(meta.l)}</td><td class="num">${text}</td></tr>`;
    }
    h += `</tbody></table>`;
  }
  return h;
}

function renderGameLog(box, row){
  const tierLabel = { top: 'Top 10', mid: 'Middle 12', bot: 'Bottom 10' };
  const volumeLabels = PLAYERSTATS.labels[playerPos].Volume;
  const volKeys = Object.keys(volumeLabels);
  if(!logStatKey || !volKeys.includes(logStatKey)) logStatKey = volKeys[0];

  let h = `<div class="split-cards">`;
  for(const tier of ['top','mid','bot']){
    const s = row.splits[tier] || {games:0, m:{}};
    h += `<div class="split-card ${tier}">
      <div class="sc-label">vs ${tierLabel[tier]}</div>
      <div class="sc-games">${s.games} game${s.games===1?'':'s'}</div>
      <div class="sc-value">${s.games ? fmtVal(s.m[logStatKey]) : '—'}</div>
      <div class="sc-games">${esc(volumeLabels[logStatKey].l)}</div>
    </div>`;
  }
  h += `</div>`;

  h += `<div class="lead-wrap" style="max-height:460px;margin-top:10px">
    <table class="lead-table"><thead><tr>
    <th class="team-col">Week</th><th>Opp</th><th>Tier</th>
    ${volKeys.map(k => `<th data-key="${k}" class="${k===logStatKey?'sorted':''}">${esc(volumeLabels[k].l)}</th>`).join('')}
  </tr></thead><tbody>`;
  row.log.slice().reverse().forEach(g => {
    h += `<tr>
      <td class="team-col">${g.week}</td>
      <td>${g.opp ? fiLogoHTML(g.opp,18)+esc(g.opp) : '—'}</td>
      <td>${g.tier ? `<span class="tier-badge ${g.tier}">${tierLabel[g.tier]}</span>` : '—'}</td>
      ${volKeys.map(k => {
        const isRate = k.endsWith('_pg') || k.endsWith('_ypg');
        const v = isRate ? g.cum[k] : g.m[k];
        return `<td><span class="cell-val">${fmtVal(v)}</span></td>`;
      }).join('')}
    </tr>`;
  });
  h += `</tbody></table></div>`;
  box.innerHTML = h;

  box.querySelectorAll("thead th[data-key]").forEach(th => {
    th.onclick = () => { logStatKey = th.dataset.key; renderGameLog(box, row); };
  });
}

function closePlayerModal(){
  $("scrim").classList.remove("open"); $("modal").classList.remove("open");
  if(lastFocus) lastFocus.focus();
}
$("mClose").addEventListener("click", closePlayerModal);
$("scrim").addEventListener("click", closePlayerModal);
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("modal").classList.contains("open")) closePlayerModal();
});

load();
</script>
</body>
</html>
