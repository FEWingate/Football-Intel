    ${r.under_price_assumed ? `<div class="empty" style="padding:6px 0;text-align:left;font-size:10px">The under price wasn't saved for this line, so −113 is assumed for it.</div>` : ''}`;
  comboWireSlip($("mBody"));
  const upd = () => {
    const ln = Number($("altLine").value), pr0 = Number($("altPrice").value);
    const ev = comboEval(r, ln, pr0, null);
    if(!ev){ $("altOut").innerHTML = ''; return; }
    $("altOut").innerHTML = `<div class="ic-row"><span class="ic-row-label">P(over ${ln})</span><span class="cell-val">${(100 * ev.pOver).toFixed(0)}%</span></div>
      <div class="ic-row"><span class="ic-row-label">Break-even at ${pr0}</span><span class="cell-val">${(100 * comboBreakEven(pr0)).toFixed(0)}%</span></div>
      <div class="ic-row"><span class="ic-row-label">Over edge</span><span class="cell-val">${((ev.pOver - comboBreakEven(pr0)) * 100).toFixed(1)} pts</span></div>`;
  };
  $("altLine").oninput = upd; $("altPrice").oninput = upd; upd();
  $("scrim").classList.add("open"); $("modal").classList.add("open"); $("mClose").focus();
}

let COMBO_LOADED = false;
async function comboLoad(){
  if(COMBO_LOADED) return;
  COMBO_LOADED = true;
  try{ const r = await fetch(`intel/combo_props.json`, {cache:'no-store'}); if(r.ok) COMBO = await r.json(); }catch(e){}
  try{
    const rf = await fetch(`fanduel_props/latest.json`, {cache:'no-store'});
    if(rf.ok){ const fd = await rf.json(); (fd.games || []).forEach(g => { if(g.canonical_event_id) COMBO_EVENTS[g.away_code + '@' + g.home_code] = g.canonical_event_id; }); }
  }catch(e){}
  try{ await comboPollEspn(); comboStartEspnWatch(); }catch(e){}
  try{
    if(COMBO && COMBO.week){
      const rt = await fetch(`threats/wk${String(COMBO.week).padStart(2, '0')}.json`, {cache:'no-store'});
      if(rt.ok){
        const td = await rt.json();
        COMBO_THREATS = {labels: td.labels || {}, map: {}};
        for(const [team, t] of Object.entries(td.teams || {})){
          for(const st of (t.starters || [])){
            const res = fiClassify(st.cats || {});
            if(res.length) COMBO_THREATS.map[comboNameKey(st.name) + '|' + team] = {s: st, res, team, opp: t.opp};
          }
        }
      }
    }
  }catch(e){}
  try{ const rh = await fetch(`results/combo_picks.json`, {cache:'no-store'}); if(rh.ok) COMBO_HIST = await rh.json(); }catch(e){}
}
async function renderComboReport(){
  if(!COMBO_LOADED){
    $('body').innerHTML = `<div class="empty">Loading Combo Props…</div>`;
    await comboLoad();
    if(activeSection !== 'combo') return;
  }
  if(COMBO && COMBO.week && propsWeekFilter !== `wk${String(COMBO.week).padStart(2, '0')}`){
    $('body').innerHTML = `<div class="empty">Combo Props are built for the current week only (Week ${esc(COMBO.week)}).<br>
      Switch the Week selector to Week ${esc(COMBO.week)} to see them.</div>`;
    return;
  }
  renderComboReportInner();
}
function esc2(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function openPickModal(key, source){
  const e = PICKBD && PICKBD.picks && PICKBD.picks[key]; if(!e) return;
  const pick = PICK_REG[key] || {};
  lastFocus = source || null;
  const side = pick.side === 'over' ? 'OVER' : (pick.side === 'under' ? 'UNDER' : null);

      <div class="cc-title">Coeus pick</div>
      <div class="cc-top"><span style="color:${col};font-weight:800;letter-spacing:.04em">${side}${line !== null ? ' ' + line : ''}</span>
        ${typeof pick.projection === 'number' ? `<span class="rank-chip">projects ${pick.projection}${diff !== null ? ` (${diff > 0 ? '+' : ''}${Math.round(diff * 10) / 10} vs line)` : ''}</span>` : ''}</div>
      ${pick.reason ? `<p class="cc-why">${esc(pick.reason)}</p>` : ''}</div>` : '';
  const logRows = (e.log || []).slice().reverse().map(x => {
    const cls = line !== null ? (x.v > line ? 'log-hit' : (x.v < line ? 'log-miss' : '')) : '';
    return `<tr><td class="name-col">2026 wk ${x.week}</td><td>${esc(x.opp || '—')}</td><td><span class="cell-val ${cls}">${x.v}</span></td></tr>`;

    <div class="lead-wrap" style="max-height:none"><table class="lead-table"><thead><tr>
      <th class="name-col">Game</th><th>Opp</th><th>${esc(e.label)}</th></tr></thead>
      <tbody>${logRows || '<tr><td class="name-col">No games</td><td></td><td></td></tr>'}</tbody></table></div>`;
  wireSlipButtons($('mBody'), () => { openPickModal(key, source); render(); });

}
