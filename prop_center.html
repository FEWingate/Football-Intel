<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prop Center — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
.parlay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;margin-bottom:22px}
.parlay-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.parlay-card.invalid{border-color:rgba(244,63,94,.4)}
.parlay-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);
  background:var(--surface2)}
.parlay-size{font-family:var(--font-display);font-weight:800;font-size:15px}
.parlay-badge{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-sm)}
.parlay-badge.pass{color:var(--accent-green);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3)}
.parlay-badge.fail{color:var(--accent-red);background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.3)}
.parlay-legs{padding:10px 14px}
.parlay-leg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hairline);
  font-size:15px}
.parlay-leg:last-child{border-bottom:0}
.parlay-leg .who{color:var(--text);font-weight:600}
.parlay-leg .mkt{color:var(--text-dim);font-size:13px}
.parlay-leg .px{font-family:var(--font-mono);color:var(--text-mid);white-space:nowrap}
.parlay-foot{padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2);
  font-family:var(--font-mono);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.parlay-foot b{color:var(--text);font-weight:600}
.parlay-note{font-size:10.5px;color:var(--accent-gold);padding:8px 14px 0;line-height:1.5}
.parlay-error{font-size:11.5px;color:var(--accent-red);padding:8px 14px;line-height:1.5}
.report-body{font-size:13.5px;line-height:1.7;color:var(--text-mid)}
.report-body h1,.report-body h2,.report-body h3{color:var(--text);font-family:var(--font-display);margin:20px 0 8px}
.report-body h1{font-size:20px}.report-body h2{font-size:17px}.report-body h3{font-size:14.5px}
.report-body ul{margin:6px 0 14px 20px}
.report-body li{margin:4px 0}
.report-body strong{color:var(--text);font-weight:700}
.toggle-report{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);cursor:pointer;
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-block;margin-bottom:14px}
.toggle-report:hover{color:var(--primary);border-color:var(--primary)}

/* ── Player Props (real, live FanDuel data — no LLM) ─────────────────── */
.pc-empty-inline{font-size:11px;color:var(--text-dim);font-style:italic}
.pc-line-px{font-family:var(--font-mono);color:var(--text-mid)}
.pc-stat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pc-stat-tab{font-family:var(--font-mono);font-size:11px;padding:7px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);color:var(--text-dim);cursor:pointer;background:var(--surface)}
.pc-stat-tab[aria-selected="true"]{color:var(--primary);border-color:var(--primary);background:rgba(99,102,241,.08)}
.pc-props-table{width:100%;border-collapse:collapse;font-size:12.5px}
.pc-props-table th{text-align:left;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border)}
.pc-props-table td{padding:7px 10px;border-bottom:1px solid var(--hairline)}
.pc-props-table tr:last-child td{border-bottom:0}
.pc-player-name{color:var(--text);font-weight:600}
.pc-alts-toggle{font-family:var(--font-mono);font-size:10.5px;color:var(--primary);cursor:pointer;
  background:none;border:0;padding:0}
.pc-alts-row{display:none}
.pc-alts-row.open{display:table-row}
.pc-alts-grid{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
.pc-alt-chip{font-family:var(--font-mono);font-size:10.5px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 8px;color:var(--text-mid)}
.pc-td-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pc-td-chip{display:flex;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 10px;font-size:12px}

.pc-topnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0}
.pc-topnav button{font-family:var(--font-mono);font-size:12px;font-weight:600;padding:10px 16px;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);cursor:pointer}
.pc-topnav button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}

/* ── Prop Builder (2026-10-02), per Frank's direct request: every real
   line in Game Lines/Totals/ML and Player Props is clickable, adding it
   to a real, user-built slip (not Coeus's picks) saved per-week in the
   browser. ── */
.pc-nav-badge{font-family:var(--font-mono);font-size:10px;color:var(--primary);margin-left:3px}
.pc-slip-btn{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text-dim);cursor:pointer;margin-left:6px;white-space:nowrap}
.pc-slip-btn:hover{border-color:var(--primary);color:var(--primary)}
.pc-slip-btn.added{border-color:var(--accent-green);color:var(--accent-green);background:rgba(74,222,128,.08)}
.pc-slip-remove{font-family:var(--font-mono);font-size:11px;background:none;border:1px solid var(--border);
  border-radius:4px;color:var(--text-dim);cursor:pointer;padding:2px 7px;margin-left:8px}
.pc-slip-remove:hover{border-color:var(--accent-red);color:var(--accent-red)}
.pc-stake-input{width:60px;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:4px;padding:3px 6px;font-family:var(--font-mono)}
.pc-clear-slip{margin-top:14px;color:var(--accent-red);border-color:rgba(244,63,94,.3)}

/* ── Parlay Scrambler (2026-10-02), per Frank's direct request: pools
   every real pick Coeus already made across Favorite O/U, Anytime TD,
   Spreads, and Parlays (only legs from combinations that passed
   validation), dedupes them, and draws a random N on demand. This
   never generates a new pick of its own — it only reshuffles picks
   that already exist elsewhere on this page. ── */
.pc-scramble-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pc-scramble-sizes{display:flex;gap:6px;flex-wrap:wrap}
.pc-scramble-sizes button{font-family:var(--font-mono);font-size:13px;font-weight:700;
  width:36px;height:36px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text-dim);cursor:pointer}
.pc-scramble-sizes button:hover{border-color:var(--primary);color:var(--primary)}
.pc-scramble-sizes button.active{border-color:var(--primary);color:var(--primary);
  background:rgba(96,165,250,.1)}
.pc-scramble-go{background:#000;color:#4ade80;border-color:#000;font-weight:700}
.pc-scramble-go:hover{background:#111;color:#4ade80;border-color:#111}
.pc-scramble-go:disabled{opacity:.4;cursor:not-allowed}
.pc-scramble-go:disabled:hover{background:#000;color:#4ade80;border-color:#000}
.pc-scramble-pool-note{font-family:var(--font-mono);font-size:11px;color:var(--text-mid)}

/* ── Game Lines cards — same shape/size as the Games page, real .gcard
   classes reused directly (defined in the shared css/fi-styles.css) so
   this looks and feels identical, not just visually similar. ── */
/* ── Real .gcard family — copied directly from games.html's own <style>
   block, confirmed NOT to live in the shared css/fi-styles.css (my
   earlier mistake was assuming it did, which is why the cards rendered
   as bare, unstyled text instead of real bordered cards). Only the
   pieces this page actually uses — no .tform/.tscore/.links, since
   props cards don't show records, live scores, or action buttons. ── */
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 22px 20px;display:block;text-decoration:none;color:inherit;
  transition:border-color .18s,transform .15s;cursor:pointer}
.gcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.gcard:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.gcard-top{display:flex;align-items:flex-start;gap:14px}
.teams-col{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:11px;padding:6px 0}
.tabbr{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.02em;min-width:60px}
.trec{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim)}
.kick{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text-mid);
  white-space:nowrap;line-height:1.7}
.odds{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--hairline)}
.odd{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;padding:5px 10px;
  border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text-mid)}
.odd b{color:var(--text);font-weight:600}

#pcSlate{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.pc-modal-stat-sect{margin:18px 0 8px}
.pc-modal-stat-sect h4{font-family:var(--font-display);font-size:13px;color:var(--text);margin-bottom:8px}

/* ── Coeus Prop Breakdown / Favorite O/U pick cards ──────────────────── */
.pc-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:8px}
.pc-pick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px}
.pc-pick-badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--primary);margin-bottom:4px;display:block}
.pc-pick-player{font-family:var(--font-display);font-weight:700;font-size:13.5px;color:var(--text)}
.pc-pick-market{font-size:11.5px;color:var(--text-dim);margin:3px 0}
.pc-pick-price{font-family:var(--font-mono);font-size:13px;color:var(--text-mid)}
.pc-pick-price-row{display:flex;align-items:center;gap:8px}
.pc-pick-side{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;padding:3px 7px;border-radius:4px}
.pc-pick-side.over{background:rgba(74,222,128,.14);color:#4ade80}
.pc-pick-side.under{background:rgba(248,113,113,.14);color:#f87171}
.pc-pick-side.spread{background:rgba(96,165,250,.14);color:#60a5fa}
.grade-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 7px;
  border-radius:5px;display:inline-block;letter-spacing:.04em}
.grade-badge.win{background:rgba(74,222,128,.16);color:#4ade80}
.grade-badge.loss{background:rgba(248,113,113,.16);color:#f87171}
.grade-badge.push{background:rgba(250,204,21,.16);color:#facc15}
.grade-badge.pending{background:var(--surface2);color:var(--text-mid)}
.pc-stat-row{display:flex;flex-wrap:wrap;gap:10px}
.pc-stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:12px 16px;min-width:120px}
.pc-stat-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-mid);margin-bottom:4px}
.pc-stat-val{font-size:20px;font-weight:700}
.pc-stat-pct{font-size:12px;color:var(--text-mid)}
.pc-pick-proj{font-size:12.5px;font-weight:600;color:var(--primary);margin-top:6px}
.pc-units-pos{color:#2e9e5b;font-weight:600}
.pc-units-neg{color:#d64545;font-weight:600}
.pc-stat-ungraded{font-size:10.5px;color:var(--text-mid);margin-top:2px}
.pc-pick-reason{font-size:14px;color:var(--text-dim);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script>
const main = fiShell({ page:'props', pageLabel:'Prop Center', status:'loading' });
const $ = id => document.getElementById(id);

main.innerHTML = `
  <div class="bar" id="pcWeekBar" style="display:none">
    <label class="lbl" for="pcWeek">Week</label><select id="pcWeek"></select>
  </div>
  <div class="bar" id="pcBatchBar" style="display:none">
    <label class="lbl" for="pcBatch">Batch</label><select id="pcBatch"></select>
  </div>
  <div class="pc-topnav" id="pcTopNav">
    <button data-s="lines" aria-selected="true">Game Lines / Totals / ML</button>
    <button data-s="props">Player Props</button>
    <button data-s="builder">Prop Builder<span class="pc-nav-badge" id="pcSlipBadge"></span></button>
    <button data-s="breakdown">Coeus Prop Breakdown</button>
    <button data-s="overunder">Coeus Favorite O/U</button>
    <button data-s="anytimetd">Coeus Anytime TD</button>
    <button data-s="spreads">Coeus Spreads</button>
    <button data-s="parlays">Coeus Parlays</button>
    <button data-s="scrambler">Parlay Scrambler</button>
    <button data-s="results">Results</button>
  </div>
  <div id="body"></div>
  <div class="modal-overlay" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-subtitle" id="mSub"></div>
      <button class="modal-close" id="mClose" aria-label="Close game">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>`;

let FDPROPS = null;   // fanduel_props/latest.json, filtered down to the selected week's real games
let FDPROPS_ALL = null; // the full, unfiltered fanduel_props/latest.json snapshot — real, live data, no LLM
let REPORT = null;    // props_reports — Coeus's picks + parlays
// REAL ADDITION (2026-09-28), per Frank's direct request to track how
// Coeus's real picks actually did: REPORT_GRADED is the sibling
// "*_graded.json" grade_props_report.py writes once a week's real
// games are final (same picks as REPORT, each with a real "grade"
// field added) — null until that script has actually been run for
// the selected week/batch. SEASON_RECORD is the rolling real W/L/P
// tally across every graded week, results/season_record.json.
let REPORT_GRADED = null;
let SEASON_RECORD = null;
let activeSection = 'lines';
let activeStat = 'passing_yards';
let PROPS_WEEKS = [];      // real week folders (plus 'mixed', if present) that actually have a report
let propsWeekFilter = null;
let PROPS_BATCHES = {};    // real batch filename -> {games, generated_at} for the selected week
let propsBatchFilter = null;
// REAL ADDITION (2026-10-01), per Frank's direct request: Parlays/TD
// Parlays/Spread Parlays built per-batch could only ever pick legs from
// that one batch's handful of games, never a genuinely best-of-the-
// whole-week combination. WHOLE_WEEK_REPORT is the sibling
// "props_parlay_report_WHOLEWEEK.json" generate_props_report.py
// --parlays-only writes once all of a week's normal batches are done —
// null until that's actually been run for the selected week, in which
// case these three tabs fall back to the selected batch's own parlays
// exactly as before (see renderParlays/renderAnytimeTD/renderSpreads).
let WHOLE_WEEK_REPORT = null;

// REAL ADDITION (2026-10-02), per Frank's direct request: a Prop Builder
// slip — real, user-picked legs from Game Lines/Totals/ML and Player
// Props, saved per-week in the browser's own localStorage. This is
// Frank's own slip, not Coeus's — never validated or re-checked the way
// Coeus's own parlays are, just whatever real price was on the board
// when he clicked it.
let SLIP = [];
let SLIP_STAKE = 10;

const pad = n => String(n).padStart(2, '0');

// REAL CHANGE (2026-09-29), same real feature already built and tested
// on games.html/matchup_stats.html/threats.html/dfs_center.html: ported
// over UNCHANGED (fully self-contained — reads games/wkNN.json
// directly, nothing specific to this page) rather than reimplemented,
// per Frank's direct request that the Prop Center's week selector
// behave exactly like every other section — advancing past a week once
// ITS OWN real Monday game has actually finished, and never quietly
// falling back to an older, already-built week just because the
// current week's props report hasn't been generated yet.
//
// Deliberately does NOT trust matchup/current.json's own "week" value —
// confirmed on games.html that this field tracks "the highest week
// build_matchup_stats.py has ever built," not "the real current NFL
// week." Always starts the real check from week 1 and walks forward.
function etOffsetMinutes(dateStr){
  const d = new Date(`${dateStr}T12:00:00Z`);
  const utcStr = d.toLocaleString('en-US', { timeZone: 'UTC', hour12: false });
  const etStr = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
  return (new Date(utcStr) - new Date(etStr)) / 60000;
}
function kickoffHasPassed(g){
  if(!g.gameday || !g.gametime) return false;
  const [h, m] = g.gametime.split(':').map(Number);
  const kickoffUTC = new Date(`${g.gameday}T00:00:00Z`);
  kickoffUTC.setUTCMinutes(kickoffUTC.getUTCMinutes() + h * 60 + m + etOffsetMinutes(g.gameday));
  return new Date() >= kickoffUTC;
}
async function determineDefaultWeek(){
  let week = 1;
  while (week < 18) {
    let wkData;
    try {
      const r = await fetch(`games/wk${pad(week)}.json`, { cache: 'no-store' });
      if (!r.ok) break; // that week isn't built yet — stop advancing, use what we have
      wkData = await r.json();
    } catch (e) { break; }

    const monGames = (wkData.games || []).filter(g => g.weekday === 'Monday' && g.gameday);
    if (!monGames.length) break; // no real Monday game this week — nothing to advance past
    const latestMon = monGames.reduce((max, g) => (!max || g.gametime > max.gametime) ? g : max, null);
    if (!kickoffHasPassed(latestMon)) break; // this week's real MNF hasn't happened yet — stay here
    week += 1;
  }
  return week;
}

async function load(){
  fiStatus('Loading','loading');

  try{
    const res = await fetch('fanduel_props/latest.json', { cache: 'no-store' });
    if(res.ok) FDPROPS_ALL = await res.json();
  }catch(e){ /* Game Lines / Player Props just won't have data yet */ }

  try{
    const res = await fetch('results/season_record.json', { cache: 'no-store' });
    if(res.ok) SEASON_RECORD = await res.json();
  }catch(e){ /* no real graded weeks yet */ }

  // REAL CHANGE (2026-09-21), per Frank's direct request: a full slate
  // can now be split into several real, separate batches (--games,
  // built to keep each run comfortably under the API's real token
  // ceiling) — each one writes its own real, distinctly-named file
  // rather than the single "props_parlay_report.json" this page
  // originally only ever looked for. A browser's fetch() can only
  // check one already-known filename at a time — it can't list a
  // folder's real contents — so this now checks for the real, per-week
  // manifest.json generate_props_report.py writes (same real pattern
  // Game Breakdowns already uses) instead of guessing filenames.
  PROPS_WEEKS = [];
  for(let w = 1; w <= 18; w++){
    const wk = `wk${pad(w)}`;
    try{
      const r = await fetch(`props_reports/${wk}/manifest.json`, { method: 'HEAD', cache: 'no-store' });
      if(r.ok) PROPS_WEEKS.push(wk);
    }catch(e){}
  }
  try{
    const r = await fetch(`props_reports/mixed/manifest.json`, { method: 'HEAD', cache: 'no-store' });
    if(r.ok) PROPS_WEEKS.push('mixed');
  }catch(e){}

  // REAL CHANGE (2026-09-29), per Frank's direct request: always default
  // to the REAL current NFL week (same auto-advance rule as Matchup
  // Stats, Threats, and the DFS Center), even when this week's props
  // report hasn't been generated yet — loadManifestForWeek() already
  // shows the real "not generated yet" empty states in that case, rather
  // than this silently substituting an older, already-built week.
  const currentWeek = await determineDefaultWeek();
  const currentWk = `wk${pad(currentWeek)}`;
  propsWeekFilter = currentWk;
  loadSlip(propsWeekFilter);
  await loadManifestForWeek(propsWeekFilter);
  await applyGameLinesWeekFilter(propsWeekFilter);

  const optionWeeks = Array.from(new Set([...PROPS_WEEKS, currentWk]));
  const rank = wk => wk === 'mixed' ? 1e6 : Number(wk.slice(2));
  optionWeeks.sort((a, b) => rank(a) - rank(b));

  const wkLabel = wk => wk === 'mixed' ? 'Mixed / partial slate' : `Week ${Number(wk.slice(2))}`;
  $('pcWeek').innerHTML = optionWeeks
    .map(wk => `<option value="${wk}"${wk===propsWeekFilter?' selected':''}>${wkLabel(wk)}</option>`).join('');
  $('pcWeekBar').style.display = '';
  $('pcWeek').addEventListener('change', async (e) => {
    propsWeekFilter = e.target.value;
    loadSlip(propsWeekFilter);
    fiStatus('Loading','loading');
    await loadManifestForWeek(propsWeekFilter);
    await applyGameLinesWeekFilter(propsWeekFilter);
    fiStatus('Ready');
    render();
  });

  fiStatus('Ready');
  fiUpdated(FDPROPS ? `Lines updated ${new Date(FDPROPS.generated_at).toLocaleString()}` : '');

  $('pcTopNav').querySelectorAll('button').forEach(b => b.onclick = () => {
    activeSection = b.dataset.s;
    $('pcTopNav').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x===b)));
    render();
  });

  $('mClose').addEventListener('click', closeModal);
  $('scrim').addEventListener('click', closeModal);
  document.addEventListener('keydown', e => {

// REAL ADDITION (2026-09-29), per Frank's direct request: fanduel_props/
// latest.json is a single, un-week-scoped snapshot — whatever games were
// on the board the last time build_fanduel_props.py ran, nothing more.
// Once the week selector auto-advances to a new real week (see
// determineDefaultWeek() above) that snapshot can easily be stale —
// still holding the PRIOR week's real games — and showing those under
// the new week's label would be actively misleading, not just empty.
// This cross-checks FDPROPS_ALL's games against that week's real
// schedule (games/wkNN.json) and keeps only the ones that actually
// belong to it; if none match, Game Lines / Player Props correctly show
// their existing "no data yet" empty states instead of the wrong week's
// real games.
async function applyGameLinesWeekFilter(wk){
  if(!FDPROPS_ALL){ FDPROPS = null; return; }
  let schedule = null;
  try{
    const res = await fetch(`games/${wk}.json`, { cache: 'no-store' });
    if(res.ok) schedule = await res.json();
  }catch(e){}
  if(!schedule || !schedule.games || !schedule.games.length){
    FDPROPS = { ...FDPROPS_ALL, games: [] };
    return;
  }
  const validKeys = new Set(schedule.games.map(g => `${g.away}_${g.home}`));
  FDPROPS = {
    ...FDPROPS_ALL,
    games: (FDPROPS_ALL.games || []).filter(g => validKeys.has(`${g.away_code}_${g.home_code}`)),
  };
}

// REAL CHANGE (2026-09-21): loads the real, per-week manifest, builds
// (or hides, when there's genuinely only one real batch) a Batch
// selector, and loads whichever real batch is currently selected.
// Defaults to the most recently-generated real batch for this week,
// same real "most recent, not just first" principle used for the week
// selector itself above.
const WHOLE_WEEK_FILENAME = 'props_parlay_report_WHOLEWEEK.json';

// REAL ADDITION (2026-10-01): loads the whole-week-only Parlays/TD
// Parlays/Spread Parlays file if generate_props_report.py --parlays-only
// has been run for this week — a 404 just means it hasn't yet, which
// is routine, not an error (every renderX() below already falls back
// to the selected batch's own parlays in that case).
async function loadWholeWeekReport(wk){
  WHOLE_WEEK_REPORT = null;
  try{
    const res = await fetch(`props_reports/${wk}/${WHOLE_WEEK_FILENAME}`, { cache: 'no-store' });
    if(res.ok) WHOLE_WEEK_REPORT = await res.json();
  }catch(e){ /* stays null — routine, handled by callers */ }
}

async function loadManifestForWeek(wk){
  PROPS_BATCHES = {};
  try{
    const res = await fetch(`props_reports/${wk}/manifest.json`, { cache: 'no-store' });
    if(res.ok){
      const mf = await res.json();
      PROPS_BATCHES = mf.batches || {};
    }
  }catch(e){ /* PROPS_BATCHES stays empty — handled below */ }
  // The whole-week parlay file is a special, separate overlay for the
  // Parlays/TD/Spread tabs only (no Prop Breakdown/Favorite O/U of its
  // own) — never shown as a selectable "batch" in the per-batch dropdown.
  delete PROPS_BATCHES[WHOLE_WEEK_FILENAME];
  await loadWholeWeekReport(wk);

  const filenames = Object.keys(PROPS_BATCHES);
  if(!filenames.length){
    propsBatchFilter = null;
    REPORT = null;
    $('pcBatchBar').style.display = 'none';
    return;
  }

  propsBatchFilter = filenames.slice()
    .sort((a, b) => new Date(PROPS_BATCHES[b].generated_at) - new Date(PROPS_BATCHES[a].generated_at))[0];

  if(filenames.length > 1){
    const batchLabel = fn => {
      const b = PROPS_BATCHES[fn];
      const games = (b.games || []).map(g => g.replace('_', '@'));
      return games.length ? `${games.length} games: ${games.join(', ')}` : fn;
    };
    $('pcBatch').innerHTML = filenames
      .map(fn => `<option value="${esc(fn)}"${fn===propsBatchFilter?' selected':''}>${esc(batchLabel(fn))}</option>`).join('');
    $('pcBatchBar').style.display = '';
    $('pcBatch').onchange = async (e) => {
      propsBatchFilter = e.target.value;
      fiStatus('Loading','loading');
      await loadReportForBatch(wk, propsBatchFilter);
      fiStatus('Ready');
      render();
    };
  } else {
    $('pcBatchBar').style.display = 'none';
  }

  await loadReportForBatch(wk, propsBatchFilter);
}

async function loadReportForBatch(wk, filename){
  REPORT = null;
  REPORT_GRADED = null;
  try{
    const res = await fetch(`props_reports/${wk}/${filename}`, { cache: 'no-store' });
    if(res.ok) REPORT = await res.json();
  }catch(e){ /* Coeus Prop Breakdown / Favorite O/U / Parlays just won't have data for this batch */ }
  // REAL ADDITION (2026-09-28): grade_props_report.py writes a sibling
  // "*_graded.json" once this batch's real games are final — a 404
  // here just means that hasn't happened yet, not an error.
  try{
    const gradedName = filename.replace(/\.json$/, '_graded.json');
    const res = await fetch(`props_reports/${wk}/${gradedName}`, { cache: 'no-store' });
    if(res.ok) REPORT_GRADED = await res.json();
  }catch(e){ /* not graded yet */ }
}

/* ── decimal -> American only, per Frank's real preference — decimal is
   the internal format everything is stored/computed in (parlay math
   needs it), but nobody actually wants to read it on the page. ── */
function priceLine(dec){
  if(dec == null) return '—';
  return dec >= 2 ? `+${Math.round((dec-1)*100)}` : `${Math.round(-100/(dec-1))}`;
}

function gameTitle(g){
  const t = g.commence_time ? new Date(g.commence_time).toLocaleString([], {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';

    <span class="pc-game-teams">${esc(g.away_team)} @ ${esc(g.home_team)}</span>
    <span class="pc-game-time">${esc(t)}</span>
  </div>`;
}

/* ── GAME LINES / TOTALS / ML — real, live data, no LLM involved.

function renderGameLines(){

let lastFocus = null;

/* ── PROP BUILDER — slip state, storage, and the clickable "+ Add"
   buttons wired into Game Lines and Player Props below. A leg here is
   always real: canonical_event_id/market_key/player/price straight off
   the real FanDuel data already on the page, never invented. ── */
function legId(leg){
  return [leg.canonical_event_id, leg.market_key, leg.player, leg.side || '',
    leg.point ?? leg.line ?? ''].join('|');
}
function isLegInSlip(leg){
  const id = legId(leg);
  return SLIP.some(l => legId(l) === id);
}
function slipStorageKey(wk){
  return `footballIntel.propBuilder.${wk}`;
}
function loadSlip(wk){
  SLIP = [];
  SLIP_STAKE = 10;
  try{
    const raw = localStorage.getItem(slipStorageKey(wk));
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed.legs)) SLIP = parsed.legs;
      if(typeof parsed.stake === 'number' && parsed.stake > 0) SLIP_STAKE = parsed.stake;
    }
  }catch(e){ /* corrupt or blocked storage — start with an empty slip, never crash over this */ }
  updateSlipNavBadge();
}
function saveSlip(wk){
  try{
    localStorage.setItem(slipStorageKey(wk), JSON.stringify({ legs: SLIP, stake: SLIP_STAKE }));
  }catch(e){ /* private window / storage blocked / quota — slip just won't persist this session */ }
}
function toggleSlipLeg(leg){
  const id = legId(leg);
  const idx = SLIP.findIndex(l => legId(l) === id);
  if(idx >= 0) SLIP.splice(idx, 1);
  else SLIP.push(leg);
  saveSlip(propsWeekFilter);
  updateSlipNavBadge();
}
function updateSlipNavBadge(){
  const el = $('pcSlipBadge');
  if(el) el.textContent = SLIP.length ? ` (${SLIP.length})` : '';
}
function slipToggleBtn(leg){
  if(leg.price === null || leg.price === undefined) return '';
  const added = isLegInSlip(leg);
  // REAL BUG FIX (2026-10-02), per Frank's direct catch: esc() (js/fi-
  // shell.js) only escapes & < > for safe HTML CONTENT — it was never
  // built to escape a value going inside a quoted HTML ATTRIBUTE, so a
  // literal " from JSON.stringify(leg) (every leg has one immediately,
  // e.g. {"canonical_event_id":...) truncated the data-leg attribute at
  // the very first character every time, silently corrupting it. Every
  // click's JSON.parse then failed and the catch block quietly did
  // nothing — exactly the "doesn't add, doesn't stay selected" Frank
  // saw. encodeURIComponent's output never contains a raw " at all, so
  // it's always safe inside a double-quoted attribute.
  return `<button class="pc-slip-btn${added ? ' added' : ''}" data-leg="${encodeURIComponent(JSON.stringify(leg))}">${added ? '✓ Added' : '+ Add'}</button>`;
}
function wireSlipButtons(root, refreshFn){
  if(!root) return;
  root.querySelectorAll('.pc-slip-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      let leg;
      try { leg = JSON.parse(decodeURIComponent(btn.dataset.leg)); } catch(err){ return; }
      toggleSlipLeg(leg);
      refreshFn();
    });
  });
}
function combinedDecimalOdds(legs){
  return legs.reduce((acc, l) => acc * (l.price || 1), 1);
}

function statBlockForGame(g, statKey, label){
  const byPlayer = (g.player_props && g.player_props[statKey]) || {};
  const names = Object.keys(byPlayer);
  if(!names.length) return '';
  const marketKey = `player_${statKey}`;
  const rows = names.map(name => {
    const p = byPlayer[name];
    let lineHTML = '<span class="pc-empty-inline">No plain line posted</span>';
    if(p.line){
      const overLeg = {canonical_event_id: g.canonical_event_id, market_key: marketKey, player: name, price: p.line.over_price, side: 'over', line: p.line.point};
      const underLeg = {canonical_event_id: g.canonical_event_id, market_key: marketKey, player: name, price: p.line.under_price, side: 'under', line: p.line.point};
      lineHTML = `${p.line.point} — O ${priceLine(p.line.over_price)} ${slipToggleBtn(overLeg)}
        / U ${priceLine(p.line.under_price)} ${slipToggleBtn(underLeg)}`;
    }
    const altsHTML = p.alts && p.alts.length
      ? `<div class="pc-alts-grid">${p.alts.map(a => {
          const side = a.over_price != null ? 'over' : 'under';
          const altKey = `player_${statKey}_milestones_${a.threshold}_or_more`;
          const leg = {canonical_event_id: g.canonical_event_id, market_key: altKey, player: name,
            price: a.over_price != null ? a.over_price : a.under_price, side};
          return `<span class="pc-alt-chip">${a.threshold}+ : ${priceLine(leg.price)} ${slipToggleBtn(leg)}</span>`;
        }).join('')}</div>`
      : '';
    return `<tr><td class="pc-player-name">${esc(name)}</td><td>${lineHTML}</td></tr>
      ${altsHTML ? `<tr><td colspan="2">${altsHTML}</td></tr>` : ''}`;
  }).join('');
  return `<div class="pc-modal-stat-sect"><h4>${esc(label)}</h4>
    <table class="pc-props-table"><tbody>${rows}</tbody></table></div>`;
}

// REAL ADDITION (2026-10-02): the Game Lines section of the per-game
// modal — real Moneyline/Spread/Total prices, each clickable into the
// Prop Builder slip, same real data already summarized on the Game
// Lines card itself (just the full real board, not just the favorite
// spread/total shown there).
function gameLinesSectionHTML(g){
  const h2h = g.game_lines.h2h || [];
  const spreads = g.game_lines.spreads || [];
  const totals = g.game_lines.totals || [];
  if(!h2h.length && !spreads.length && !totals.length) return '';
  const chips = [];
  for(const o of h2h){
    const leg = {canonical_event_id: g.canonical_event_id, market_key: 'h2h', player: o.name, price: o.price, side: null};
    chips.push(`<div class="pc-td-chip"><span>${esc(o.name)} ML</span><span class="pc-line-px">${priceLine(o.price)} ${slipToggleBtn(leg)}</span></div>`);
  }
  for(const o of spreads){
    const leg = {canonical_event_id: g.canonical_event_id, market_key: 'spreads', player: o.name, price: o.price, side: null, point: o.point};
    const pt = o.point > 0 ? `+${o.point}` : `${o.point}`;
    chips.push(`<div class="pc-td-chip"><span>${esc(o.name)} ${pt}</span><span class="pc-line-px">${priceLine(o.price)} ${slipToggleBtn(leg)}</span></div>`);
  }
  for(const o of totals){
    const side = (o.name || '').toLowerCase() === 'over' ? 'over' : 'under';
    const leg = {canonical_event_id: g.canonical_event_id, market_key: 'totals', player: 'Game Total', price: o.price, side, line: o.point};
    chips.push(`<div class="pc-td-chip"><span>${esc(o.name)} ${o.point}</span><span class="pc-line-px">${priceLine(o.price)} ${slipToggleBtn(leg)}</span></div>`);
  }
  return `<div class="pc-modal-stat-sect"><h4>Game Lines</h4><div class="pc-td-grid">${chips.join('')}</div></div>`;
}

function openGameProps(eid, source){
  const g = FDPROPS.games.find(x => x.canonical_event_id === eid);
  if(!g) return;
  lastFocus = source;
  $('mTitle').innerHTML = `${fiLogoHTML(g.away_code, 34)} ${g.away_code} <em>at</em> ${g.home_code} ${fiLogoHTML(g.home_code, 34)}`;
  const t = g.commence_time ? new Date(g.commence_time).toLocaleString([], {weekday:'long', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
  $('mSub').textContent = t;

  let h = '';
  h += gameLinesSectionHTML(g);
  h += statBlockForGame(g, 'passing_yards', 'Passing Yards');
  h += statBlockForGame(g, 'rushing_yards', 'Rushing Yards');
  h += statBlockForGame(g, 'receiving_yards', 'Receiving Yards');
  h += statBlockForGame(g, 'receptions', 'Receptions');
  if(g.anytime_td && g.anytime_td.length){
    const chips = g.anytime_td.slice().sort((a,b) => a.price - b.price)
      .map(p => {
        const leg = {canonical_event_id: g.canonical_event_id, market_key: 'player_anytime_td', player: p.player, price: p.price, side: null};
        return `<div class="pc-td-chip"><span>${esc(p.player)}</span><span class="pc-line-px">${priceLine(p.price)} ${slipToggleBtn(leg)}</span></div>`;
      }).join('');
    h += `<div class="pc-modal-stat-sect"><h4>Anytime TD</h4><div class="pc-td-grid">${chips}</div></div>`;
  }
  if(!h) h = `<div class="empty">No real player props posted for this game yet.</div>`;

  $('mBody').innerHTML = h;
  $('scrim').classList.add('open'); $('modal').classList.add('open');
  wireSlipButtons($('mBody'), () => openGameProps(eid, source));
  $('mClose').focus();
}
function closeModal(){
  $('scrim').classList.remove('open'); $('modal').classList.remove('open');
  if(lastFocus) lastFocus.focus();
}

/* ── COEUS PROP BREAKDOWN / FAVORITE O/U ─────────────────────────────── */
function marketKeyLabel(key){
  if(key === 'h2h') return 'Moneyline';
  if(key === 'totals') return 'Game Total';
  if(key === 'spreads') return 'Spread';
  const altMatch = key.match(/^player_(.+)_milestones_(\d+)_or_more$/);
  if(altMatch){
    const statKey = altMatch[1];
    return `${STAT_LABELS[statKey] || statKey} ${altMatch[2]}+`;
  }
  const statKey = key.replace(/^player_/, '');
  return STAT_LABELS[statKey] || statKey.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function gameForEventId(eid){
  return (FDPROPS && FDPROPS.games || []).find(g => g.canonical_event_id === eid);

// must show the real posted line alongside Over/Under, and Anytime TD
// — which has no line or Over/Under side at all, just a single real
// "Yes" price — must not show a fabricated Over/Under badge. Shared by
// every card type below (Prop Breakdown, Favorite O/U, and every
// parlay leg) so this rule is consistent everywhere, not just one
// section.
function isAnytimeTdMarket(marketKey){
  return String(marketKey || '').includes('anytime_td');
}
// REAL ADDITION (2026-09-28): a spread leg has no Over/Under side at
// all — just a real team name (in the shared "player" field, same as
// every other leg shape) and a real posted point (e.g. -3.5), so it
// needs its own label rather than being squeezed into the Over/Under
// side badge above.
function isSpreadMarket(marketKey){
  return marketKey === 'spreads';
}
function sideLineLabel(pick){
  if (isAnytimeTdMarket(pick.market_key)) return ''; // no Over/Under, no line — real single "Yes" price only
  if (isSpreadMarket(pick.market_key)){
    if (pick.point === undefined || pick.point === null) return '';
    const pt = pick.point > 0 ? `+${pick.point}` : `${pick.point}`;
    return `<span class="pc-pick-side spread">${pt}</span>`;
  }
  if (pick.side !== 'over' && pick.side !== 'under') return '';
  const sideText = pick.side === 'over' ? 'Over' : 'Under';
  const lineText = (pick.line !== undefined && pick.line !== null) ? ` ${pick.line}` : '';
  return `<span class="pc-pick-side ${pick.side}">${sideText}${lineText}</span>`;
}

function renderMarkdown(md){
  const stripped = md.replace(/```json[\s\S]*?```/g, '');
  const lines = stripped.split('\n');
  let html = '', inList = false;
  const closeList = () => { if(inList){ html += '</ul>'; inList = false; } };
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ closeList(); continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if(h){
      closeList();
      const level = h[1].length;
      html += `<h${level}>${inlineMd(h[2])}</h${level}>`;
      continue;
    }
    const li = line.match(/^[-*]\s+(.*)/);
    if(li){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(li[1])}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inlineMd(line)}</p>`;
  }
  closeList();
  return html;
}
function inlineMd(s){
  const escaped = esc(s);
  return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

/* ── PARLAY SCRAMBLER (2026-10-02), per Frank's direct request: pools
   every real pick Coeus has already made across Coeus Favorite O/U,
   Coeus Anytime TD, Coeus Spreads, and Coeus Parlays (same sources
   each of those tabs already shows — whole-week file preferred for
   the three parlay tabs, exactly like those tabs do; Favorite O/U is
   always batch-scoped since it has no whole-week version), dedupes
   by the same legId() the Prop Builder slip uses, and draws a random
   N of them. This never grades or re-validates anything of its own —
   only legs from combinations that already passed validation are
   pooled, and the Scrambler only randomizes which subset is shown
   together. Each drawn leg can also be sent into Frank's own Prop
   Builder slip with the same "+ Add" button used everywhere else. ── */
let SCRAMBLE_SIZE = 5;
let SCRAMBLE_RESULT = null;

function scramblerPool(){
  const pool = [];
  const seen = new Set();
  const now = new Date();
  const addLeg = (leg) => {
    if(!leg || leg.price === null || leg.price === undefined) return;
    // REAL FIX (2026-10-02), per Frank's direct catch: a game that has
    // already kicked off (PIT @ CLE, Thursday night) was still turning
    // up in scrambled draws Friday evening — the pool never checked
    // commence_time against the real clock. Anything whose game has
    // already started (or has no commence_time to check at all) is
    // excluded, same real timestamp the game cards elsewhere use.
    const game = gameForEventId(leg.canonical_event_id);
    if(!game || !game.commence_time) return;
    if(new Date(game.commence_time) <= now) return;
    const id = legId(leg);
    if(seen.has(id)) return;
    seen.add(id);
    pool.push(leg);
  };

  if(REPORT && REPORT.favorite_ou){
    (REPORT.favorite_ou.overs || []).forEach(addLeg);
    (REPORT.favorite_ou.unders || []).forEach(addLeg);
  }

  const sizes = ['2','3','4','5','6','7'];
  const addFromParlaySrc = (src, key) => {
    if(!src || !src[key]) return;
    sizes.forEach(s => {
      const p = src[key][s];
      if(p && p.valid && Array.isArray(p.legs)) p.legs.forEach(addLeg);
    });
  };
  const tdSrc = (WHOLE_WEEK_REPORT && WHOLE_WEEK_REPORT.td_parlays) ? WHOLE_WEEK_REPORT
              : (REPORT && REPORT.td_parlays) ? REPORT : null;
  const spreadSrc = (WHOLE_WEEK_REPORT && WHOLE_WEEK_REPORT.spread_parlays) ? WHOLE_WEEK_REPORT
              : (REPORT && REPORT.spread_parlays) ? REPORT : null;
  const parlaySrc = (WHOLE_WEEK_REPORT && WHOLE_WEEK_REPORT.parlays) ? WHOLE_WEEK_REPORT
              : (REPORT && REPORT.parlays) ? REPORT : null;
  addFromParlaySrc(tdSrc, 'td_parlays');
  addFromParlaySrc(spreadSrc, 'spread_parlays');
  addFromParlaySrc(parlaySrc, 'parlays');

  return pool;
}

function shuffledSample(arr, n){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}

      renderScrambler();
    });
  });
  if(canGenerate){
    $('pcScrambleGo').addEventListener('click', () => {
      SCRAMBLE_RESULT = shuffledSample(scramblerPool(), SCRAMBLE_SIZE);
      renderScrambler();
    });
  }
  wireSlipButtons($('body'), renderScrambler);
}

// REAL ADDITION (2026-09-28), per Frank's direct request: a Results
// tab showing the real season-to-date W/L/P record (results/
// season_record.json, written by grade_props_report.py) plus every
// one of the currently-selected week's picks with a real ✓/✗/Push
// badge — reuses pickCardHTML/parlayCard as-is (see gradeBadgeHTML)
// rather than a second, separate rendering path.
function seasonStatTile(label, t, showUnits, legs){
  if(!t) return '';
  const decided = t.w + t.l;
  const pct = decided ? Math.round(t.w / decided * 100) : null;
  // Units are flat 1-unit stakes at each pick's own real price (a whole
  // parlay's units use its real combined price). Hidden for Overall, which
  // counts every parlay leg alongside the single picks, so a units total
  // there would double-count. Hidden too when an older record has none.
  const hasUnits = showUnits && typeof t.units === 'number' && decided > 0;
  const unitsCls = hasUnits ? (t.units > 0 ? 'pc-units-pos' : t.units < 0 ? 'pc-units-neg' : '') : '';
  return `<div class="pc-stat-tile">
    <div class="pc-stat-label">${esc(label)}</div>
    <div class="pc-stat-val">${t.w}-${t.l}${t.p ? '-' + t.p : ''}</div>
    ${pct !== null ? `<div class="pc-stat-pct">${pct}% hit rate</div>` : ''}
    ${legs && (legs.w + legs.l) ? `<div class="pc-stat-pct">legs: ${legs.w}-${legs.l}${legs.p ? '-' + legs.p : ''} (${Math.round(legs.w / (legs.w + legs.l) * 100)}%)</div>` : ''}
    ${hasUnits ? `<div class="pc-stat-pct ${unitsCls}">${t.units > 0 ? '+' : ''}${t.units.toFixed(2)}u</div>` : ''}
    ${t.ungraded ? `<div class="pc-stat-ungraded">${t.ungraded} ungraded</div>` : ''}
  </div>`;
}

function renderResults(){
  if(!SEASON_RECORD){
    $('body').innerHTML = `<div class="empty">No graded results yet.<br>
      Once a week's real games are final, run <b>python3 grade_props_report.py &lt;week&gt;</b>
      in your lab folder, then reload.</div>`;
    return;
  }
  const season = SEASON_RECORD.season_totals || {};
  const sectionLabels = {
    overall: 'Overall (unique picks)', best_10: 'Best 10', prop_breakdown: 'Prop Breakdown',
    favorite_ou: 'Favorite O/U', parlays: 'Parlays (whole)', td_parlays: 'Anytime TD Parlays (whole)',
    spread_parlays: 'Spread Parlays (whole)',
  };
  let h = `<div class="lineup-note" style="margin-bottom:14px">
    Season-to-date record of Coeus's real, graded picks. <b>Overall</b> counts each separate pick
    once, however many places it appears. Units are flat 1-unit stakes at each pick's real price
    (a parlay uses its real combined price); at typical -113 odds break-even is about 53%.
    Parlay tiles show whole parlays (every leg must hit) with the hit rate of the distinct
    <b>legs</b> inside them underneath.
  </div>`;
  h += `<div class="pc-stat-row">${Object.keys(sectionLabels)
    .map(k => seasonStatTile(sectionLabels[k], season[k], true, season[k + '_legs'])).join('')}</div>`;

  if(!REPORT_GRADED){
    h += `<div class="empty" style="margin-top:18px">This week's report hasn't been graded yet.<br>
      Once this week's real games are final, run <b>python3 grade_props_report.py</b>
      with this week's number, then reload.</div>`;
    $('body').innerHTML = h;
    return;
  }

  h += `<div class="subsect" style="margin-top:18px">This Week's Graded Picks</div>`;

  const pb = REPORT_GRADED.prop_breakdown;
  if(pb){
    for(const game of (pb.per_game || [])){
      h += `<div class="pc-game-card">
        <div class="pc-game-head"><span class="pc-game-teams">${esc(game.away)} @ ${esc(game.home)}</span></div>
        <div class="pc-pick-grid">${(game.picks || []).map(p => pickCardHTML(p)).join('')}</div>
      </div>`;
    }
    const posPicks = ['QB', 'RB', 'WR', 'TE']
      .map(pos => (pb.per_position || {})[pos] ? pickCardHTML(pb.per_position[pos], pos) : '')
      .join('');
    if(posPicks){
      h += `<div class="subsect" style="margin-top:8px">League-Wide Position Favorites</div>
        <div class="pc-pick-grid">${posPicks}</div>`;
    }
  }

  const b10 = REPORT_GRADED.best_10;
  if(b10 && (b10.picks || []).length){
    h += `<div class="subsect" style="margin-top:14px">Best 10</div>
      <div class="pc-pick-grid">${b10.picks.slice().sort((a,b) => (a.rank||99)-(b.rank||99))
        .map((p,i) => pickCardHTML(p, '#' + (p.rank || i + 1))).join('')}</div>`;
  }

  const fou = REPORT_GRADED.favorite_ou;
  if(fou){
    h += `<div class="subsect" style="margin-top:14px">Favorite Overs</div>
      <div class="pc-pick-grid">${(fou.overs || []).map(p => pickCardHTML(p)).join('') ||
        '<div class="empty">None</div>'}</div>`;
    h += `<div class="subsect" style="margin-top:8px">Favorite Unders</div>
      <div class="pc-pick-grid">${(fou.unders || []).map(p => pickCardHTML(p)).join('') ||
        '<div class="empty">None</div>'}</div>`;
  }

  const sizes = ['2', '3', '4', '5', '6', '7'];
  const parlaySection = (title, block) => {
    if(!block) return '';
    const cards = sizes.map(s => block[s] ? parlayCard(s, block[s]) : '').join('');
    return `<div class="subsect" style="margin-top:14px">${esc(title)}</div>
      <div class="parlay-grid">${cards}</div>`;
  };
  h += parlaySection('Parlays', REPORT_GRADED.parlays);
  h += parlaySection('Anytime TD Parlays', REPORT_GRADED.td_parlays);
  h += parlaySection('Spread Parlays', REPORT_GRADED.spread_parlays);

  $('body').innerHTML = h;
}

// REAL ADDITION (2026-10-02), per Frank's direct request: a real
// user-built parlay slip, assembled by clicking "+ Add" next to any
// real line in Game Lines/Totals/ML or Player Props. This is Frank's
// own slip, not Coeus's — never independently re-checked against real
// data the way Coeus's own Parlays/TD Parlays/Spread Parlays are
// (those stay exactly as they were); it's exactly what he clicked, at
// the real price shown at the time.
function slipLegRowHTML(leg){
  const game = gameForEventId(leg.canonical_event_id);
  const gameLabel = game ? `${game.away_code} @ ${game.home_code}` : '';
  const sideLabel = sideLineLabel(leg);
  return `<div class="parlay-leg">
    <div><div class="who">${esc(leg.player)}</div>
      <div class="mkt">${esc(marketKeyLabel(leg.market_key))}${gameLabel ? ' · ' + esc(gameLabel) : ''}</div>
      ${sideLabel}
    </div>
    <div class="px">${priceLine(leg.price)}
      <button class="pc-slip-remove" data-legid="${encodeURIComponent(legId(leg))}" title="Remove from slip">✕</button>
    </div>
  </div>`;
}

function renderPropBuilder(){
  if(!SLIP.length){
    $('body').innerHTML = `<div class="empty">Your slip is empty.<br>
      Click <b>+ Add</b> next to any real line in <b>Game Lines / Totals / ML</b> or
      <b>Player Props</b> to build your own parlay here.</div>`;
    return;
  }
  const rows = SLIP.map(leg => slipLegRowHTML(leg)).join('');
  const combined = combinedDecimalOdds(SLIP);
  const payout = SLIP_STAKE * combined;

  $('body').innerHTML = `
    <div class="lineup-note" style="margin-bottom:14px">
      ${SLIP.length} leg(s) in your own slip — these are your picks, not Coeus's, and are never
      independently re-checked against real data the way the Parlays tab's picks are. Exactly what
      you clicked, at the real FanDuel price shown at the time.
    </div>
    <div class="parlay-card" style="max-width:520px">
      <div class="parlay-head">
        <span class="parlay-size">Your Slip</span>
        <span class="parlay-badge pass">${SLIP.length} LEG${SLIP.length === 1 ? '' : 'S'}</span>
      </div>
      <div class="parlay-legs">${rows}</div>
      <div class="parlay-foot">
        <span>Combined: <b>${combined.toFixed(2)}</b> (${priceLine(combined)})</span>
        <span>Stake $<input type="number" id="pcStakeInput" class="pc-stake-input" value="${SLIP_STAKE}" min="1" step="1">
          → <b>$${payout.toFixed(2)}</b></span>
      </div>
    </div>
    <button class="toggle-report pc-clear-slip" id="pcClearSlip">Clear slip</button>
  `;

  $('body').querySelectorAll('.pc-slip-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      SLIP = SLIP.filter(l => legId(l) !== decodeURIComponent(btn.dataset.legid));
      saveSlip(propsWeekFilter);
      updateSlipNavBadge();
      renderPropBuilder();
    });
  });
  $('pcStakeInput').addEventListener('change', (e) => {
    const v = parseFloat(e.target.value);
    SLIP_STAKE = (isFinite(v) && v > 0) ? v : 10;
    saveSlip(propsWeekFilter);
    renderPropBuilder();
  });
  $('pcClearSlip').addEventListener('click', () => {
    SLIP = [];
    saveSlip(propsWeekFilter);
    updateSlipNavBadge();
    renderPropBuilder();
  });
}

// 2026-10-07: Anytime TD and Spreads are retired as separate products. Their
// tabs only show for a week that actually has that data (e.g. Week 4's old
// reports); new weeks hide them. TD and spread plays live in the Best 10 now.
function syncLegacyTabs(){
  const has = key => [REPORT, WHOLE_WEEK_REPORT].some(r => r && r[key] && Object.keys(r[key]).length);
  const show = { anytimetd: has('td_parlays'), spreads: has('spread_parlays') };
  Object.keys(show).forEach(k => {
    const b = $('pcTopNav').querySelector(`button[data-s="${k}"]`);
    if(b) b.style.display = show[k] ? '' : 'none';
  });
  if(activeSection in show && !show[activeSection]){
    activeSection = 'lines';
    $('pcTopNav').querySelectorAll('button').forEach(x =>
      x.setAttribute('aria-selected', String(x.dataset.s === 'lines')));
  }
}

function render(){
  syncLegacyTabs();
  if(activeSection === 'lines') return renderGameLines();
  if(activeSection === 'props') return renderPlayerProps();
  if(activeSection === 'builder') return renderPropBuilder();
  if(activeSection === 'breakdown') return renderPropBreakdown();
  if(activeSection === 'overunder') return renderFavoriteOU();
  if(activeSection === 'anytimetd') return renderAnytimeTD();
  if(activeSection === 'spreads') return renderSpreads();
  if(activeSection === 'parlays') return renderParlays();
  if(activeSection === 'scrambler') return renderScrambler();
  if(activeSection === 'results') return renderResults();
}

load();
</script>
