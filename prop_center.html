<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prop Center — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
#pcWeek,#pcBatch{max-width:100%;text-overflow:ellipsis}
@media (max-width:768px){#pcBatchBar,#pcWeekBar{flex-wrap:wrap}#pcBatch{max-width:calc(100vw - 48px)}}
.parlay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:14px;margin-bottom:22px}
.parlay-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.parlay-card.invalid{border-color:rgba(244,63,94,.4)}
.parlay-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);
  background:var(--surface2)}
.parlay-size{font-family:var(--font-display);font-weight:800;font-size:15px}
.parlay-badge{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-sm)}
.parlay-badge.pass{color:var(--accent-green);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3)}
.parlay-badge.fail{color:var(--accent-red);background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.3)}
.parlay-legs{padding:10px 14px}
.parlay-leg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hairline);
  font-size:15px}
.parlay-leg:last-child{border-bottom:0}
.parlay-leg .who{color:var(--text);font-weight:600}
.parlay-leg .mkt{color:var(--text-dim);font-size:13px}
.parlay-leg .px{font-family:var(--font-mono);color:var(--text-mid);white-space:nowrap}
.parlay-foot{padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2);
  font-family:var(--font-mono);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.parlay-foot b{color:var(--text);font-weight:600}
.parlay-note{font-size:10.5px;color:var(--accent-gold);padding:8px 14px 0;line-height:1.5}
.parlay-error{font-size:11.5px;color:var(--accent-red);padding:8px 14px;line-height:1.5}
.report-body{font-size:13.5px;line-height:1.7;color:var(--text-mid)}
.report-body h1,.report-body h2,.report-body h3{color:var(--text);font-family:var(--font-display);margin:20px 0 8px}
.report-body h1{font-size:20px}.report-body h2{font-size:17px}.report-body h3{font-size:14.5px}
.report-body ul{margin:6px 0 14px 20px}
.report-body li{margin:4px 0}
.report-body strong{color:var(--text);font-weight:700}
.toggle-report{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);cursor:pointer;
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-block;margin-bottom:14px}
.toggle-report:hover{color:var(--primary);border-color:var(--primary)}

/* ── Player Props (real, live FanDuel data — no LLM) ─────────────────── */
.pc-empty-inline{font-size:11px;color:var(--text-dim);font-style:italic}
.pc-line-px{font-family:var(--font-mono);color:var(--text-mid)}
.pc-stat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pc-stat-tab{font-family:var(--font-mono);font-size:11px;padding:7px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);color:var(--text-dim);cursor:pointer;background:var(--surface)}
.pc-stat-tab[aria-selected="true"]{color:var(--primary);border-color:var(--primary);background:rgba(99,102,241,.08)}
.pc-props-table{width:100%;border-collapse:collapse;font-size:12.5px}
.pc-props-table th{text-align:left;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border)}
.pc-props-table td{padding:7px 10px;border-bottom:1px solid var(--hairline)}
.pc-props-table tr:last-child td{border-bottom:0}
.pc-player-name{color:var(--text);font-weight:600}
.pc-alts-toggle{font-family:var(--font-mono);font-size:10.5px;color:var(--primary);cursor:pointer;
  background:none;border:0;padding:0}
.pc-alts-row{display:none}
.pc-alts-row.open{display:table-row}
.pc-alts-grid{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
.pc-alt-chip{font-family:var(--font-mono);font-size:10.5px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 8px;color:var(--text-mid)}
.pc-td-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:8px}
.pc-td-chip{display:flex;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 10px;font-size:12px}

.pc-topnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0}
.pc-topnav button{font-family:var(--font-mono);font-size:12px;font-weight:600;padding:10px 16px;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);cursor:pointer}
.pc-topnav button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}

/* ── Prop Builder (2026-10-02), per Frank's direct request: every real
   line in Game Lines/Totals/ML and Player Props is clickable, adding it
   to a real, user-built slip (not Coeus's picks) saved per-week in the
   browser. ── */
.pc-nav-badge{font-family:var(--font-mono);font-size:10px;color:var(--primary);margin-left:3px}
.pc-slip-btn{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text-dim);cursor:pointer;margin-left:6px;white-space:nowrap}
.pc-slip-btn:hover{border-color:var(--primary);color:var(--primary)}
.pc-slip-btn.added{border-color:var(--accent-green);color:var(--accent-green);background:rgba(74,222,128,.08)}
.pc-pick-add{margin-top:8px}
.pc-slip-remove{font-family:var(--font-mono);font-size:11px;background:none;border:1px solid var(--border);
  border-radius:4px;color:var(--text-dim);cursor:pointer;padding:2px 7px;margin-left:8px}
.pc-slip-remove:hover{border-color:var(--accent-red);color:var(--accent-red)}
.pc-stake-input{width:60px;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:4px;padding:3px 6px;font-family:var(--font-mono)}
.pc-clear-slip{margin-top:14px;color:var(--accent-red);border-color:rgba(244,63,94,.3)}

/* ── Parlay Scrambler (2026-10-02), per Frank's direct request: pools
   every real pick Coeus already made across Favorite O/U, Anytime TD,
   Spreads, and Parlays (only legs from combinations that passed
   validation), dedupes them, and draws a random N on demand. This
   never generates a new pick of its own — it only reshuffles picks
   that already exist elsewhere on this page. ── */
.pc-scramble-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pc-scramble-sizes{display:flex;gap:6px;flex-wrap:wrap}
.pc-scramble-sizes button{font-family:var(--font-mono);font-size:13px;font-weight:700;
  width:36px;height:36px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text-dim);cursor:pointer}
.pc-scramble-sizes button:hover{border-color:var(--primary);color:var(--primary)}
.pc-scramble-sizes button.active{border-color:var(--primary);color:var(--primary);
  background:rgba(96,165,250,.1)}
.pc-scramble-go{background:#000;color:#4ade80;border-color:#000;font-weight:700}
.pc-scramble-go:hover{background:#111;color:#4ade80;border-color:#111}
.pc-scramble-go:disabled{opacity:.4;cursor:not-allowed}
.pc-scramble-go:disabled:hover{background:#000;color:#4ade80;border-color:#000}
.pc-scramble-pool-note{font-family:var(--font-mono);font-size:11px;color:var(--text-mid)}

/* ── Game Lines cards — same shape/size as the Games page, real .gcard
   classes reused directly (defined in the shared css/fi-styles.css) so
   this looks and feels identical, not just visually similar. ── */
/* ── Real .gcard family — copied directly from games.html's own <style>
   block, confirmed NOT to live in the shared css/fi-styles.css (my
   earlier mistake was assuming it did, which is why the cards rendered
   as bare, unstyled text instead of real bordered cards). Only the
   pieces this page actually uses — no .tform/.tscore/.links, since
   props cards don't show records, live scores, or action buttons. ── */
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 22px 20px;display:block;text-decoration:none;color:inherit;
  transition:border-color .18s,transform .15s;cursor:pointer}
.gcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.gcard:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.gcard-top{display:flex;align-items:flex-start;gap:14px}
.teams-col{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:11px;padding:6px 0}
.tabbr{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.02em;min-width:60px}
.trec{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim)}
.kick{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text-mid);
  white-space:nowrap;line-height:1.7}
.odds{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--hairline)}
.odd{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;padding:5px 10px;
  border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text-mid)}
.odd b{color:var(--text);font-weight:600}

#pcSlate{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:16px}
.pc-modal-stat-sect{margin:18px 0 8px}
.pc-modal-stat-sect h4{font-family:var(--font-display);font-size:13px;color:var(--text);margin-bottom:8px}

/* ── Coeus Prop Breakdown / Favorite O/U pick cards ──────────────────── */
.pc-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px;margin-bottom:8px}
.pc-pick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px}
.pc-pick-badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--primary);margin-bottom:4px;display:block}
.pc-pick-player{font-family:var(--font-display);font-weight:700;font-size:13.5px;color:var(--text)}
.pc-pick-market{font-size:11.5px;color:var(--text-dim);margin:3px 0}
.pc-pick-price{font-family:var(--font-mono);font-size:13px;color:var(--text-mid)}
.pc-pick-price-row{display:flex;align-items:center;gap:8px}
.pc-pick-side{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;padding:3px 7px;border-radius:4px}
.pc-pick-side.over{background:rgba(74,222,128,.14);color:#4ade80}
.pc-pick-side.under{background:rgba(248,113,113,.14);color:#f87171}
.pc-pick-side.spread{background:rgba(96,165,250,.14);color:#60a5fa}
.grade-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 7px;
  border-radius:5px;display:inline-block;letter-spacing:.04em}
.grade-badge.win{background:rgba(74,222,128,.16);color:#4ade80}
.grade-badge.loss{background:rgba(248,113,113,.16);color:#f87171}
.grade-badge.push{background:rgba(250,204,21,.16);color:#facc15}
.grade-badge.pending{background:var(--surface2);color:var(--text-mid)}
.pc-stat-row{display:flex;flex-wrap:wrap;gap:10px}
.pc-stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:12px 16px;min-width:120px}
.pc-stat-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-mid);margin-bottom:4px}
.pc-stat-val{font-size:20px;font-weight:700}
.pc-stat-pct{font-size:12px;color:var(--text-mid)}
.pc-pick-proj{font-size:12.5px;font-weight:600;color:var(--primary);margin-top:6px}
.pc-units-pos{color:#2e9e5b;font-weight:600}
.pc-units-neg{color:#d64545;font-weight:600}
.pc-stat-ungraded{font-size:10.5px;color:var(--text-mid);margin-top:2px}
.pc-pick-reason{font-size:14px;color:var(--text-dim);margin-top:6px;line-height:1.5}
.pc-pick-reason.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc-pick-card.open .pc-pick-reason.clamp{display:block;-webkit-line-clamp:unset;overflow:visible}
.pc-readmore{font-family:var(--font-mono);font-size:10px;color:var(--primary);cursor:pointer;margin-top:4px;display:inline-block}
.pc-pick-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.pc-pick-top .pc-pick-badge{margin:0}
.pc-pick-kick{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--text-mid);
  border:1px solid var(--border);border-radius:5px;padding:1px 6px;white-space:nowrap}
.pc-pick-card.has-bd,.parlay-leg.has-bd{cursor:pointer}
.pc-pick-card.has-bd:hover{border-color:var(--border2,var(--primary))}
.parlay-leg.has-bd:hover{background:rgba(127,127,127,.07)}
.pc-pick-foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);text-align:center;font-family:var(--font-mono);
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-blue)}
.pc-pick-card.has-bd:hover .pc-pick-foot{color:var(--text)}
.pc-addall{margin-left:auto;padding:5px 11px;font-size:11px}
.parlay-head .pc-addall+.parlay-badge,.parlay-head .parlay-badge+.pc-addall{margin-left:10px}
.pf-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:6px 0 14px}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px}
.pf-chip{font-family:var(--font-mono);font-size:11px;padding:6px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);color:var(--text-dim);cursor:pointer;background:var(--surface)}
.pf-chip:hover{border-color:var(--primary);color:var(--primary)}
.pf-chip.on{border-color:var(--primary);color:var(--primary);background:rgba(127,127,127,.10)}
.pf-group{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.pf-group h4{font-family:var(--font-display);font-size:15px;color:var(--text);margin:0}
.pf-group span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim)}
.pc-pick-edge{font-family:var(--font-mono);font-size:10.5px;color:var(--text-mid);margin-top:4px}

/* ── Combo Props (moved from Intel Reports) ── */
.report-intro{font-size:12.5px;color:var(--text-mid);line-height:1.6;max-width:820px;margin-bottom:20px}
.report-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.search-box{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:12px;padding:8px 12px;width:220px;
}
.intel-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.intel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.ic-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ic-headshot{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface2);
  border:2px solid var(--border);flex:none}
.ic-name{font-family:var(--font-display);font-weight:700;font-size:15px}
.ic-team{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.ic-matchup{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text-mid);
  padding:8px 10px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:12px;
}
.fav-badge{font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;
  padding:2px 6px;border-radius:3px;text-transform:uppercase}
.fav-badge.yes{color:var(--accent-green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)}
.fav-badge.no{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.fav-badge.mid{color:var(--text-mid);background:var(--surface2);border:1px solid var(--border)}
.fav-badge.neu{color:var(--accent-blue);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35)}
.fav-badge.check{border-style:dashed}
.ic-section-label{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text-dim);margin:12px 0 6px}
.ic-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px}
.ic-row-label{color:var(--text-mid);flex:1;min-width:0}
.intel-card{cursor:pointer}
.intel-card:hover{border-color:var(--border2)}
.lead-wrap{overflow:auto;max-height:calc(100vh - 220px);border:1px solid var(--border);border-radius:var(--radius-lg)}
.lead-table{width:100%;border-collapse:separate;border-spacing:0}
.lead-table thead th{
  padding:9px 12px;text-align:right;font-family:var(--font-mono);font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;
  position:sticky;top:0;background:var(--surface2);z-index:2;border-bottom:1px solid var(--border);
}
.lead-table thead th.name-col{text-align:left;left:0;z-index:3}
.lead-table td{padding:8px 12px;font-size:12px;text-align:right;border-bottom:1px solid var(--hairline);white-space:nowrap}
.lead-table tbody tr:last-child td{border-bottom:0}
.lead-table tbody tr:hover td{background:var(--surface2)}
.lead-table td.name-col{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.cell-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-mid);font-size:12px}
.log-hit{color:var(--accent-green)}
.log-miss{color:var(--accent-red)}
.rank-chip{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.intel-card.watch{border-color:var(--accent-gold);background:rgba(250,204,21,.04)}
.prop-input-row{display:flex;align-items:center;gap:8px}
.prop-input-row label{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);white-space:nowrap}
.prop-input{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--font-mono);font-size:12px;padding:5px 8px;width:80px;
}
.prop-clear{
  background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;
  padding:4px 6px;margin-left:auto;
}
.prop-clear:hover{color:var(--accent-red)}
/* Combo Props card separation */
.combo-card .ic-section-label{margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--border2,var(--border));font-size:9.5px;color:var(--text-mid)}
.combo-card .ic-row{padding:8px 0;border-bottom:1px solid var(--border)}
.combo-card .ic-row:last-child{border-bottom:0}
.combo-card .ic-head{padding-bottom:12px}
.combo-box{margin:14px 0 0;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(127,127,127,.06)}
.combo-box .ic-row:last-of-type{border-bottom:0}
.combo-coeus{margin:14px 0 0;padding:12px 14px;border-radius:10px;border:1px solid var(--border);border-left-width:5px;border-left-style:solid}
.combo-coeus .cc-title{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-mid);margin-bottom:6px}
.combo-coeus .cc-top{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:8px}
.combo-coeus .cc-why{font-family:var(--font-sans,inherit);font-size:12.5px;line-height:1.65;color:var(--text);margin:0}
.combo-mini{margin:12px 0 0;padding:9px 12px;border-radius:10px;border:1px solid var(--border);border-left-width:5px;border-left-style:solid;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.combo-mini .cm-pick{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:.04em}

<body>
<script src="js/fi-shell.js"></script>
<script>
const main = fiShell({ page:'props', pageLabel:'Prop Center', status:'loading' });
const $ = id => document.getElementById(id);

main.innerHTML = `
  <div class="bar" id="pcWeekBar" style="display:none">
    <label class="lbl" for="pcWeek">Week</label><select id="pcWeek"></select>
  </div>
  <div class="bar" id="pcBatchBar" style="display:none">
    <label class="lbl" for="pcBatch">Batch</label><select id="pcBatch"></select>
  </div>
  <div class="pc-topnav" id="pcTopNav">
    <button data-s="lines" aria-selected="true">Game Lines / Totals / ML</button>
    <button data-s="props">Player Props</button>
    <button data-s="builder">Prop Builder<span class="pc-nav-badge" id="pcSlipBadge"></span></button>
    <button data-s="breakdown">Coeus Prop Breakdown</button>
    <button data-s="overunder">Coeus Favorite O/U</button>
    <button data-s="anytimetd">Coeus Anytime TD</button>
    <button data-s="spreads">Coeus Spreads</button>
    <button data-s="parlays">Coeus Parlays</button>
    <button data-s="combo">Combo Props</button>
    <button data-s="scrambler">Parlay Scrambler</button>
    <button data-s="results">Results</button>
  </div>
  <div id="body"></div>
  <div class="modal-overlay" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-subtitle" id="mSub"></div>
      <button class="modal-close" id="mClose" aria-label="Close game">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>`;

let FDPROPS = null;   // fanduel_props/latest.json, filtered down to the selected week's real games
let FDPROPS_ALL = null; // the full, unfiltered fanduel_props/latest.json snapshot — real, live data, no LLM
let REPORT = null;    // props_reports — Coeus's picks + parlays
// REAL ADDITION (2026-09-28), per Frank's direct request to track how
// Coeus's real picks actually did: REPORT_GRADED is the sibling
// "*_graded.json" grade_props_report.py writes once a week's real
// games are final (same picks as REPORT, each with a real "grade"
// field added) — null until that script has actually been run for
// the selected week/batch. SEASON_RECORD is the rolling real W/L/P
// tally across every graded week, results/season_record.json.
let REPORT_GRADED = null;
let SEASON_RECORD = null;
let activeSection = 'lines';
let activeStat = 'passing_yards';
let PROPS_WEEKS = [];      // real week folders (plus 'mixed', if present) that actually have a report
let propsWeekFilter = null;
let PROPS_BATCHES = {};    // real batch filename -> {games, generated_at} for the selected week
let propsBatchFilter = null;
// REAL ADDITION (2026-10-01), per Frank's direct request: Parlays/TD
// Parlays/Spread Parlays built per-batch could only ever pick legs from
// that one batch's handful of games, never a genuinely best-of-the-
// whole-week combination. WHOLE_WEEK_REPORT is the sibling
// "props_parlay_report_WHOLEWEEK.json" generate_props_report.py
// --parlays-only writes once all of a week's normal batches are done —
// null until that's actually been run for the selected week, in which
// case these three tabs fall back to the selected batch's own parlays
// exactly as before (see renderParlays/renderAnytimeTD/renderSpreads).
let WHOLE_WEEK_REPORT = null;
// Every batch report for the selected week (graded copy when one exists),
// so a game's modal can show Coeus's picks for that game no matter which
// batch they were generated in.
let ALL_BATCH_REPORTS = [];
let PICKBD = null;          // intel/pick_breakdowns.json (VS breakdown per player-stat pick), current week only
const PICK_REG = {};        // key -> the pick object last drawn, so the modal can show its line/side/price

// REAL ADDITION (2026-10-02), per Frank's direct request: a Prop Builder
// slip — real, user-picked legs from Game Lines/Totals/ML and Player
// Props, saved per-week in the browser's own localStorage. This is
// Frank's own slip, not Coeus's — never validated or re-checked the way
// Coeus's own parlays are, just whatever real price was on the board
// when he clicked it.
let SLIP = [];
let SLIP_STAKE = 10;

const pad = n => String(n).padStart(2, '0');

// REAL CHANGE (2026-09-29), same real feature already built and tested
// on games.html/matchup_stats.html/threats.html/dfs_center.html: ported
// over UNCHANGED (fully self-contained — reads games/wkNN.json
// directly, nothing specific to this page) rather than reimplemented,
// per Frank's direct request that the Prop Center's week selector
// behave exactly like every other section — advancing past a week once
// ITS OWN real Monday game has actually finished, and never quietly
// falling back to an older, already-built week just because the
// current week's props report hasn't been generated yet.
//
// Deliberately does NOT trust matchup/current.json's own "week" value —
// confirmed on games.html that this field tracks "the highest week
// build_matchup_stats.py has ever built," not "the real current NFL
// week." Always starts the real check from week 1 and walks forward.
function etOffsetMinutes(dateStr){
  const d = new Date(`${dateStr}T12:00:00Z`);
  const utcStr = d.toLocaleString('en-US', { timeZone: 'UTC', hour12: false });
  const etStr = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
  return (new Date(utcStr) - new Date(etStr)) / 60000;
}
function kickoffHasPassed(g){
  if(!g.gameday || !g.gametime) return false;
  const [h, m] = g.gametime.split(':').map(Number);
  const kickoffUTC = new Date(`${g.gameday}T00:00:00Z`);
  kickoffUTC.setUTCMinutes(kickoffUTC.getUTCMinutes() + h * 60 + m + etOffsetMinutes(g.gameday));
  return new Date() >= kickoffUTC;
}
async function determineDefaultWeek(){
  let week = 1;
  while (week < 18) {
    let wkData;
    try {
      const r = await fetch(`games/wk${pad(week)}.json`, { cache: 'no-store' });
      if (!r.ok) break; // that week isn't built yet — stop advancing, use what we have
      wkData = await r.json();
    } catch (e) { break; }

    const monGames = (wkData.games || []).filter(g => g.weekday === 'Monday' && g.gameday);
    if (!monGames.length) break; // no real Monday game this week — nothing to advance past
    const latestMon = monGames.reduce((max, g) => (!max || g.gametime > max.gametime) ? g : max, null);
    if (!kickoffHasPassed(latestMon)) break; // this week's real MNF hasn't happened yet — stay here
    week += 1;
  }
  return week;
}

async function load(){
  fiStatus('Loading','loading');

  try{
    const res = await fetch('fanduel_props/latest.json', { cache: 'no-store' });
    if(res.ok) FDPROPS_ALL = await res.json();
  }catch(e){ /* Game Lines / Player Props just won't have data yet */ }

  try{
    const res = await fetch('results/season_record.json', { cache: 'no-store' });
    if(res.ok) SEASON_RECORD = await res.json();
  }catch(e){ /* no real graded weeks yet */ }

  // REAL CHANGE (2026-09-21), per Frank's direct request: a full slate
  // can now be split into several real, separate batches (--games,
  // built to keep each run comfortably under the API's real token
  // ceiling) — each one writes its own real, distinctly-named file
  // rather than the single "props_parlay_report.json" this page
  // originally only ever looked for. A browser's fetch() can only
  // check one already-known filename at a time — it can't list a
  // folder's real contents — so this now checks for the real, per-week
  // manifest.json generate_props_report.py writes (same real pattern
  // Game Breakdowns already uses) instead of guessing filenames.
  PROPS_WEEKS = [];
  for(let w = 1; w <= 18; w++){
    const wk = `wk${pad(w)}`;
    try{
      const r = await fetch(`props_reports/${wk}/manifest.json`, { method: 'HEAD', cache: 'no-store' });
      if(r.ok) PROPS_WEEKS.push(wk);
    }catch(e){}
  }
  try{
    const r = await fetch(`props_reports/mixed/manifest.json`, { method: 'HEAD', cache: 'no-store' });
    if(r.ok) PROPS_WEEKS.push('mixed');
  }catch(e){}

  // REAL CHANGE (2026-09-29), per Frank's direct request: always default
  // to the REAL current NFL week (same auto-advance rule as Matchup
  // Stats, Threats, and the DFS Center), even when this week's props
  // report hasn't been generated yet — loadManifestForWeek() already
  // shows the real "not generated yet" empty states in that case, rather
  // than this silently substituting an older, already-built week.
  const currentWeek = await determineDefaultWeek();
  const currentWk = `wk${pad(currentWeek)}`;
  propsWeekFilter = currentWk;
  loadSlip(propsWeekFilter);
  await loadManifestForWeek(propsWeekFilter);
  await applyGameLinesWeekFilter(propsWeekFilter);
  await loadPickBreakdowns();

  const optionWeeks = Array.from(new Set([...PROPS_WEEKS, currentWk]));
  const rank = wk => wk === 'mixed' ? 1e6 : Number(wk.slice(2));
  optionWeeks.sort((a, b) => rank(a) - rank(b));

  const wkLabel = wk => wk === 'mixed' ? 'Mixed / partial slate' : `Week ${Number(wk.slice(2))}`;
  $('pcWeek').innerHTML = optionWeeks
    .map(wk => `<option value="${wk}"${wk===propsWeekFilter?' selected':''}>${wkLabel(wk)}</option>`).join('');
  $('pcWeekBar').style.display = '';
  $('pcWeek').addEventListener('change', async (e) => {
    propsWeekFilter = e.target.value;
    loadSlip(propsWeekFilter);
    fiStatus('Loading','loading');
    await loadManifestForWeek(propsWeekFilter);
    await applyGameLinesWeekFilter(propsWeekFilter);
    fiStatus('Ready');
    render();
  });

  fiStatus('Ready');
  fiUpdated(FDPROPS ? `Lines updated ${new Date(FDPROPS.generated_at).toLocaleString()}` : '');

  $('pcTopNav').querySelectorAll('button').forEach(b => b.onclick = () => {
    activeSection = b.dataset.s;
    $('pcTopNav').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x===b)));
    render();
  });

  $('mClose').addEventListener('click', closeModal);
  $('scrim').addEventListener('click', closeModal);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && $('modal').classList.contains('open')) closeModal();
  });

  render();
}

// REAL ADDITION (2026-09-29), per Frank's direct request: fanduel_props/
// latest.json is a single, un-week-scoped snapshot — whatever games were
// on the board the last time build_fanduel_props.py ran, nothing more.
// Once the week selector auto-advances to a new real week (see
// determineDefaultWeek() above) that snapshot can easily be stale —
// still holding the PRIOR week's real games — and showing those under
// the new week's label would be actively misleading, not just empty.
// This cross-checks FDPROPS_ALL's games against that week's real
// schedule (games/wkNN.json) and keeps only the ones that actually
// belong to it; if none match, Game Lines / Player Props correctly show
// their existing "no data yet" empty states instead of the wrong week's
// real games.
async function applyGameLinesWeekFilter(wk){
  if(!FDPROPS_ALL){ FDPROPS = null; return; }
  let schedule = null;
  try{
    const res = await fetch(`games/${wk}.json`, { cache: 'no-store' });
    if(res.ok) schedule = await res.json();
  }catch(e){}
  if(!schedule || !schedule.games || !schedule.games.length){
    FDPROPS = { ...FDPROPS_ALL, games: [] };
    return;
  }
  const validKeys = new Set(schedule.games.map(g => `${g.away}_${g.home}`));
  // Same order the Games page uses: by real kickoff (gameday + gametime, ET),
  // ties kept in the schedule file's own order — not whatever order the
  // FanDuel feed happened to return them in.
  const kickoffOrder = {};
  schedule.games
    .map((g, i) => ({ key: `${g.away}_${g.home}`, when: `${g.gameday || ''} ${g.gametime || ''}`, i }))
    .sort((a, b) => (a.when < b.when ? -1 : a.when > b.when ? 1 : a.i - b.i))
    .forEach((x, rank) => { kickoffOrder[x.key] = rank; });
  FDPROPS = {
    ...FDPROPS_ALL,
    games: (FDPROPS_ALL.games || [])
      .filter(g => validKeys.has(`${g.away_code}_${g.home_code}`))
      .sort((a, b) => (kickoffOrder[`${a.away_code}_${a.home_code}`] ?? 999) -
                      (kickoffOrder[`${b.away_code}_${b.home_code}`] ?? 999)),
  };
}

// REAL CHANGE (2026-09-21): loads the real, per-week manifest, builds
// (or hides, when there's genuinely only one real batch) a Batch
// selector, and loads whichever real batch is currently selected.
// Defaults to the most recently-generated real batch for this week,
// same real "most recent, not just first" principle used for the week
// selector itself above.
const WHOLE_WEEK_FILENAME = 'props_parlay_report_WHOLEWEEK.json';

// REAL ADDITION (2026-10-01): loads the whole-week-only Parlays/TD
// Parlays/Spread Parlays file if generate_props_report.py --parlays-only
// has been run for this week — a 404 just means it hasn't yet, which
// is routine, not an error (every renderX() below already falls back
// to the selected batch's own parlays in that case).
async function loadWholeWeekReport(wk){
  WHOLE_WEEK_REPORT = null;
  try{
    // Prefer the graded copy (same file plus real Hit/Miss grades on every
    // Best 10 pick and parlay leg) once grade_props_report.py has written it,
    // exactly like the per-batch reports do; otherwise the ungraded original.
    const gradedName = WHOLE_WEEK_FILENAME.replace(/\.json$/, '_graded.json');
    let res = await fetch(`props_reports/${wk}/${gradedName}`, { cache: 'no-store' });
    if(!res.ok) res = await fetch(`props_reports/${wk}/${WHOLE_WEEK_FILENAME}`, { cache: 'no-store' });
    if(res.ok) WHOLE_WEEK_REPORT = await res.json();
  }catch(e){ /* stays null — routine, handled by callers */ }
}

async function loadManifestForWeek(wk){
  PROPS_BATCHES = {};
  try{
    const res = await fetch(`props_reports/${wk}/manifest.json`, { cache: 'no-store' });
    if(res.ok){
      const mf = await res.json();
      PROPS_BATCHES = mf.batches || {};
    }
  }catch(e){ /* PROPS_BATCHES stays empty — handled below */ }
  // The whole-week parlay file is a special, separate overlay for the
  // Parlays/TD/Spread tabs only (no Prop Breakdown/Favorite O/U of its
  // own) — never shown as a selectable "batch" in the per-batch dropdown.
  delete PROPS_BATCHES[WHOLE_WEEK_FILENAME];
  await loadWholeWeekReport(wk);

  const filenames = Object.keys(PROPS_BATCHES);
  ALL_BATCH_REPORTS = [];
  await Promise.all(filenames.map(async fn => {
    const fetchJson = async name => {
      try{
        const res = await fetch(`props_reports/${wk}/${name}`, { cache: 'no-store' });
        return res.ok ? await res.json() : null;
      }catch(e){ return null; }
    };
    const graded = await fetchJson(fn.replace(/\.json$/, '_graded.json'));
    const rep = graded || await fetchJson(fn);
    if(rep) ALL_BATCH_REPORTS.push(rep);
  }));
  ALL_BATCH_REPORTS.sort((a, b) => new Date(a.generated_at) - new Date(b.generated_at));
  if(!filenames.length){
    propsBatchFilter = null;
    REPORT = null;
    $('pcBatchBar').style.display = 'none';
    return;
  }

  propsBatchFilter = filenames.slice()
    .sort((a, b) => new Date(PROPS_BATCHES[b].generated_at) - new Date(PROPS_BATCHES[a].generated_at))[0];
  // With 2+ batches, open on "All Picks" (every batch combined) — the single batches stay selectable below it.
  if(filenames.length > 1) propsBatchFilter = ALL_PICKS;

  if(filenames.length > 1){
    const totalGames = fns => fns.reduce((n, fn) => n + ((PROPS_BATCHES[fn].games || []).length), 0);
    const batchLabel = fn => {
      const b = PROPS_BATCHES[fn];
      const games = (b.games || []).map(g => g.replace('_', '@'));
      return games.length ? `${games.length} games: ${games.join(', ')}` : fn;
    };
    $('pcBatch').innerHTML = `<option value="${ALL_PICKS}"${propsBatchFilter===ALL_PICKS?' selected':''}>All Picks · ${filenames.length} batches, ${totalGames(filenames)} games</option>` + filenames
      .map(fn => `<option value="${esc(fn)}"${fn===propsBatchFilter?' selected':''}>${esc(batchLabel(fn))}</option>`).join('');
    $('pcBatchBar').style.display = '';
    $('pcBatch').onchange = async (e) => {
      propsBatchFilter = e.target.value;
      fiStatus('Loading','loading');
      await loadReportForBatch(wk, propsBatchFilter);
      fiStatus('Ready');
      render();
    };
  } else {
    $('pcBatchBar').style.display = 'none';
  }

  await loadReportForBatch(wk, propsBatchFilter);
}

const ALL_PICKS = '__ALL__';
// "All Picks": every batch's picks combined into one report-shaped object, so Prop Breakdown,
// Favorite O/U and Results show the whole week's slate at once. Parlays / Best 10 still come from
// the whole-week file (they're built from the full slate already).
function mergeAllBatches(){
  const reps = ALL_BATCH_REPORTS.filter(Boolean);
  if(!reps.length) return null;
  const seen = new Set(), games = [], perGame = [], posAll = [];
  reps.forEach(r => {
    (r.games_included || []).forEach(g => { if(!games.includes(g)) games.push(g); });
    const pb = r.prop_breakdown || {};
    (pb.per_game || []).forEach(gm => { const k = gm.away + '@' + gm.home; if(!seen.has(k)){ seen.add(k); perGame.push(gm); } });
    Object.entries(pb.per_position || {}).forEach(([pos, p]) => { if(p) posAll.push({pos, pick: p}); });
  });
  const order = {QB:0, RB:1, WR:2, TE:3};
  posAll.sort((a, b) => (order[a.pos] ?? 9) - (order[b.pos] ?? 9));
  // Each batch ranks its own O/U picks by conviction; scores aren't comparable across batches,
  // so interleave them (every batch's #1, then every #2, ...), dropping duplicates.
  const interleave = side => {
    const lists = reps.map(r => ((r.favorite_ou || {})[side] || []).slice());
    const out = [], ids = new Set();
    for(let i = 0; lists.some(l => i < l.length); i++){
      lists.forEach(l => { const p = l[i]; if(!p) return; const id = legId(p); if(!ids.has(id)){ ids.add(id); out.push(p); } });
    }
    return out;
  };
  const latest = reps.map(r => r.generated_at).sort().slice(-1)[0];
  return {
    __all: true, generated_at: latest, games_included: games, markdown: '', coverage: {},
    stake_used_for_payout_examples: (reps[0] || {}).stake_used_for_payout_examples || 10,
    prop_breakdown: {per_game: perGame, per_position: {}, per_position_all: posAll},
    favorite_ou: {overs: interleave('overs'), unders: interleave('unders')},
    graded_at: reps.some(r => r.graded_at) ? latest : undefined,
  };
}
async function loadReportForBatch(wk, filename){
  REPORT = null;
  REPORT_GRADED = null;
  if(filename === ALL_PICKS){
    REPORT = mergeAllBatches();
    if(REPORT && REPORT.graded_at) REPORT_GRADED = REPORT;
    return;
  }
  try{
    const res = await fetch(`props_reports/${wk}/${filename}`, { cache: 'no-store' });
    if(res.ok) REPORT = await res.json();
  }catch(e){ /* Coeus Prop Breakdown / Favorite O/U / Parlays just won't have data for this batch */ }
  // REAL ADDITION (2026-09-28): grade_props_report.py writes a sibling
  // "*_graded.json" once this batch's real games are final — a 404
  // here just means that hasn't happened yet, not an error.
  try{
    const gradedName = filename.replace(/\.json$/, '_graded.json');
    const res = await fetch(`props_reports/${wk}/${gradedName}`, { cache: 'no-store' });
    if(res.ok) REPORT_GRADED = await res.json();
  }catch(e){ /* not graded yet */ }
}

/* ── PROP BUILDER — slip state, storage, and the clickable "+ Add"
   buttons wired into Game Lines and Player Props below. A leg here is
   always real: canonical_event_id/market_key/player/price straight off
   the real FanDuel data already on the page, never invented. ── */
function legId(leg){
  return [leg.canonical_event_id, leg.market_key, leg.player, leg.side || '',
    leg.point ?? leg.line ?? ''].join('|');
}
function isLegInSlip(leg){
  const id = legId(leg);
  return SLIP.some(l => legId(l) === id);
}
function slipStorageKey(wk){
  return `footballIntel.propBuilder.${wk}`;
}
function loadSlip(wk){
  SLIP = [];
  SLIP_STAKE = 10;
  try{
    const raw = localStorage.getItem(slipStorageKey(wk));
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed.legs)) SLIP = parsed.legs;
      if(typeof parsed.stake === 'number' && parsed.stake > 0) SLIP_STAKE = parsed.stake;
    }
  }catch(e){ /* corrupt or blocked storage — start with an empty slip, never crash over this */ }
  updateSlipNavBadge();
}
function saveSlip(wk){
  try{
    localStorage.setItem(slipStorageKey(wk), JSON.stringify({ legs: SLIP, stake: SLIP_STAKE }));
  }catch(e){ /* private window / storage blocked / quota — slip just won't persist this session */ }
}
function toggleSlipLeg(leg){
  const id = legId(leg);
  const idx = SLIP.findIndex(l => legId(l) === id);
  if(idx >= 0) SLIP.splice(idx, 1);
  else SLIP.push(leg);
  saveSlip(propsWeekFilter);
  updateSlipNavBadge();
}
function updateSlipNavBadge(){
  const el = $('pcSlipBadge');
  if(el) el.textContent = SLIP.length ? ` (${SLIP.length})` : '';
}
function slipToggleBtn(leg){
  if(leg.price === null || leg.price === undefined) return '';
  const added = isLegInSlip(leg);
  // REAL BUG FIX (2026-10-02), per Frank's direct catch: esc() (js/fi-
  // shell.js) only escapes & < > for safe HTML CONTENT — it was never
  // built to escape a value going inside a quoted HTML ATTRIBUTE, so a
  // literal " from JSON.stringify(leg) (every leg has one immediately,
  // e.g. {"canonical_event_id":...) truncated the data-leg attribute at
  // the very first character every time, silently corrupting it. Every
  // click's JSON.parse then failed and the catch block quietly did
  // nothing — exactly the "doesn't add, doesn't stay selected" Frank
  // saw. encodeURIComponent's output never contains a raw " at all, so
  // it's always safe inside a double-quoted attribute.
  return `<button class="pc-slip-btn${added ? ' added' : ''}" data-leg="${encodeURIComponent(JSON.stringify(leg))}">${added ? '✓ Added' : '+ Add'}</button>`;
}
function wireSlipButtons(root, refreshFn){
  if(!root) return;
  root.querySelectorAll('.pc-slip-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      let leg;
      try { leg = JSON.parse(decodeURIComponent(btn.dataset.leg)); } catch(err){ return; }
      toggleSlipLeg(leg);
      refreshFn();
    });
  });
}
function combinedDecimalOdds(legs){

// Coeus's picks for ONE game, pulled from every batch of the selected week
// plus the weekly Best 10 — each real pick once, Best 10 plays first.
function coeusPicksForGame(g){
  const out = new Map();
  const add = (p, badge) => {
    if(!p || p.canonical_event_id !== g.canonical_event_id) return;
    const k = [p.player, p.market_key, p.side || '', p.line ?? p.threshold ?? p.point ?? ''].join('|');
    const prev = out.get(k);
    if(!prev) out.set(k, { pick: p, badge });
    else if(badge && (!prev.badge || String(badge).startsWith('Best 10'))) prev.badge = badge;
  };
  for(const r of ALL_BATCH_REPORTS){
    const pb = r.prop_breakdown || {};
    (pb.per_game || []).forEach(gm => {
      if(gm.away === g.away_code && gm.home === g.home_code) (gm.picks || []).forEach(p => add(p));
    });
    Object.entries(pb.per_position || {}).forEach(([pos, p]) => add(p, pos));
    const fou = r.favorite_ou || {};
    [...(fou.overs || []), ...(fou.unders || [])].forEach(p => add(p));
  }
  const b10 = (WHOLE_WEEK_REPORT && WHOLE_WEEK_REPORT.best_10 && WHOLE_WEEK_REPORT.best_10.picks) || [];
  b10.forEach(p => add(p, `Best 10 · #${p.rank}`));
  const rank = x => (String(x.badge || '').startsWith('Best 10') ? Number(x.pick.rank) || 99 : 100);
  return [...out.values()].sort((a, b) => rank(a) - rank(b));
}
function coeusPicksSectionHTML(g){
  const picks = coeusPicksForGame(g);
  if(!picks.length) return '';
  return `<div class="pc-modal-stat-sect"><h4>Coeus Picks</h4>
    <div class="pc-pick-grid">${picks.map(x => pickCardHTML(x.pick, x.badge)).join('')}</div></div>`;
}

function marketKeyLabel(key){
  if(key === 'h2h') return 'Moneyline';
  if(key === 'totals') return 'Game Total';
  if(key === 'spreads') return 'Spread';
  const altMatch = key.match(/^player_(.+)_milestones_(\d+)_or_more$/);
  if(altMatch){
    const statKey = altMatch[1];
    return `${STAT_LABELS[statKey] || statKey} ${altMatch[2]}+`;
  }
  const statKey = key.replace(/^player_/, '');
  return STAT_LABELS[statKey] || statKey.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function gameLabelWithTime(game){
  if(!game) return '';
  let t = '';
  if(game.commence_time){
    const d = new Date(game.commence_time);
    if(!isNaN(d)) t = ' · ' + d.toLocaleString('en-US', {timeZone:'America/New_York', weekday:'short', hour:'numeric', minute:'2-digit'}) + ' ET';
  }
  return `${game.away_code} @ ${game.home_code}${t}`;
}

function gameForEventId(eid){

}

// REAL CHANGE (2026-09-15), per Frank's direct request: every card
// must show the real posted line alongside Over/Under, and Anytime TD
// — which has no line or Over/Under side at all, just a single real
// "Yes" price — must not show a fabricated Over/Under badge. Shared by
// every card type below (Prop Breakdown, Favorite O/U, and every
// parlay leg) so this rule is consistent everywhere, not just one
// section.
function isAnytimeTdMarket(marketKey){
  return String(marketKey || '').includes('anytime_td');
}
// REAL ADDITION (2026-09-28): a spread leg has no Over/Under side at
// all — just a real team name (in the shared "player" field, same as
// every other leg shape) and a real posted point (e.g. -3.5), so it
// needs its own label rather than being squeezed into the Over/Under
// side badge above.
function isSpreadMarket(marketKey){
  return marketKey === 'spreads';
}
function sideLineLabel(pick){
  if (isAnytimeTdMarket(pick.market_key)) return ''; // no Over/Under, no line — real single "Yes" price only
  if (isSpreadMarket(pick.market_key)){
    if (pick.point === undefined || pick.point === null) return '';
    const pt = pick.point > 0 ? `+${pick.point}` : `${pick.point}`;
    return `<span class="pc-pick-side spread">${pt}</span>`;
  }
  if (pick.side !== 'over' && pick.side !== 'under') return '';
  const sideText = pick.side === 'over' ? 'Over' : 'Under';
  const lineText = (pick.line !== undefined && pick.line !== null) ? ` ${pick.line}` : '';
  return `<span class="pc-pick-side ${pick.side}">${sideText}${lineText}</span>`;
}

// REAL ADDITION (2026-09-28), per Frank's direct request to track how
// Coeus's real picks actually did: renders a ✓/✗/PUSH/pending badge
// for a real graded pick's "grade" field. Returns '' when "grade" is
// absent entirely (an ungraded REPORT, i.e. every tab except Results)
// so this has zero effect anywhere the pick hasn't actually been
// graded — only the Results tab ever passes graded picks through
// pickCardHTML/parlayCard.
function gradeBadgeHTML(grade, actual){
  if(grade === undefined) return '';
  // `actual` is the real result the grade was based on ("279 pass yds",
  // "1 TD", "won by 12"), written by grade_props_report.py next to each grade.
  const a = actual ? ` · ${esc(actual)}` : '';
  if(grade === 'W') return `<span class="grade-badge win">✓ Hit${a}</span>`;
  if(grade === 'L') return `<span class="grade-badge loss">✗ Miss${a}</span>`;
  if(grade === 'P' && actual === 'DNP') return `<span class="grade-badge push" title="Player did not play; sportsbooks refund this bet">Void · DNP</span>`;
  if(grade === 'P') return `<span class="grade-badge push">Push${a}</span>`;
  return `<span class="grade-badge pending">Pending</span>`;
}

const RETIRED_NOTE = label => `<div class="empty">${esc(label)} are retired as a separate product for new weeks.
  Anytime TD and spread plays can now appear in the weekly Best 10 and in the 2/3/4-leg parlays built from it
  (see the Parlays tab). Earlier weeks' ${esc(label.toLowerCase())} are still graded in the Results tab.</div>`;

function projectionLineHTML(pick){
  if(typeof pick.projection !== 'number') return '';
  let txt;
  if(pick.market_key === 'player_anytime_td'){
    const p = pick.projection > 1 ? pick.projection : pick.projection * 100;
    txt = `Coeus projects ${Math.round(p)}% to score`;
  } else if(pick.market_key === 'spreads'){
    txt = `Coeus projects a ${pick.projection > 0 ? '+' : ''}${pick.projection} margin`;
  } else {
    // Signed projection minus the line: an Under with a projection BELOW the
    // line reads negative ("projects 188, -12.5 vs line" for Under 200.5), not
    // the always-positive "edge" number stored in the report.
    const ln = typeof pick.line === 'number' ? pick.line
             : (typeof pick.threshold === 'number' ? pick.threshold : null);
    let diff = null;
    if(ln !== null) diff = Math.round((pick.projection - ln) * 10) / 10;
    else if(typeof pick.projection_edge === 'number') diff = pick.side === 'under' ? -pick.projection_edge : pick.projection_edge;
    const edge = diff === null ? ''
      : ` (${diff > 0 ? '+' : diff < 0 ? '\u2212' : ''}${Math.abs(diff)} vs line)`;
    txt = `Coeus projects ${pick.projection}${edge}`;
  }
  const n = Number.isInteger(pick.games_2026) ? ` · ${pick.games_2026} games in 2026` : '';
  return `<div class="pc-pick-proj">${esc(txt + n)}</div>`;
}

function kickBadge(game){
  if(!game || !game.commence_time) return '';
  const d = new Date(game.commence_time); if(isNaN(d)) return '';
  return d.toLocaleString('en-US', {timeZone:'America/New_York', weekday:'short', hour:'numeric', minute:'2-digit'}) + ' ET';
}
function pickNorm(n){
  return String(n || '').toLowerCase().replace(/[.'\u2019]/g, '').replace(/ jr/g, '').replace(/ sr/g, '').replace(/ iii/g, '').replace(/ ii/g, '')
    .replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function pickBdKey(p){
  if(!PICKBD || !p || !p.player || !p.market_key) return null;
  if(!propsWeekFilter || propsWeekFilter !== 'wk' + String(PICKBD.week).padStart(2, '0')) return null;
  const k = pickNorm(p.player) + '|' + p.market_key;
  return PICKBD.picks && PICKBD.picks[k] ? k : null;
}

function pickEdge(p){
  const ln = typeof p.line === 'number' ? p.line : (typeof p.threshold === 'number' ? p.threshold : null);
  if(typeof p.projection !== 'number' || ln === null) return -1e9;
  return p.side === 'under' ? ln - p.projection : p.projection - ln;

function renderMarkdown(md){
  const stripped = md.replace(/```json[\s\S]*?```/g, '');
  const lines = stripped.split('\n');
  let html = '', inList = false;
  const closeList = () => { if(inList){ html += '</ul>'; inList = false; } };
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ closeList(); continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if(h){
      closeList();
      const level = h[1].length;
      html += `<h${level}>${inlineMd(h[2])}</h${level}>`;
      continue;
    }
    const li = line.match(/^[-*]\s+(.*)/);
    if(li){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(li[1])}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inlineMd(line)}</p>`;
  }
  closeList();
  return html;
}
function inlineMd(s){
  const escaped = esc(s);
  return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

  const sorted = picks.slice().sort((a,b) => (a.rank || 99) - (b.rank || 99));
  const errs = (src.best_10.errors || []).map(e => `<div class="parlay-error">✗ ${esc(e)}</div>`).join('');
  return `<div class="subsect">Coeus's Best 10 This Week</div>
    <div class="pc-pick-grid">${sorted.map((p,i) => pickCardHTML(p, '#' + (p.rank || i + 1))).join('')}</div>
    ${errs}`;
}

/* ── PARLAY SCRAMBLER (2026-10-02), per Frank's direct request: pools
   every real pick Coeus has already made across Coeus Favorite O/U,
   Coeus Anytime TD, Coeus Spreads, and Coeus Parlays (same sources
   each of those tabs already shows — whole-week file preferred for
   the three parlay tabs, exactly like those tabs do; Favorite O/U is
   always batch-scoped since it has no whole-week version), dedupes
   by the same legId() the Prop Builder slip uses, and draws a random
   N of them. This never grades or re-validates anything of its own —
   only legs from combinations that already passed validation are
   pooled, and the Scrambler only randomizes which subset is shown
   together. Each drawn leg can also be sent into Frank's own Prop
   Builder slip with the same "+ Add" button used everywhere else. ── */
let SCRAMBLE_SIZE = 5;
let SCRAMBLE_RESULT = null;

function scramblerPool(){
  const pool = [];
  const seen = new Set();
  const now = new Date();
  const addLeg = (leg) => {
    if(!leg || leg.price === null || leg.price === undefined) return;
    // REAL FIX (2026-10-02), per Frank's direct catch: a game that has
    // already kicked off (PIT @ CLE, Thursday night) was still turning
    // up in scrambled draws Friday evening — the pool never checked
    // commence_time against the real clock. Anything whose game has
    // already started (or has no commence_time to check at all) is
    // excluded, same real timestamp the game cards elsewhere use.
    const game = gameForEventId(leg.canonical_event_id);
    if(!game || !game.commence_time) return;
    if(new Date(game.commence_time) <= now) return;
    const id = legId(leg);
    if(seen.has(id)) return;
    seen.add(id);
    pool.push(leg);
  };

  if(REPORT && REPORT.favorite_ou){
    (REPORT.favorite_ou.overs || []).forEach(addLeg);
    (REPORT.favorite_ou.unders || []).forEach(addLeg);
  }

  const sizes = ['2','3','4','5','6','7'];
  const addFromParlaySrc = (src, key) => {
    if(!src || !src[key]) return;
    sizes.forEach(s => {
      const p = src[key][s];
      if(p && p.valid && Array.isArray(p.legs)) p.legs.forEach(addLeg);
    });
  };
  const tdSrc = (WHOLE_WEEK_REPORT && WHOLE_WEEK_REPORT.td_parlays) ? WHOLE_WEEK_REPORT
              : (REPORT && REPORT.td_parlays) ? REPORT : null;
  const spreadSrc = (WHOLE_WEEK_REPORT && WHOLE_WEEK_REPORT.spread_parlays) ? WHOLE_WEEK_REPORT
              : (REPORT && REPORT.spread_parlays) ? REPORT : null;
  const parlaySrc = (WHOLE_WEEK_REPORT && WHOLE_WEEK_REPORT.parlays) ? WHOLE_WEEK_REPORT
              : (REPORT && REPORT.parlays) ? REPORT : null;
  addFromParlaySrc(tdSrc, 'td_parlays');
  addFromParlaySrc(spreadSrc, 'spread_parlays');
  addFromParlaySrc(parlaySrc, 'parlays');

  return pool;
}

function shuffledSample(arr, n){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}

function scrambleLegRowHTML(leg){
  const game = gameForEventId(leg.canonical_event_id);
  const gameLabel = gameLabelWithTime(game);
  const sideLabel = sideLineLabel(leg);
  return `<div class="parlay-leg">
    <div><div class="who">${esc(leg.player || leg.side || '—')} ${gradeBadgeHTML(leg.grade, leg.actual_label)}</div>
      <div class="mkt">${esc(marketKeyLabel(leg.market_key || ''))}${gameLabel ? ' · ' + esc(gameLabel) : ''}</div>
      ${sideLabel}
      ${leg.reason ? `<div class="pc-pick-reason">${esc(leg.reason)}</div>` : ''}
    </div>
    <div class="px">${priceLine(leg.price)}${slipToggleBtn(leg)}</div>
  </div>`;
}

function renderScrambler(){
  const pool = scramblerPool();
  const sizeOptions = [3,4,5,6,7,8,9,10];
  const sizeButtons = sizeOptions.map(n =>
    `<button class="pc-scramble-size${SCRAMBLE_SIZE === n ? ' active' : ''}" data-n="${n}">${n}</button>`
  ).join('');
  const canGenerate = pool.length >= 3;

  let resultHTML = '';
  if(SCRAMBLE_RESULT && SCRAMBLE_RESULT.length){
    const rows = SCRAMBLE_RESULT.map(leg => scrambleLegRowHTML(leg)).join('');
    const addable = SCRAMBLE_RESULT.filter(l => l.price !== null && l.price !== undefined);
    const allIn = addable.length > 0 && addable.every(l => isLegInSlip(l));
    const combined = combinedDecimalOdds(SCRAMBLE_RESULT);
    const stake = 10;
    resultHTML = `<div class="parlay-card" style="max-width:520px">
      <div class="parlay-head">
        <span class="parlay-size">${SCRAMBLE_RESULT.length}-Pick Scramble</span>
        <span class="parlay-badge pass">RANDOM DRAW</span>
        ${addable.length ? `<button class="pc-slip-btn pc-addall${allIn ? ' added' : ''}" id="pcScrambleAddAll" title="${allIn ? 'Remove these picks from your Prop Builder' : 'Add every pick in this scramble to your Prop Builder'}">${allIn ? '✓ All Added' : '+ Add All'}</button>` : ''}
      </div>
      <div class="parlay-legs">${rows}</div>
      <div class="parlay-foot">
        <span>Combined: <b>${combined.toFixed(2)}</b> (${priceLine(combined)})</span>
        <span>$${stake} → <b>$${(stake * combined).toFixed(2)}</b></span>
      </div>
    </div>`;
  }

  $('body').innerHTML = `
    <div class="lineup-note" style="margin-bottom:14px">
      Pools every real pick Coeus has already made across Coeus Favorite O/U, Coeus Anytime TD,
      Coeus Spreads, and Coeus Parlays — only legs from combinations that passed validation, and
      each pick counted once even if it shows up in more than one tab.
      <span class="pc-scramble-pool-note">${pool.length} unique pick${pool.length === 1 ? '' : 's'} in the pool right now.</span>
      Pick a size, hit Generate, and get that many drawn at random. This only reshuffles Coeus's
      existing picks — it never makes a new one of its own.
    </div>
    <div class="pc-scramble-controls">
      <div class="pc-scramble-sizes">${sizeButtons}</div>
      <button class="toggle-report pc-scramble-go" id="pcScrambleGo"${canGenerate ? '' : ' disabled'}>Generate</button>
    </div>
    ${!canGenerate ? '<div class="empty">Not enough picks in the pool yet (need at least 3) — generate Coeus\'s reports first.</div>' : ''}
    ${resultHTML}
  `;

  $('body').querySelectorAll('.pc-scramble-sizes button').forEach(btn => {
    btn.addEventListener('click', () => {
      SCRAMBLE_SIZE = parseInt(btn.dataset.n, 10);
      renderScrambler();
    });
  });
  if(canGenerate){
    $('pcScrambleGo').addEventListener('click', () => {
      SCRAMBLE_RESULT = shuffledSample(scramblerPool(), SCRAMBLE_SIZE);
      renderScrambler();
    });
  }
  const addAll = $('pcScrambleAddAll');
  if(addAll){
    addAll.addEventListener('click', () => {
      const legs = (SCRAMBLE_RESULT || []).filter(l => l.price !== null && l.price !== undefined);
      const allIn = legs.length > 0 && legs.every(l => isLegInSlip(l));
      if(allIn){
        const ids = new Set(legs.map(legId));
        SLIP = SLIP.filter(l => !ids.has(legId(l)));
      } else {
        legs.forEach(l => { if(!isLegInSlip(l)) SLIP.push(l); });
      }
      saveSlip(propsWeekFilter);
      updateSlipNavBadge();
      renderScrambler();
    });
  }
  wireSlipButtons($('body'), renderScrambler);
}

  if(!t) return '';

  // Units are flat 1-unit stakes at each pick's own real price (a whole

  const hasUnits = showUnits && typeof t.units === 'number' && decided > 0;

    ${hasUnits ? `<div class="pc-stat-pct ${unitsCls}">${t.units > 0 ? '+' : ''}${t.units.toFixed(2)}u</div>` : ''}
    ${t.ungraded ? `<div class="pc-stat-ungraded">${t.ungraded} ungraded</div>` : ''}

}

/* ── COMBO PROPS (RB rushing + receiving, QB passing + rushing) ──────── */
let COMBO = null;
let COMBO_HIST = null;
let COMBO_THREATS = {labels: {}, map: {}};
function comboNameKey(n){
  return String(n || '').toLowerCase().replace(/[.'\u2019]/g, '').replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '').replace(/[^a-z]/g, '');
}
// Game status. ESPN's public scoreboard (the same one the Games page uses; no scores are read or shown here) says
// whether each game is not started / in progress / final. If ESPN can't be reached, fall back to the kickoff clock:
// kickoff passed = started, and about 3.5 hours later = final.
let ESPN_STATE = {};
let ESPN_TIME = {};   // 'AWAY@HOME' -> kickoff ISO from ESPN, for rows whose game left the FanDuel board
let ESPN_OK = false;
let espnComboTimer = null;
const ESPN_FIX = {WSH: 'WAS'};
async function comboPollEspn(){
  if(!COMBO || !COMBO.season || !COMBO.week) return false;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 4000);
  try{
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&dates=${COMBO.season}&week=${COMBO.week}`,
      {cache: 'no-store', signal: ctl.signal});
    if(!r.ok) return false;
    const d = await r.json();
    const next = {};
    (d.events || []).forEach(ev => {
      const c = (ev.competitions || [])[0]; if(!c || !c.competitors) return;
      const a = c.competitors.find(x => x.homeAway === 'away'), h = c.competitors.find(x => x.homeAway === 'home');
      if(!a || !h) return;
      const code = x => ESPN_FIX[x.team.abbreviation] || x.team.abbreviation;
      next[code(a) + '@' + code(h)] = c.status && c.status.type ? c.status.type.state : null;   // 'pre' | 'in' | 'post'
      ESPN_TIME[code(a) + '@' + code(h)] = c.date || ev.date || null;
    });
    const changed = JSON.stringify(next) !== JSON.stringify(ESPN_STATE);
    ESPN_STATE = next; ESPN_OK = Object.keys(next).length > 0;
    return changed;
  }catch(e){ return false; }
  finally{ clearTimeout(to); }
}
function comboStartEspnWatch(){
  if(espnComboTimer) return;
  espnComboTimer = setInterval(async () => {
    const changed = await comboPollEspn();
    const typing = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('prop-input');
    if(changed && !typing && $("comboGrid") && !$("modal").classList.contains("open")) renderComboGrid();
    if(ESPN_OK && Object.values(ESPN_STATE).every(x => x === 'post')){ clearInterval(espnComboTimer); espnComboTimer = null; }
  }, 90000);
}
// A played game drops off the FanDuel board, so its rows can lose their opponent and kickoff time.
// ESPN's scoreboard (already polled) still lists every game of the week, so use it to fill the gap.
function comboMatch(r){
  if(r.opp) return {opp: r.opp, home: r.home, key: r.home ? r.opp + '@' + r.team : r.team + '@' + r.opp};
  for(const k of Object.keys(ESPN_STATE)){
    const [a, h] = k.split('@');
    if(a === r.team) return {opp: h, home: false, key: k};
    if(h === r.team) return {opp: a, home: true, key: k};
  }
  return null;
}
function comboKick(r){
  const iso = r.game && r.game.commence_time;
  if(iso) return iso;
  const m = comboMatch(r);
  return m ? (ESPN_TIME[m.key] || null) : null;
}
function comboGameId(r){
  const mm = comboMatch(r);
  if(!mm || !COMBO) return null;
  const away = mm.home ? mm.opp : r.team, home = mm.home ? r.team : mm.opp;
  return `${COMBO.season}_${String(COMBO.week).padStart(2, '0')}_${away}_${home}`;
}
function comboFootHTML(r, gs){
  if(gs === 'final'){
    const id = comboGameId(r);
    return id ? `<a href="games.html?week=${COMBO.week}&game=${encodeURIComponent(id)}" onclick="event.stopPropagation()" style="color:inherit;text-decoration:none">Final · View Box Score ›</a>`
              : 'Final · View Breakdown ›';
  }
  return gs ? 'In progress · View Breakdown ›' : 'Click for Full Breakdown ›';
}
function comboGameState(r){
  const mm = comboMatch(r);
  if(ESPN_OK && mm){
    const st = ESPN_STATE[mm.key];
    if(st) return st === 'post' ? 'final' : (st === 'in' ? 'live' : null);
  }
  const iso = comboKick(r); if(!iso) return null;
  const t = new Date(iso).getTime(); if(isNaN(t)) return null;
  const d = Date.now() - t;
  return d < 0 ? null : (d < 3.5 * 3600 * 1000 ? 'live' : 'final');
}

// ---- Prop Builder: Combo legs go straight into this page's own slip (same legId format as every other leg).
let COMBO_EVENTS = {};
const COMBO_MKEY = {pass_rush: 'player_combo_passing_rushing_yards', rush_rec: 'player_combo_rushing_receiving_yards'};
function comboToDecimal(p){
  if(p == null || isNaN(Number(p))) return 1.885;           // -113 assumed when no price was saved
  p = Number(p);
  if(Math.abs(p) >= 100) return p < 0 ? 1 + 100 / (-p) : 1 + p / 100;
  return p;
}
function comboAm(dec){
  if(dec == null) return '—';

function comboToggleSlip(i, side){
  const r = COMBO_VIEW[i]; if(!r) return;
  const leg = comboLeg(r, side); if(!leg) return;
  const slip = comboSlipRead(), id = comboLegId(leg);
  const idx = slip.legs.findIndex(l => comboLegId(l) === id);
  if(idx >= 0) slip.legs.splice(idx, 1);
  else{
    // one side per player and market: adding Over replaces an Under on the same prop
    slip.legs = slip.legs.filter(l => !(l.canonical_event_id === leg.canonical_event_id && l.market_key === leg.market_key && l.player === leg.player));
    slip.legs.push(leg);
  }
  if(!comboSlipWrite(slip)) alert('Your browser blocked saving the Prop Builder slip (private window or blocked storage).');
  document.querySelectorAll('.combo-slip-btn').forEach(b => {
    const [bi, bs] = b.dataset.slip.split('|'); const rr = COMBO_VIEW[Number(bi)]; if(!rr) return;
    const lg = comboLeg(rr, bs); if(!lg) return;
    const on = comboInSlip(lg);

    b.textContent = on ? '✓ In Prop Builder' : (b.dataset.lbl || b.textContent);
  });
}

function comboSetOverride(key, val){

function comboKey(r){ return r.player + '|' + r.market; }
function comboPhi(z){
  const x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return 0.5 * (1 + (z < 0 ? -y : y));
}
function comboBreakEven(p){
  if(p == null || p === '') p = -113;
  p = Number(p);
  if(Math.abs(p) >= 100) return p < 0 ? (-p) / (-p + 100) : 100 / (p + 100);
  return p > 1 ? 1 / p : 0.5;
}
function comboEval(r, point, overP, underP){
  const pr = r.projection; if(!pr || point == null || isNaN(point)) return null;
  const z = (point - pr.proj_total) / pr.sd;
  const pOver = 1 - comboPhi(z), pUnder = comboPhi(z);
  const eO = pOver - comboBreakEven(overP), eU = pUnder - comboBreakEven(underP);
  const over = eO >= eU;
  const edge = over ? eO : eU, p = over ? pOver : pUnder;
  const gap = Math.abs(pr.proj_total - point) / point;
  let lean = edge >= COMBO_STRONG ? 'STRONG' : (edge >= COMBO_LEAN ? 'LEAN' : 'NEUTRAL');
  if(lean !== 'NEUTRAL' && gap > COMBO_MAX_GAP) lean = 'CHECK';
  return { side: over ? 'OVER' : 'UNDER', p, edge, lean, gap, pOver, pUnder, diff: pr.proj_total - point };
}

function comboRows(){
  if(!COMBO) return [];
  const pos = comboPos === 'QB' ? 'pass_rush' : 'rush_rec';
  let rows = (COMBO.rows || []).filter(r => r.market === pos);
  const hasLine = r => !!comboEffLine(r);
  if(comboOnlyLine === null) comboOnlyLine = rows.some(hasLine);
  if(comboOnlyLine) rows = rows.filter(hasLine);
  const q = comboSearch;
  if(q) rows = rows.filter(r => r.player.toLowerCase().includes(q) || (r.team || '').toLowerCase().includes(q) || (r.opp || '').toLowerCase().includes(q));
  const score = r => {
    const L = comboEffLine(r); if(!L || !r.projection) return -1;
    const ev = comboEval(r, L.point, L.over_price, L.under_price);
    return ev ? ev.edge : -1;
  };
  rows.sort((a, b) => (score(b) - score(a)) || ((b.projection ? b.projection.proj_total : 0) - (a.projection ? a.projection.proj_total : 0)));
  return rows;
}

      The projection does not model game script or injuries, so a gap of more than 12% from the line gets a dashed ⚠ label and a caution note.
      Coeus makes the final call and every pick is saved and graded afterward.
    </div>
    <div class="report-controls">
      <div class="tabs" id="comboTabs" role="tablist">
        <button role="tab" data-p="QB" aria-selected="${comboPos === 'QB'}">QB · Pass + Rush</button>
        <button role="tab" data-p="RB" aria-selected="${comboPos === 'RB'}">RB · Rush + Rec</button>
      </div>
      <label class="lbl" style="font-size:11px;color:var(--text-mid);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="comboOnly" ${comboOnlyLine ? 'checked' : ''}> only players with a FanDuel line
      </label>
      <input class="search-box" id="comboSearch" placeholder="Search player or team…" value="${esc2(comboSearch)}">
      <span class="rank-chip">built ${esc2((COMBO.generated_at || '').replace('T', ' ').replace('Z', ' UTC'))}</span>
      ${comboRecordHTML()}
    </div>
    <div class="intel-grid" id="comboGrid" style="grid-template-columns:repeat(auto-fill,minmax(430px,1fr))"></div>`;
  $("comboTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    comboPos = b.dataset.p;
    $("comboTabs").querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
    renderComboGrid();
  });
  $("comboOnly").onchange = e => { comboOnlyLine = e.target.checked; renderComboGrid(); };
  $("comboSearch").oninput = e => { comboSearch = e.target.value.toLowerCase(); renderComboGrid(); };
  renderComboGrid();
}

const COMBO_TZ = 'America/New_York';
function comboET(iso){
  if(!iso) return null;
  const d = new Date(iso); if(isNaN(d)) return null;
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: COMBO_TZ, weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: false})
    .formatToParts(d).map(p => [p.type, p.value]));
  const h = Number(parts.hour) % 24;
  const t12 = new Intl.DateTimeFormat('en-US', {timeZone: COMBO_TZ, hour: 'numeric', minute: '2-digit', hour12: true}).format(d);
  return {dow: parts.weekday, h, label: `${parts.weekday} ${t12} ET`, t12: t12 + ' ET'};
}
function comboSlot(iso){
  const e = comboET(iso);
  if(!e) return {rank: 99, title: 'Time not posted yet', sub: ''};
  if(e.dow === 'Thu') return {rank: 1, title: 'Thursday Night', sub: e.t12};
  if(e.dow === 'Fri' || e.dow === 'Sat') return {rank: 2, title: e.dow === 'Fri' ? 'Friday' : 'Saturday', sub: e.t12};
  if(e.dow === 'Sun'){
    if(e.h < 12) return {rank: 3, title: 'Sunday Morning (international game)', sub: e.t12};
    if(e.h < 16) return {rank: 4, title: 'Sunday Early Games', sub: '1:00 PM ET'};
    if(e.h < 19) return {rank: 5, title: 'Sunday Late Games', sub: '4:00 PM ET window'};
    return {rank: 6, title: 'Sunday Night Football', sub: e.t12};
  }
  if(e.dow === 'Mon') return {rank: 7, title: 'Monday Night Football', sub: e.t12};
  return {rank: 8, title: e.dow, sub: e.t12};
}
let COMBO_VIEW = [];
function renderComboGrid(){
  // Group by kickoff slot (Thursday, Sunday early, Sunday late, SNF, MNF); order inside a slot stays best-edge first.
  const tagged = comboRows().map((r, k) => ({r, k, s: comboSlot(comboKick(r))}))
    .sort((a, b) => (a.s.rank - b.s.rank) || (a.k - b.k));
  const slots = tagged.map(x => x.s);
  COMBO_VIEW = tagged.map(x => x.r);
  let html = '', last = null;
  COMBO_VIEW.forEach((r, i) => {
    const sl = slots[i], key = sl.rank + '|' + sl.title;
    if(key !== last){
      const mine = COMBO_VIEW.filter((_, j) => slots[j].rank + '|' + slots[j].title === key);
      const games = [...new Set(mine.map(x => { const m = comboMatch(x); return m ? (m.home ? `${m.opp} @ ${x.team}` : `${x.team} @ ${m.opp}`) : null; }).filter(Boolean))];
      const sts = mine.map(comboGameState), allPlayed = sts.every(x => x), allFinal = sts.every(x => x === 'final');
      html += `<div class="slot-head${allPlayed ? ' played' : ''}"><span class="sh-t">${esc2(sl.title)}</span><span class="sh-m">${allPlayed ? (allFinal ? 'FINAL' : 'STARTED') + ' · ' : ''}${esc2(sl.sub)} · ${mine.length} player${mine.length === 1 ? '' : 's'}</span>
        <span class="sh-m">${games.map(esc2).join(' · ')}</span></div>`;
      last = key;
    }
    html += comboCardHTML(r, i);
  });
  $("comboGrid").innerHTML = html ||
    `<div class="empty">${comboOnlyLine ? 'No players with a FanDuel line yet. Add one with <b>--add</b> or untick the box to see every player with both halves posted.' : 'No players match.'}</div>`;
  $("comboGrid").querySelectorAll('.intel-card').forEach(el => { el.onclick = () => openComboModal(Number(el.dataset.i)); });
  comboWireSlip($("comboGrid"));
  $("comboGrid").querySelectorAll('input.prop-input').forEach(inp => {
    inp.oninput = () => {
      const i = Number(inp.dataset.i), r = COMBO_VIEW[i], v = inp.value === '' ? null : Number(inp.value);
      comboSetOverride(comboKey(r), v == null || isNaN(v) ? null : { line: v });
      const cr = $("cres_" + i); if(cr) cr.innerHTML = comboResultHTML(r);
    };
  });
  $("comboGrid").querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
    comboSetOverride(comboKey(COMBO_VIEW[Number(b.dataset.clear)]), null); renderComboGrid();
  });
}

function bdVal(x, unit){
  if(!x || x.avg == null) return `<span class="rank-chip">no games</span>`;
  return `<b>${x.avg}</b>${unit || ''} <span class="rank-chip">${comboNText(x.games)}</span>`;
}
function bdRankChip(rank){
  if(!rank) return '';
  const t = rank <= 10 ? 'top' : (rank <= 22 ? 'mid' : 'bot');
  return comboTierChip(t, TIER_NAME[t], rank);
}
const TIER_NAME = {top: 'Top 10', mid: 'Mid 12', bot: 'Bottom 10'};
function bdPlayerSide(r, bd){
  const pk = r.player_rank, pos = bd.pos;
  const rankLine = pk ? `Season #${pk.season_rank} of ${pk.of} ${pos}s · last 5 #${pk.l5_rank}` : `not ranked yet (needs 3 games)`;
  const blocks = bd.player.map(row => {
    const opp = row.opp_rank ? `${esc2(r.opp)} is ${bdRankChip(row.opp_rank)}` : '';
    return `<div class="bd-block ${row.key === 't' ? 'bd-comb' : ''}">
      <div class="bd-block-t"><span>${esc2(row.name)}</span><span>${opp}</span></div>
      <div class="ic-row"><span class="ic-row-label">Season avg</span><span>${bdVal(row.season, '/gm')}</span></div>
      <div class="ic-row"><span class="ic-row-label">Last 3 avg</span><span>${bdVal(row.last3, '/gm')}</span></div>
      <div class="ic-row"><span class="ic-row-label">Last 5 avg</span><span>${bdVal(row.last5, '/gm')}</span></div>
      <div class="ic-row"><span class="ic-row-label">Avg vs ${esc2(row.opp_tier_label || '—')} defenses</span><span>${bdVal(row.vs_tier, '/gm')}</span></div>
      ${row.vs_fine ? `<div class="ic-row"><span class="ic-row-label">Avg vs ${esc2(row.vs_fine.label)} defenses</span><span>${bdVal(row.vs_fine, '/gm')}</span></div>` : ''}
    </div>`;
  }).join('');
  return `<div class="bd-col">
    <div class="bd-head"><img class="ic-headshot" src="${esc2(r.headshot || '')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <div><div class="bd-h1">${esc2(r.player)}</div><div class="bd-h2">${fiLogoHTML(r.team, 14)}${esc2(r.team)} ${esc2(pos)} · ${esc2(rankLine)}</div></div></div>
    ${blocks}
    <div class="bd-note">2026 games only (QBs with 10+ attempts; other positions 3+ carries + targets). "Avg vs Bottom 10 defenses" is how this player has done against defenses in the same tier as ${esc2(r.opp)} for that stat.</div>
  </div>`;
}
function bdDefSide(r, bd){
  const pt = bd.player_tier;
  const ptLabel = pt && pt.label ? pt.label : null;
  const blocks = bd.defense.map(d => {
    const rec = (x) => x ? `<b>${x.pg}</b>/gm ${bdRankChip(x.rank)} <span class="rank-chip">${comboNText(x.games)}</span>` : `<span class="rank-chip">no games</span>`;
    const tier = (x) => x && x.avg != null ? bdVal(x, '/gm') : `<span class="rank-chip">no games</span>`;
    return `<div class="bd-block ${d.key === 't' ? 'bd-comb' : ''}">
      <div class="bd-block-t"><span>${esc2(d.name)} allowed</span><span>${bdRankChip(d.rank)}</span></div>
      <div class="ic-row"><span class="ic-row-label">Season avg allowed</span><span>${d.season_pg != null ? `<b>${d.season_pg}</b>/gm` : '—'}</span></div>
      <div class="ic-row"><span class="ic-row-label">Last 3 allowed</span><span>${rec(d.last3)}</span></div>
      <div class="ic-row"><span class="ic-row-label">Last 5 allowed</span><span>${rec(d.last5)}</span></div>
      <div class="ic-row"><span class="ic-row-label">${ptLabel ? 'Allowed to ' + esc2(ptLabel) : 'Allowed to this player\'s tier'}</span><span>${ptLabel ? tier(d.vs_tier) : '<span class="rank-chip">player not ranked yet</span>'}</span></div>
      ${pt && pt.fine_label ? `<div class="ic-row"><span class="ic-row-label">Allowed to ${esc2(pt.fine_label)}</span><span>${tier(d.vs_fine)}</span></div>` : ''}
    </div>`;
  }).join('');
  return `<div class="bd-col">
    <div class="bd-head">${r.opp ? fiLogoHTML(r.opp, 34) : ''}
      <div><div class="bd-h1">${esc2(r.opp || '—')} defense</div><div class="bd-h2">vs ${esc2(bd.pos)}s · faces ${esc2(r.player)}${ptLabel ? ' · ' + esc2(ptLabel) : ''}</div></div></div>
    ${blocks}
    <div class="bd-note">Yards per game allowed by the whole defense to ${esc2(bd.pos)}s. "Allowed to ${esc2(ptLabel || 'this tier')}" is the defense's average per player-game against ${esc2(bd.pos)}s ranked in the same tier as ${esc2(r.player)} (season rank by combined yards per game); small samples are marked thin.</div>
  </div>`;
}
function bdSectionHTML(r){
  const bd = r.breakdown;
  if(!bd) return `<div class="empty" style="padding:16px 0;text-align:left">No breakdown available for this player yet (no opponent this week, or no ${esc2(r.pos || '')} matchup data).</div>`;
  return `<div class="bd-grid">${bdPlayerSide(r, bd)}<div class="bd-mid"><span>VS.</span></div>${bdDefSide(r, bd)}</div>`;
}
function openComboModal(i){

  $("mTitle").textContent = `${r.player} — ${r.team} ${(comboMatch(r) || r).home ? 'vs' : '@'} ${(comboMatch(r) || {}).opp || '—'}`;

  const comp = pr ? `<div class="lead-wrap" style="max-height:none"><table class="lead-table"><thead><tr>

    </tr></thead><tbody>${pr.components.map((c, k) => `<tr>

  const logRows = (r.log || []).slice().reverse().map(g => {

    return `<tr><td class="name-col">${g.season} wk ${g.week}</td><td>${esc2(g.opp || '—')}</td>

  const names = pr ? pr.components.map(c => c.name) : ['A', 'B'];
  $("modal").classList.add("combo-wide");
  $("mBody").innerHTML = `

      <div class="combo-box">${comboResultHTML(r)}</div></div>

    <div class="ic-section-label" style="margin-top:26px">Model details</div>
    <div class="ic-section-label">How the projection is built</div>${comp}
    <div class="ic-section-label">Recent games (green = over the line${L ? ' ' + L.point : ''}, red = under)</div>
    <div class="lead-wrap" style="max-height:none"><table class="lead-table"><thead><tr>
      <th class="name-col">Game</th><th>Opp</th><th>${esc2(names[0])}</th><th>${esc2(names[1])}</th><th>Total</th></tr></thead>
      <tbody>${logRows || '<tr><td class="name-col">No games</td><td></td><td></td><td></td><td></td></tr>'}</tbody></table></div>
    <div class="ic-section-label">Alt line tester</div>
    <div class="prop-input-row" onclick="event.stopPropagation()">
      <label>LINE</label><input class="prop-input" id="altLine" type="number" step="0.5" value="${L ? L.point : ''}">
