<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DFS Center — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/javascript-lp-solver/dist/solver.global.js"></script>
<style>
.drop-zone{
  border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:48px 24px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
.drop-zone:hover,.drop-zone.drag{border-color:var(--primary);background:var(--surface2)}
.drop-zone .dz-title{font-family:var(--font-display);font-weight:700;font-size:16px;margin-bottom:6px}
.drop-zone .dz-sub{font-size:12px;color:var(--text-dim);font-family:var(--font-mono)}
.caveat{
  background:rgba(250,204,21,.07);border:1px solid rgba(250,204,21,.3);border-radius:var(--radius);
  padding:10px 14px;font-size:11.5px;color:var(--text-mid);margin-bottom:16px;line-height:1.5;
}
.caveat b{color:var(--accent-gold)}
.file-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.file-name{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
.replace-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text-mid);font-family:var(--font-mono);font-size:10px;padding:6px 12px;cursor:pointer;
}
.replace-btn:hover{color:var(--text);border-color:var(--border2)}
.search-box{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:12px;padding:7px 12px;width:220px;
}
.search-box::placeholder{color:var(--text-dim)}
.slate-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.card-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:8px}
.play-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.play-card .pc-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:2px}
.play-card .pc-name{font-family:var(--font-display);font-weight:700;font-size:15px}
.play-card .pc-team{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:10px}
.play-card .pc-opp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mid);margin-bottom:12px;
  font-family:var(--font-mono)}
.pc-factors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.pc-factor{background:var(--surface2);border-radius:var(--radius-sm);padding:6px 4px;text-align:center}
.pc-factor .f-label{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.pc-factor .f-value{font-family:var(--font-mono);font-weight:600;font-size:13px;margin-top:2px}
.pc-bottom{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px solid var(--hairline)}
.pc-salary{font-family:var(--font-mono);font-weight:700;font-size:16px}
.pc-score{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.status-pill{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px}
.status-pill.q{color:var(--accent-gold);background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.3)}
.status-pill.out,.status-pill.ir{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.lead-wrap{overflow:auto;max-height:calc(100vh - 300px);border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:12px}
.lead-table{width:100%;border-collapse:separate;border-spacing:0}
.lead-table thead th{
  padding:9px 12px;text-align:right;font-family:var(--font-mono);font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;
  cursor:pointer;user-select:none;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface2);z-index:3;
}
.lead-table thead th:hover{color:var(--text)}
.lead-table thead th.sorted{color:var(--primary)}
.lead-table thead th.name-col{text-align:left;left:0;z-index:4}
.lead-table td{padding:8px 12px;font-size:12px;text-align:right;border-bottom:1px solid var(--hairline);white-space:nowrap}
.lead-table tbody tr:last-child td{border-bottom:0}
.lead-table tbody tr:hover td{background:var(--surface2)}
.lead-table td.name-col{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.lead-table tbody tr:hover td.name-col{background:var(--surface2)}
.cell-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-mid);font-size:12px}
.stack-builder-layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
#stackListsCol{min-width:0}
#builderCol{
  position:sticky;top:70px;border-left:1px solid var(--border);padding-left:20px;
}
.builder-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.builder-title{font-family:var(--font-display);font-weight:700;font-size:15px}
.builder-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:10px}
.builder-sub.over{color:var(--accent-red)}
.builder-slot{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);
  border:1px solid var(--border);margin-bottom:5px;font-size:12px;min-height:34px;
}
.builder-slot.filled{background:var(--surface2);cursor:pointer}
.builder-slot.filled:hover{border-color:var(--accent-red)}
.builder-slot.empty{color:var(--text-dim);border-style:dashed}
.builder-slot .bs-pos{
  font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-dim);width:32px;flex:none;
}
.builder-slot .bs-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.builder-slot .bs-salary{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex:none}
.builder-slot.selected-stack{border-color:var(--primary)}
.excluded-chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.excluded-chip{
  display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;
  color:var(--accent-red);background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.3);
  border-radius:3px;padding:2px 6px;cursor:pointer;
}
.excluded-chip:hover{background:rgba(244,63,94,.16)}
.excluded-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.play-card.stack-selected{border-color:var(--primary);background:var(--surface2)}
.search-result{
  display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12px;cursor:pointer;
  border-bottom:1px solid var(--hairline);
}
.search-result:hover{background:var(--surface2)}
.search-result.disabled{opacity:.35;cursor:not-allowed}
.search-result .sr-pos{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:26px;flex:none}
.search-result .sr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-result .sr-salary{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex:none}
@media(max-width:900px){
  .stack-builder-layout{grid-template-columns:1fr}
  #builderCol{position:static;border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:16px;margin-top:8px}
}
.lineup-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.gen-btn{
  background:var(--primary);color:var(--bg);border:none;border-radius:var(--radius);
  font-family:var(--font-display);font-weight:700;font-size:13px;padding:10px 20px;cursor:pointer;
}
.gen-btn:hover{opacity:.9}
.gen-btn:disabled{opacity:.5;cursor:default}
.lineup-note{font-size:11px;color:var(--text-dim);font-family:var(--font-mono)}
.lineup-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.lineup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.lineup-card .lc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
  padding-bottom:10px;border-bottom:1px solid var(--hairline)}
.lineup-card .lc-title{font-family:var(--font-display);font-weight:700;font-size:14px}
.lineup-card .lc-salary{font-family:var(--font-mono);font-size:12px;color:var(--text-mid)}
.lineup-card .lc-salary b{color:var(--primary)}
.lineup-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.lineup-row .lr-pos{
  font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-dim);
  width:32px;flex:none;
}
.lineup-row .lr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lineup-row .lr-salary{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex:none}
.stack-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.bringback-toggle{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-mid);cursor:pointer;
}
.bringback-toggle input{cursor:pointer}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script>
const main = fiShell({ page:'dfs', pageLabel:'DFS Center', status:'loading' });

let CSV_PLAYERS = null;
let MATCHUP = null;
let bestPos = 'QB';
let slatePos = 'ALL';
let slateSort = 'value', slateDir = 'desc';
let searchTerm = '';
let dfsView = 'best'; // 'best' | 'lineups' | 'slate'
let stackMode = 'none'; // 'none' | 'stack' | 'double' | 'onslaught'
let scoringMode = 'composite'; // 'composite' | 'matchup_history' | 'ceiling'
let generatorCount = 5; // 5 | 10 | 15 | 25
let bestView = 'players'; // 'players' | 'stacks'
let stackBasis = 'recommended'; // 'recommended' | 'matchup' | 'contextual'
const BUILDER_SLOT_LABELS = ['QB','RB','RB','WR','WR','WR','TE','FLEX','DST'];
let builderSlots = BUILDER_SLOT_LABELS.map(label => ({ label, player: null }));
let selectedStackSig = null;
let builderSearchTerm = '';
let loadedFileName = null;
const STORAGE_KEY = 'fi_dfs_slate_v1';

function saveSlate(players, fileName){
  try{
    const raw = players.map(p => ({
      name:p.name, pos:p.pos, team:p.team, salary:p.salary,
      avgPts:p.avgPts, status:p.status, gameInfo:p.gameInfo,
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ raw, fileName, savedAt: Date.now() }));
  }catch(e){ /* storage full/unavailable — upload still works, just won't persist */ }
}
function loadSavedSlate(){
  try{
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : null;
  }catch(e){ return null; }
}
function clearSavedSlate(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

main.innerHTML = `
  <div class="bar">
    <span class="lbl">DFS Center</span>
    <div class="legend"><span>Upload a DraftKings salary CSV to get started</span></div>
  </div>
  <div id="content"></div>`;

const $ = id => document.getElementById(id);

let PLAYERSTATS = null;
let NAME_INDEX = { exact: {}, lastname: {} };
let unmatchedRelevant = [];

function normalizeName(name){
  return String(name).toLowerCase().trim()
    .replace(/[.']/g, '')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b\.?\s*$/, '')
    .trim().replace(/\s+/g, ' ');
}

function buildNameIndex(playerStats){
  const exact = {}, lastname = {};
  ['QB','RB','WR','TE'].forEach(pos => {
    (playerStats.players[pos] || []).forEach(p => {
      const norm = normalizeName(p.name);
      exact[norm + '|' + pos] = p;
      const last = norm.split(' ').pop();
      const key = last + '|' + pos;
      (lastname[key] = lastname[key] || []).push(p);
    });
  });
  return { exact, lastname };
}

function firstNamesSimilar(normA, normB){
  const a = normA.split(' ')[0], b = normB.split(' ')[0];
  if(!a || !b) return false;
  const len = Math.min(3, a.length, b.length);
  return a.slice(0, len) === b.slice(0, len);
}

function matchSiteData(dkPlayer){
  const norm = normalizeName(dkPlayer.name);
  const exactHit = NAME_INDEX.exact[norm + '|' + dkPlayer.pos];
  if(exactHit) return exactHit;
  const last = norm.split(' ').pop();
  const candidates = NAME_INDEX.lastname[last + '|' + dkPlayer.pos] || [];
  if(candidates.length !== 1) return null;
  // Last name alone isn't safe enough — "Robert Henry Jr." and "Derrick
  // Henry" both being the only "Henry" RB would otherwise wrongly match a
  // deep-bench player to a superstar's stats. Require the first names to
  // at least share a 3-character prefix (also handles nicknames like
  // Kenny/Kenneth) before accepting the fallback.
  const cand = candidates[0];
  return firstNamesSimilar(norm, normalizeName(cand.name)) ? cand : null;
}

const TIER_LABEL = { top: 'Top 10', mid: 'Middle 12', bot: 'Bottom 10' };
function tierOf(rank){
  if(rank <= 10) return 'top';
  if(rank <= 22) return 'mid';
  return 'bot';
}

async function load(){
  fiStatus("Loading","loading");
  try{
    const res = await fetch(`matchup/wk18.json`);
    if(res.ok) MATCHUP = await res.json();
  }catch(e){ /* opponent grading unavailable without it */ }
  try{
    const res = await fetch(`players/latest.json`);
    if(res.ok){ PLAYERSTATS = await res.json(); NAME_INDEX = buildNameIndex(PLAYERSTATS); }
  }catch(e){ /* matchup history / ceiling modes unavailable without it */ }

  const saved = loadSavedSlate();
  if(saved && saved.raw && saved.raw.length){
    CSV_PLAYERS = saved.raw.map(r => ({...r}));
    computeAll(CSV_PLAYERS);
    loadedFileName = saved.fileName || null;
  }

  fiStatus("Ready");
  fiUpdated(CSV_PLAYERS ? `${CSV_PLAYERS.length} players loaded` : "no slate loaded");
  renderShell();
}

function renderShell(){
  if(!CSV_PLAYERS){
    $("content").innerHTML = `
      <div class="drop-zone" id="dropZone">
        <div class="dz-title">Drop a DraftKings salary CSV here</div>
        <div class="dz-sub">or click to browse · exported from DraftKings' "Export Players" button</div>
        <input type="file" accept=".csv" id="fileInput" style="display:none">
      </div>`;
    wireUpload();
    return;
  }

  $("content").innerHTML = `
    <div class="file-bar">
      <span class="file-name">${CSV_PLAYERS.length} players loaded${loadedFileName ? ' · ' + esc(loadedFileName) : ''}</span>
      <button class="replace-btn" id="replaceBtn">Replace file</button>
    </div>
    ${MATCHUP ? `<div class="caveat"><b>Opponent grading note:</b> using ${MATCHUP.season} season-final
      defense-vs-position ranks (through week ${MATCHUP.week}) as the matchup signal — there's no current-season
      data yet this early. This updates automatically once real games are on the board.</div>`
      : `<div class="caveat"><b>No opponent data found</b> — matchup/wk18.json didn't load, so Best Plays will
      skip the opponent factor. Salary and value still work fine.</div>`}

    <div class="tabs view-switch" id="dfsViewSwitch" role="tablist">
      <button role="tab" data-view="best" aria-selected="${dfsView==='best'}">Best Plays</button>
      <button role="tab" data-view="lineups" aria-selected="${dfsView==='lineups'}">Lineup Generator</button>
      <button role="tab" data-view="slate" aria-selected="${dfsView==='slate'}">Full Slate</button>
    </div>

    <div id="viewBest" style="display:${dfsView==='best'?'':'none'}">
      <div class="tabs" id="bestViewTabs" role="tablist">
        <button role="tab" data-view="players" aria-selected="true">Players</button>
        <button role="tab" data-view="stacks" aria-selected="false">Stacks</button>
      </div>
      <div id="bestPlayersPanel">
        <div class="tabs" id="bestPosTabs" role="tablist"></div>
        <div class="card-grid" id="bestCards"></div>
      </div>
      <div id="bestStacksPanel" style="display:none">
        <div class="tabs" id="stackBasisTabs" role="tablist"></div>
        <div class="lineup-note" id="stackBasisNote" style="margin-bottom:14px"></div>
        <div class="stack-builder-layout">
          <div id="stackListsCol">
            <div class="sect"><h3>Single stack — QB + 1</h3><span class="rule"></span></div>
            <div class="card-grid" id="stackSingleCards"></div>
            <div class="sect" style="margin-top:20px"><h3>Double stack — QB + 2</h3><span class="rule"></span></div>
            <div class="card-grid" id="stackDoubleCards"></div>
            <div class="sect" style="margin-top:20px"><h3>Triple stack — QB + 3</h3><span class="rule"></span></div>
            <div class="card-grid" id="stackTripleCards"></div>
          </div>
          <div id="builderCol">
            <div class="builder-head">
              <span class="builder-title">Lineup Builder</span>
              <button class="replace-btn" id="clearBuilderBtn">Clear</button>
            </div>
            <div class="builder-sub" id="builderSalary">Select a stack to begin</div>
            <div id="builderSlots"></div>
            <div id="builderExcluded"></div>
            <button class="gen-btn" id="builderGenBtn" style="width:100%;margin-top:10px">Generate rest of the lineup</button>
            <div class="sect" style="margin-top:18px"><h3>Search players</h3><span class="rule"></span></div>
            <input class="search-box" id="builderSearchBox" placeholder="Or search by name…" style="width:100%">
            <div id="builderSearchResults"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="viewLineups" style="display:${dfsView==='lineups'?'':'none'}">
      ${!PLAYERSTATS ? `<div class="caveat"><b>Matchup History and Ceiling modes unavailable</b> —
        players/latest.json didn't load. Season Composite mode still works fully.</div>` : ''}
      ${unmatchedRelevant.length ? `<div class="caveat"><b>${unmatchedRelevant.length} player(s)
        with real production couldn't be matched to site data</b> by name
        (${unmatchedRelevant.slice(0,6).map(p=>esc(p.name)).join(', ')}${unmatchedRelevant.length>6?'…':''}) —
        they'll use season-average as a fallback for Matchup History/Ceiling instead of their own history.</div>` : ''}
      <div class="tabs" id="scoringModeTabs" role="tablist"></div>
      <div class="lineup-controls">
        <div class="tabs" id="countTabs" role="tablist"></div>
        <button class="gen-btn" id="genBtn">Generate 5 lineups</button>
        <span class="lineup-note" id="scoringModeNote"></span>
      </div>
      <div class="lineup-note" id="exposureNote" style="margin-bottom:14px"></div>
      <div class="stack-controls">
        <div class="tabs" id="stackModeTabs" role="tablist"></div>
        <label class="bringback-toggle">
          <input type="checkbox" id="bringBackChk"> Bring-back (add 1+ opponent player)
        </label>
      </div>
      <div id="lineupResults"></div>
    </div>

    <div id="viewSlate" style="display:${dfsView==='slate'?'':'none'}">
      <div class="slate-controls">
        <div class="tabs" id="slatePosTabs" role="tablist"></div>
        <input class="search-box" id="searchBox" placeholder="Search players…">
      </div>
      <div class="lead-wrap"><table class="lead-table" id="slateTable"></table></div>
    </div>`;

  $("replaceBtn").onclick = () => { CSV_PLAYERS = null; loadedFileName = null; clearSavedSlate(); renderShell(); };
  $("genBtn").onclick = generateLineups;
  $("dfsViewSwitch").querySelectorAll("button").forEach(b => b.onclick = () => {
    dfsView = b.dataset.view; renderShell();
  });
  buildBestTabs();
  setupBuilderControls();
  buildScoringModeTabs();
  buildCountTabs();
  buildStackModeTabs();
  buildSlateTabs();
  $("searchBox").oninput = e => { searchTerm = e.target.value.toLowerCase(); renderSlate(); };
  renderBestPlays();
  if(bestView === 'stacks') renderStacks();
  renderSlate();
}

function wireUpload(){
  const zone = $("dropZone"), input = $("fileInput");
  zone.onclick = () => input.click();
  input.onchange = e => { if(e.target.files[0]) parseFile(e.target.files[0]); };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag'); };
  zone.ondragleave = () => zone.classList.remove('drag');
  zone.ondrop = e => {
    e.preventDefault(); zone.classList.remove('drag');
    if(e.dataTransfer.files[0]) parseFile(e.dataTransfer.files[0]);
  };
}

function parseFile(file){
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: results => {
      CSV_PLAYERS = results.data.map(normalizeRow).filter(p => p.pos);
      computeAll(CSV_PLAYERS);
      loadedFileName = file.name;
      saveSlate(CSV_PLAYERS, file.name);
      fiUpdated(`${CSV_PLAYERS.length} players loaded`);
      renderShell();
    },
  });
}

function normalizeRow(r){
  return {
    name: r['Name'], pos: r['Position'], team: r['TeamAbbrev'],
    salary: Number(r['Salary']) || 0, avgPts: Number(r['AvgPointsPerGame']) || 0,
    status: (r['Status'] || '').trim(), gameInfo: r['Game Info'] || '',
  };
}

function opponentOf(team, gameInfo){
  const m = gameInfo.match(/^([A-Z]+)@([A-Z]+)/);
  if(!m) return null;
  return m[1] === team ? m[2] : (m[2] === team ? m[1] : null);
}

function computeAll(players){
  const byPos = {};
  players.forEach(p => { (byPos[p.pos] = byPos[p.pos] || []).push(p); });

  players.forEach(p => {
    p.opp = opponentOf(p.team, p.gameInfo);
    p.value = p.salary ? (p.avgPts / (p.salary / 1000)) : 0;
    p.siteData = (PLAYERSTATS && p.pos !== 'DST') ? matchSiteData(p) : null;
  });

  unmatchedRelevant = players.filter(p =>
    p.pos !== 'DST' && !p.siteData && p.avgPts >= 5);

  for(const pos in byPos){
    const group = byPos[pos];
    const range = arr => [Math.min(...arr), Math.max(...arr)];
    const [vMin, vMax] = range(group.map(p => p.value));
    const [pMin, pMax] = range(group.map(p => p.avgPts));
    const norm = (v, lo, hi) => hi > lo ? ((v - lo) / (hi - lo)) * 100 : 50;
    const primaryKey = MATCHUP?.labels?.pos?.[pos] ? Object.keys(MATCHUP.labels.pos[pos])[0] : null;

    group.forEach(p => {
      p.valueScore = norm(p.value, vMin, vMax);
      p.perfScore = norm(p.avgPts, pMin, pMax);
      p.oppScore = null; p.oppRankLabel = null; p.oppTier = null;

      if(MATCHUP && p.opp && MATCHUP.teams[p.opp]){
        if(pos === 'DST'){
          const r = MATCHUP.teams[p.opp].team_off?.ppg?.r;
          if(r){ p.oppScore = ((r - 1) / 31) * 100; p.oppRankLabel = `Opp offense #${r}`; p.oppTier = tierOf(r); }
        } else if(primaryKey){
          const r = MATCHUP.teams[p.opp].def?.[pos]?.[primaryKey]?.r;
          if(r){ p.oppScore = ((r - 1) / 31) * 100; p.oppRankLabel = `Def vs ${pos} #${r}`; p.oppTier = tierOf(r); }
        }
      }

      const hasOpp = p.oppScore !== null;
      p.composite = hasOpp
        ? 0.4 * p.oppScore + 0.3 * p.valueScore + 0.3 * p.perfScore
        : 0.5 * p.valueScore + 0.5 * p.perfScore;
      // lineup generator's default mode: matchup + performance only, no salary/value
      p.quality = hasOpp ? 0.5 * p.oppScore + 0.5 * p.perfScore : p.perfScore;

      // Matchup History: this exact player's own history against defenses
      // in the same tier as their actual upcoming opponent. Needs 2+
      // qualifying games or it falls back to season average (avgPts) —
      // a 1-game sample is too noisy to build a lineup around.
      p.matchupHistoryGames = 0;
      if(p.siteData && p.oppTier && primaryKey){
        const split = p.siteData.splits[p.oppTier];
        const gamesForKey = split && split.games ? (split.games[primaryKey] || 0) : 0;
        if(split && gamesForKey >= 2 && split.m[primaryKey] != null){
          p.matchupHistoryRaw = split.m[primaryKey];
          p.matchupHistoryGames = gamesForKey;
        } else {
          p.matchupHistoryRaw = p.avgPts;
        }
      } else {
        p.matchupHistoryRaw = p.avgPts;
      }

      // Ceiling: average of this player's top-3 DK-scored games this
      // season. Needs 2+ games logged or falls back to season average.
      if(p.siteData && p.siteData.ceiling && p.siteData.ceiling.games >= 2){
        p.ceilingRaw = p.siteData.ceiling.top3avg;
        p.ceilingGames = p.siteData.ceiling.games;
        p.ceilingBest = p.siteData.ceiling.best;
      } else {
        p.ceilingRaw = p.avgPts;
        p.ceilingGames = 0;
        p.ceilingBest = null;
      }
    });

    const [mhMin, mhMax] = range(group.map(p => p.matchupHistoryRaw));
    const [ceMin, ceMax] = range(group.map(p => p.ceilingRaw));
    group.forEach(p => {
      p.matchupHistoryScore = norm(p.matchupHistoryRaw, mhMin, mhMax);
      p.ceilingScore = norm(p.ceilingRaw, ceMin, ceMax);
    });
  }
}

const STACK_BASIS_FIELDS = { recommended: 'composite', matchup: 'oppScore', contextual: 'matchupHistoryScore' };
const STACK_BASIS_NOTES = {
  recommended: 'Ranked by overall composite score (matchup + value + performance) for the QB and his pass-catchers combined.',
  matchup: "Ranked purely by opponent matchup quality — how weak the opposing defense is against this team's passing attack, ignoring value and recent form.",
  contextual: "Ranked by each player's own history against defenses in the same tier as this week's actual opponent (falls back to season average below 2 qualifying games).",
};

function computeStacks(size){
  const field = STACK_BASIS_FIELDS[stackBasis];
  const eligible = CSV_PLAYERS.filter(p => p.status !== 'OUT' && p.status !== 'IR');
  // One QB per team — the highest-salary one, the best available proxy for
  // "starter" without depth-chart data. Without this, a backup/third-string
  // QB (same team, same matchup) produces a near-duplicate stack entry.
  // One QB per team — highest AvgPointsPerGame is a better "who's actually
  // the starter" signal than salary alone. Salary can tie between a
  // starter and a backup in a genuine QB competition (e.g. Tua/Penix both
  // at $4,800 on ATL, where Penix is the real starter but avgPts separates
  // them correctly); salary only breaks ties when avgPts also matches.
  const qbsByTeam = {};
  eligible.filter(p => p.pos === 'QB').forEach(p => {
    const cur = qbsByTeam[p.team];
    if(!cur || p.avgPts > cur.avgPts || (p.avgPts === cur.avgPts && p.salary > cur.salary)){
      qbsByTeam[p.team] = p;
    }
  });
  const stacks = [];
  Object.values(qbsByTeam).forEach(qb => {
    const catchers = eligible
      .filter(p => p.team === qb.team && (p.pos === 'WR' || p.pos === 'TE'))
      .filter(p => p[field] != null)
      .sort((a,b) => b[field] - a[field])
      .slice(0, size);
    if(catchers.length < size || qb[field] == null) return; // not enough teammates for this stack size
    const group = [qb, ...catchers];
    const score = group.reduce((s,p) => s + p[field], 0) / group.length;
    stacks.push({ qb, catchers, score, salary: group.reduce((s,p)=>s+p.salary,0) });
  });
  stacks.sort((a,b) => b.score - a.score);
  return stacks.slice(0, 5);
}

function stackSig(stack){
  return stack.qb.name + '|' + stack.catchers.map(c=>c.name).join(',');
}

function stackCardHTML(stack){
  const playerRow = (p, tag) => `<div class="lineup-row">
    <span class="lr-pos">${tag}</span>
    <span class="lr-name">${esc(p.name)}${statusPill(p.status)}</span>
    <span class="lr-salary">$${p.salary.toLocaleString()}</span>
  </div>`;
  const sig = stackSig(stack);
  const selected = sig === selectedStackSig;
  return `<div class="play-card${selected?' stack-selected':''}" data-sig="${esc(sig)}" style="cursor:pointer">
    <div class="pc-top">
      <span class="pc-name">${esc(stack.qb.team)} Stack</span>
    </div>
    <div class="pc-team">vs ${esc(stack.qb.opp || '?')}${stack.qb.oppRankLabel ? ' · ' + esc(stack.qb.oppRankLabel) : ''}</div>
    ${playerRow(stack.qb, 'QB')}
    ${stack.catchers.map(c => playerRow(c, c.pos)).join('')}
    <div class="pc-bottom">
      <span class="pc-salary">$${stack.salary.toLocaleString()}</span>
      <span class="pc-score">score ${stack.score.toFixed(0)}</span>
    </div>
  </div>`;
}

function renderStacks(){
  buildStackBasisTabs();
  const stacksBySize = {};
  [['stackSingleCards',1], ['stackDoubleCards',2], ['stackTripleCards',3]].forEach(([id, size]) => {
    const stacks = computeStacks(size);
    stacksBySize[size] = stacks;
    $(id).innerHTML = stacks.length
      ? stacks.map(stackCardHTML).join('')
      : `<div class="empty">No eligible ${size===1?'single':size===2?'double':'triple'} stacks in this slate.</div>`;
    $(id).querySelectorAll('.play-card[data-sig]').forEach(card => {
      card.onclick = () => {
        const stack = stacks.find(s => stackSig(s) === card.dataset.sig);
        if(stack) selectStack(stack);
      };
    });
  });
  renderBuilderPanel();
}

/* ── LINEUP BUILDER ──────────────────────────────────────────────── */
function initBuilderSlots(){
  builderSlots = BUILDER_SLOT_LABELS.map(label => ({ label, player: null }));
}

function placeInBuilder(player){
  const compatible = idx => {
    const label = builderSlots[idx].label;
    if(label === player.pos) return true;
    if(label === 'FLEX' && ['RB','WR','TE'].includes(player.pos)) return true;
    return false;
  };
  // fill the named slot first, FLEX only as last resort
  let idx = builderSlots.findIndex((s,i) => !s.player && s.label === player.pos && compatible(i));
  if(idx === -1) idx = builderSlots.findIndex((s,i) => !s.player && s.label === 'FLEX' && compatible(i));
  if(idx === -1) return false;
  builderSlots[idx].player = player;
  return true;
}

function selectStack(stack){
  initBuilderSlots();
  placeInBuilder(stack.qb);
  stack.catchers.forEach(c => placeInBuilder(c));
  selectedStackSig = stackSig(stack);
  renderStacks();
}

let excludedNames = new Set();

function removeBuilderSlot(idx){
  const removed = builderSlots[idx].player;
  if(removed) excludedNames.add(removed.name);
  builderSlots[idx].player = null;
  selectedStackSig = null; // no longer matches any single stack once hand-edited
  renderBuilderPanel();
}

function builderUsedSalary(){
  return builderSlots.reduce((s, slot) => s + (slot.player ? slot.player.salary : 0), 0);
}

function renderBuilderPanel(){
  const used = builderUsedSalary();
  const remaining = 50000 - used;
  const filledCount = builderSlots.filter(s => s.player).length;
  const subEl = $("builderSalary");
  if(filledCount === 0){
    subEl.textContent = 'Select a stack to begin';
    subEl.className = 'builder-sub';
  } else {
    subEl.textContent = `$${used.toLocaleString()} used · $${remaining.toLocaleString()} remaining · ${filledCount}/9 filled`;
    subEl.className = 'builder-sub' + (remaining < 0 ? ' over' : '');
  }

  $("builderSlots").innerHTML = builderSlots.map((slot, i) => slot.player
    ? `<div class="builder-slot filled" data-idx="${i}">
        <span class="bs-pos">${slot.label}</span>
        <span class="bs-name">${esc(slot.player.name)}</span>
        <span class="bs-salary">$${slot.player.salary.toLocaleString()}</span>
      </div>`
    : `<div class="builder-slot empty">
        <span class="bs-pos">${slot.label}</span>
        <span class="bs-name">—</span>
      </div>`
  ).join('');
  $("builderSlots").querySelectorAll('.builder-slot.filled').forEach(el => {
    el.onclick = () => removeBuilderSlot(Number(el.dataset.idx));
  });

  $("builderExcluded").innerHTML = excludedNames.size
    ? `<div class="excluded-label">Excluded (click to un-exclude)</div>
       <div class="excluded-chips">${[...excludedNames].map(n =>
         `<span class="excluded-chip" data-name="${esc(n)}">${esc(n)} ✕</span>`).join('')}</div>`
    : '';
  $("builderExcluded").querySelectorAll('.excluded-chip').forEach(el => {
    el.onclick = () => { excludedNames.delete(el.dataset.name); renderBuilderPanel(); };
  });

  renderBuilderSearch();
}

function renderBuilderSearch(){
  const term = builderSearchTerm.trim().toLowerCase();
  const placedNames = new Set(builderSlots.filter(s=>s.player).map(s=>s.player.name));
  const remaining = 50000 - builderUsedSalary();
  const scoreField = SCORE_FIELDS[scoringMode] || STACK_BASIS_FIELDS[stackBasis] || 'quality';

  const base = CSV_PLAYERS
    .filter(p => p.status !== 'OUT' && p.status !== 'IR')
    .filter(p => !placedNames.has(p.name))
    .filter(p => !excludedNames.has(p.name));

  const resultRow = p => {
    const hasSlot = builderSlots.some(s => !s.player &&
      (s.label === p.pos || (s.label === 'FLEX' && ['RB','WR','TE'].includes(p.pos))));
    const affordable = p.salary <= remaining;
    const disabled = !hasSlot || !affordable;
    return `<div class="search-result${disabled?' disabled':''}" data-name="${esc(p.name)}">
      <span class="sr-pos">${p.pos}</span>
      <span class="sr-name">${esc(p.name)} · ${esc(p.team)}</span>
      <span class="sr-salary">$${p.salary.toLocaleString()}</span>
    </div>`;
  };

  let html;
  if(term.length >= 2){
    const results = base.filter(p => p.name.toLowerCase().includes(term)).slice(0, 15);
    html = results.map(resultRow).join('') ||
      `<div class="empty" style="padding:16px 4px">No matches.</div>`;
  } else {
    // Default: browse what's actually affordable at each position still open.
    const emptyLabels = [...new Set(builderSlots.filter(s=>!s.player).map(s=>s.label))];
    if(!emptyLabels.length){
      html = `<div class="empty" style="padding:16px 4px">Lineup is full.</div>`;
    } else {
      const neededPositions = new Set();
      emptyLabels.forEach(label => {
        if(label === 'FLEX') ['RB','WR','TE'].forEach(p => neededPositions.add(p));
        else neededPositions.add(label);
      });
      html = [...neededPositions].map(pos => {
        const candidates = base
          .filter(p => p.pos === pos && p.salary <= remaining)
          .sort((a,b) => b.salary - a.salary)
          .slice(0, 6);
        if(!candidates.length) return '';
        return `<div class="excluded-label" style="margin-top:8px">${pos} — affordable ($${remaining.toLocaleString()} left)</div>`
          + candidates.map(resultRow).join('');
      }).join('') || `<div class="empty" style="padding:16px 4px">Nothing affordable at the remaining positions.</div>`;
    }
  }

  $("builderSearchResults").innerHTML = html;
  $("builderSearchResults").querySelectorAll('.search-result:not(.disabled)').forEach(el => {
    el.onclick = () => {
      const p = CSV_PLAYERS.find(x => x.name === el.dataset.name);
      if(p && placeInBuilder(p)){ selectedStackSig = null; renderBuilderPanel(); }
    };
  });
}

function generateRestOfLineup(){
  if(typeof solver === 'undefined') return;
  const pool = CSV_PLAYERS
    .filter(p => p.status !== 'OUT' && p.status !== 'IR')
    .filter(p => !excludedNames.has(p.name));
  pool.forEach((p,i) => { p.__pid = i; });
  const pinned = builderSlots.filter(s=>s.player).map(s => pool.find(p => p.name === s.player.name)).filter(Boolean);
  const pinnedPids = new Set(pinned.map(p => p.__pid));
  const scoreField = SCORE_FIELDS[scoringMode] || STACK_BASIS_FIELDS[stackBasis] || 'quality';

  const model = buildLineupModel(pool, [], 0, stackMode, false, scoreField, false, pinnedPids);
  const result = solver.Solve(model);
  if(!result.feasible){
    $("builderSalary").textContent = 'No feasible completion — try clearing an exclusion or picking a cheaper stack.';
    $("builderSalary").className = 'builder-sub over';
    return;
  }
  const chosen = [];
  pool.forEach(p => { if(result['p'+p.__pid]) chosen.push(p); });
  initBuilderSlots();
  // place pinned players first so they land in the same slots as before
  pinned.forEach(p => placeInBuilder(p));
  chosen.filter(p => !pinnedPids.has(p.__pid)).forEach(p => placeInBuilder(p));
  renderBuilderPanel();
}

const STACK_SIZES = { none: 0, stack: 1, double: 2, onslaught: 3 };

function teamOpponentMap(players){
  const map = {};
  players.forEach(p => { if(p.team && p.opp) map[p.team] = p.opp; });
  return map;
}

function buildLineupModel(players, priorPidSets, minDiff, mode, bringBack, scoreField, forceSingleTE, pinnedPids){
  scoreField = scoreField || 'quality';
  pinnedPids = pinnedPids || new Set();
  const variables = {}, binaries = {};
  const constraints = {
    salary: { max: 50000 }, total: { equal: 9 },
    isQB: { equal: 1 }, isDST: { equal: 1 },
    isRB: { min: 2, max: 3 }, isWR: { min: 3, max: 4 },
    isTE: forceSingleTE ? { equal: 1 } : { min: 1, max: 2 },
  };
  const stackSize = STACK_SIZES[mode] || 0;
  const oppOf = teamOpponentMap(players);
  const teams = [...new Set(players.map(p => p.team))];
  // Stack/double stack pair the QB with his own pass-catchers (the
  // standard DFS meaning). Onslaught is broader — any 4+ same-team skill
  // players including the QB, RB included — with zero opponent exposure.
  const stackPositions = mode === 'onslaught' ? ['RB','WR','TE'] : ['WR','TE'];

  players.forEach((p) => {
    const vid = 'p' + p.__pid;
    variables[vid] = {
      quality: p[scoreField], salary: p.salary, total: 1,
      isQB: p.pos==='QB'?1:0, isRB: p.pos==='RB'?1:0, isWR: p.pos==='WR'?1:0,
      isTE: p.pos==='TE'?1:0, isDST: p.pos==='DST'?1:0,
    };
    priorPidSets.forEach((pidSet, li) => {
      if(pidSet.has(p.__pid)) variables[vid]['div'+li] = 1;
    });
    if(pinnedPids.has(p.__pid)){
      const key = 'pin_' + p.__pid;
      variables[vid][key] = 1;
      constraints[key] = { equal: 1 };
    }
    binaries[vid] = 1;
  });
  priorPidSets.forEach((pidSet, li) => { constraints['div'+li] = { max: 9 - minDiff }; });

  // Stack / double stack / onslaught: if this team's QB is picked, require
  // stackSize of that same team's eligible skill players also picked.
  // sum(skill players) - stackSize*QB >= 0  <=>  sum(skill players) >= stackSize*QB
  if(stackSize > 0){
    teams.forEach(T => {
      const key = 'stack_' + T;
      constraints[key] = { min: 0 };
      players.forEach((p) => {
        const vid = 'p' + p.__pid;
        if(p.team === T && stackPositions.includes(p.pos)) variables[vid][key] = 1;
        if(p.team === T && p.pos === 'QB') variables[vid][key] = -stackSize;
      });
    });
  }

  // Onslaught also requires ZERO players from the opponent team. Big-M:
  // sum(opp players) + M*QB <= M  =>  QB picked forces sum(opp)<=0;
  // QB not picked leaves sum(opp) <= M (unrestricted, M=9=full roster).
  if(mode === 'onslaught'){
    const M = 9;
    teams.forEach(T => {
      const O = oppOf[T];
      if(!O) return;
      const key = 'noOpp_' + T;
      constraints[key] = { max: M };
      players.forEach((p) => {
        const vid = 'p' + p.__pid;
        if(p.team === O) variables[vid][key] = 1;
        if(p.team === T && p.pos === 'QB') variables[vid][key] = M;
      });
    });
  }

  // Bring-back: if this team's QB is picked, require at least 1 player
  // from the opponent team. (Mutually exclusive with onslaught — the UI
  // prevents both being active at once.)
  if(bringBack && mode !== 'onslaught'){
    teams.forEach(T => {
      const O = oppOf[T];
      if(!O) return;
      const key = 'bring_' + T;
      constraints[key] = { min: 0 };
      players.forEach((p) => {
        const vid = 'p' + p.__pid;
        if(p.team === O) variables[vid][key] = 1;
        if(p.team === T && p.pos === 'QB') variables[vid][key] = -1;
      });
    });
  }

  return { optimize:'quality', opType:'max', constraints, variables, binaries };
}

const SCORING_MODE_NOTES = {
  composite: 'Ranked by opponent matchup + recent performance — salary is a hard cap, not a scoring factor.',
  matchup_history: "Ranked by each player's own history vs. defenses in the same tier as their actual upcoming opponent (2+ games required, else falls back to season average).",
  ceiling: "Ranked by each player's average of their best 3 games this season (DK scoring) — chases upside, not consistency.",
};

function buildCountTabs(){
  const counts = [5, 10, 15, 25];
  $("countTabs").innerHTML = counts.map(c =>
    `<button role="tab" aria-selected="${c===generatorCount}" data-count="${c}">${c}</button>`).join('');
  $("genBtn").textContent = `Generate ${generatorCount} lineups`;
  updateExposureNote();
  $("countTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("countTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    generatorCount = Number(b.dataset.count);
    $("genBtn").textContent = `Generate ${generatorCount} lineups`;
    updateExposureNote();
  });
}

function updateExposureNote(){
  const cap = EXPOSURE_CAPS[generatorCount];
  $("exposureNote").textContent =
    `Exposure rules: any player (including DST) appears in at most ${cap} of ${generatorCount} lineups; ` +
    `at most ${cap} of ${generatorCount} lineups may use a 2nd TE in FLEX.`;
}

function buildScoringModeTabs(){
  const modes = [
    { key:'composite', label:'Season Composite' },
    { key:'matchup_history', label:'Matchup History' },
    { key:'ceiling', label:'High Ceiling' },
  ];
  $("scoringModeTabs").innerHTML = modes.map(m =>
    `<button role="tab" aria-selected="${m.key===scoringMode}" data-mode="${m.key}">${m.label}</button>`).join('');
  $("scoringModeNote").textContent = SCORING_MODE_NOTES[scoringMode];
  $("scoringModeTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("scoringModeTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    scoringMode = b.dataset.mode;
    $("scoringModeNote").textContent = SCORING_MODE_NOTES[scoringMode];
  });
}

function buildStackModeTabs(){
  const modes = [
    { key:'none', label:'No stack' }, { key:'stack', label:'Stack' },
    { key:'double', label:'Double stack' }, { key:'onslaught', label:'Onslaught' },
  ];
  $("stackModeTabs").innerHTML = modes.map(m =>
    `<button role="tab" aria-selected="${m.key===stackMode}" data-mode="${m.key}">${m.label}</button>`).join('');
  $("bringBackChk").disabled = (stackMode === 'onslaught');
  $("stackModeTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("stackModeTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    stackMode = b.dataset.mode;
    const bbChk = $("bringBackChk");
    if(stackMode === 'onslaught'){
      bbChk.checked = false; bbChk.disabled = true;
    } else {
      bbChk.disabled = false;
    }
  });
}

const SCORE_FIELDS = { composite: 'quality', matchup_history: 'matchupHistoryScore', ceiling: 'ceilingScore' };
// Rule 1/2: max times any player (including DST) may appear across the
// batch. Rule 3: max number of lineups in the batch allowed to use TE in
// FLEX (2 total TE). Same numbers, different mechanism — see note above.
const EXPOSURE_CAPS = { 5: 2, 10: 4, 15: 6, 25: 8 };

function generateLineups(){
  if(typeof solver === 'undefined'){
    $("lineupResults").innerHTML = `<div class="empty">Solver library failed to load — check your connection and reload.</div>`;
    return;
  }
  const btn = $("genBtn");
  btn.disabled = true; btn.textContent = 'Generating…';
  const bringBack = $("bringBackChk").checked;
  const scoreField = SCORE_FIELDS[scoringMode];
  const numLineups = generatorCount;
  const exposureCap = EXPOSURE_CAPS[numLineups];

  const pool = CSV_PLAYERS.filter(p => p.status !== 'OUT' && p.status !== 'IR');
  pool.forEach((p, i) => { p.__pid = i; }); // stable id, survives per-iteration filtering

  const exposureCount = {};
  let teLineupCount = 0;
  const lineups = [];
  const priorPidSets = [];

  for(let n = 0; n < numLineups; n++){
    const eligible = pool.filter(p => (exposureCount[p.__pid] || 0) < exposureCap);
    const forceSingleTE = teLineupCount >= exposureCap;
    const model = buildLineupModel(eligible, priorPidSets, 3, stackMode, bringBack, scoreField, forceSingleTE);
    const result = solver.Solve(model);
    if(!result.feasible) break;

    const chosenPids = new Set();
    const chosen = [];
    eligible.forEach(p => { if(result['p'+p.__pid]){ chosen.push(p); chosenPids.add(p.__pid); } });
    lineups.push({ players: chosen, quality: result.result,
      salary: chosen.reduce((s,p)=>s+p.salary,0) });
    priorPidSets.push(chosenPids);

    chosen.forEach(p => { exposureCount[p.__pid] = (exposureCount[p.__pid] || 0) + 1; });
    if(chosen.filter(p => p.pos === 'TE').length === 2) teLineupCount++;
  }

  btn.disabled = false; btn.textContent = `Generate ${numLineups} lineups`;
  if(!lineups.length){
    $("lineupResults").innerHTML = `<div class="empty">
      No feasible lineup found under these constraints — try a lighter stack setting
      or turn off bring-back; this slate may not have enough qualifying combinations.</div>`;
    return;
  }
  const shortfallMsg = lineups.length < numLineups
    ? `Generated ${lineups.length} of ${numLineups} — exposure caps and stacking constraints ran out
       of valid combinations before reaching the full batch.`
    : null;
  renderLineups(lineups, shortfallMsg);
}

const POS_ORDER = { QB:0, RB:1, WR:2, TE:3, DST:5 }; // FLEX sits at 4, resolved below

function renderLineups(lineups, caveatMsg){
  if(!lineups.length){
    $("lineupResults").innerHTML = `<div class="empty">No feasible lineup found — the slate may be too thin at some position.</div>`;
    return;
  }
  const caveatHtml = caveatMsg ? `<div class="caveat">${caveatMsg}</div>` : '';
  $("lineupResults").innerHTML = caveatHtml + `<div class="lineup-grid">` + lineups.map((lu, i) => {
    // 1 QB, 2 base RB, 3 base WR, 1 base TE, 1 FLEX (extra RB/WR/TE), 1 DST
    const byPos = { QB:[], RB:[], WR:[], TE:[], DST:[] };
    lu.players.forEach(p => byPos[p.pos].push(p));
    const rows = [];
    rows.push({ label:'QB', p: byPos.QB[0] });
    rows.push({ label:'RB', p: byPos.RB[0] });
    rows.push({ label:'RB', p: byPos.RB[1] });
    rows.push({ label:'WR', p: byPos.WR[0] });
    rows.push({ label:'WR', p: byPos.WR[1] });
    rows.push({ label:'WR', p: byPos.WR[2] });
    rows.push({ label:'TE', p: byPos.TE[0] });
    const flexPlayer = byPos.RB[2] || byPos.WR[3] || byPos.TE[1];
    rows.push({ label:'FLEX', p: flexPlayer });
    rows.push({ label:'DST', p: byPos.DST[0] });

    return `<div class="lineup-card">
      <div class="lc-head">
        <span class="lc-title">Lineup ${i+1}</span>
        <span class="lc-salary"><b>\$${lu.salary.toLocaleString()}</b> / \$50,000</span>
      </div>
      ${rows.map(r => `<div class="lineup-row">
        <span class="lr-pos">${r.label}</span>
        <span class="lr-name">${esc(r.p.name)}</span>
        <span class="lr-salary">\$${r.p.salary.toLocaleString()}</span>
      </div>`).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function buildSlateTabs(){
  const positions = ['ALL','QB','RB','WR','TE','DST'];
  $("slatePosTabs").innerHTML = positions.map(p =>
    `<button role="tab" aria-selected="${p===slatePos}" data-pos="${p}">${p}</button>`).join('');
  $("slatePosTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("slatePosTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    slatePos = b.dataset.pos; renderSlate();
  });
}

const SLATE_COLS = [
  { key: 'salary', label: 'Salary' },
  { key: 'avgPts', label: 'Avg pts' },
  { key: 'value', label: 'Value' },
];

function renderSlate(){
  let rows = CSV_PLAYERS.filter(p => slatePos === 'ALL' || p.pos === slatePos);
  if(searchTerm) rows = rows.filter(p => p.name.toLowerCase().includes(searchTerm));
  rows.sort((a,b) => slateDir === 'desc' ? b[slateSort]-a[slateSort] : a[slateSort]-b[slateSort]);

  let head = `<thead><tr>
    <th class="name-col">Player</th><th>Pos</th><th>Team</th><th>Opp</th>
    ${SLATE_COLS.map(c => `<th data-key="${c.key}" class="${c.key===slateSort?'sorted':''}">
      ${c.label}${c.key===slateSort ? (slateDir==='desc'?' ▾':' ▴') : ''}</th>`).join('')}
  </tr></thead>`;

  let body = '<tbody>' + rows.map(p => `
    <tr>
      <td class="name-col">${esc(p.name)} ${statusPill(p.status)}</td>
      <td><span class="cell-val">${esc(p.pos)}</span></td>
      <td>${fiLogoHTML(p.team,18)}<span class="cell-val">${esc(p.team)}</span></td>
      <td><span class="cell-val">${p.opp ? esc(p.opp) : '—'}</span></td>
      <td><span class="cell-val">$${p.salary.toLocaleString()}</span></td>
      <td><span class="cell-val">${p.avgPts.toFixed(1)}</span></td>
      <td><span class="cell-val">${p.value.toFixed(1)}x</span></td>
    </tr>`).join('') + '</tbody>';

  $("slateTable").innerHTML = head + body;
  $("slateTable").querySelectorAll("thead th[data-key]").forEach(th => {
    th.onclick = () => {
      const k = th.dataset.key;
      if(k === slateSort) slateDir = slateDir === 'desc' ? 'asc' : 'desc';
      else { slateSort = k; slateDir = 'desc'; }
      renderSlate();
    };
  });
}

load();
</script>
