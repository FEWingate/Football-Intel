<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Intel Reports — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
.report-intro{font-size:12.5px;color:var(--text-mid);line-height:1.6;max-width:820px;margin-bottom:20px}
.report-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.search-box{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:12px;padding:8px 12px;width:220px;
}
.intel-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.intel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.ic-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ic-headshot{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface2);
  border:2px solid var(--border);flex:none}
.ic-name{font-family:var(--font-display);font-weight:700;font-size:15px}
.ic-team{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.ic-matchup{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text-mid);
  padding:8px 10px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:12px;
}
.fav-badge{font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;
  padding:2px 6px;border-radius:3px;text-transform:uppercase}
.fav-badge.yes{color:var(--accent-green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)}
.fav-badge.no{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.fav-badge.mid{color:var(--text-mid);background:var(--surface2);border:1px solid var(--border)}
.ic-section-label{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text-dim);margin:12px 0 6px}
.ic-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px}
.ic-row-label{color:var(--text-mid);flex:1;min-width:0}
.hit-badge{
  font-family:var(--font-mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;
  white-space:nowrap;flex:none;
}
.hit-badge.hit{color:var(--accent-green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)}
.hit-badge.miss{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.hit-badge .n{color:var(--text-dim);font-weight:400;font-size:9px;margin-left:3px}
@media(max-width:520px){ .intel-grid{grid-template-columns:1fr} }
.intel-card{cursor:pointer}
.intel-card:hover{border-color:var(--border2)}
.lead-wrap{overflow:auto;max-height:calc(100vh - 220px);border:1px solid var(--border);border-radius:var(--radius-lg)}
.lead-table{width:100%;border-collapse:separate;border-spacing:0}
.lead-table thead th{
  padding:9px 12px;text-align:right;font-family:var(--font-mono);font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;
  position:sticky;top:0;background:var(--surface2);z-index:2;border-bottom:1px solid var(--border);
}
.lead-table thead th.name-col{text-align:left;left:0;z-index:3}
.lead-table td{padding:8px 12px;font-size:12px;text-align:right;border-bottom:1px solid var(--hairline);white-space:nowrap}
.lead-table tbody tr:last-child td{border-bottom:0}
.lead-table tbody tr:hover td{background:var(--surface2)}
.lead-table td.name-col{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.cell-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-mid);font-size:12px}
.log-hit{color:var(--accent-green)} .log-miss{color:var(--accent-red)}
.rank-chip{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.caveat{
  background:rgba(250,204,21,.07);border:1px solid rgba(250,204,21,.3);border-radius:var(--radius);
  padding:10px 14px;font-size:11.5px;color:var(--text-mid);margin-bottom:16px;line-height:1.5;
}
.caveat b{color:var(--accent-gold)}
.intel-card.watch{border-color:var(--accent-gold);background:rgba(250,204,21,.04)}
.watch-badge{
  display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;font-weight:700;
  letter-spacing:.05em;color:var(--accent-gold);background:rgba(250,204,21,.1);
  border:1px solid rgba(250,204,21,.35);border-radius:3px;padding:2px 7px;text-transform:uppercase;
  margin-bottom:10px;
}
.prop-box{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:12px;
}
.prop-input-row{display:flex;align-items:center;gap:8px}
.prop-input-row label{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);white-space:nowrap}
.prop-input{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--font-mono);font-size:12px;padding:5px 8px;width:80px;
}
.prop-clear{
  background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;
  padding:4px 6px;margin-left:auto;
}
.prop-clear:hover{color:var(--accent-red)}
.prop-result{margin-top:8px;font-size:11.5px;color:var(--text-mid);display:none}
.prop-result.show{display:block}
.prop-result-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}
.prop-verdict{
  font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap;
}
.prop-verdict.under{color:var(--accent-green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)}
.prop-verdict.over{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.prop-verdict.flat{color:var(--text-dim);background:var(--surface);border:1px solid var(--border)}
.prop-stale{font-size:9.5px;color:var(--accent-gold);margin-top:4px}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script>
const main = fiShell({ page:'reports', pageLabel:'Intel Reports', status:'loading' });

let INTEL = null;
let BLITZ = null;
let activeReport = 'qb'; // 'qb' | 'rb' | 'blitz'
let sortKey = 'watch';
let searchTerm = '';
let rbSortKey = 'watch';
let rbSearchTerm = '';
let blitzPos = 'QB';
let blitzSortKey = 'watch';
let blitzSearchTerm = '';

main.innerHTML = `
  <div class="bar">
    <span class="lbl">Intel Reports</span>
    <div class="legend"><span>Hidden Intelligence — patterns most sites don't show you</span></div>
  </div>
  <div class="tabs" id="reportTabs" role="tablist">
    <button role="tab" data-r="qb" aria-selected="true">QB Passing vs. Run Game</button>
    <button role="tab" data-r="rb" aria-selected="false">RB Rushing vs. Passing Game</button>
    <button role="tab" data-r="blitz" aria-selected="false">Blitz Impact</button>
  </div>
  <div id="body"></div>
  <div class="modal-overlay" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-subtitle" id="mSub"></div>
      <button class="modal-close" id="mClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>`;

const $ = id => document.getElementById(id);

async function load(){
  fiStatus("Loading","loading");
  try{
    const res = await fetch(`intel/latest.json`);
    if(res.ok) INTEL = await res.json();
  }catch(e){}
  try{
    const res2 = await fetch(`intel/blitz.json`);
    if(res2.ok) BLITZ = await res2.json();
  }catch(e){}

  if(!INTEL || !Object.keys(INTEL.teams||{}).length){
    fiStatus("No data","error"); fiUpdated("");
    $("body").innerHTML = `<div class="empty">
      No Intel Reports data found yet.<br>
      Run <b>python3 build_matchup_stats.py all</b> in your lab folder, then reload.</div>`;
    return;
  }

  fiStatus("Ready");
  fiUpdated(`${INTEL.season} · as of week ${INTEL.as_of_week}`);

  $("reportTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    activeReport = b.dataset.r;
    $("reportTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    render();
  });

  render();
}

function render(){
  if(activeReport === 'qb') renderQBReport();
  else if(activeReport === 'rb') renderRBReport();
  else renderBlitzReport();
}

function esc2(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// A QB is "on watch" this week if: the run game has a genuinely favorable
// matchup (weak run D, likely to be hot) AND this specific QB has
// historically struggled to hit his own passing average in exactly that
// scenario. Requires a real sample (4+ games) in the run-hot bucket —
// otherwise a QB with one bad game could get flagged off pure noise.
/* ── PROP LINE INPUT ─────────────────────────────────────────────── */
const PROP_STORE_KEY = 'fi_intel_prop_lines_v1';

function loadPropLines(){
  try{ return JSON.parse(localStorage.getItem(PROP_STORE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function savePropLine(team, line){
  const store = loadPropLines();
  store[team] = { line, week: INTEL.as_of_week };
  try{ localStorage.setItem(PROP_STORE_KEY, JSON.stringify(store)); }catch(e){}
}
function clearPropLine(team){
  const store = loadPropLines();
  delete store[team];
  try{ localStorage.setItem(PROP_STORE_KEY, JSON.stringify(store)); }catch(e){}
}

// Vs a real, user-entered line (not the QB's own season average) — split
// by whether the run game was hot or cold that game, since that's the
// whole point: checking the actual bettable number against exactly the
// scenario (favorable run spot) the strategy is built around.
function computePropResult(team, line){
  const t = INTEL.teams[team];
  if(!t || !t.log || !t.log.length) return null;
  const hot = t.log.filter(g => g.run_hit);
  const cold = t.log.filter(g => !g.run_hit);
  const underRate = games => {
    if(!games.length) return null;
    const unders = games.filter(g => g.qb_pass_yds < line).length;
    return { pct: Math.round(1000*unders/games.length)/10, unders, n: games.length };
  };
  return { hot: underRate(hot), cold: underRate(cold) };
}

function propVerdictBadge(pct){
  if(pct == null) return `<span class="prop-verdict flat">no data</span>`;
  if(pct >= 60) return `<span class="prop-verdict under">Leans Under</span>`;
  if(pct <= 40) return `<span class="prop-verdict over">Leans Over</span>`;
  return `<span class="prop-verdict flat">No clear lean</span>`;
}

function renderPropResult(team){
  const box = document.getElementById(`propResult_${team}`);
  if(!box) return;
  const input = document.getElementById(`propInput_${team}`);
  const val = parseFloat(input.value);
  if(!val || val <= 0){
    box.classList.remove('show'); box.innerHTML = '';
    clearPropLine(team);
    return;
  }
  savePropLine(team, val);
  const res = computePropResult(team, val);
  const fmtRow = (label, r) => {
    if(!r) return `<div class="prop-result-row"><span>${label}</span><span class="prop-verdict flat">no games</span></div>`;
    return `<div class="prop-result-row"><span>${label} (${r.unders}/${r.n} under)</span>${propVerdictBadge(r.pct)}</div>`;
  };
  box.innerHTML = fmtRow('Run game HOT →', res.hot) + fmtRow('Run game COLD →', res.cold);
  box.classList.add('show');
}

function matchupTierBadge(tier){
  if(tier === 'bot') return `<span class="fav-badge yes">Favorable run spot</span>`;
  if(tier === 'top') return `<span class="fav-badge no">Tough run spot</span>`;
  if(tier === 'mid') return `<span class="fav-badge mid">Neutral run spot</span>`;
  return '';
}

// Same direction as matchupTierBadge, just labeling the pass defense's own
// strength directly — no speculative "leans run/pass" story. The value is
// seeing both badges together: two "Tough" badges means the whole matchup
// is bad, not just one side of it.
function passTierBadge(tier){
  if(tier === 'bot') return `<span class="fav-badge yes">Favorable pass spot</span>`;
  if(tier === 'top') return `<span class="fav-badge no">Tough pass spot</span>`;
  if(tier === 'mid') return `<span class="fav-badge mid">Neutral pass spot</span>`;
  return '';
}

const WATCH_THRESHOLD = 35;
const WATCH_MIN_N = 4;
function isWatchFlag(t){
  return t.run_matchup_tier === 'bot'
    && t.qb_hit_rate_run_hot != null
    && t.qb_hit_rate_run_hot < WATCH_THRESHOLD
    && t.qb_hit_rate_run_hot_n >= WATCH_MIN_N;
}

// Exact mirror of isWatchFlag, reversed: a weak pass defense (bottom 10)
// makes the QB likely to have a hot passing game — and if this specific
// RB has historically struggled to hit his own rushing average when the
// QB is hot, that's the same "watch for an under" signal, just on the
// other side of the correlation.
function isRbWatchFlag(t){
  return t.pass_matchup_tier === 'bot'
    && t.rb_hit_rate_qb_hot != null
    && t.rb_hit_rate_qb_hot < WATCH_THRESHOLD
    && t.rb_hit_rate_qb_hot_n >= WATCH_MIN_N;
}

// Same mirror pattern again: opponent is a top-10 blitz-heavy defense
// (likely to blitz a lot this week) + this player's own history shows a
// low hit rate specifically in his high-blitz games. Works for both QB
// and WR since both share the same field names.
function isBlitzWatchFlag(t){
  return t.blitz_matchup_tier === 'top'
    && t.hit_rate_blitz_high != null
    && t.hit_rate_blitz_high < WATCH_THRESHOLD
    && t.hit_rate_blitz_high_n >= WATCH_MIN_N;
}

function renderQBReport(){
  $("body").innerHTML = `
    <div class="sect"><h3>QB Passing vs. Run Game — Hit Rate Correlation</h3><span class="rule"></span></div>
    <div class="report-intro">
      Does a team's starting QB reach his own season passing average more or less often depending on whether the
      run game is having a good day — and does it work the same way in reverse? Each card shows both directions,
      using each QB's own games only (no blending across a benched starter), with the sample size shown next to
      every number so a real pattern is easy to tell apart from a small-sample fluke.
    </div>
    <div class="report-controls">
      <input class="search-box" id="searchBox" placeholder="Search team or QB…">
      <div class="tabs" id="sortTabs" role="tablist"></div>
    </div>
    <div id="watchBanner"></div>
    <div class="intel-grid" id="intelGrid"></div>`;

  $("searchBox").oninput = e => { searchTerm = e.target.value.toLowerCase(); renderGrid(); };

  const sorts = [['watch',"This week's watch list"], ['gap','Strongest pattern'], ['team','Team A–Z']];
  $("sortTabs").innerHTML = sorts.map(([k,l]) =>
    `<button role="tab" aria-selected="${k===sortKey}" data-k="${k}">${l}</button>`).join('');
  $("sortTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    sortKey = b.dataset.k;
    $("sortTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderGrid();
  });

  renderGrid();
}

function hitBadge(rate, n){
  if(rate == null) return `<span class="hit-badge miss">no data</span>`;
  const isHit = rate >= 50;
  const displayRate = isHit ? rate : Math.round((100 - rate) * 10) / 10;
  return `<span class="hit-badge ${isHit?'hit':'miss'}">${isHit?'Usually hits':'Usually falls short'}
    (${displayRate}%)<span class="n">${n}g</span></span>`;
}

function renderGrid(){
  const savedLines = loadPropLines();
  let teams = Object.entries(INTEL.teams).map(([team, v]) => ({ team, ...v }));
  teams = teams.filter(t =>
    !searchTerm || t.team.toLowerCase().includes(searchTerm) || (t.qb_name||'').toLowerCase().includes(searchTerm));

  const gap = t => {
    const vals = [t.qb_hit_rate_run_hot, t.qb_hit_rate_run_cold].filter(v => v != null);
    return vals.length === 2 ? Math.abs(vals[0]-vals[1]) : -1;
  };

  if(sortKey === 'team'){
    teams.sort((a,b) => a.team.localeCompare(b.team));
  } else if(sortKey === 'watch'){
    teams.sort((a,b) => (isWatchFlag(b) - isWatchFlag(a)) || (gap(b) - gap(a)));
  } else {
    teams.sort((a,b) => gap(b) - gap(a));
  }

  const watchCount = Object.values(INTEL.teams).filter(isWatchFlag).length;
  $("watchBanner").innerHTML = watchCount
    ? `<div class="caveat"><b>${watchCount} QB${watchCount===1?'':'s'} on watch this week</b> —
       favorable run matchup, and historically a sub-${WATCH_THRESHOLD}% hit rate on their own passing average
       when the run game gets going. Flagged with ⚠️ below.</div>`
    : `<div class="caveat">No QBs meet the watch criteria (favorable run spot + sub-${WATCH_THRESHOLD}%
       hit rate when run game is hot, min ${WATCH_MIN_N} games) this week.</div>`;

  $("intelGrid").innerHTML = teams.map(t => `
    <div class="intel-card${isWatchFlag(t)?' watch':''}" data-team="${esc2(t.team)}">
      ${isWatchFlag(t) ? `<div class="watch-badge">⚠️ Watch this week</div>` : ''}
      <div class="ic-head">
        <img class="ic-headshot" src="${esc2(t.qb_headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <div>
          <div class="ic-name">${esc2(t.qb_name)}</div>
          <div class="ic-team">${esc2(t.team)} · ${t.starts} start${t.starts===1?'':'s'} · avg ${t.qb_season_avg} pass yds/gm</div>
        </div>
      </div>
      <div class="ic-matchup">
        ${t.upcoming_opponent
          ? `${fiLogoHTML(t.team,16)}<span>${esc2(t.team)}</span> vs ${fiLogoHTML(t.upcoming_opponent,16)}<span>${esc2(t.upcoming_opponent)} · Run D #${t.opp_run_def_rank} · Pass D #${t.opp_pass_def_rank}</span>
             ${matchupTierBadge(t.run_matchup_tier)} ${passTierBadge(t.pass_matchup_tier)}`
          : `<span>No upcoming game scheduled</span>`}
      </div>

      <div class="prop-box" data-noclick="1">
        <div class="prop-input-row">
          <label for="propInput_${esc2(t.team)}">Prop line (pass yds)</label>
          <input class="prop-input" type="number" step="0.5" id="propInput_${esc2(t.team)}"
                 value="${savedLines[t.team] ? savedLines[t.team].line : ''}" placeholder="225.5">
          <button class="prop-clear" id="propClear_${esc2(t.team)}">✕ clear</button>
        </div>
        <div class="prop-result" id="propResult_${esc2(t.team)}"></div>
        ${savedLines[t.team] && savedLines[t.team].week !== INTEL.as_of_week
          ? `<div class="prop-stale">⚠ line saved for week ${savedLines[t.team].week}, this is week ${INTEL.as_of_week}</div>` : ''}
      </div>

      <div class="ic-section-label">Passing game</div>
      <div class="ic-row"><span class="ic-row-label">When run game is HOT →</span>
        ${hitBadge(t.qb_hit_rate_run_hot, t.qb_hit_rate_run_hot_n)}</div>
      <div class="ic-row"><span class="ic-row-label">When run game is COLD →</span>
        ${hitBadge(t.qb_hit_rate_run_cold, t.qb_hit_rate_run_cold_n)}</div>

      <div class="ic-section-label">Run game</div>
      <div class="ic-row"><span class="ic-row-label">When QB is HOT →</span>
        ${hitBadge(t.run_hit_rate_qb_hot, t.run_hit_rate_qb_hot_n)}</div>
      <div class="ic-row"><span class="ic-row-label">When QB is COLD →</span>
        ${hitBadge(t.run_hit_rate_qb_cold, t.run_hit_rate_qb_cold_n)}</div>
    </div>`).join('') || `<div class="empty">No teams match that search.</div>`;

  $("intelGrid").querySelectorAll('.intel-card').forEach(el => {
    el.onclick = (e) => {
      if(e.target.closest('[data-noclick]')) return; // clicks inside the prop box shouldn't open the modal
      openGameLog(el.dataset.team);
    };
  });

  teams.forEach(t => {
    const input = document.getElementById(`propInput_${t.team}`);
    const clearBtn = document.getElementById(`propClear_${t.team}`);
    if(!input) return;
    input.oninput = () => renderPropResult(t.team);
    input.onclick = e => e.stopPropagation();
    clearBtn.onclick = (e) => { e.stopPropagation(); input.value = ''; renderPropResult(t.team); };
    if(input.value) renderPropResult(t.team); // show result immediately for a restored saved line
  });
}

/* ── GAME LOG MODAL ──────────────────────────────────────────────── */
/* ── RB REPORT (reverse signal) ──────────────────────────────────── */
function renderRBReport(){
  $("body").innerHTML = `
    <div class="sect"><h3>RB Rushing vs. Passing Game — Hit Rate Correlation</h3><span class="rule"></span></div>
    <div class="report-intro">
      The same relationship, reversed: does each team's lead back reach his own season rushing average more or
      less often depending on whether the starting QB had a hot or cold passing game — and the same thing in
      reverse. Useful for rushing-yards props the same way the QB report is useful for passing-yards props.
      Matchup context below still uses the opponent's run-defense rank, since that's the most direct signal for
      rushing yards specifically.
    </div>
    <div class="report-controls">
      <input class="search-box" id="rbSearchBox" placeholder="Search team or RB…">
      <div class="tabs" id="rbSortTabs" role="tablist"></div>
    </div>
    <div id="rbWatchBanner"></div>
    <div class="intel-grid" id="rbIntelGrid"></div>`;

  $("rbSearchBox").oninput = e => { rbSearchTerm = e.target.value.toLowerCase(); renderRbGrid(); };

  const sorts = [['watch',"This week's watch list"], ['gap','Strongest pattern'], ['team','Team A–Z']];
  $("rbSortTabs").innerHTML = sorts.map(([k,l]) =>
    `<button role="tab" aria-selected="${k===rbSortKey}" data-k="${k}">${l}</button>`).join('');
  $("rbSortTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    rbSortKey = b.dataset.k;
    $("rbSortTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderRbGrid();
  });

  renderRbGrid();
}

function computeRbPropResult(team, line){
  const t = INTEL.rb_teams[team];
  if(!t || !t.log || !t.log.length) return null;
  const qbHot = t.log.filter(g => g.qb_hit);
  const qbCold = t.log.filter(g => !g.qb_hit);
  const underRate = games => {
    if(!games.length) return null;
    const unders = games.filter(g => g.rb_rush_yds < line).length;
    return { pct: Math.round(1000*unders/games.length)/10, unders, n: games.length };
  };
  return { hot: underRate(qbHot), cold: underRate(qbCold) };
}

function renderRbPropResult(team){
  const box = document.getElementById(`rbPropResult_${team}`);
  if(!box) return;
  const input = document.getElementById(`rbPropInput_${team}`);
  const val = parseFloat(input.value);
  if(!val || val <= 0){
    box.classList.remove('show'); box.innerHTML = '';
    clearPropLine('RB_'+team);
    return;
  }
  savePropLine('RB_'+team, val);
  const res = computeRbPropResult(team, val);
  const fmtRow = (label, r) => {
    if(!r) return `<div class="prop-result-row"><span>${label}</span><span class="prop-verdict flat">no games</span></div>`;
    return `<div class="prop-result-row"><span>${label} (${r.unders}/${r.n} under)</span>${propVerdictBadge(r.pct)}</div>`;
  };
  box.innerHTML = fmtRow('QB HOT →', res.hot) + fmtRow('QB COLD →', res.cold);
  box.classList.add('show');
}

function renderRbGrid(){
  const savedLines = loadPropLines();
  let teams = Object.entries(INTEL.rb_teams).map(([team, v]) => ({ team, ...v }));
  teams = teams.filter(t =>
    !rbSearchTerm || t.team.toLowerCase().includes(rbSearchTerm) || (t.rb_name||'').toLowerCase().includes(rbSearchTerm));

  const gap = t => {
    const vals = [t.rb_hit_rate_qb_hot, t.rb_hit_rate_qb_cold].filter(v => v != null);
    return vals.length === 2 ? Math.abs(vals[0]-vals[1]) : -1;
  };
  if(rbSortKey === 'team'){
    teams.sort((a,b) => a.team.localeCompare(b.team));
  } else if(rbSortKey === 'watch'){
    teams.sort((a,b) => (isRbWatchFlag(b) - isRbWatchFlag(a)) || (gap(b) - gap(a)));
  } else {
    teams.sort((a,b) => gap(b) - gap(a));
  }

  const rbWatchCount = Object.values(INTEL.rb_teams).filter(isRbWatchFlag).length;
  $("rbWatchBanner").innerHTML = rbWatchCount
    ? `<div class="caveat"><b>${rbWatchCount} RB${rbWatchCount===1?'':'s'} on watch this week</b> —
       opponent has a weak pass defense (likely means the QB has a good passing game), and historically a
       sub-${WATCH_THRESHOLD}% hit rate on this RB's own rushing average specifically when the QB is hot.
       Flagged with ⚠️ below.</div>`
    : `<div class="caveat">No RBs meet the watch criteria (weak opponent pass D + sub-${WATCH_THRESHOLD}%
       hit rate when QB is hot, min ${WATCH_MIN_N} games) this week.</div>`;

  $("rbIntelGrid").innerHTML = teams.map(t => {
    const saved = savedLines['RB_'+t.team];
    return `
    <div class="intel-card${isRbWatchFlag(t)?' watch':''}" data-team="${esc2(t.team)}" data-kind="rb">
      ${isRbWatchFlag(t) ? `<div class="watch-badge">⚠️ Watch this week</div>` : ''}
      <div class="ic-head">
        <img class="ic-headshot" src="${esc2(t.rb_headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <div>
          <div class="ic-name">${esc2(t.rb_name)}</div>
          <div class="ic-team">${esc2(t.team)} · ${t.starts} games · avg ${t.rb_season_avg} rush yds/gm</div>
        </div>
      </div>
      <div class="ic-matchup">
        ${t.upcoming_opponent
          ? `${fiLogoHTML(t.team,16)}<span>${esc2(t.team)}</span> vs ${fiLogoHTML(t.upcoming_opponent,16)}<span>${esc2(t.upcoming_opponent)} · Run D #${t.opp_run_def_rank} · Pass D #${t.opp_pass_def_rank}</span>
             ${matchupTierBadge(t.run_matchup_tier)} ${passTierBadge(t.pass_matchup_tier)}`
          : `<span>No upcoming game scheduled</span>`}
      </div>

      <div class="prop-box" data-noclick="1">
        <div class="prop-input-row">
          <label for="rbPropInput_${esc2(t.team)}">Prop line (rush yds)</label>
          <input class="prop-input" type="number" step="0.5" id="rbPropInput_${esc2(t.team)}"
                 value="${saved ? saved.line : ''}" placeholder="75.5">
          <button class="prop-clear" id="rbPropClear_${esc2(t.team)}">✕ clear</button>
        </div>
        <div class="prop-result" id="rbPropResult_${esc2(t.team)}"></div>
        ${saved && saved.week !== INTEL.as_of_week
          ? `<div class="prop-stale">⚠ line saved for week ${saved.week}, this is week ${INTEL.as_of_week}</div>` : ''}
      </div>

      <div class="ic-section-label">Rushing (his own average)</div>
      <div class="ic-row"><span class="ic-row-label">When QB is HOT →</span>
        ${hitBadge(t.rb_hit_rate_qb_hot, t.rb_hit_rate_qb_hot_n)}</div>
      <div class="ic-row"><span class="ic-row-label">When QB is COLD →</span>
        ${hitBadge(t.rb_hit_rate_qb_cold, t.rb_hit_rate_qb_cold_n)}</div>

      <div class="ic-section-label">Passing (team's QB)</div>
      <div class="ic-row"><span class="ic-row-label">When RB is HOT →</span>
        ${hitBadge(t.qb_hit_rate_rb_hot, t.qb_hit_rate_rb_hot_n)}</div>
      <div class="ic-row"><span class="ic-row-label">When RB is COLD →</span>
        ${hitBadge(t.qb_hit_rate_rb_cold, t.qb_hit_rate_rb_cold_n)}</div>
    </div>`;
  }).join('') || `<div class="empty">No teams match that search.</div>`;

  $("rbIntelGrid").querySelectorAll('.intel-card').forEach(el => {
    el.onclick = (e) => {
      if(e.target.closest('[data-noclick]')) return;
      openGameLog(el.dataset.team, 'rb');
    };
  });

  teams.forEach(t => {
    const input = document.getElementById(`rbPropInput_${t.team}`);
    const clearBtn = document.getElementById(`rbPropClear_${t.team}`);
    if(!input) return;
    input.oninput = () => renderRbPropResult(t.team);
    input.onclick = e => e.stopPropagation();
    clearBtn.onclick = (e) => { e.stopPropagation(); input.value = ''; renderRbPropResult(t.team); };
    if(input.value) renderRbPropResult(t.team);
  });
}

/* ── BLITZ IMPACT REPORT ─────────────────────────────────────────── */
function renderBlitzReport(){
  if(!BLITZ || (!Object.keys(BLITZ.qb_teams||{}).length && !Object.keys(BLITZ.wr_teams||{}).length)){
    $("body").innerHTML = `<div class="empty">
      No Blitz Impact data found yet.<br>
      Run <b>python3 build_matchup_stats.py all</b> in your lab folder, then reload.</div>`;
    return;
  }
  $("body").innerHTML = `
    <div class="sect"><h3>Blitz Impact — Real Per-Play Splits</h3><span class="rule"></span></div>
    <div class="report-intro">
      Does this specific player's own performance actually change when the defense sends extra rushers?
      Real play-by-play splits (5+ rushers = blitz), not a season average with a theory attached.
      Completion % reliably drops under blitz league-wide, but EPA/play often doesn't — fewer completions,
      but bigger plays when it connects, since a blitz means fewer defenders in coverage. RB isn't included
      here: blitzing is a pass-rush decision and doesn't apply to run plays, and a direct test showed no real
      link between a defense's blitz rate and rushing efficiency (r=-0.005) — so there's no honest signal to show.
      <br><br>Blitz charting data courtesy of <a href="https://www.ftndata.com" target="_blank" style="color:var(--primary)">FTN Data via nflverse</a>.
    </div>
    <div class="report-controls">
      <div class="tabs" id="blitzPosTabs" role="tablist">
        <button role="tab" data-p="QB" aria-selected="true">QB</button>
        <button role="tab" data-p="WR" aria-selected="false">WR</button>
      </div>
      <input class="search-box" id="blitzSearchBox" placeholder="Search team or player…">
      <div class="tabs" id="blitzSortTabs" role="tablist"></div>
    </div>
    <div id="blitzWatchBanner"></div>
    <div class="intel-grid" id="blitzGrid"></div>`;

  $("blitzPosTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    blitzPos = b.dataset.p;
    $("blitzPosTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderBlitzGrid();
  });
  $("blitzSearchBox").oninput = e => { blitzSearchTerm = e.target.value.toLowerCase(); renderBlitzGrid(); };

  const sorts = [['watch',"This week's watch list"], ['team','Team A–Z']];
  $("blitzSortTabs").innerHTML = sorts.map(([k,l]) =>
    `<button role="tab" aria-selected="${k===blitzSortKey}" data-k="${k}">${l}</button>`).join('');
  $("blitzSortTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    blitzSortKey = b.dataset.k;
    $("blitzSortTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderBlitzGrid();
  });

  renderBlitzGrid();
}

function blitzStatRow(label, blitzVal, cleanVal, higherBetter, isPct){
  const fmt = v => v == null ? '—' : (isPct ? `${v}%` : v);
  const bothKnown = blitzVal != null && cleanVal != null;
  const blitzBetter = bothKnown && (higherBetter ? blitzVal > cleanVal : blitzVal < cleanVal);
  const cleanBetter = bothKnown && (higherBetter ? cleanVal > blitzVal : cleanVal < blitzVal);
  return `<div class="ic-row">
    <span class="ic-row-label">${label}</span>
    <span style="display:flex;gap:14px">
      <span style="font-family:var(--font-mono);font-size:12px;${blitzBetter?'color:var(--primary);font-weight:700':'color:var(--text-mid)'}">${fmt(blitzVal)}</span>
      <span style="color:var(--text-dim)">vs</span>
      <span style="font-family:var(--font-mono);font-size:12px;${cleanBetter?'color:var(--primary);font-weight:700':'color:var(--text-mid)'}">${fmt(cleanVal)}</span>
    </span>
  </div>`;
}

function renderBlitzGrid(){
  const dataset = blitzPos === 'QB' ? (BLITZ.qb_teams||{}) : (BLITZ.wr_teams||{});
  let teams = Object.entries(dataset).map(([team, v]) => ({ team, ...v }));
  teams = teams.filter(t =>
    !blitzSearchTerm || t.team.toLowerCase().includes(blitzSearchTerm) || (t.name||'').toLowerCase().includes(blitzSearchTerm));

  if(blitzSortKey === 'watch'){
    teams.sort((a,b) => (isBlitzWatchFlag(b) - isBlitzWatchFlag(a)) || a.team.localeCompare(b.team));
  } else {
    teams.sort((a,b) => a.team.localeCompare(b.team));
  }

  const watchCount = Object.values(dataset).filter(isBlitzWatchFlag).length;
  const posLabel = blitzPos === 'QB' ? 'QB' : 'WR';
  $("blitzWatchBanner").innerHTML = watchCount
    ? `<div class="caveat"><b>${watchCount} ${posLabel}${watchCount===1?'':'s'} on watch this week</b> —
       opponent is a top-10 blitz-heavy defense, and historically a sub-${WATCH_THRESHOLD}% hit rate on this
       player's own season average specifically in his high-blitz games. Flagged with ⚠️ below.</div>`
    : `<div class="caveat">No ${posLabel}s meet the watch criteria (top-10 blitz-heavy opponent + sub-${WATCH_THRESHOLD}%
       hit rate in high-blitz games, min ${WATCH_MIN_N} games) this week.</div>`;

  $("blitzGrid").innerHTML = teams.map(t => {
    const bv = t.vs_blitz || {}, cv = t.vs_no_blitz || {};
    return `
    <div class="intel-card${isBlitzWatchFlag(t)?' watch':''}" data-team="${esc2(t.team)}">
      ${isBlitzWatchFlag(t) ? `<div class="watch-badge">⚠️ Watch this week</div>` : ''}
      <div class="ic-head">
        <img class="ic-headshot" src="${esc2(t.headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <div>
          <div class="ic-name">${esc2(t.name)}</div>
          <div class="ic-team">${esc2(t.team)} · ${blitzPos==='QB' ? (t.starts+' starts') : (t.targets+' targets')}</div>
        </div>
      </div>
      <div class="ic-matchup">
        ${t.upcoming_opponent
          ? `${fiLogoHTML(t.team,16)}<span>${esc2(t.team)}</span> vs ${fiLogoHTML(t.upcoming_opponent,16)}<span>${esc2(t.upcoming_opponent)} · Blitz Rate #${t.opp_blitz_rank} (${t.opp_blitz_rate}%) · Blitz Success #${t.opp_blitz_success_rank} (${t.opp_blitz_success_rate}%)</span>`
          : `<span>No upcoming game scheduled</span>`}
      </div>
      <div class="ic-section-label">${blitzPos==='QB'?'Reaches his own passing avg':'Reaches his own receiving avg'} — season blitz rate faced: ${t.season_blitz_rate!=null?t.season_blitz_rate+'%':'—'}</div>
      <div class="ic-row"><span class="ic-row-label">When facing a HIGH-blitz game →</span>
        ${hitBadge(t.hit_rate_blitz_high, t.hit_rate_blitz_high_n)}</div>
      <div class="ic-row"><span class="ic-row-label">When facing a LOW-blitz game →</span>
        ${hitBadge(t.hit_rate_blitz_low, t.hit_rate_blitz_low_n)}</div>

      <div class="ic-section-label">Vs Blitz (${bv.n||0}g) &nbsp;·&nbsp; Vs No Blitz (${cv.n||0}g)</div>
      ${blitzPos==='QB' ? blitzStatRow('Completion %', bv.comp_pct, cv.comp_pct, true, true) : blitzStatRow('Catch Rate', bv.comp_pct, cv.comp_pct, true, true)}
      ${blitzStatRow('Yards / Play', bv.yds_per_play, cv.yds_per_play, true, false)}
      ${blitzStatRow('EPA / Play', bv.epa_per_play, cv.epa_per_play, true, false)}
      ${blitzStatRow('Success Rate', bv.success_pct, cv.success_pct, true, true)}
    </div>`;
  }).join('') || `<div class="empty">No players match that search.</div>`;

  $("blitzGrid").querySelectorAll('.intel-card').forEach(el => {
    el.onclick = () => openBlitzGameLog(el.dataset.team);
  });
}

function openBlitzGameLog(team){
  const dataset = blitzPos === 'QB' ? (BLITZ.qb_teams||{}) : (BLITZ.wr_teams||{});
  const t = dataset[team];
  if(!t || !t.log) return;

  $("mTitle").textContent = `${t.name} — ${team}`;
  const yardLabel = blitzPos === 'QB' ? 'pass yds/gm' : 'rec yds/gm';
  $("mSub").textContent = `${t.log.length} games · season avg ${t.season_avg} ${yardLabel} · season blitz rate faced ${t.season_blitz_rate}%`;

  const rows = t.log.slice().sort((a,b) => b.week - a.week);
  let h = `<div class="lead-wrap"><table class="lead-table"><thead><tr>
    <th class="name-col">Week</th><th>Opponent</th>
    <th>Blitz Rate That Game</th><th>Blitz Success Rate</th><th>${blitzPos==='QB'?'Pass Yds':'Rec Yds'}</th>
  </tr></thead><tbody>`;
  rows.forEach(g => {
    h += `<tr>
      <td class="name-col">${g.week}</td>
      <td>${g.opponent ? fiLogoHTML(g.opponent,16)+esc2(g.opponent) : '—'}</td>
      <td><span class="rank-chip">${g.game_blitz_rate}% ${g.was_high?'(high)':'(low)'}</span></td>
      <td><span class="rank-chip">${g.blitz_plays_n ? g.blitz_success_rate+'% ('+g.blitz_plays_n+'p)' : '—'}</span></td>
      <td><span class="cell-val ${g.hit?'log-hit':'log-miss'}">${g.yds}</span></td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div class="empty" style="padding:10px 4px;text-align:left;font-size:10px">
    Green = hit his own season average that game · Red = fell short · "high"/"low" is that game's
    blitz rate compared against his own season average blitz rate faced · Blitz Success Rate is how
    often the blitz actually worked for the defense that game (small play counts per game, so treat with
    caution — shown with the play count next to it).
  </div>`;
  $("mBody").innerHTML = h;

  $("scrim").classList.add("open"); $("modal").classList.add("open");
  $("mClose").focus();
}

function openGameLog(team, kind){
  kind = kind || 'qb';
  const t = kind === 'qb' ? INTEL.teams[team] : INTEL.rb_teams[team];
  if(!t) return;

  if(kind === 'qb'){
    $("mTitle").textContent = `${t.qb_name} — ${team}`;
    $("mSub").textContent = `${t.starts} starts · season avg ${t.qb_season_avg} pass yds/gm · team avg ${t.team_rush_avg} rush yds/gm`;
  } else {
    $("mTitle").textContent = `${t.rb_name} — ${team}`;
    $("mSub").textContent = `${t.starts} games · season avg ${t.rb_season_avg} rush yds/gm`;
  }

  const rushLabel = kind === 'qb' ? 'Team Rush Yds' : 'RB Rush Yds';
  const rushKey = kind === 'qb' ? 'team_rush_yds' : 'rb_rush_yds';
  const rushHitKey = kind === 'qb' ? 'run_hit' : 'rb_hit';

  const rows = t.log.slice().sort((a,b) => b.week - a.week);
  let h = `<div class="lead-wrap"><table class="lead-table"><thead><tr>
    <th class="name-col">Week</th><th>Opponent</th>
    <th>Opp vs Run</th><th>Opp vs Pass</th>
    <th>${rushLabel}</th><th>QB Pass Yds</th>
  </tr></thead><tbody>`;
  rows.forEach(g => {
    h += `<tr>
      <td class="name-col">${g.week}</td>
      <td>${g.opponent ? fiLogoHTML(g.opponent,16)+esc2(g.opponent) : '—'}</td>
      <td><span class="rank-chip">${g.opp_run_def_rank ? '#'+g.opp_run_def_rank : '—'}</span></td>
      <td><span class="rank-chip">${g.opp_pass_def_rank ? '#'+g.opp_pass_def_rank : '—'}</span></td>
      <td><span class="cell-val ${g[rushHitKey]?'log-hit':'log-miss'}">${g[rushKey]}</span></td>
      <td><span class="cell-val ${g.qb_hit?'log-hit':'log-miss'}">${g.qb_pass_yds != null ? g.qb_pass_yds : '—'}</span></td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div class="empty" style="padding:10px 4px;text-align:left;font-size:10px">
    Green = hit that game's own season average · Red = fell short · ranks are each opponent's current defensive rank.
  </div>`;
  $("mBody").innerHTML = h;

  $("scrim").classList.add("open"); $("modal").classList.add("open");
  $("mClose").focus();
}

function closeModal(){
  $("scrim").classList.remove("open"); $("modal").classList.remove("open");
}
$("mClose").addEventListener("click", closeModal);
$("scrim").addEventListener("click", closeModal);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

load();
</script>
