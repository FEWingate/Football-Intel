<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Intel Reports — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
.report-intro{font-size:12.5px;color:var(--text-mid);line-height:1.6;max-width:820px;margin-bottom:20px}
.report-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.search-box{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:12px;padding:8px 12px;width:220px;
}
.intel-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.intel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.ic-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ic-headshot{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface2);
  border:2px solid var(--border);flex:none}
.ic-name{font-family:var(--font-display);font-weight:700;font-size:15px}
.ic-team{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.ic-matchup{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text-mid);
  padding:8px 10px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:12px;
}
.fav-badge{font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;
  padding:2px 6px;border-radius:3px;text-transform:uppercase}
.fav-badge.yes{color:var(--accent-green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3)}
.fav-badge.no{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}
.fav-badge.mid{color:var(--text-mid);background:var(--surface2);border:1px solid var(--border)}
.ic-section-label{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;

.ic-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px}

.lead-table tbody tr:last-child td{border-bottom:0}

}

.watch-badge{
  display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;font-weight:700;
  letter-spacing:.05em;color:var(--accent-gold);background:rgba(250,204,21,.1);

}

.prop-verdict.over{color:var(--accent-red);background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3)}

.gb-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;cursor:pointer;transition:border-color .15s;text-align:left;font:inherit;

.gb-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.gb-card-teams .vs{color:var(--text-dim);font-weight:500;font-size:12px}
.gb-card-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.gb-card-cta{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--primary);margin-top:2px}

.gb-back{

  padding:7px 14px;cursor:pointer;margin-bottom:18px;transition:all .15s;

  background:rgba(163,230,53,.07);margin-bottom:14px;
}

.gb-report{max-width:940px}

.gb-report p{font-size:15.5px;line-height:1.75;color:var(--text-mid);margin:0 0 14px}
.gb-report strong{color:var(--text);font-weight:600}

<body>
<script src="js/fi-shell.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
<script>
const main = fiShell({ page:'reports', pageLabel:'Intel Reports', status:'loading' });

let INTEL = null;
let BLITZ = null;
let COVERAGE = null;
let activeReport = 'qb'; // 'qb' | 'rb' | 'blitz' | 'coverage' | 'cbdb'
let sortKey = 'watch';
let searchTerm = '';
let rbSortKey = 'watch';
let rbSearchTerm = '';
let blitzPos = 'QB';
let blitzSortKey = 'watch';
let blitzSearchTerm = '';
let coveragePos = 'QB';
let coverageModalTeam = null;
let coverageModalView = 'log'; // 'log' | 'splits'
let coverageSearchTerm = '';
let CBDB = null;
let cbdbSortKey = 'yds_per_tgt_allowed';
let cbdbSortDir = 'asc';
let cbdbSearchTerm = '';

let GB_GAMES = [];        // merged list of {away, home, wk} across every manifest found
let gbSelected = null;    // {away, home, wk} of the report currently open, or null for the grid
let gbReportCache = {};

main.innerHTML = `
  <div class="bar">
    <span class="lbl">Intel Reports</span>
    <div class="legend"><span>Hidden Intelligence — patterns most sites don't show you</span></div>
  </div>
  <div class="tabs" id="reportTabs" role="tablist">
    <button role="tab" data-r="qb" aria-selected="true">QB Passing vs. Run Game</button>
    <button role="tab" data-r="rb" aria-selected="false">RB Rushing vs. Passing Game</button>
    <button role="tab" data-r="blitz" aria-selected="false">Blitz Impact</button>
    <button role="tab" data-r="coverage" aria-selected="false">Coverage Breakdown</button>
    <button role="tab" data-r="cbdb" aria-selected="false">CB/DB Coverage Rankings</button>
    <button role="tab" data-r="gb" aria-selected="false">Coeus Game Breakdowns</button>
  </div>
  <div id="body"></div>
  <div class="modal-overlay" id="scrim"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-subtitle" id="mSub"></div>
      <button class="modal-close" id="mClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>`;

const $ = id => document.getElementById(id);

async function load(){
  fiStatus("Loading","loading");
  try{
    const res = await fetch(`intel/latest.json`);
    if(res.ok) INTEL = await res.json();
  }catch(e){}
  try{
    const resC = await fetch(`intel/coverage.json`);
    if(resC.ok) COVERAGE = await resC.json();
  }catch(e){}
  try{
    const res2 = await fetch(`intel/blitz.json`);
    if(res2.ok) BLITZ = await res2.json();
  }catch(e){}
  try{
    const res3 = await fetch(`intel/cb_rankings.json`);
    if(res3.ok) CBDB = await res3.json();
  }catch(e){}

  // Game Breakdowns: check both the bootstrap folder (upcoming, unplayed
  // games — currently the only reports that exist) and the current real
  // week's folder (matchup/current.json), if one exists. A manifest.json
  // only appears in a folder once generate_game_breakdown.py has actually
  // written at least one report there — missing is expected, not an error.
  GB_GAMES = [];
  try{
    const rBoot = await fetch(`game_breakdowns/bootstrap/manifest.json`);
    if(rBoot.ok){
      const mf = await rBoot.json();
      Object.values(mf.games || {}).forEach(g => GB_GAMES.push({ ...g, wk: 'bootstrap' }));
    }
  }catch(e){}
  try{
    const rCur = await fetch(`matchup/current.json`);
    if(rCur.ok){
      const cur = await rCur.json();
      const wk = `wk${String(cur.week).padStart(2,'0')}`;
      const rWk = await fetch(`game_breakdowns/${wk}/manifest.json`);
      if(rWk.ok){
        const mf = await rWk.json();
        Object.values(mf.games || {}).forEach(g => GB_GAMES.push({ ...g, wk }));
      }
    }
  }catch(e){}

  if(!INTEL || !Object.keys(INTEL.teams||{}).length){
    fiStatus("No data","error"); fiUpdated("");
    $("body").innerHTML = `<div class="empty">
      No Intel Reports data found yet.<br>
      Run <b>python3 build_matchup_stats.py all</b> in your lab folder, then reload.</div>`;
    return;
  }

  fiStatus("Ready");
  fiUpdated(`${INTEL.season} · as of week ${INTEL.as_of_week}`);

  $("reportTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    activeReport = b.dataset.r;
    gbSelected = null;
    $("reportTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    render();
  });

  render();
}

function render(){
  if(activeReport === 'qb') renderQBReport();
  else if(activeReport === 'rb') renderRBReport();
  else if(activeReport === 'blitz') renderBlitzReport();
  else if(activeReport === 'coverage') renderCoverageReport();
  else if(activeReport === 'gb') renderGbReport();
  else renderCbDbReport();
}

function esc2(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// A QB is "on watch" this week if: the run game has a genuinely favorable
// matchup (weak run D, likely to be hot) AND this specific QB has
// historically struggled to hit his own passing average in exactly that
// scenario. Requires a real sample (4+ games) in the run-hot bucket —
// otherwise a QB with one bad game could get flagged off pure noise.
/* ── PROP LINE INPUT ─────────────────────────────────────────────── */
const PROP_STORE_KEY = 'fi_intel_prop_lines_v1';

function loadPropLines(){
  try{ return JSON.parse(localStorage.getItem(PROP_STORE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function savePropLine(team, line){
  const store = loadPropLines();
  store[team] = { line, week: INTEL.as_of_week };
  try{ localStorage.setItem(PROP_STORE_KEY, JSON.stringify(store)); }catch(e){}
}
function clearPropLine(team){
  const store = loadPropLines();
  delete store[team];
  try{ localStorage.setItem(PROP_STORE_KEY, JSON.stringify(store)); }catch(e){}
}

// Vs a real, user-entered line (not the QB's own season average) — split
// by whether the run game was hot or cold that game, since that's the
// whole point: checking the actual bettable number against exactly the
// scenario (favorable run spot) the strategy is built around.
function computePropResult(team, line){
  const t = INTEL.teams[team];
  if(!t || !t.log || !t.log.length) return null;
  const hot = t.log.filter(g => g.run_hit);
  const cold = t.log.filter(g => !g.run_hit);
  const underRate = games => {
    if(!games.length) return null;
    const unders = games.filter(g => g.qb_pass_yds < line).length;
    return { pct: Math.round(1000*unders/games.length)/10, unders, n: games.length };
  };
  return { hot: underRate(hot), cold: underRate(cold) };
}

function propVerdictBadge(pct){
  if(pct == null) return `<span class="prop-verdict flat">no data</span>`;
  if(pct >= 60) return `<span class="prop-verdict under">Leans Under</span>`;
  if(pct <= 40) return `<span class="prop-verdict over">Leans Over</span>`;
  return `<span class="prop-verdict flat">No clear lean</span>`;
}

function renderPropResult(team){
  const box = document.getElementById(`propResult_${team}`);
  if(!box) return;
  const input = document.getElementById(`propInput_${team}`);
  const val = parseFloat(input.value);
  if(!val || val <= 0){
    box.classList.remove('show'); box.innerHTML = '';
    clearPropLine(team);
    return;
  }
  savePropLine(team, val);
  const res = computePropResult(team, val);
  const fmtRow = (label, r) => {
    if(!r) return `<div class="prop-result-row"><span>${label}</span><span class="prop-verdict flat">no games</span></div>`;
    return `<div class="prop-result-row"><span>${label} (${r.unders}/${r.n} under)</span>${propVerdictBadge(r.pct)}</div>`;
  };
  box.innerHTML = fmtRow('Run game HOT →', res.hot) + fmtRow('Run game COLD →', res.cold);
  box.classList.add('show');
}

function matchupTierBadge(tier){
  if(tier === 'bot') return `<span class="fav-badge yes">Favorable run spot</span>`;
  if(tier === 'top') return `<span class="fav-badge no">Tough run spot</span>`;
  if(tier === 'mid') return `<span class="fav-badge mid">Neutral run spot</span>`;
  return '';
}

// Same direction as matchupTierBadge, just labeling the pass defense's own
// strength directly — no speculative "leans run/pass" story. The value is
// seeing both badges together: two "Tough" badges means the whole matchup
// is bad, not just one side of it.
function passTierBadge(tier){
  if(tier === 'bot') return `<span class="fav-badge yes">Favorable pass spot</span>`;
  if(tier === 'top') return `<span class="fav-badge no">Tough pass spot</span>`;
  if(tier === 'mid') return `<span class="fav-badge mid">Neutral pass spot</span>`;
  return '';
}

const WATCH_THRESHOLD = 35;
const WATCH_MIN_N = 4;
function isWatchFlag(t){
  return t.run_matchup_tier === 'bot'
    && t.qb_hit_rate_run_hot != null
    && t.qb_hit_rate_run_hot < WATCH_THRESHOLD
    && t.qb_hit_rate_run_hot_n >= WATCH_MIN_N;
}

// Exact mirror of isWatchFlag, reversed: a weak pass defense (bottom 10)
// makes the QB likely to have a hot passing game — and if this specific
// RB has historically struggled to hit his own rushing average when the
// QB is hot, that's the same "watch for an under" signal, just on the
// other side of the correlation.
function isRbWatchFlag(t){
  return t.pass_matchup_tier === 'bot'
    && t.rb_hit_rate_qb_hot != null
    && t.rb_hit_rate_qb_hot < WATCH_THRESHOLD
    && t.rb_hit_rate_qb_hot_n >= WATCH_MIN_N;
}

// Same mirror pattern again: opponent is a top-10 blitz-heavy defense
// (likely to blitz a lot this week) + this player's own history shows a
// low hit rate specifically in his high-blitz games. Works for both QB
// and WR since both share the same field names.
function isBlitzWatchFlag(t){
  return t.blitz_matchup_tier === 'top'
    && t.hit_rate_blitz_high != null
    && t.hit_rate_blitz_high < WATCH_THRESHOLD
    && t.hit_rate_blitz_high_n >= WATCH_MIN_N;
}

function renderQBReport(){
  $("body").innerHTML = `
    <div class="sect"><h3>QB Passing vs. Run Game — Hit Rate Correlation</h3><span class="rule"></span></div>
    <div class="report-intro">
      Does a team's starting QB reach his own season passing average more or less often depending on whether the
      run game is having a good day — and does it work the same way in reverse? Each card shows both directions,
      using each QB's own games only (no blending across a benched starter), with the sample size shown next to
      every number so a real pattern is easy to tell apart from a small-sample fluke.
    </div>
    <div class="report-controls">
      <input class="search-box" id="searchBox" placeholder="Search team or QB…">
      <div class="tabs" id="sortTabs" role="tablist"></div>
    </div>
    <div id="watchBanner"></div>
    <div class="intel-grid" id="intelGrid"></div>`;

  $("searchBox").oninput = e => { searchTerm = e.target.value.toLowerCase(); renderGrid(); };

  const sorts = [['watch',"This week's watch list"], ['gap','Strongest pattern'], ['team','Team A–Z']];
  $("sortTabs").innerHTML = sorts.map(([k,l]) =>
    `<button role="tab" aria-selected="${k===sortKey}" data-k="${k}">${l}</button>`).join('');
  $("sortTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    sortKey = b.dataset.k;
    $("sortTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderGrid();
  });

  renderGrid();
}

function hitBadge(rate, n){
  if(rate == null) return `<span class="hit-badge miss">no data</span>`;
  const isHit = rate >= 50;
  const displayRate = isHit ? rate : Math.round((100 - rate) * 10) / 10;
  return `<span class="hit-badge ${isHit?'hit':'miss'}">${isHit?'Usually hits':'Usually falls short'}
    (${displayRate}%)<span class="n">${n}g</span></span>`;
}

function renderGrid(){
  const savedLines = loadPropLines();
  let teams = Object.entries(INTEL.teams).map(([team, v]) => ({ team, ...v }));
  teams = teams.filter(t =>
    !searchTerm || t.team.toLowerCase().includes(searchTerm) || (t.qb_name||'').toLowerCase().includes(searchTerm));

  const gap = t => {
    const vals = [t.qb_hit_rate_run_hot, t.qb_hit_rate_run_cold].filter(v => v != null);
    return vals.length === 2 ? Math.abs(vals[0]-vals[1]) : -1;
  };

  if(sortKey === 'team'){
    teams.sort((a,b) => a.team.localeCompare(b.team));
  } else if(sortKey === 'watch'){

function computeRbPropResult(team, line){
  const t = INTEL.rb_teams[team];
  if(!t || !t.log || !t.log.length) return null;
  const qbHot = t.log.filter(g => g.qb_hit);
  const qbCold = t.log.filter(g => !g.qb_hit);
  const underRate = games => {
    if(!games.length) return null;
    const unders = games.filter(g => g.rb_rush_yds < line).length;
    return { pct: Math.round(1000*unders/games.length)/10, unders, n: games.length };
  };
  return { hot: underRate(qbHot), cold: underRate(qbCold) };
}

function renderRbPropResult(team){
  const box = document.getElementById(`rbPropResult_${team}`);
  if(!box) return;
  const input = document.getElementById(`rbPropInput_${team}`);
  const val = parseFloat(input.value);
  if(!val || val <= 0){
    box.classList.remove('show'); box.innerHTML = '';
    clearPropLine('RB_'+team);
    return;
  }
  savePropLine('RB_'+team, val);
  const res = computeRbPropResult(team, val);
  const fmtRow = (label, r) => {
    if(!r) return `<div class="prop-result-row"><span>${label}</span><span class="prop-verdict flat">no games</span></div>`;
    return `<div class="prop-result-row"><span>${label} (${r.unders}/${r.n} under)</span>${propVerdictBadge(r.pct)}</div>`;
  };
  box.innerHTML = fmtRow('QB HOT →', res.hot) + fmtRow('QB COLD →', res.cold);
  box.classList.add('show');
}

function blitzStatRow(label, blitzVal, cleanVal, higherBetter, isPct){
  const fmt = v => v == null ? '—' : (isPct ? `${v}%` : v);
  const bothKnown = blitzVal != null && cleanVal != null;
  const blitzBetter = bothKnown && (higherBetter ? blitzVal > cleanVal : blitzVal < cleanVal);
  const cleanBetter = bothKnown && (higherBetter ? cleanVal > blitzVal : cleanVal < blitzVal);
  return `<div class="ic-row">
    <span class="ic-row-label">${label}</span>
    <span style="display:flex;gap:14px">
      <span style="font-family:var(--font-mono);font-size:12px;${blitzBetter?'color:var(--primary);font-weight:700':'color:var(--text-mid)'}">${fmt(blitzVal)}</span>
      <span style="color:var(--text-dim)">vs</span>
      <span style="font-family:var(--font-mono);font-size:12px;${cleanBetter?'color:var(--primary);font-weight:700':'color:var(--text-mid)'}">${fmt(cleanVal)}</span>
    </span>
  </div>`;
}

function openBlitzGameLog(team){
  const dataset = blitzPos === 'QB' ? (BLITZ.qb_teams||{}) : (BLITZ.wr_teams||{});
  const t = dataset[team];
  if(!t || !t.log) return;

  $("mTitle").textContent = `${t.name} — ${team}`;
  const yardLabel = blitzPos === 'QB' ? 'pass yds/gm' : 'rec yds/gm';
  $("mSub").textContent = `${t.log.length} games · season avg ${t.season_avg} ${yardLabel} · season blitz rate faced ${t.season_blitz_rate}%`;

  const rows = t.log.slice().sort((a,b) => b.week - a.week);
  let h = `<div class="lead-wrap"><table class="lead-table"><thead><tr>
    <th class="name-col">Week</th><th>Opponent</th>
    <th>Blitz Rate That Game</th><th>Blitz Success Rate</th><th>${blitzPos==='QB'?'Pass Yds':'Rec Yds'}</th>
  </tr></thead><tbody>`;
  rows.forEach(g => {
    h += `<tr>
      <td class="name-col">${g.week}</td>
      <td>${g.opponent ? fiLogoHTML(g.opponent,16)+esc2(g.opponent) : '—'}</td>
      <td><span class="rank-chip">${g.game_blitz_rate}% ${g.was_high?'(high)':'(low)'}</span></td>
      <td><span class="rank-chip">${g.blitz_plays_n ? g.blitz_success_rate+'% ('+g.blitz_plays_n+'p)' : '—'}</span></td>
      <td><span class="cell-val ${g.hit?'log-hit':'log-miss'}">${g.yds}</span></td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div class="empty" style="padding:10px 4px;text-align:left;font-size:10px">
    Green = hit his own season average that game · Red = fell short · "high"/"low" is that game's
    blitz rate compared against his own season average blitz rate faced · Blitz Success Rate is how
    often the blitz actually worked for the defense that game (small play counts per game, so treat with
    caution — shown with the play count next to it).
  </div>`;
  $("mBody").innerHTML = h;

  $("scrim").classList.add("open"); $("modal").classList.add("open");
  $("mClose").focus();
}

    $("body").innerHTML = `<div class="empty">
      No Coverage Breakdown data available for ${COVERAGE?COVERAGE.season:'this season'} yet.<br>
      This report uses nflverse's participation data, which is only released after the full season
      (including playoffs) concludes — it doesn't update during a live season. Run
      <b>python3 build_matchup_stats.py all</b> again once that season is fully over.</div>`;
    return;
  }
  $("body").innerHTML = `
    <div class="sect"><h3>Coverage Breakdown — ${COVERAGE.season} Season Retrospective</h3><span class="rule"></span></div>
    <div class="report-intro">
      How did each team's starting QB (and their target leader) actually perform against man vs. zone
      coverage, and against specific calls like Cover 2 or Cover 3, over the full ${COVERAGE.season} season?
      This is deliberately a look-back, not a "this week" report — coverage-scheme charting only gets
      released once a season fully wraps up, so there's no forward-looking matchup angle here, just real
      season totals. Coverage types with fewer than 10 plays are hidden — too small a sample to mean anything.
    </div>
    <div class="report-controls">
      <div class="tabs" id="coveragePosTabs" role="tablist">
        <button role="tab" data-p="QB" aria-selected="true">QB</button>
        <button role="tab" data-p="WR" aria-selected="false">WR</button>
        <button role="tab" data-p="TE" aria-selected="false">TE</button>
      </div>
      <input class="search-box" id="coverageSearchBox" placeholder="Search team or player…">
    </div>
    <div class="intel-grid" id="coverageGrid"></div>`;

  $("coveragePosTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    coveragePos = b.dataset.p;
    $("coveragePosTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderCoverageGrid();
  });
  $("coverageSearchBox").oninput = e => { coverageSearchTerm = e.target.value.toLowerCase(); renderCoverageGrid(); };

  renderCoverageGrid();
}

function coverageTableHTML(splits, title){
  const rows = Object.entries(splits).sort((a,b) => b[1].n - a[1].n);
  if(!rows.length) return '';
  return `
    <div class="ic-section-label">${title}</div>
    <div class="lead-wrap" style="max-height:none"><table class="lead-table"><thead><tr>
      <th class="name-col">Coverage</th><th>Plays</th><th>Yds/Play</th><th>Comp%</th><th>Success%</th>
      <th>10+%</th><th>16+%</th><th>20+%</th><th>40+%</th>
    </tr></thead><tbody>
      ${rows.map(([key, s]) => `<tr>
        <td class="name-col">${esc2(COVERAGE_LABELS[key]||key)}</td>
        <td><span class="cell-val">${s.n}</span></td>
        <td><span class="cell-val">${s.yds_per_play}</span></td>
        <td><span class="cell-val">${s.comp_pct!=null?s.comp_pct+'%':'—'}</span></td>
        <td><span class="cell-val">${s.success_pct}%</span></td>
        <td><span class="cell-val">${s.c10_pct}%</span></td>
        <td><span class="cell-val">${s.c16_pct}%</span></td>
        <td><span class="cell-val">${s.c20_pct}%</span></td>
        <td><span class="cell-val">${s.c40_pct}%</span></td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

function manZoneSplitsHTML(manZone, record, pos){
  const cols = [['MAN_COVERAGE','Man'], ['ZONE_COVERAGE','Zone']];
  const statRows = [
    ['Total Plays', s => s.n, false, null],
    ['Yds / Play', s => s.yds_per_play, false, null],
    ['Completion %', s => s.comp_pct, true, null],
    ['EPA / Play', s => s.epa_per_play, false, null],
    ['Success %', s => s.success_pct, true, null],
    ['10+ Yd %', s => s.c10_pct, true, null],
    ['16+ Yd %', s => s.c16_pct, true, null],
    ['20+ Yd %', s => s.c20_pct, true, null],
    ['40+ Yd %', s => s.c40_pct, true, null],
  ];
  return `
    <div class="lead-wrap" style="max-height:none"><table class="lead-table"><thead><tr>
      <th class="name-col">Stat</th>
      ${cols.map(([key,label]) => `<th>${label}${manZone[key]?'':' (no plays)'}</th>`).join('')}
    </tr></thead><tbody>
      ${statRows.map(([label, getter, isPct]) => `<tr>
        <td class="name-col">${label}</td>
        ${cols.map(([key]) => {
          const s = manZone[key];
          const v = s ? getter(s) : null;
          const text = v == null ? '—' : (isPct ? v+'%' : v);
          return `<td><span class="cell-val">${text}</span></td>`;
        }).join('')}
      </tr>`).join('')}
      <tr><td class="name-col">Yards / Game</td>
        ${cols.map(([key]) => {
          const r = record ? record[key] : null;
          const text = (r && r.yds_per_game != null) ? r.yds_per_game : '—';
          return `<td><span class="cell-val">${text}</span></td>`;
        }).join('')}
      </tr>
      <tr><td class="name-col">W-L Record</td>
        ${cols.map(([key]) => {
          const r = record ? record[key] : null;
          const text = r ? `${r.W}-${r.L}${r.T?'-'+r.T:''}` : '—';
          return `<td><span class="cell-val">${text}</span></td>`;
        }).join('')}
      </tr>
    </tbody></table></div>
    <div class="empty" style="padding:10px 4px;text-align:left;font-size:10px">
      Total Plays through Success % above are per-play splits (each play tagged man or zone directly from
      charting data), season-long. Yards/Game and W-L Record are different: both are tied to whichever
      coverage was actually more common in each specific game — whichever type had more snaps that game is
      the bucket it counts toward. A tied game (equal snaps of each) isn't counted either direction.
    </div>`;
}

function openCoverageModal(team){
  const dataset = coverageDataset(coveragePos);
  const t = dataset[team];
  if(!t) return;
  coverageModalTeam = team;
  coverageModalView = coverageModalView || 'log';

  $("mTitle").textContent = `${t.name} — ${team}`;
  $("mSub").textContent = `${(t.log||[]).length} games · ${COVERAGE.season} season · ${seasonAvgLineHTML(t, coveragePos)}`;

  $("mBody").innerHTML = `
    <div class="tabs" id="coverageModalTabs" role="tablist" style="margin-bottom:12px">
      <button role="tab" data-v="log" aria-selected="${coverageModalView==='log'}">Game Log</button>
      <button role="tab" data-v="splits" aria-selected="${coverageModalView==='splits'}">Splits (Man / Zone)</button>
    </div>
    <div id="coverageModalBody"></div>`;

  $("coverageModalTabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    coverageModalView = b.dataset.v;
    $("coverageModalTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    renderCoverageModalBody();
  });

  renderCoverageModalBody();

  $("scrim").classList.add("open"); $("modal").classList.add("open");
  $("mClose").focus();
}

function renderCoverageModalBody(){
  const dataset = coverageDataset(coveragePos);
  const t = dataset[coverageModalTeam];
  if(!t) return;
  $("coverageModalBody").innerHTML = coverageModalView === 'log'
    ? coverageLogTableHTML(t.log, coveragePos)
    : manZoneSplitsHTML(t.man_zone || {}, t.man_zone_record || {}, coveragePos);
}

function coverageLogTableHTML(log, pos){
  if(!log || !log.length) return `<div class="empty">No game log available.</div>`;
  const rows = log.slice().sort((a,b) => b.week - a.week);
  const yardLabel = pos === 'QB' ? 'Pass Yds' : 'Rec Yds';
  return `
    <div class="lead-wrap"><table class="lead-table"><thead><tr>
      <th class="name-col">Week</th><th>Opponent</th><th>W/L</th>
      <th>Man %</th><th>Zone %</th><th>${yardLabel}</th><th>Comp %</th><th>TD</th>
    </tr></thead><tbody>
      ${rows.map(g => { const resultClass = g.result==='W'?'log-hit':(g.result==='L'?'log-miss':''); return `<tr>
        <td class="name-col">${g.week}</td>
        <td>${g.opponent ? fiLogoHTML(g.opponent,16)+esc2(g.opponent) : '—'}</td>
        <td><span class="cell-val ${resultClass}">${g.result||'—'}</span></td>
        <td><span class="rank-chip">${g.man_pct!=null?g.man_pct+'%':'—'}</span></td>
        <td><span class="rank-chip">${g.zone_pct!=null?g.zone_pct+'%':'—'}</span></td>
        <td><span class="cell-val">${g.yds!=null?g.yds:'—'}</span></td>
        <td><span class="cell-val">${g.comp_pct!=null?g.comp_pct+'%':'—'}</span></td>
        <td><span class="cell-val">${g.td!=null?g.td:'—'}</span></td>
      </tr>`; }).join('')}
    </tbody></table></div>`;
}

function seasonAvgLineHTML(t, pos){
  if(pos === 'QB') return `${t.season_pass_yds_avg} pass yds/gm · ${t.season_comp_pct!=null?t.season_comp_pct+'%':'—'} comp`;
  return `${t.season_rec_yds_avg} rec yds/gm · ${t.season_rec_pg} rec/gm`;
}

function renderCoverageGrid(){
  const dataset = coverageDataset(coveragePos);
  let teams = Object.entries(dataset).map(([team, v]) => ({ team, ...v }));
  teams = teams.filter(t =>
    !coverageSearchTerm || t.team.toLowerCase().includes(coverageSearchTerm) || (t.name||'').toLowerCase().includes(coverageSearchTerm));
  teams.sort((a,b) => a.team.localeCompare(b.team));

  $("coverageGrid").innerHTML = teams.map(t => `
    <div class="intel-card" data-team="${esc2(t.team)}">
      <div class="ic-head">
        <img class="ic-headshot" src="${esc2(t.headshot||'')}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <div>
          <div class="ic-name">${esc2(t.name)}</div>
          <div class="ic-team">${esc2(t.team)} · ${coveragePos==='QB' ? (t.starts+' starts') : (t.targets+' targets')}</div>
          <div class="ic-team" style="color:var(--text-mid)">${seasonAvgLineHTML(t, coveragePos)}</div>
        </div>
      </div>
      ${coverageTableHTML(t.man_zone, 'Man vs Zone (Play-Level)')}
      ${coverageTableHTML(t.by_coverage, 'By Specific Coverage (min 10 plays)')}
    </div>`).join('') || `<div class="empty">No players match that search.</div>`;

  $("coverageGrid").querySelectorAll('.intel-card').forEach(el => {
    el.onclick = () => openCoverageModal(el.dataset.team);
  });
}

function openGameLog(team, kind){
  kind = kind || 'qb';
  const t = kind === 'qb' ? INTEL.teams[team] : INTEL.rb_teams[team];
  if(!t) return;

  if(kind === 'qb'){
    $("mTitle").textContent = `${t.qb_name} — ${team}`;
    $("mSub").textContent = `${t.starts} starts · season avg ${t.qb_season_avg} pass yds/gm · team avg ${t.team_rush_avg} rush yds/gm`;
  } else {
    $("mTitle").textContent = `${t.rb_name} — ${team}`;
    $("mSub").textContent = `${t.starts} games · season avg ${t.rb_season_avg} rush yds/gm`;
  }

  const rushLabel = kind === 'qb' ? 'Team Rush Yds' : 'RB Rush Yds';
  const rushKey = kind === 'qb' ? 'team_rush_yds' : 'rb_rush_yds';
  const rushHitKey = kind === 'qb' ? 'run_hit' : 'rb_hit';

  const rows = t.log.slice().sort((a,b) => b.week - a.week);
  let h = `<div class="lead-wrap"><table class="lead-table"><thead><tr>
    <th class="name-col">Week</th><th>Opponent</th>
    <th>Opp vs Run</th><th>Opp vs Pass</th>
    <th>${rushLabel}</th><th>QB Pass Yds</th>
  </tr></thead><tbody>`;
  rows.forEach(g => {
    h += `<tr>
      <td class="name-col">${g.week}</td>
      <td>${g.opponent ? fiLogoHTML(g.opponent,16)+esc2(g.opponent) : '—'}</td>
      <td><span class="rank-chip">${g.opp_run_def_rank ? '#'+g.opp_run_def_rank : '—'}</span></td>
      <td><span class="rank-chip">${g.opp_pass_def_rank ? '#'+g.opp_pass_def_rank : '—'}</span></td>
      <td><span class="cell-val ${g[rushHitKey]?'log-hit':'log-miss'}">${g[rushKey]}</span></td>
      <td><span class="cell-val ${g.qb_hit?'log-hit':'log-miss'}">${g.qb_pass_yds != null ? g.qb_pass_yds : '—'}</span></td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div class="empty" style="padding:10px 4px;text-align:left;font-size:10px">
    Green = hit that game's own season average · Red = fell short · ranks are each opponent's current defensive rank.
  </div>`;
  $("mBody").innerHTML = h;

  $("scrim").classList.add("open"); $("modal").classList.add("open");
  $("mClose").focus();
}

function closeModal(){
  $("scrim").classList.remove("open"); $("modal").classList.remove("open");
}
$("mClose").addEventListener("click", closeModal);
$("scrim").addEventListener("click", closeModal);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

/* ── CB/DB COVERAGE RANKINGS (live, individual defenders) ───────────
   Standalone leaderboard — NOT a "WR vs this specific CB" matchup engine.
   No source available to this project tracks shadow-coverage assignments
   (who covered whom on a given play), so this deliberately stays a
   league-wide individual-defender leaderboard rather than pretending to
   know which CB a given WR will actually face. */
const CBDB_COLS = [
  { key: 'targets', label: 'Targets' },
  { key: 'comp_pct_allowed', label: 'Comp% Allowed', pct: true },
  { key: 'yards_allowed', label: 'Yards Allowed' },
  { key: 'yds_per_tgt_allowed', label: 'Yds/Tgt Allowed' },
  { key: 'td_allowed', label: 'TD Allowed' },
  { key: 'ints', label: 'INTs' },
  { key: 'rating_allowed', label: 'Rating Allowed' },
];

function renderCbDbReport(){
  if(!CBDB || !CBDB.available || !CBDB.players.length){
    $("body").innerHTML = `<div class="empty">
      No CB/DB Coverage Rankings data available for ${CBDB?CBDB.season:'this season'} yet.<br>
      This report uses PFR Advanced Stats (defense), which updates during a live season — run
      <b>python3 build_matchup_stats.py all</b> again once games have been played.</div>`;
    return;
  }
  $("body").innerHTML = `
    <div class="sect"><h3>CB/DB Coverage Rankings — ${CBDB.season} Season</h3><span class="rule"></span></div>
    <div class="report-intro">
      Individual defensive backs (CB/S/FS/SAF), ranked league-wide on what they've allowed in coverage —
      not a "this WR vs this specific CB" matchup, since no data source tracks who actually covered whom on
      a given play. ${CBDB.data_horizon}. Minimum ${CBDB.min_targets} targets faced to qualify — smaller
      samples are hidden as noise. Rank 1 = stingiest. Data via Pro Football Reference (nflverse).
    </div>
    <div class="report-controls">
      <input class="search-box" id="cbdbSearchBox" placeholder="Search player or team…">
    </div>
    <div class="lead-wrap"><table class="lead-table" id="cbdbTable"></table></div>`;

  $("cbdbSearchBox").oninput = e => { cbdbSearchTerm = e.target.value.toLowerCase(); renderCbDbTable(); };
  renderCbDbTable();
}

function renderCbDbTable(){
  let rows = CBDB.players;
  if(cbdbSearchTerm){
    rows = rows.filter(r => r.name.toLowerCase().includes(cbdbSearchTerm)
      || r.team.toLowerCase().includes(cbdbSearchTerm));
  }
  rows = rows.slice().sort((a,b) => {
    const av = a[cbdbSortKey], bv = b[cbdbSortKey];
    return cbdbSortDir === 'asc' ? av - bv : bv - av;
  });

  let h = `<thead><tr>
    <th class="name-col">Player</th>
    ${CBDB_COLS.map(c => `<th data-key="${c.key}" class="${c.key===cbdbSortKey?'sorted':''}" style="cursor:pointer">
      ${esc2(c.label)}${c.key===cbdbSortKey ? (cbdbSortDir==='asc'?' ▴':' ▾') : ''}</th>`).join('')}
  </tr></thead><tbody>`;
  rows.forEach(r => {
    h += `<tr>
      <td class="name-col"><b style="display:inline-flex;align-items:center;gap:6px">
        ${fiLogoHTML(r.team,16)}${esc2(r.name)}
        <span class="rank-chip">${esc2(r.position)} · #${r[`rank_${cbdbSortKey}`] ?? '—'}</span></b></td>
      ${CBDB_COLS.map(c => `<td><span class="cell-val">${fmtCbdbVal(r[c.key], c.pct)}</span></td>`).join('')}
    </tr>`;
  });
  h += `</tbody>`;
  $("cbdbTable").innerHTML = h;

  $("cbdbTable").querySelectorAll("th[data-key]").forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    if(k === cbdbSortKey) cbdbSortDir = cbdbSortDir === 'asc' ? 'desc' : 'asc';
    else { cbdbSortKey = k; cbdbSortDir = 'asc'; }
    renderCbDbTable();
  });
}

function fmtCbdbVal(v, pct){
  if(v === null || v === undefined) return '—';
  return pct ? `${v}%` : v;
}

/* ── Game Breakdowns: card grid (browse) + in-page full report (read) ──
   Deliberately NOT a modal — a 9-section, multi-thousand-word report reads
   like a nested scrollbar squeezed into a small box if forced into one;
   swapping the main content area, same pattern as DFS Center's Coeus tab,
   reads like an actual page instead. */
function renderGbReport(){
  if(gbSelected) renderGbSingleReport();
  else renderGbGrid();
}

function renderGbGrid(){
  if(!GB_GAMES.length){
    $("body").innerHTML = `
      <div class="sect"><h3>Coeus Game Breakdowns</h3><span class="rule"></span></div>
      <div class="report-intro">
        Full, market-neutral, both-teams analysis — one per game, engineered by Coeus.
      </div>
      <div class="empty">No Game Breakdowns available yet. Run <b>generate_game_breakdown.py</b>
        for a game, then reload.</div>`;
    return;
  }
  $("body").innerHTML = `
    <div class="sect"><h3>Coeus Game Breakdowns</h3><span class="rule"></span></div>
    <div class="report-intro">
      Full, market-neutral, both-teams analysis — one per game, engineered by Coeus. Click a
      game to read its complete breakdown.
    </div>
    <div class="intel-grid" id="gbGrid"></div>`;

  const grid = $("gbGrid");
  grid.innerHTML = GB_GAMES.map((g, i) => `
    <button class="gb-card" data-i="${i}">
      <div class="gb-card-teams">
        ${fiLogoHTML(g.away,26)}<span>${esc2(g.away)}</span>
        <span class="vs">@</span>
        ${fiLogoHTML(g.home,26)}<span>${esc2(g.home)}</span>
      </div>
      <div class="gb-card-meta">${g.wk === 'bootstrap' ? 'Upcoming — bootstrap preview' : g.wk.toUpperCase()}</div>
      <div class="gb-card-cta">Read full breakdown →</div>
    </button>`).join('');

  grid.querySelectorAll(".gb-card").forEach(card => {
    card.onclick = () => {
      gbSelected = GB_GAMES[Number(card.dataset.i)];
      renderGbReport();
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
  });
}

async function renderGbSingleReport(){
  const g = gbSelected;
  $("body").innerHTML = `
    <button class="gb-back" id="gbBack">← All Game Breakdowns</button>
    <div class="coeus-attribution">Engineered by Coeus</div>
    <div id="gbReportBody"><div class="empty">Loading report…</div></div>`;
  $("gbBack").onclick = () => { gbSelected = null; renderGbReport(); window.scrollTo({top:0}); };

  const key = `${g.away}_${g.home}`;
  const body = $("gbReportBody");
  try{
    let md = gbReportCache[`${g.wk}:${key}`];
    if(!md){
      const res = await fetch(`game_breakdowns/${g.wk}/${key}.md`);
      if(!res.ok) throw new Error('not found');
      md = await res.text();
      gbReportCache[`${g.wk}:${key}`] = md;
    }
    body.innerHTML = `<div class="gb-report">${marked.parse(md)}</div>`;
  }catch(e){
    body.innerHTML = `<div class="empty">This report could not be loaded.</div>`;
  }
}

load();
</script>
</body>
</html>
