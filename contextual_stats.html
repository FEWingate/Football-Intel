<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contextual Statistics — Football Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fi-styles.css">
<style>
/* page-specific: tier chips + splits slope */
.chip{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;padding:2px 5px;
  border-radius:3px;border:1px solid var(--border2);color:var(--text-mid);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.top{color:var(--accent-green);border-color:rgba(74,222,128,.42);background:rgba(74,222,128,.06)}
.chip.mid{color:var(--text-mid)}
.chip.bot{color:var(--accent-red);border-color:rgba(244,63,94,.42);background:rgba(244,63,94,.06)}
.sp-row{display:grid;grid-template-columns:1.3fr 1fr repeat(3,1fr) 92px 64px;gap:12px;
  align-items:center;padding:12px 16px;border-bottom:1px solid var(--hairline)}
.sp-row:last-child{border-bottom:0}
.sp-row.head{background:var(--surface2);border-bottom:1px solid var(--border)}
.sp-row.head span{font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--text-dim)}
.sp-metric{font-size:12.5px}
.sp-val{font-family:var(--font-mono);font-size:15px;font-variant-numeric:tabular-nums}
.sp-val.season{color:var(--text-mid)}
.sp-val small{display:block;font-size:9px;color:var(--text-dim);letter-spacing:.05em;margin-top:2px}
.sp-val.none{color:var(--text-dim);font-size:12.5px}
.tier-diff{font-size:10.5px;font-weight:600}
.tier-diff.up{color:var(--accent-green)} .tier-diff.down{color:var(--accent-red)} .tier-diff.flat{color:var(--text-dim)}
.slope{height:26px}
.gap{font-family:var(--font-mono);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
.gap.up{color:var(--accent-red)} .gap.down{color:var(--accent-green)} .gap.flat{color:var(--text-dim)}
.cell{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.wknum{color:var(--text-dim);font-size:10.5px;margin-right:5px;font-family:var(--font-mono)}
.team-pick{display:inline-flex;align-items:center;gap:7px}
.stat-table td b{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.panel-title{display:flex;align-items:center;gap:8px}
.res{font-family:var(--font-mono);font-size:10.5px;margin-left:7px;color:var(--text-mid)}
.res.w{color:var(--accent-green)} .res.l{color:var(--accent-red)}
@media(max-width:860px){
  .sp-row{grid-template-columns:1fr;gap:6px;padding:14px}
  .sp-row.head{display:none}
  .sp-val:before{content:attr(data-tier) " ";font-family:var(--font-mono);font-size:9px;
    letter-spacing:.1em;color:var(--text-dim);margin-right:6px}
  .slope{display:none}.gap{text-align:left}
}
</style>
</head>
<body>
<script src="js/fi-shell.js"></script>
<script>
const POSITIONS=["QB","RB","WR","TE"];
const UNITS=[["team","Team"],["QB","Quarterback"],["RB","Running backs"],
             ["WR","Wide receivers"],["TE","Tight ends"]];
const TIERS=[["top","vs Top 10"],["mid","vs Middle 12"],["bot","vs Bottom 10"]];
let DATA=null, team=null, unit="team";

const main = fiShell({ page:'context', pageLabel:'Contextual Statistics', status:'loading' });

main.innerHTML = `
  <div class="bar">
    <label class="lbl" for="wk">Week</label><select id="wk"></select>
    <label class="lbl" for="tm">Team</label>
    <span class="team-pick"><span id="tmLogo"></span><select id="tm"></select></span>
    <div class="legend">
      <span>Defense faced:</span>
      <span class="chip top">T10</span><span>toughest</span>
      <span class="chip mid">MID</span><span>middle 12</span>
      <span class="chip bot">B10</span><span>softest</span>
    </div>
  </div>
  <div class="tabs" id="units" role="tablist"></div>
  <div id="body"></div>`;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

const wkSel=$("wk");
for(let w=3;w<=18;w++){const o=document.createElement("option");o.value=w;o.textContent="Week "+w;wkSel.appendChild(o);}
wkSel.value=10;
wkSel.addEventListener("change",()=>load(Number(wkSel.value)));
$("tm").addEventListener("change",()=>{team=$("tm").value;syncTeamLogo();render();});
function syncTeamLogo(){ $("tmLogo").innerHTML = team ? fiLogoHTML(team,22) : ''; }

$("units").innerHTML = UNITS.map(([k,l])=>
  `<button role="tab" data-u="${k}">${l}</button>`).join('');
$("units").querySelectorAll("button").forEach(b=>
  b.addEventListener("click",()=>{unit=b.dataset.u;render();}));

async function load(week){
  $("body").innerHTML=`<div class="empty">Loading week ${week}…</div>`;
  fiStatus("Loading","loading");
  try{
    const res = await fetch(`context/wk${pad(week)}.json`);
    if(!res.ok) throw new Error("missing");
    DATA = await res.json();
  }catch(e){
    DATA=null; fiStatus("No data","error"); fiUpdated("");
    $("body").innerHTML=`<div class="empty">
      Week ${week} isn't built yet.<br>
      Run <b>python3 build_matchup_stats.py ${week}</b> in your lab folder, then reload.</div>`;
    return;
  }
  fiStatus("Ready");
  fiUpdated(`${DATA.season} · logs through ${DATA.data_horizon}`);
  const teams = Object.keys(DATA.teams).sort();
  if(!teams.includes(team)) team = teams[0];
  $("tm").innerHTML = teams.map(t=>
    `<option value="${t}">${t} (${DATA.teams[t].record})</option>`).join('');
  $("tm").value = team;
  syncTeamLogo();
  render();
}

const labelsFor = u => u==="team" ? DATA.labels.team : DATA.labels.pos[u];
const splitsFor = u => u==="team" ? DATA.teams[team].splits.team : DATA.teams[team].splits.off[u];
const cellFor = (e,u,m) => u==="team" ? e.team[m] : e.off[u][m];

/* three-point slope: production as defenses get softer */
function slopeSVG(sp){
  const pts = TIERS.map(([k])=>sp[k].avg).filter(v=>v!==null);
  if(pts.length<2) return `<svg class="slope" viewBox="0 0 92 26"></svg>`;
  const lo=Math.min(...pts), hi=Math.max(...pts), span=hi-lo||1;
  const y=v=>21-((v-lo)/span)*16;
  let d="",dots="",i=0;
  TIERS.forEach(([k],idx)=>{
    const v=sp[k].avg; if(v===null) return;
    const x=6+idx*40;
    d += (i++?" L":"M")+`${x} ${y(v).toFixed(1)}`;
    dots += `<circle cx="${x}" cy="${y(v).toFixed(1)}" r="2.6" fill="currentColor"/>`;
  });
  const first=pts[0], last=pts[pts.length-1];
  const color = last>first?"var(--accent-red)":last<first?"var(--accent-green)":"var(--text-dim)";
  return `<svg class="slope" viewBox="0 0 92 26" style="color:${color}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>${dots}</svg>`;
}
function gapTag(sp){
  const a=sp.top.avg, b=sp.bot.avg;
  if(a===null||b===null) return `<div class="gap flat">—</div>`;
  const diff=b-a, cls=diff>0?"up":diff<0?"down":"flat";
  return `<div class="gap ${cls}">${diff>0?"+":""}${diff.toFixed(1)}</div>`;
}
function seasonAvgFor(m){
  const log = DATA.teams[team].log;
  const vals = log.map(e => cellFor(e,unit,m)).filter(c => c && c.v!=null).map(c => c.v);
  if(!vals.length) return null;
  return vals.reduce((s,v)=>s+v,0) / vals.length;
}
function diffBadge(tierAvg, seasonAvg){
  if(tierAvg===null || seasonAvg===null) return '';
  const diff = tierAvg - seasonAvg;
  const cls = diff>0 ? 'up' : diff<0 ? 'down' : 'flat';
  return ` <span class="tier-diff ${cls}">(${diff>0?'+':''}${diff.toFixed(1)})</span>`;
}

function render(){
  if(!DATA) return;
  $("units").querySelectorAll("button").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.u===unit)));
  const labels=labelsFor(unit), sp=splitsFor(unit), log=DATA.teams[team].log;
  const metrics=Object.keys(labels);

  let h = `<div class="panel">
    <div class="panel-header">
      <div>
        <div class="panel-title">${fiLogoHTML(team,20)}Production by defense faced</div>
        <div class="panel-subtitle">${esc(team)} · per-game average · n = games</div>
      </div>
      <span class="panel-count">${metrics.length} metrics</span>
    </div>
    <div class="sp-row head"><span>Metric</span><span>Season Avg</span>
      ${TIERS.map(([,l])=>`<span>${l}</span>`).join('')}<span>Trend</span><span>Gap</span></div>`;
  metrics.forEach(m=>{
    const seasonAvg = seasonAvgFor(m);
    h += `<div class="sp-row"><div class="sp-metric">${esc(labels[m])}</div>`;
    h += `<div class="sp-val season" data-tier="Season Avg">${seasonAvg===null ? '—' : seasonAvg.toFixed(1)}</div>`;
    TIERS.forEach(([k,l])=>{
      const c=sp[m][k];
      h += c.avg===null
        ? `<div class="sp-val none" data-tier="${l}">— <small>no games</small></div>`
        : `<div class="sp-val" data-tier="${l}">${c.avg}${diffBadge(c.avg, seasonAvg)}<small>n=${c.n}</small></div>`;
    });
    h += slopeSVG(sp[m]) + gapTag(sp[m]) + `</div>`;
  });
  h += `</div>`;

  h += `<div class="panel">
    <div class="panel-header">
      <div>
        <div class="panel-title">Game log</div>
        <div class="panel-subtitle">Chip shows the opponent's season rank in that category</div>
      </div>
      <span class="panel-count">${log.length} games</span>
    </div>
    <div class="table-wrap"><table class="stat-table"><thead><tr><th>Game</th>
      ${metrics.map(m=>`<th class="right">${esc(labels[m])}</th>`).join('')}
    </tr></thead><tbody>`;
  log.forEach(e=>{
    h += `<tr><td><span class="wknum">WK ${e.week}</span>
      <b>${e.home?"vs":"@"} ${fiLogoHTML(e.opp,16)}${esc(e.opp)}</b>
      <span class="res ${e.result.toLowerCase()}">${esc(e.result)} ${esc(e.score)}</span></td>`;
    metrics.forEach(m=>{
      const c=cellFor(e,unit,m);
      h += `<td class="num"><span class="cell">${c.v}
        <span class="chip ${c.t}" title="${esc(e.opp)} ranks #${c.r} in ${esc(labels[m])} allowed">#${c.r}</span>
      </span></td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div></div>`;
  $("body").innerHTML = h;
}

load(10);
</script>
</body>
</html>
